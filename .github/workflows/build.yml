name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. تحميل المستودع
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. فك ملف المشروع ZIP
      # ============================================================
      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          if [ ! -f "substack-downloader.zip" ]; then
            echo "ERROR: substack-downloader.zip not found."
            exit 1
          fi

          mkdir -p extracted

          unzip -o "substack-downloader.zip" -d extracted

          echo "ZIP extracted successfully."

          echo "Project contents:"
          find extracted -maxdepth 3 -type f | sort | head -200


      # ============================================================
      # 3. تحديد مجلد Android الحقيقي
      # ============================================================
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          SETTINGS_FILE=$(find extracted \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No settings.gradle or settings.gradle.kts found."
            echo "The ZIP does not appear to contain a valid Gradle Android project."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          # نقل المشروع إلى جذر المستودع
          shopt -s dotglob

          cp -R "$PROJECT_DIR"/* .

          echo "Project copied to repository root."

          echo "Root files:"
          ls -la


      # ============================================================
      # 4. البحث عن google-services.json
      # ============================================================
      - name: Inspect Google Services configuration
        shell: bash
        run: |
          set -e

          echo "Searching for google-services.json..."

          find . -type f -name "google-services.json" -print || true


      # ============================================================
      # 5. إزالة google-services.json الوهمي
      #
      # لا ننشئ ملف Firebase مزيف.
      # الملف المزيف كان سبب الخطأ:
      #
      # No matching client found for package name
      #
      # ============================================================
      - name: Remove invalid Google Services configuration
        shell: bash
        run: |
          set -e

          find . -type f -name "google-services.json" -delete

          echo "Invalid google-services.json files removed."


      # ============================================================
      # 6. إزالة Google Services plugin إذا كان المشروع يستخدمه
      #
      # هذا يمنع:
      # processDebugGoogleServices FAILED
      #
      # إذا كان التطبيق يحتاج Firebase فعلًا، يجب استخدام
      # google-services.json حقيقي بدل هذه الخطوة.
      # ============================================================
      - name: Disable Google Services plugin
        shell: bash
        run: |
          set -e

          echo "Removing Google Services plugin references..."

          find . \
            -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print0 |
          while IFS= read -r -d '' file; do

            echo "Processing: $file"

            # Groovy
            sed -i \
              '/com\.google\.gms\.google-services/d' \
              "$file" || true

            sed -i \
              '/com\.google\.gms:google-services/d' \
              "$file" || true

            # Kotlin DSL
            sed -i \
              '/id("com\.google\.gms\.google-services")/d' \
              "$file" || true

            sed -i \
              '/id '\''com\.google\.gms\.google-services'\''/d' \
              "$file" || true

          done

          echo "Google Services plugin references removed."


      # ============================================================
      # 7. إزالة Compose compiler plugin القديم/المتعارض
      # ============================================================
      - name: Clean incompatible Compose compiler references
        shell: bash
        run: |
          set -e

          find . \
            -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print0 |
          while IFS= read -r -d '' file; do

            echo "Cleaning: $file"

            sed -i \
              '/kotlin\.plugin\.compose/d' \
              "$file" || true

            sed -i \
              '/compose-compiler/d' \
              "$file" || true

          done


      # ============================================================
      # 8. تحديد Java 17
      # ============================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ============================================================
      # 9. إعداد Gradle
      # ============================================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4


      # ============================================================
      # 10. التأكد من وجود Gradle Wrapper
      # ============================================================
      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            echo "Gradle wrapper already exists."
            chmod +x ./gradlew

          elif [ -f "./gradlew.bat" ]; then
            echo "gradlew.bat exists but Unix wrapper is missing."

            if command -v gradle >/dev/null 2>&1; then
              gradle wrapper
              chmod +x ./gradlew
            else
              echo "ERROR: Gradle wrapper is missing."
              exit 1
            fi

          else
            echo "Gradle wrapper does not exist."

            if command -v gradle >/dev/null 2>&1; then
              gradle wrapper
              chmod +x ./gradlew
            else
              echo "ERROR: Gradle command is unavailable."
              exit 1
            fi
          fi

          echo "Gradle version:"
          ./gradlew --version


      # ============================================================
      # 11. تنظيف المشروع
      # ============================================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 12. فحص Gradle modules
      # ============================================================
      - name: Check Gradle projects
        shell: bash
        run: |
          set -e

          ./gradlew projects \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 13. بناء Debug APK
      # ============================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # ============================================================
      # 14. البحث عن APK الناتج
      # ============================================================
      - name: Locate APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          APK_COUNT=$(find . \
            -type f \
            -path "*/build/outputs/apk/*.apk" \
            | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "Generated APK files:"
          find . \
            -type f \
            -path "*/build/outputs/apk/*.apk" \
            -print


      # ============================================================
      # 15. رفع APK كـ Artifact
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Substack-Downloader-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
