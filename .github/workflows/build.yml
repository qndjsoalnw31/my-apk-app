name: Build Substack Downloader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Extract ZIP if necessary
        shell: bash
        run: |
          set -e

          if ls *.zip >/dev/null 2>&1; then
            ZIP_FILE=$(ls *.zip | head -n 1)
            echo "Found ZIP: $ZIP_FILE"

            mkdir -p extracted
            unzip -o "$ZIP_FILE" -d extracted

            echo "Extracted files:"
            find extracted -maxdepth 3 -type f | head -100
          fi

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          if [ -f "gradlew" ]; then
            PROJECT_DIR="."
          elif [ -f "extracted/gradlew" ]; then
            PROJECT_DIR="extracted"
          else
            FOUND=$(find . -type f -name gradlew -not -path "./.git/*" | head -n 1 || true)

            if [ -n "$FOUND" ]; then
              PROJECT_DIR=$(dirname "$FOUND")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No Gradle Android project found."
            find . -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

          find "$PROJECT_DIR" -maxdepth 2 -type f | sort

      - name: Move Gradle wrapper to project root
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -f "gradlew" ]; then
            WRAPPER=$(find . -type f -name gradlew | head -n 1 || true)

            if [ -n "$WRAPPER" ]; then
              WRAPPER_DIR=$(dirname "$WRAPPER")

              cp "$WRAPPER_DIR/gradlew" ./gradlew

              if [ -f "$WRAPPER_DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
                mkdir -p gradle/wrapper
                cp "$WRAPPER_DIR/gradle/wrapper/"* gradle/wrapper/
              fi
            fi
          fi

          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Repair Gradle version
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          mkdir -p gradle/wrapper

          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          echo "Gradle wrapper configured for 9.3.1"

      - name: Remove Google Services dependency
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Searching Gradle files..."

          find . -type f \( \
            -name "build.gradle" \
            -o -name "build.gradle.kts" \
            \) \
            -not -path "./.gradle/*" \
            -print

          while IFS= read -r FILE; do
            echo "Repairing: $FILE"

            sed -i \
              '/com\.google\.gms\.google-services/d' \
              "$FILE" || true

            sed -i \
              '/apply plugin:.*google-services/d' \
              "$FILE" || true

            sed -i \
              '/id[[:space:]]*(\?"com\.google\.gms\.google-services"\?)/d' \
              "$FILE" || true

          done < <(
            find . -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -not -path "./.gradle/*"
          )

      - name: Remove google-services.json
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          find . -type f \
            -name "google-services.json" \
            -not -path "./.gradle/*" \
            -delete || true

          echo "google-services.json removed if present."

      - name: Check Android project
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "===== SETTINGS ====="
          [ -f settings.gradle ] && cat settings.gradle || true
          [ -f settings.gradle.kts ] && cat settings.gradle.kts || true

          echo "===== ROOT BUILD ====="
          [ -f build.gradle ] && cat build.gradle || true
          [ -f build.gradle.kts ] && cat build.gradle.kts || true

          echo "===== APP BUILD ====="
          [ -f app/build.gradle ] && cat app/build.gradle || true
          [ -f app/build.gradle.kts ] && cat app/build.gradle.kts || true

      - name: Generate Gradle wrapper if missing
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -f "gradlew" ]; then
            echo "Gradle wrapper missing."

            curl -L \
              https://services.gradle.org/distributions/gradle-9.3.1-bin.zip \
              -o /tmp/gradle.zip

            unzip -q /tmp/gradle.zip -d /opt/

            /opt/gradle-9.3.1/bin/gradle wrapper --gradle-version 9.3.1

            chmod +x gradlew
          fi

      - name: Verify Gradle
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --version

      - name: Build Debug APK
        shell: bash
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.daemon=false
            -Dorg.gradle.jvmargs=-Xmx3g
            -XX:MaxMetaspaceSize=768m
          CI: true
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew \
            clean \
            assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -not -path "*/build/intermediates/*" \
            | head -n 1)

          if [ -z "$APK" ]; then
            APK=$(find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              | head -n 1)
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p "$PROJECT_DIR/output"

          cp "$APK" \
            "$PROJECT_DIR/output/Substack-Downloader-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Substack-Downloader-APK
          path: ${{ env.PROJECT_DIR }}/output/Substack-Downloader-debug.apk
          if-no-files-found: error

      - name: Build summary
        if: success()
        run: |
          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "======================================"
          echo "Artifact: Substack-Downloader-APK"
          echo "File: Substack-Downloader-debug.apk"
