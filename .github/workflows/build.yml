name: Build Android APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project with hidden files
        run: |
          unzip substack-downloader.zip -d extracted
          # البحث عن المجلد الذي يحتوي على build.gradle.kts ونقل كافة محتوياته بما فيها الملفات والمجلدات المخفية
          TARGET_DIR=$(find extracted -name "build.gradle.kts" -exec dirname {} \; | head -n 1)
          shopt -s dotglob
          cp -r $TARGET_DIR/* .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable if present
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-App-APK
          path: app/build/outputs/apk/debug/*.apk
