name: Build SAM Advanced APK Analyzer

'on':
workflow_dispatch:
push:
branches:
- main
- master

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:

  # =========================================================
  # 1. CHECKOUT
  # =========================================================
  - name: Checkout repository
    uses: actions/checkout@v6

  # =========================================================
  # 2. JAVA 21
  # =========================================================
  - name: Setup JDK 21
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '21'
      cache: gradle

  # =========================================================
  # 3. ANDROID SDK
  # =========================================================
  - name: Setup Android SDK
    uses: android-actions/setup-android@v4
    with:
      packages: ''

  # =========================================================
  # 4. INSTALL SDK COMPONENTS
  # =========================================================
  - name: Install Android SDK components
    shell: bash
    run: |
      set -e

      sdkmanager \
        "platform-tools" \
        "platforms;android-35" \
        "platforms;android-36" \
        "build-tools;35.0.0" \
        "build-tools;36.0.0"

  # =========================================================
  # 5. FIND SAM ZIP
  # =========================================================
  - name: Find SAM project ZIP
    shell: bash
    run: |
      set -e

      ZIP_FILE=""

      if [ -f "$GITHUB_WORKSPACE/remix-sam_-advanced-apk-analyzer.zip" ]; then
        ZIP_FILE="$GITHUB_WORKSPACE/remix-sam_-advanced-apk-analyzer.zip"
      else
        ZIP_FILE="$(
          find "$GITHUB_WORKSPACE" \
            -maxdepth 3 \
            -type f \
            -name 'remix-sam_-advanced-apk-analyzer.zip' \
            | head -n 1 \
            || true
        )"
      fi

      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: remix-sam_-advanced-apk-analyzer.zip not found."
        echo
        echo "Available ZIP files:"
        find "$GITHUB_WORKSPACE" \
          -type f \
          -name '*.zip' \
          -print \
          || true
        exit 1
      fi

      echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      echo "Using:"
      echo "$ZIP_FILE"

  # =========================================================
  # 6. EXTRACT SAM PROJECT
  # =========================================================
  - name: Extract SAM project
    shell: bash
    run: |
      set -e

      rm -rf "$GITHUB_WORKSPACE/extracted"

      mkdir -p "$GITHUB_WORKSPACE/extracted"

      unzip -q -o \
        "$ZIP_FILE" \
        -d "$GITHUB_WORKSPACE/extracted"

      echo "Extraction completed."

  # =========================================================
  # 7. LOCATE ANDROID PROJECT
  # =========================================================
  - name: Locate Android project
    shell: bash
    run: |
      set -e

      PROJECT_DIR=""

      SETTINGS_FILE="$(
        find "$GITHUB_WORKSPACE/extracted" \
          -type f \
          \
            -name 'settings.gradle' \
            -o \
            -name 'settings.gradle.kts' \
          \
          | head -n 1 \
          || true
      )"

      if [ -n "$SETTINGS_FILE" ]; then
        PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
      fi

      if [ -z "$PROJECT_DIR" ]; then
        echo "ERROR: Android project not found."

        echo
        echo "Extracted files:"
        find "$GITHUB_WORKSPACE/extracted" \
          -maxdepth 7 \
          -type f \
          | sort

        exit 1
      fi

      PROJECT_DIR="$(realpath "$PROJECT_DIR")"

      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      echo
      echo "=============================================="
      echo "SAM ANDROID PROJECT"
      echo "=============================================="
      echo "$PROJECT_DIR"

  # =========================================================
  # 8. VERIFY PROJECT
  # =========================================================
  - name: Verify Android project
    shell: bash
    run: |
      set -e

      cd "$PROJECT_DIR"

      echo "Project files:"
      ls -la

      echo
      echo "Gradle files:"

      find . \
        -maxdepth 3 \
        -type f \
        \
          -name 'settings.gradle' \
          -o \
          -name 'settings.gradle.kts' \
          -o \
          -name 'build.gradle' \
          -o \
          -name 'build.gradle.kts' \
          -o \
          -name 'gradle.properties' \
        \
        | sort

  # =========================================================
  # 9. MAKE GRADLE WRAPPER EXECUTABLE
  # =========================================================
  - name: Prepare Gradle wrapper
    shell: bash
    run: |
      set -e

      cd "$PROJECT_DIR"

      if [ -f "./gradlew" ]; then
        chmod +x ./gradlew
        echo "Gradle wrapper found."
      else
        echo "No Gradle wrapper found."
      fi

  # =========================================================
  # 10. BUILD DEBUG APK
  # =========================================================
  - name: Build SAM Debug APK
    shell: bash
    env:
      CI: true
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
    run: |
      set -e

      cd "$PROJECT_DIR"

      echo
      echo "=============================================="
      echo "BUILDING SAM ADVANCED APK ANALYZER"
      echo "=============================================="

      if [ -f "./gradlew" ]; then

        ./gradlew \
          assembleDebug \
          --no-daemon \
          --stacktrace \
          --warning-mode all

      else

        echo "Gradle wrapper not found."
        echo "Installing Gradle 8.11.1..."

        GRADLE_VERSION="8.11.1"
        GRADLE_DIR="/opt/gradle-${GRADLE_VERSION}"

        if [ ! -d "$GRADLE_DIR" ]; then

          curl -fL \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o /tmp/gradle.zip

          unzip -q \
            /tmp/gradle.zip \
            -d /opt/

        fi

        export PATH="$GRADLE_DIR/bin:$PATH"

        gradle \
          assembleDebug \
          --no-daemon \
          --stacktrace \
          --warning-mode all

      fi

  # =========================================================
  # 11. FIND APK
  # =========================================================
  - name: Locate generated APK
    shell: bash
    run: |
      set -e

      APK="$(
        find "$PROJECT_DIR" \
          -type f \
          -name '*.apk' \
          -not -path '*/.gradle/*' \
          | grep -E '/build/outputs/apk/.*/.*debug.*\.apk$' \
          | head -n 1 \
          || true
      )"

      if [ -z "$APK" ]; then

        APK="$(
          find "$PROJECT_DIR" \
            -type f \
            -name '*.apk' \
            -not -path '*/.gradle/*' \
            | head -n 1 \
            || true
        )"

      fi

      if [ -z "$APK" ]; then

        echo "ERROR: No APK generated."

        echo
        echo "APK search result:"
        find "$PROJECT_DIR" \
          -type f \
          -name '*.apk' \
          -print \
          || true

        echo
        echo "Build directories:"
        find "$PROJECT_DIR" \
          -type d \
          -name 'build' \
          -print \
          | sort \
          || true

        exit 1
      fi

      echo "APK found:"
      echo "$APK"

      mkdir -p "$PROJECT_DIR/output"

      cp \
        "$APK" \
        "$PROJECT_DIR/output/SAM-Advanced-APK-Analyzer-debug.apk"

      echo
      echo "Final APK:"
      ls -lh \
        "$PROJECT_DIR/output/SAM-Advanced-APK-Analyzer-debug.apk"

      echo "APK_PATH=$PROJECT_DIR/output/SAM-Advanced-APK-Analyzer-debug.apk" >> "$GITHUB_ENV"

  # =========================================================
  # 12. UPLOAD APK
  # =========================================================
  - name: Upload SAM APK
    uses: actions/upload-artifact@v6
    with:
      name: SAM-Advanced-APK-Analyzer-debug
      path: ${{ env.APK_PATH }}
      if-no-files-found: error
      retention-days: 30

  # =========================================================
  # 13. SUCCESS
  # =========================================================
  - name: Build successful
    if: success()
    shell: bash
    run: |
      echo
      echo "=============================================="
      echo "SAM BUILD SUCCESSFUL"
      echo "=============================================="
      echo
      echo "Artifact:"
      echo "SAM-Advanced-APK-Analyzer-debug"
