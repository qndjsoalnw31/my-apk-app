name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "platforms;android-34"
          sdkmanager "platforms;android-33"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "build-tools;34.0.0"
          sdkmanager "build-tools;33.0.2"

      - name: Extract ZIP
        run: |
          set -e

          test -f substack-downloader.zip

          rm -rf extracted
          mkdir extracted

          unzip -q substack-downloader.zip -d extracted

          echo "ZIP extracted."

      - name: Find Android Project
        run: |
          set -e

          GRADLEW=$(find extracted -type f -name gradlew | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found."
            find extracted -maxdepth 6 -type f
            exit 1
          fi

          PROJECT=$(dirname "$GRADLEW")

          echo "Project found:"
          echo "$PROJECT"

          if [ ! -f "$PROJECT/settings.gradle" ] && [ ! -f "$PROJECT/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Move Project To Root
        run: |
          set -e

          mkdir project-root

          cp -a "$PROJECT"/. project-root/

          shopt -s dotglob nullglob

          for FILE in project-root/*; do
            NAME=$(basename "$FILE")

            if [ "$NAME" = ".git" ]; then
              continue
            fi

            rm -rf "$NAME"
            cp -a "$FILE" .
          done

          rm -rf project-root

          echo "Project moved to root."

      - name: Verify Project
        run: |
          set -e

          echo "Current directory:"
          pwd

          echo ""
          echo "Files:"
          ls -la

          echo ""

          if [ ! -f gradlew ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          chmod +x gradlew

          echo "Gradle wrapper found."

      - name: Remove Google Services
        run: |
          find . \
            -type f \
            -name google-services.json \
            -not -path "./.git/*" \
            -delete || true

      - name: Remove Google Services Plugin
        run: |
          find . \
            -type f \
            \( \
              -name build.gradle \
              -o \
              -name build.gradle.kts \
            \) \
            -print0 |
          while IFS= read -r -d '' FILE; do
            sed -i '/com\.google\.gms\.google-services/d' "$FILE" || true
            sed -i '/com\.google\.gms:google-services/d' "$FILE" || true
          done

      - name: Configure Gradle
        run: |
          touch gradle.properties

          sed -i \
            '/^[[:space:]]*org\.gradle\.jvmargs[[:space:]]*=/d' \
            gradle.properties || true

          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
            'org.gradle.daemon=false' \
            'org.gradle.parallel=true' \
            'org.gradle.caching=true' \
            >> gradle.properties

      - name: Check Gradle
        run: |
          chmod +x gradlew
          java -version
          ./gradlew --version

      - name: Validate Gradle
        run: |
          ./gradlew help \
            --no-daemon \
            --stacktrace

      - name: Clean
        run: |
          ./gradlew clean \
            --no-daemon \
            --stacktrace

      - name: Build APK
        run: |
          set -o pipefail

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            2>&1 | tee gradle-build.log

          CODE=${PIPESTATUS[0]}

          if [ "$CODE" -ne 0 ]; then
            echo ""
            echo "BUILD FAILED"
            echo ""

            grep -A 30 -B 5 \
              "\* What went wrong" \
              gradle-build.log || true

            echo ""
            tail -100 gradle-build.log

            exit "$CODE"
          fi

          echo ""
          echo "BUILD SUCCESSFUL"

      - name: Find APK
        run: |
          set -e

          APK=$(find . \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            -not -path "./.gradle/*" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            find . -type f -name "*.apk"
            exit 1
          fi

          echo "APK:"
          echo "$APK"

          mkdir -p artifacts

          cp "$APK" artifacts/Substack-Downloader-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Substack-Downloader-APK
          path: artifacts/Substack-Downloader-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Gradle-Build-Log
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7
