name: Build TikTok Downloader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "9.3.1"
  ANDROID_PLATFORM: "36.1"
  ANDROID_BUILD_TOOLS: "36.1.0"
  GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:

      # ============================================================
      # 01 - CHECKOUT
      # ============================================================
      - name: "01 - Checkout repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # ============================================================
      # 02 - JAVA 17
      # IMPORTANT:
      # No Gradle cache is used here.
      # The Android project is inside the ZIP and has not been
      # extracted yet.
      # ============================================================
      - name: "02 - Setup Java 17"
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 03 - ANDROID SDK COMMAND LINE TOOLS
      # Required SDK packages are installed explicitly later.
      # ============================================================
      - name: "03 - Setup Android SDK tools"
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # ============================================================
      # 04 - LOCATE ZIP
      # ============================================================
      - name: "04 - Locate Android project ZIP"
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          if [ -f "$GITHUB_WORKSPACE/tiktok-downloader.zip" ]; then
            ZIP_FILE="$GITHUB_WORKSPACE/tiktok-downloader.zip"
          else
            ZIP_FILE="$({
              find "$GITHUB_WORKSPACE" \
                -type f \
                -iname '*.zip' \
                -not -path '*/.git/*' \
                -print \
                -quit \
                2>/dev/null || true
            })"
          fi

          if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "::error::No Android project ZIP was found."
            echo "Repository contents:"
            find "$GITHUB_WORKSPACE" -maxdepth 6 -type f -print | sort || true
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "Selected ZIP:"
          ls -lh "$ZIP_FILE"

      # ============================================================
      # 05 - VALIDATE ZIP
      # ============================================================
      - name: "05 - Validate ZIP archive"
        shell: bash
        run: |
          set -euo pipefail

          unzip -t "$ZIP_FILE"

          echo "ZIP integrity: OK"

      # ============================================================
      # 06 - EXTRACT PROJECT
      # ============================================================
      - name: "06 - Extract Android project"
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_ROOT="$GITHUB_WORKSPACE/android-project"

          rm -rf "$EXTRACT_ROOT"
          mkdir -p "$EXTRACT_ROOT"

          unzip -q "$ZIP_FILE" -d "$EXTRACT_ROOT"

          echo "Extracted project files:"
          find "$EXTRACT_ROOT" -maxdepth 12 -type f -print | sort

      # ============================================================
      # 07 - FIND PROJECT ROOT
      # ============================================================
      - name: "07 - Locate Gradle project root"
        shell: bash
        run: |
          set -euo pipefail

          SEARCH_ROOT="$GITHUB_WORKSPACE/android-project"

          SETTINGS_FILE="$({
            find "$SEARCH_ROOT" \
              -type f \
              \( \
                -name 'settings.gradle.kts' \
                -o -name 'settings.gradle' \
              \) \
              -print \
              -quit \
              2>/dev/null || true
          })"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle(.kts) was not found inside the ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$(realpath "$SETTINGS_FILE")")"

          if [ ! -f "$PROJECT_DIR/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/build.gradle" ]; then
            echo "::error::Gradle root build file was not found: $PROJECT_DIR"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Gradle project root:"
          echo "$PROJECT_DIR"

      # ============================================================
      # 08 - INSTALL EXACT SDK REQUIRED BY THE ZIP
      # Project:
      # compileSdk release(36) { minorApiLevel = 1 }
      # ============================================================
      - name: "08 - Install Android SDK 36.1"
        shell: bash
        run: |
          set -uo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK root is unavailable."
            exit 1
          fi

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            else
              SDKMANAGER="$({
                find "$SDK_ROOT/cmdline-tools" \
                  -type f \
                  -name sdkmanager \
                  -print \
                  -quit \
                  2>/dev/null || true
              })"
            fi
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found."
            find "$SDK_ROOT/cmdline-tools" \
              -maxdepth 5 \
              -type f \
              -name sdkmanager \
              -print \
              2>/dev/null || true
            exit 1
          fi

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"

          echo "SDK_ROOT=$SDK_ROOT"
          echo "SDKMANAGER=$SDKMANAGER"

          "$SDKMANAGER" --version || true

          echo "Accepting Android SDK licenses..."

          set +e
          yes | timeout 180 \
            "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --licenses \
            > "$GITHUB_WORKSPACE/sdk-licenses.log" \
            2>&1
          set -e

          PACKAGES=(
            "platform-tools"
            "platforms;android-${ANDROID_PLATFORM}"
            "build-tools;${ANDROID_BUILD_TOOLS}"
          )

          install_package() {
            local package="$1"
            local safe="${package//[^A-Za-z0-9._-]/_}"
            local log="$GITHUB_WORKSPACE/sdk-install-${safe}.log"
            local attempt=1
            local max_attempts=3

            case "$package" in

              platform-tools)
                if [ -d "$SDK_ROOT/platform-tools" ]; then
                  return 0
                fi
                ;;

              "platforms;android-${ANDROID_PLATFORM}")
                if [ -f \
                  "$SDK_ROOT/platforms/android-${ANDROID_PLATFORM}/android.jar"
                ]; then
                  return 0
                fi
                ;;

              "build-tools;${ANDROID_BUILD_TOOLS}")
                if [ -d \
                  "$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}"
                ]; then
                  return 0
                fi
                ;;
            esac

            while [ "$attempt" -le "$max_attempts" ]; do

              echo ""
              echo "Installing $package"
              echo "Attempt $attempt/$max_attempts"

              set +e

              timeout 900 \
                "$SDKMANAGER" \
                --sdk_root="$SDK_ROOT" \
                "$package" \
                2>&1 | tee "$log"

              rc=${PIPESTATUS[0]}

              set -e

              if [ "$rc" -eq 0 ]; then

                case "$package" in

                  platform-tools)
                    if [ -d "$SDK_ROOT/platform-tools" ]; then
                      return 0
                    fi
                    ;;

                  "platforms;android-${ANDROID_PLATFORM}")
                    if [ -f \
                      "$SDK_ROOT/platforms/android-${ANDROID_PLATFORM}/android.jar"
                    ]; then
                      return 0
                    fi
                    ;;

                  "build-tools;${ANDROID_BUILD_TOOLS}")
                    if [ -d \
                      "$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}"
                    ]; then
                      return 0
                    fi
                    ;;
                esac
              fi

              echo "Installation not verified for $package."

              tail -n 80 "$log" 2>/dev/null || true

              sleep $((attempt * 5))

              attempt=$((attempt + 1))
            done

            return 1
          }

          FAILED=""

          for package in "${PACKAGES[@]}"; do
            if ! install_package "$package"; then
              FAILED="$package"
              break
            fi
          done

          if [ -n "$FAILED" ]; then

            echo "::error::Failed to install or verify Android SDK package: $FAILED"

            echo ""
            echo "Installed packages:"

            "$SDKMANAGER" \
              --sdk_root="$SDK_ROOT" \
              --list_installed \
              2>&1 \
              | tail -n 200 \
              || true

            exit 1
          fi

          echo ""
          echo "Android SDK verification:"

          test -f \
            "$SDK_ROOT/platforms/android-${ANDROID_PLATFORM}/android.jar"

          test -d \
            "$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}"

          test -d \
            "$SDK_ROOT/platform-tools"

          echo "Android SDK 36.1 + Build Tools 36.1.0: OK"

      # ============================================================
      # 09 - CONFIGURE LOCAL SDK PATH
      # ============================================================
      - name: "09 - Configure local.properties"
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK path is empty."
            exit 1
          fi

          printf 'sdk.dir=%s\n' "$SDK_ROOT" > local.properties

          echo "local.properties:"
          cat local.properties

      # ============================================================
      # 10 - VERIFY ACTUAL ZIP TOOLCHAIN
      # ============================================================
      - name: "10 - Verify project configuration"
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "============================================================"
          echo "PROJECT TOOLCHAIN"
          echo "============================================================"

          echo ""
          echo "AGP:"
          grep -n 'agp =' gradle/libs.versions.toml

          echo ""
          echo "Kotlin:"
          grep -n '^kotlin =' gradle/libs.versions.toml

          echo ""
          echo "KSP:"
          grep -n 'googleDevtoolsKsp' gradle/libs.versions.toml

          echo ""
          echo "compileSdk:"
          grep -n -A5 -B2 'compileSdk' app/build.gradle.kts

          echo ""
          echo "applicationId:"
          grep -n 'applicationId' app/build.gradle.kts

          echo ""
          echo "Gradle wrapper properties:"
          cat gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "Source project files verified."

      # ============================================================
      # 11 - GENERATE MISSING DEBUG KEYSTORE
      # ============================================================
      - name: "11 - Generate debug keystore"
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          DEBUG_KEYSTORE="$PROJECT_DIR/debug.keystore"

          if [ ! -f "$DEBUG_KEYSTORE" ]; then

            echo "Generating missing debug.keystore..."

            keytool \
              -genkeypair \
              -v \
              -keystore "$DEBUG_KEYSTORE" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

          else

            echo "debug.keystore already exists."

          fi

          test -f "$DEBUG_KEYSTORE"

          keytool \
            -list \
            -keystore "$DEBUG_KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            >/dev/null

          echo "Debug keystore verified."

      # ============================================================
      # 12 - SETUP GRADLE AFTER ZIP EXTRACTION
      # ============================================================
      - name: "12 - Setup Gradle 9.3.1"
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"
          cache-read-only: false
          validate-wrappers: false
          add-job-summary: on-failure

      # ============================================================
      # 13 - VERIFY JAVA + GRADLE
      # ============================================================
      - name: "13 - Verify Java and Gradle"
        shell: bash
        run: |
          set -euo pipefail

          echo "Java:"
          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo ""
          echo "Gradle:"
          gradle --version

      # ============================================================
      # 14 - BUILD DEBUG APK
      # ============================================================
      - name: "14 - Build Debug APK"
        shell: bash
        run: |
          set -uo pipefail

          cd "$PROJECT_DIR"

          LOG1="$GITHUB_WORKSPACE/gradle-build-attempt-1.log"
          LOG2="$GITHUB_WORKSPACE/gradle-build-attempt-2.log"
          LOG3="$GITHUB_WORKSPACE/gradle-build-attempt-3.log"

          rm -f \
            "$LOG1" \
            "$LOG2" \
            "$LOG3" \
            "$GITHUB_WORKSPACE/gradle-build.log"

          GRADLE_ARGS=(
            ":app:assembleDebug"
            "--no-daemon"
            "--stacktrace"
            "--console=plain"
            "--warning-mode=all"
            "--no-configuration-cache"
            "--rerun-tasks"
          )

          run_build() {
            local logfile="$1"
            shift

            set +e

            gradle \
              "${GRADLE_ARGS[@]}" \
              "$@" \
              2>&1 | tee "$logfile"

            local rc=${PIPESTATUS[0]}

            set -e

            return "$rc"
          }

          echo "============================================================"
          echo "BUILD ATTEMPT 1"
          echo "============================================================"

          if run_build "$LOG1"; then

            cp \
              "$LOG1" \
              "$GITHUB_WORKSPACE/gradle-build.log"

            echo "BUILD SUCCESSFUL ON ATTEMPT 1"

            exit 0
          fi

          echo ""
          echo "Attempt 1 failed."
          echo "Checking for known KSP 2.3.5 CI failure..."

          KSP_FAILURE="false"

          if grep -qE \
            'ApplicationManager\.getApplication\(\).*null|return value of.*ApplicationManager\.getApplication\(\).*null' \
            "$LOG1" \
            2>/dev/null
          then
            KSP_FAILURE="true"
          fi

          if [ "$KSP_FAILURE" = "true" ] && \
             grep -q \
               'googleDevtoolsKsp = "2\.3\.5"' \
               gradle/libs.versions.toml \
               2>/dev/null
          then

            echo "Known KSP 2.3.5 CI failure detected."

            echo "Applying temporary CI-only KSP 2.3.6 compatibility patch."

            cp \
              gradle/libs.versions.toml \
              "$GITHUB_WORKSPACE/libs.versions.toml.before-ksp-patch"

            sed -i \
              's/googleDevtoolsKsp = "2\.3\.5"/googleDevtoolsKsp = "2.3.6"/' \
              gradle/libs.versions.toml

            echo "KSP after temporary patch:"

            grep -n \
              'googleDevtoolsKsp' \
              gradle/libs.versions.toml
          fi

          gradle --stop >/dev/null 2>&1 || true

          rm -rf \
            .gradle \
            app/build \
            2>/dev/null || true

          echo ""
          echo "============================================================"
          echo "BUILD ATTEMPT 2"
          echo "============================================================"

          if run_build \
            "$LOG2" \
            "--no-build-cache"
          then

            cat \
              "$LOG1" \
              "$LOG2" \
              > "$GITHUB_WORKSPACE/gradle-build.log"

            echo "BUILD SUCCESSFUL ON ATTEMPT 2"

            exit 0
          fi

          echo ""
          echo "Attempt 2 failed."

          echo "Retrying with refreshed dependencies..."

          gradle --stop >/dev/null 2>&1 || true

          rm -rf \
            .gradle \
            app/build \
            2>/dev/null || true

          echo ""
          echo "============================================================"
          echo "BUILD ATTEMPT 3"
          echo "============================================================"

          if run_build \
            "$LOG3" \
            "--no-build-cache" \
            "--refresh-dependencies"
          then

            cat \
              "$LOG1" \
              "$LOG2" \
              "$LOG3" \
              > "$GITHUB_WORKSPACE/gradle-build.log"

            echo "BUILD SUCCESSFUL ON ATTEMPT 3"

            exit 0
          fi

          cat \
            "$LOG1" \
            "$LOG2" \
            "$LOG3" \
            > "$GITHUB_WORKSPACE/gradle-build.log"

          echo ""
          echo "============================================================"
          echo "BUILD FAILED"
          echo "============================================================"

          echo ""
          echo "---------------- KSP ----------------"

          grep -n -E \
            'KSP|ksp|symbol-processing|ApplicationManager' \
            "$GITHUB_WORKSPACE/gradle-build.log" \
            | tail -n 220 \
            || true

          echo ""
          echo "---------------- SDK / AAPT ----------------"

          grep -n -E \
            'compileSdk|36\.1|buildTools|SDK|AAPT|android\.jar|resource .* not found|Manifest merger' \
            "$GITHUB_WORKSPACE/gradle-build.log" \
            | tail -n 220 \
            || true

          echo ""
          echo "---------------- Kotlin / Java ----------------"

          grep -n -E \
            'Kotlin|KotlinCompile|jvmTarget|JVM target|Unsupported class file|Inconsistent JVM|Java|OutOfMemory|Metaspace' \
            "$GITHUB_WORKSPACE/gradle-build.log" \
            | tail -n 220 \
            || true

          echo ""
          echo "---------------- Dependencies / Network ----------------"

          grep -n -E \
            'Could not resolve|Could not find|Could not download|TLS|SSL|PKIX|timeout|timed out|Connection reset|Connection refused|UnknownHost' \
            "$GITHUB_WORKSPACE/gradle-build.log" \
            | tail -n 220 \
            || true

          echo ""
          echo "---------------- Signing ----------------"

          grep -n -E \
            'signing|keystore|androiddebugkey|storePassword|keyPassword' \
            "$GITHUB_WORKSPACE/gradle-build.log" \
            | tail -n 160 \
            || true

          echo ""
          echo "---------------- Gradle ----------------"

          grep -n -E \
            'FAILURE:|Execution failed for task|Task .* FAILED|Exception|Caused by:|error:' \
            "$GITHUB_WORKSPACE/gradle-build.log" \
            | tail -n 320 \
            || true

          echo ""
          echo "---------------- LAST 500 LINES ----------------"

          tail -n 500 \
            "$GITHUB_WORKSPACE/gradle-build.log" \
            || true

          exit 1

      # ============================================================
      # 15 - LOCATE APK
      # ============================================================
      - name: "15 - Locate generated APK"
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          OUTPUT_DIR="$GITHUB_WORKSPACE/apk-output"

          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"

          EXPECTED="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$EXPECTED" ]; then

            echo "::error::Expected debug APK was not generated."

            echo ""
            echo "All APK files found:"

            find . \
              -type f \
              -name '*.apk' \
              -path '*/build/outputs/*' \
              -print \
              | sort \
              || true

            exit 1
          fi

          cp \
            "$EXPECTED" \
            "$OUTPUT_DIR/TikTok-Downloader-debug.apk"

          echo ""
          echo "Generated APK:"

          ls -lh \
            "$OUTPUT_DIR/TikTok-Downloader-debug.apk"

      # ============================================================
      # 16 - APK INFORMATION
      # ============================================================
      - name: "16 - Inspect APK"
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/apk-output/TikTok-Downloader-debug.apk"

          test -f "$APK"

          echo "============================================================"
          echo "APK INFORMATION"
          echo "============================================================"

          ls -lh "$APK"

          echo ""
          echo "File:"

          file "$APK"

          echo ""
          echo "SHA256:"

          sha256sum "$APK"

          echo ""
          echo "APK summary:"

          apkanalyzer apk summary "$APK" || true

      # ============================================================
      # 17 - UPLOAD APK
      # ============================================================
      - name: "17 - Upload APK"
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: TikTok-Downloader-APK
          path: apk-output/TikTok-Downloader-debug.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # ============================================================
      # 18 - COLLECT DIAGNOSTICS
      # ============================================================
      - name: "18 - Collect diagnostics"
        if: always()
        shell: bash
        run: |
          set +e

          DIAG="$GITHUB_WORKSPACE/diagnostics"

          rm -rf "$DIAG"
          mkdir -p "$DIAG"

          copy_if_exists() {
            local src="$1"
            local dst="$2"

            if [ -f "$src" ]; then
              cp "$src" "$dst" || true
            fi
          }

          copy_if_exists \
            "$GITHUB_WORKSPACE/gradle-build.log" \
            "$DIAG/gradle-build.log"

          copy_if_exists \
            "$GITHUB_WORKSPACE/gradle-build-attempt-1.log" \
            "$DIAG/gradle-build-attempt-1.log"

          copy_if_exists \
            "$GITHUB_WORKSPACE/gradle-build-attempt-2.log" \
            "$DIAG/gradle-build-attempt-2.log"

          copy_if_exists \
            "$GITHUB_WORKSPACE/gradle-build-attempt-3.log" \
            "$DIAG/gradle-build-attempt-3.log"

          copy_if_exists \
            "$GITHUB_WORKSPACE/sdk-licenses.log" \
            "$DIAG/sdk-licenses.log"

          copy_if_exists \
            "$GITHUB_WORKSPACE/libs.versions.toml.before-ksp-patch" \
            "$DIAG/libs.versions.toml.before-ksp-patch"

          if [ -d "$GITHUB_WORKSPACE/android-project" ]; then

            find "$GITHUB_WORKSPACE/android-project" \
              -maxdepth 10 \
              -type f \
              \( \
                -name 'settings.gradle*' \
                -o -name 'build.gradle*' \
                -o -name 'gradle.properties' \
                -o -name '*.toml' \
                -o -name 'AndroidManifest.xml' \
                -o -name 'gradle-wrapper.properties' \
              \) \
              -print \
              | sort \
              > "$DIAG/project-build-files.txt" \
              || true

            cp \
              "$GITHUB_WORKSPACE/android-project/gradle/wrapper/gradle-wrapper.properties" \
              "$DIAG/gradle-wrapper.properties" \
              2>/dev/null \
              || true

            cp \
              "$GITHUB_WORKSPACE/android-project/gradle/libs.versions.toml" \
              "$DIAG/libs.versions.toml.final" \
              2>/dev/null \
              || true

            cp \
              "$GITHUB_WORKSPACE/android-project/app/build.gradle.kts" \
              "$DIAG/app-build.gradle.kts" \
              2>/dev/null \
              || true
          fi

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          {
            echo "============================================================"
            echo "BUILD ENVIRONMENT"
            echo "============================================================"

            echo "Repository: ${GITHUB_REPOSITORY:-unknown}"
            echo "Commit: ${GITHUB_SHA:-unknown}"
            echo "Run: ${GITHUB_RUN_ID:-unknown}"
            echo "Project: ${PROJECT_DIR:-unknown}"
            echo "SDK: ${SDK_ROOT:-unknown}"

            echo "Java:"
            java -version 2>&1 || true

            echo ""
            echo "Gradle:"
            gradle --version 2>&1 || true

            echo ""
            echo "SDK packages:"

            if [ -n "$SDK_ROOT" ] && \
               command -v sdkmanager >/dev/null 2>&1
            then

              sdkmanager \
                --sdk_root="$SDK_ROOT" \
                --list_installed \
                2>&1 \
                || true

            fi

          } > "$DIAG/environment.txt"

          echo "Diagnostics collected."

      # ============================================================
      # 19 - UPLOAD DIAGNOSTICS
      # ============================================================
      - name: "19 - Upload diagnostics"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: TikTok-Downloader-Diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
