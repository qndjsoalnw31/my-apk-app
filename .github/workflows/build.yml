name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    env:
      CI: true
      GRADLE_OPTS: >-
        -Xmx4g
        -XX:MaxMetaspaceSize=1g
        -Dfile.encoding=UTF-8

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. Verify ZIP
      # ==========================================================
      - name: Verify ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "untitled.zip" ]; then
            echo "ERROR: untitled.zip not found"
            echo ""
            echo "Available ZIP files:"
            find . -type f -iname "*.zip" -print || true
            exit 1
          fi

          ls -lh untitled.zip

      # ==========================================================
      # 3. Extract ZIP
      # ==========================================================
      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted project
          mkdir -p extracted project

          unzip -q -o untitled.zip -d extracted

          echo "ZIP extracted successfully."

      # ==========================================================
      # 4. Find Android project
      # ==========================================================
      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE=$(
            find extracted \
              -type f \
              \( \
                -name "settings.gradle.kts" \
                -o \
                -name "settings.gradle" \
              \) \
              -print -quit
          )

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android Gradle project not found."

            find extracted \
              -maxdepth 6 \
              -type f \
              | sort \
              | head -500

            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Project: $PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. project/

          test -f project/app/build.gradle.kts || {
            echo "ERROR: app/build.gradle.kts not found"
            exit 1
          }

      # ==========================================================
      # 5. Automatically repair app/build.gradle.kts
      # ==========================================================
      - name: Repair app Gradle Kotlin DSL
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re
          import unicodedata

          path = Path("project/app/build.gradle.kts")

          if not path.exists():
              raise SystemExit(
                  "ERROR: project/app/build.gradle.kts not found"
              )

          text = path.read_text(
              encoding="utf-8",
              errors="replace"
          )

          print("========================================")
          print("STARTING AUTOMATIC GRADLE REPAIR")
          print("========================================")

          # ------------------------------------------------------
          # A. Normalize Unicode / hidden characters
          # ------------------------------------------------------
          text = text.replace("\ufeff", "")
          text = unicodedata.normalize("NFKC", text)

          hidden_spaces = [
              "\u00a0",
              "\u1680",
              "\u180e",
              "\u2000",
              "\u2001",
              "\u2002",
              "\u2003",
              "\u2004",
              "\u2005",
              "\u2006",
              "\u2007",
              "\u2008",
              "\u2009",
              "\u200a",
              "\u202f",
              "\u205f",
              "\u3000",
          ]

          for char in hidden_spaces:
              text = text.replace(char, " ")

          hidden_chars = [
              "\u200b",
              "\u200c",
              "\u200d",
              "\u2060",
              "\ufeff",
          ]

          for char in hidden_chars:
              text = text.replace(char, "")

          quote_map = {
              "“": '"',
              "”": '"',
              "„": '"',
              "‟": '"',
              "‘": "'",
              "’": "'",
              "‚": "'",
              "‛": "'",
              "＂": '"',
              "＇": "'",
          }

          for old, new in quote_map.items():
              text = text.replace(old, new)

          # ------------------------------------------------------
          # B. Fix escaped quotes
          # ------------------------------------------------------
          text = text.replace('\\"', '"')
          text = text.replace("\\'", "'")

          # ------------------------------------------------------
          # C. Fix quoted dependency functions
          # ------------------------------------------------------
          dependency_functions = [
              "implementation",
              "api",
              "compileOnly",
              "runtimeOnly",
              "testImplementation",
              "testRuntimeOnly",
              "androidTestImplementation",
              "debugImplementation",
              "releaseImplementation",
              "debugApi",
              "releaseApi",
              "debugCompileOnly",
              "releaseCompileOnly",
              "debugRuntimeOnly",
              "releaseRuntimeOnly",
              "ksp",
              "kapt",
              "annotationProcessor",
          ]

          for function in dependency_functions:
              text = re.sub(
                  rf'["\']{re.escape(function)}["\']\s*\(',
                  f"{function}(",
                  text
              )

              text = re.sub(
                  rf'`{re.escape(function)}`\s*\(',
                  f"{function}(",
                  text
              )

              text = re.sub(
                  rf'\b{re.escape(function)}\s+\(',
                  f"{function}(",
                  text
              )

          # ------------------------------------------------------
          # D. Remove Google Services references
          # ------------------------------------------------------
          text = re.sub(
              r'^[ \t]*import[ \t]+com\.google\.gms\..*$\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          text = re.sub(
              r'^[ \t]*alias\s*\(\s*libs\.plugins\.google\.services\s*\).*$\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          text = re.sub(
              r'^[ \t]*id\s*\(\s*["\']com\.google\.gms\.google-services["\']\s*\).*$\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          text = re.sub(
              r'^[^\n]*MissingGoogleServicesStrategy[^\n]*$\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          text = re.sub(
              r'^[^\n]*missingGoogleServicesStrategy[^\n]*$\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          # ------------------------------------------------------
          # E. Remove debugConfig references
          # ------------------------------------------------------
          text = re.sub(
              r'^[^\n]*signingConfigs\.getByName\s*\(\s*["\']debugConfig["\']\s*\)[^\n]*$\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          text = re.sub(
              r'^[^\n]*debugConfig[^\n]*$\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          # ------------------------------------------------------
          # F. Remove googleServices block using brace tracking
          # ------------------------------------------------------
          def remove_block(lines, start_pattern):
              result = []
              i = 0

              while i < len(lines):
                  line = lines[i]

                  if re.search(start_pattern, line):
                      depth = (
                          line.count("{")
                          - line.count("}")
                      )

                      i += 1

                      while i < len(lines) and depth > 0:
                          depth += (
                              lines[i].count("{")
                              - lines[i].count("}")
                          )
                          i += 1

                      continue

                  result.append(line)
                  i += 1

              return result

          lines = text.splitlines()

          lines = remove_block(
              lines,
              r'^\s*googleServices\s*\{'
          )

          lines = remove_block(
              lines,
              r'^\s*create\s*\(\s*["\']debugConfig["\']\s*\)\s*\{'
          )

          text = "\n".join(lines)

          # ------------------------------------------------------
          # G. Locate dependencies block
          # ------------------------------------------------------
          match = re.search(
              r'\bdependencies\s*\{',
              text
          )

          if not match:
              raise SystemExit(
                  "ERROR: dependencies { block could not be found"
              )

          dependencies_start = match.start()
          brace_start = text.find("{", match.start())

          # ------------------------------------------------------
          # H. Find matching closing brace
          # ------------------------------------------------------
          depth = 0
          end = None

          in_string = False
          string_char = None
          escaped = False

          i = brace_start

          while i < len(text):

              ch = text[i]

              if in_string:

                  if escaped:
                      escaped = False

                  elif ch == "\\":
                      escaped = True

                  elif ch == string_char:
                      in_string = False
                      string_char = None

                  i += 1
                  continue

              if ch in ('"', "'"):
                  in_string = True
                  string_char = ch
                  i += 1
                  continue

              if ch == "{":
                  depth += 1

              elif ch == "}":
                  depth -= 1

                  if depth == 0:
                      end = i + 1
                      break

              i += 1

          if end is None:
              raise SystemExit(
                  "ERROR: dependencies block has unbalanced braces"
              )

          old_dependencies = text[
              brace_start + 1:
              end - 1
          ]

          # ------------------------------------------------------
          # I. Extract valid dependency calls.
          #
          # We preserve the project's own libraries.
          # Only rebuild the surrounding dependencies syntax.
          # ------------------------------------------------------
          dependency_pattern = re.compile(
              r'(?m)^[ \t]*('
              + "|".join(map(re.escape, dependency_functions))
              + r')\s*\((.*?)\)\s*$'
          )

          dependencies = []

          for dep_match in dependency_pattern.finditer(
              old_dependencies
          ):
              function = dep_match.group(1)
              argument = dep_match.group(2).strip()

              if not argument:
                  continue

              # Remove impossible/garbled dependency arguments.
              if "\n" in argument:
                  continue

              dependencies.append(
                  (function, argument)
              )

          # Remove duplicates while preserving order.
          unique_dependencies = []
          seen = set()

          for item in dependencies:
              if item in seen:
                  continue

              seen.add(item)
              unique_dependencies.append(item)

          dependencies = unique_dependencies

          print("")
          print("Recovered dependency declarations:")
          for function, argument in dependencies:
              print(
                  f"  {function}({argument})"
              )

          # ------------------------------------------------------
          # J. If extraction missed dependencies because the old
          # block was heavily damaged, recover from raw lines.
          # ------------------------------------------------------
          if not dependencies:

              raw_lines = old_dependencies.splitlines()

              for line in raw_lines:

                  line = line.strip()

                  for function in dependency_functions:

                      prefix = function + "("

                      if line.startswith(prefix) and line.endswith(")"):
                          argument = line[
                              len(prefix):-1
                          ].strip()

                          if argument:
                              item = (
                                  function,
                                  argument
                              )

                              if item not in dependencies:
                                  dependencies.append(item)

          if not dependencies:
              print(
                  "WARNING: No dependency declarations recovered."
              )

          # ------------------------------------------------------
          # K. Build clean dependencies block.
          # ------------------------------------------------------
          clean_dependencies = [
              "dependencies {"
          ]

          for function, argument in dependencies:
              clean_dependencies.append(
                  f"    {function}({argument})"
              )

          clean_dependencies.append("}")

          clean_block = "\n".join(
              clean_dependencies
          )

          # ------------------------------------------------------
          # L. Replace damaged dependencies block.
          # ------------------------------------------------------
          text = (
              text[:dependencies_start]
              + clean_block
              + text[end:]
          )

          # ------------------------------------------------------
          # M. Fix trailing malformed braces caused by previous
          # repair attempts.
          #
          # We do NOT arbitrarily rewrite the whole file.
          # We only remove blank duplicate lines.
          # ------------------------------------------------------
          text = re.sub(
              r'\n{4,}',
              "\n\n",
              text
          )

          # ------------------------------------------------------
          # N. Ensure normal Unix newline.
          # ------------------------------------------------------
          text = text.replace("\r\n", "\n")
          text = text.replace("\r", "\n")

          path.write_text(
              text,
              encoding="utf-8",
              newline="\n"
          )

          print("")
          print("========================================")
          print("REPAIRED app/build.gradle.kts")
          print("========================================")
          print(text)
          PY

      # ==========================================================
      # 6. Repair root Gradle files
      # ==========================================================
      - name: Repair root Gradle files
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re
          import unicodedata

          for filename in [
              "project/build.gradle.kts",
              "project/build.gradle",
          ]:

              path = Path(filename)

              if not path.exists():
                  continue

              text = path.read_text(
                  encoding="utf-8",
                  errors="replace"
              )

              text = text.replace("\ufeff", "")
              text = unicodedata.normalize(
                  "NFKC",
                  text
              )

              replacements = {
                  "\u00a0": " ",
                  "\u1680": " ",
                  "\u180e": " ",
                  "\u2000": " ",
                  "\u2001": " ",
                  "\u2002": " ",
                  "\u2003": " ",
                  "\u2004": " ",
                  "\u2005": " ",
                  "\u2006": " ",
                  "\u2007": " ",
                  "\u2008": " ",
                  "\u2009": " ",
                  "\u200a": " ",
                  "\u202f": " ",
                  "\u205f": " ",
                  "\u3000": " ",
                  "“": '"',
                  "”": '"',
                  "„": '"',
                  "‘": "'",
                  "’": "'",
                  "\u200b": "",
                  "\u200c": "",
                  "\u200d": "",
                  "\u2060": "",
              }

              for old, new in replacements.items():
                  text = text.replace(old, new)

              text = re.sub(
                  r'^[^\n]*(google-services|googleServices)[^\n]*$\n?',
                  '',
                  text,
                  flags=re.MULTILINE
              )

              path.write_text(
                  text,
                  encoding="utf-8",
                  newline="\n"
              )

              print(f"Repaired {path}")
          PY

      # ==========================================================
      # 7. Repair Version Catalog WITHOUT deleting it
      # ==========================================================
      - name: Normalize Version Catalog
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import unicodedata

          path = Path(
              "project/gradle/libs.versions.toml"
          )

          if not path.exists():
              print(
                  "libs.versions.toml not found."
              )
              raise SystemExit(0)

          text = path.read_text(
              encoding="utf-8",
              errors="replace"
          )

          text = text.replace("\ufeff", "")
          text = unicodedata.normalize(
              "NFKC",
              text
          )

          replacements = {
              "\u00a0": " ",
              "\u1680": " ",
              "\u180e": " ",
              "\u2000": " ",
              "\u2001": " ",
              "\u2002": " ",
              "\u2003": " ",
              "\u2004": " ",
              "\u2005": " ",
              "\u2006": " ",
              "\u2007": " ",
              "\u2008": " ",
              "\u2009": " ",
              "\u200a": " ",
              "\u202f": " ",
              "\u205f": " ",
              "\u3000": " ",
              "“": '"',
              "”": '"',
              "„": '"',
              "‘": "'",
              "’": "'",
              "\u200b": "",
              "\u200c": "",
              "\u200d": "",
              "\u2060": "",
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          path.write_text(
              text,
              encoding="utf-8",
              newline="\n"
          )

          print(
              "Version catalog normalized without deleting entries."
          )
          PY

      # ==========================================================
      # 8. Remove Google Services JSON
      # ==========================================================
      - name: Remove Google Services JSON
        shell: bash
        run: |
          set -euo pipefail

          find project \
            -type f \
            -name "google-services.json" \
            -delete \
            || true

          echo "Google Services JSON removed if present."

      # ==========================================================
      # 9. Detect hidden invalid characters
      # ==========================================================
      - name: Validate source characters
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          files = list(
              Path("project").rglob("*.gradle.kts")
          )

          files += list(
              Path("project").rglob("*.gradle")
          )

          for path in files:

              text = path.read_text(
                  encoding="utf-8",
                  errors="replace"
              )

              bad = []

              for index, char in enumerate(text):
                  code = ord(char)

                  if code in {
                      0x200B,
                      0x200C,
                      0x200D,
                      0x2060,
                      0xFEFF,
                      0x00A0,
                  }:
                      bad.append(
                          (index, hex(code))
                      )

              if bad:
                  print(
                      f"ERROR: invalid Unicode in {path}"
                  )
                  print(bad[:20])
                  raise SystemExit(1)

          print(
              "No invalid hidden Unicode characters found."
          )
          PY

      # ==========================================================
      # 10. Validate dependencies block
      # ==========================================================
      - name: Validate dependencies block
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "project/app/build.gradle.kts"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          # ------------------------------------------------------
          # Must have dependencies block.
          # ------------------------------------------------------
          match = re.search(
              r'\bdependencies\s*\{',
              text
          )

          if not match:
              raise SystemExit(
                  "ERROR: dependencies block missing"
              )

          # ------------------------------------------------------
          # Count braces while ignoring strings.
          # ------------------------------------------------------
          depth = 0
          in_string = False
          string_char = None
          escaped = False

          for index, char in enumerate(text):

              if in_string:

                  if escaped:
                      escaped = False
                      continue

                  if char == "\\":
                      escaped = True
                      continue

                  if char == string_char:
                      in_string = False
                      string_char = None

                  continue

              if char in ('"', "'"):
                  in_string = True
                  string_char = char
                  continue

              if char == "{":
                  depth += 1

              elif char == "}":
                  depth -= 1

                  if depth < 0:
                      raise SystemExit(
                          "ERROR: closing brace without matching opening brace"
                      )

          if depth != 0:
              raise SystemExit(
                  f"ERROR: unbalanced Gradle braces. Depth={depth}"
              )

          # ------------------------------------------------------
          # No quoted dependency functions.
          # ------------------------------------------------------
          bad_functions = [
              "implementation",
              "api",
              "compileOnly",
              "runtimeOnly",
              "testImplementation",
              "testRuntimeOnly",
              "androidTestImplementation",
              "debugImplementation",
              "releaseImplementation",
              "ksp",
              "kapt",
          ]

          for function in bad_functions:

              pattern = (
                  rf'["\']{function}["\']\s*\('
              )

              if re.search(pattern, text):
                  raise SystemExit(
                      f"ERROR: invalid quoted function: {function}"
                  )

          # ------------------------------------------------------
          # Previous known failures.
          # ------------------------------------------------------
          forbidden = [
              "debugConfig",
              "MissingGoogleServicesStrategy",
              "missingGoogleServicesStrategy",
              "libs.plugins.google.services",
          ]

          for item in forbidden:

              if item in text:
                  raise SystemExit(
                      f"ERROR: forbidden Gradle reference remains: {item}"
                  )

          print(
              "Gradle dependency structure is valid."
          )
          PY

      # ==========================================================
      # 11. Setup JDK 17
      # ==========================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # 12. Setup Gradle 9.3.1
      # ==========================================================
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # ==========================================================
      # 13. Android SDK
      # ==========================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses \
            >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # ==========================================================
      # 14. Gradle Wrapper
      # ==========================================================
      - name: Generate Gradle wrapper
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "gradlew" ]; then

            gradle wrapper \
              --gradle-version 9.3.1 \
              --distribution-type bin

          fi

          chmod +x gradlew

          ./gradlew --version

      # ==========================================================
      # 15. Gradle Configuration Test
      # ==========================================================
      - name: Test Gradle configuration
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:tasks \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ==========================================================
      # 16. Compile Kotlin
      # ==========================================================
      - name: Compile Kotlin
        working-directory: project
        shell: bash
        run: |
          set -o pipefail

          ./gradlew \
            :app:compileDebugKotlin \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            2>&1 \
            | tee kotlin-compile.log

          EXIT_CODE=${PIPESTATUS[0]}

          if [ "$EXIT_CODE" -ne 0 ]; then

            echo ""
            echo "========================================"
            echo "REAL KOTLIN ERRORS"
            echo "========================================"

            grep -E \
              '(^e: |error: |Unresolved reference|Type mismatch|Expecting |Cannot access|Overload resolution ambiguity|Unexpected symbol|Unexpected tokens)' \
              kotlin-compile.log \
              | head -200 \
              || true

            echo ""
            echo "========================================"
            echo "ERROR CONTEXT"
            echo "========================================"

            grep -n \
              -B 3 \
              -A 8 \
              '^e: ' \
              kotlin-compile.log \
              | head -300 \
              || true

            exit "$EXIT_CODE"
          fi

          echo ""
          echo "Kotlin compilation successful."

      # ==========================================================
      # 17. Build APK
      # ==========================================================
      - name: Build Debug APK
        working-directory: project
        shell: bash
        run: |
          set -o pipefail

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            2>&1 \
            | tee build.log

          EXIT_CODE=${PIPESTATUS[0]}

          if [ "$EXIT_CODE" -ne 0 ]; then

            echo ""
            echo "========================================"
            echo "BUILD FAILURE SUMMARY"
            echo "========================================"

            grep -E \
              'Execution failed for task|(^e: )|error: |What went wrong|Caused by:|FAILED|FAILURE|Unexpected symbol|Unexpected tokens' \
              build.log \
              | head -250 \
              || true

            echo ""
            echo "========================================"
            echo "LAST 250 LINES"
            echo "========================================"

            tail -250 build.log

            exit "$EXIT_CODE"
          fi

          echo ""
          echo "========================================"
          echo "APK BUILD SUCCESSFUL"
          echo "========================================"

      # ==========================================================
      # 18. Find APK
      # ==========================================================
      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(
            find project/app/build/outputs/apk/debug \
              -type f \
              -name "*.apk" \
              -print -quit
          )

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

      # ==========================================================
      # 19. Prepare APK
      # ==========================================================
      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          APK=$(
            find project/app/build/outputs/apk/debug \
              -type f \
              -name "*.apk" \
              -print -quit
          )

          cp "$APK" \
            artifacts/APK-Builder-Mobile-debug.apk

          ls -lh \
            artifacts/APK-Builder-Mobile-debug.apk

      # ==========================================================
      # 20. Upload APK
      # ==========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Builder-Mobile
          path: artifacts/APK-Builder-Mobile-debug.apk
          if-no-files-found: error
          retention-days: 7

      # ==========================================================
      # 21. Upload Diagnostics
      # ==========================================================
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Diagnostics
          path: |
            project/kotlin-compile.log
            project/build.log
          if-no-files-found: ignore
          retention-days: 7
