name: Build TikTok Downloader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build TikTok Downloader APK
    runs-on: ubuntu-24.04

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v7


      # =========================================================
      # 2. JAVA
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # 3. ANDROID SDK
      # =========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # =========================================================
      # 4. VERIFY PREINSTALLED ANDROID SDK
      # =========================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ANDROID SDK"
          echo "=============================================="

          echo "ANDROID_HOME:"
          echo "${ANDROID_HOME:-not set}"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "${ANDROID_SDK_ROOT:-not set}"

          echo ""
          echo "SDK Manager:"
          sdkmanager --version

          echo ""
          echo "Installed Android platforms:"
          sdkmanager --list_installed 2>/dev/null \
            | grep "platforms;android-" \
            || true

          echo ""
          echo "Installed Build Tools:"
          sdkmanager --list_installed 2>/dev/null \
            | grep "build-tools;" \
            || true


      # =========================================================
      # 5. FIND ZIP
      # =========================================================

      - name: Find TikTok project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=""

          if [ -f "$GITHUB_WORKSPACE/tiktok-downloader.zip" ]; then
            ZIP_FILE="$GITHUB_WORKSPACE/tiktok-downloader.zip"
          else
            ZIP_FILE="$(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -iname "*.zip" \
                -not -path "*/.git/*" \
                | head -n 1
            )"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: tiktok-downloader.zip not found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "Using ZIP:"
          echo "$ZIP_FILE"


      # =========================================================
      # 6. VERIFY ZIP
      # =========================================================

      - name: Verify ZIP
        shell: bash
        run: |
          set -e

          unzip -t "$ZIP_FILE" >/dev/null

          echo "ZIP integrity: OK"


      # =========================================================
      # 7. EXTRACT PROJECT
      # =========================================================

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/android-project"

          mkdir -p "$GITHUB_WORKSPACE/android-project"

          unzip -q \
            "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/android-project"

          echo "Project extracted."


      # =========================================================
      # 8. LOCATE GRADLE PROJECT
      # =========================================================

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          ROOT="$GITHUB_WORKSPACE/android-project"
          PROJECT_DIR=""

          # Prefer settings.gradle project containing app/
          while IFS= read -r SETTINGS; do

            CANDIDATE="$(dirname "$SETTINGS")"

            if [ -d "$CANDIDATE/app" ]; then
              PROJECT_DIR="$CANDIDATE"
              break
            fi

          done < <(
            find "$ROOT" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -not -path "*/build/*" \
              | sort
          )


          # Any settings.gradle
          if [ -z "$PROJECT_DIR" ]; then

            SETTINGS="$(
              find "$ROOT" \
                -type f \
                \( \
                  -name "settings.gradle" \
                  -o \
                  -name "settings.gradle.kts" \
                \) \
                -not -path "*/build/*" \
                | head -n 1
            )"

            if [ -n "$SETTINGS" ]; then
              PROJECT_DIR="$(dirname "$SETTINGS")"
            fi

          fi


          # gradlew fallback
          if [ -z "$PROJECT_DIR" ]; then

            GRADLEW="$(
              find "$ROOT" \
                -type f \
                -name "gradlew" \
                -not -path "*/build/*" \
                | head -n 1
            )"

            if [ -n "$GRADLEW" ]; then
              PROJECT_DIR="$(dirname "$GRADLEW")"
            fi

          fi


          if [ -z "$PROJECT_DIR" ]; then

            echo "ERROR: Android Gradle project not found."

            echo ""
            echo "Extracted project:"

            find "$ROOT" -maxdepth 12 -print | sort

            exit 1

          fi


          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Android project:"
          echo "$PROJECT_DIR"


      # =========================================================
      # 9. LOCATE APP MODULE
      # =========================================================

      - name: Locate Android app module
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APP_MODULE=""

          if [ -d "app" ]; then
            APP_MODULE="$PROJECT_DIR/app"
          fi


          if [ -z "$APP_MODULE" ]; then

            MANIFEST="$(
              find . \
                -type f \
                -path "*/src/main/AndroidManifest.xml" \
                | head -n 1
            )"

            if [ -n "$MANIFEST" ]; then

              APP_MODULE="$(
                dirname \
                "$(dirname \
                "$(dirname "$MANIFEST")")"
              )"

            fi

          fi


          if [ -z "$APP_MODULE" ]; then

            echo "ERROR: Android app module not found."

            find . -maxdepth 10 -print | sort

            exit 1

          fi


          APP_MODULE="$(realpath "$APP_MODULE")"

          RELATIVE_MODULE="${APP_MODULE#$PROJECT_DIR/}"

          if [ "$RELATIVE_MODULE" = "$APP_MODULE" ]; then
            RELATIVE_MODULE="app"
          fi


          MODULE_TASK=":${RELATIVE_MODULE//\//:}:assembleDebug"


          echo "APP_MODULE=$APP_MODULE" >> "$GITHUB_ENV"
          echo "MODULE_TASK=$MODULE_TASK" >> "$GITHUB_ENV"

          echo ""
          echo "Android module:"
          echo "$APP_MODULE"

          echo ""
          echo "Build task:"
          echo "$MODULE_TASK"


      # =========================================================
      # 10. DETECT COMPILE SDK
      # =========================================================

      - name: Detect Android SDK requirements
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          COMPILE_SDK=""

          # compileSdk = 35
          COMPILE_SDK="$(
            grep -RhoE \
              'compileSdk[[:space:]]*[=:]?[[:space:]]*[0-9]+' \
              . \
              --include="*.gradle" \
              --include="*.gradle.kts" \
              2>/dev/null \
              | grep -oE '[0-9]+' \
              | head -n 1 \
              || true
          )"


          # compileSdkVersion 35
          if [ -z "$COMPILE_SDK" ]; then

            COMPILE_SDK="$(
              grep -RhoE \
                'compileSdkVersion[[:space:]]+[0-9]+' \
                . \
                --include="*.gradle" \
                --include="*.gradle.kts" \
                2>/dev/null \
                | grep -oE '[0-9]+' \
                | head -n 1 \
                || true
            )"

          fi


          # Kotlin DSL:
          # compileSdk = libs.versions...
          if [ -z "$COMPILE_SDK" ]; then
            COMPILE_SDK="35"
          fi


          echo "Detected compileSdk: $COMPILE_SDK"


          BUILD_TOOLS_VERSION=""

          BUILD_TOOLS_VERSION="$(
            grep -RhoE \
              'buildToolsVersion[[:space:]]*[=:]?[[:space:]]*["'\''][0-9]+\.[0-9]+\.[0-9]+["'\'']' \
              . \
              --include="*.gradle" \
              --include="*.gradle.kts" \
              2>/dev/null \
              | grep -oE \
                '[0-9]+\.[0-9]+\.[0-9]+' \
              | head -n 1 \
              || true
          )"


          if [ -z "$BUILD_TOOLS_VERSION" ]; then
            BUILD_TOOLS_VERSION=""
          fi


          echo "Detected buildToolsVersion:"
          echo "${BUILD_TOOLS_VERSION:-default}"


          echo "COMPILE_SDK=$COMPILE_SDK" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS_VERSION=$BUILD_TOOLS_VERSION" >> "$GITHUB_ENV"


      # =========================================================
      # 11. INSTALL ONLY MISSING SDK COMPONENTS
      # =========================================================

      - name: Prepare required Android SDK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "PREPARING ANDROID SDK"
          echo "=============================================="


          # Accept licenses without making the job fail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true


          # -----------------------------------------------------
          # Platform
          # -----------------------------------------------------

          PLATFORM_PACKAGE="platforms;android-${COMPILE_SDK}"

          if sdkmanager --list_installed 2>/dev/null \
            | awk -F'|' '{gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1}' \
            | grep -Fxq "$PLATFORM_PACKAGE"; then

            echo "Platform already installed:"
            echo "$PLATFORM_PACKAGE"

          else

            echo "Installing missing platform:"
            echo "$PLATFORM_PACKAGE"

            sdkmanager "$PLATFORM_PACKAGE"

          fi


          # -----------------------------------------------------
          # Exact Build Tools
          # -----------------------------------------------------

          if [ -n "$BUILD_TOOLS_VERSION" ]; then

            BUILD_TOOLS_PACKAGE="build-tools;${BUILD_TOOLS_VERSION}"

            if sdkmanager --list_installed 2>/dev/null \
              | awk -F'|' '{gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1}' \
              | grep -Fxq "$BUILD_TOOLS_PACKAGE"; then

              echo "Build Tools already installed:"
              echo "$BUILD_TOOLS_PACKAGE"

            else

              echo "Installing missing Build Tools:"
              echo "$BUILD_TOOLS_PACKAGE"

              sdkmanager "$BUILD_TOOLS_PACKAGE"

            fi

          fi


          echo ""
          echo "Android SDK preparation complete."


      # =========================================================
      # 12. DETECT GRADLE
      # =========================================================

      - name: Configure Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          USE_WRAPPER="false"
          GRADLE_VERSION=""

          # Existing wrapper
          if [ -f "./gradlew" ] && \
             [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then

            chmod +x ./gradlew

            USE_WRAPPER="true"

            echo "Gradle Wrapper found."

          fi


          # Read wrapper version
          if [ "$USE_WRAPPER" = "true" ]; then

            DISTRIBUTION_URL="$(
              grep '^distributionUrl=' \
                gradle/wrapper/gradle-wrapper.properties \
                | head -n 1 \
                | cut -d'=' -f2-
            )"

            GRADLE_VERSION="$(
              echo "$DISTRIBUTION_URL" \
                | sed \
                  's/.*gradle-\([0-9][0-9.]*\)-.*/\1/p'
            )"

            echo "Wrapper Gradle:"
            echo "${GRADLE_VERSION:-unknown}"

          fi


          # Fallback when wrapper does not exist
          if [ "$USE_WRAPPER" = "false" ]; then

            GRADLE_VERSION="8.13"

            # Detect AGP
            AGP_VERSION="$(
              grep -RhoE \
                'com\.android\.tools\.build:gradle:[0-9]+\.[0-9]+\.[0-9]+' \
                . \
                --include="*.gradle" \
                --include="*.gradle.kts" \
                2>/dev/null \
                | grep -oE \
                  '[0-9]+\.[0-9]+\.[0-9]+' \
                | head -n 1 \
                || true
            )"


            if [ -n "$AGP_VERSION" ]; then

              AGP_MAJOR="$(echo "$AGP_VERSION" | cut -d. -f1)"
              AGP_MINOR="$(echo "$AGP_VERSION" | cut -d. -f2)"


              if [ "$AGP_MAJOR" -ge 9 ]; then
                GRADLE_VERSION="9.1.0"

              elif [ "$AGP_MAJOR" -eq 8 ] && [ "$AGP_MINOR" -ge 13 ]; then
                GRADLE_VERSION="8.13"

              elif [ "$AGP_MAJOR" -eq 8 ] && [ "$AGP_MINOR" -ge 11 ]; then
                GRADLE_VERSION="8.13"

              elif [ "$AGP_MAJOR" -eq 8 ] && [ "$AGP_MINOR" -ge 9 ]; then
                GRADLE_VERSION="8.11.1"

              elif [ "$AGP_MAJOR" -eq 8 ] && [ "$AGP_MINOR" -eq 8 ]; then
                GRADLE_VERSION="8.10.2"

              elif [ "$AGP_MAJOR" -eq 8 ] && [ "$AGP_MINOR" -eq 7 ]; then
                GRADLE_VERSION="8.9"

              elif [ "$AGP_MAJOR" -eq 8 ] && [ "$AGP_MINOR" -ge 5 ]; then
                GRADLE_VERSION="8.7"

              elif [ "$AGP_MAJOR" -eq 8 ] && [ "$AGP_MINOR" -eq 4 ]; then
                GRADLE_VERSION="8.6"

              elif [ "$AGP_MAJOR" -eq 8 ] && [ "$AGP_MINOR" -eq 3 ]; then
                GRADLE_VERSION="8.4"

              elif [ "$AGP_MAJOR" -eq 8 ] && [ "$AGP_MINOR" -eq 2 ]; then
                GRADLE_VERSION="8.2"

              elif [ "$AGP_MAJOR" -eq 8 ]; then
                GRADLE_VERSION="8.0"

              elif [ "$AGP_MAJOR" -eq 7 ]; then
                GRADLE_VERSION="7.6.4"

              fi

            fi


            echo "Detected AGP:"
            echo "${AGP_VERSION:-unknown}"

          fi


          echo "USE_WRAPPER=$USE_WRAPPER" >> "$GITHUB_ENV"
          echo "GRADLE_VERSION=$GRADLE_VERSION" >> "$GITHUB_ENV"


          echo ""
          echo "Gradle version:"
          echo "$GRADLE_VERSION"


      # =========================================================
      # 13. SETUP GRADLE ONLY WHEN NEEDED
      # =========================================================

      - name: Setup Gradle
        if: env.USE_WRAPPER != 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-disabled: true


      # =========================================================
      # 14. BUILD
      # =========================================================

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo "BUILDING APK"
          echo "=============================================="

          echo ""
          echo "Project:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Task:"
          echo "$MODULE_TASK"

          echo ""
          echo "compileSdk:"
          echo "$COMPILE_SDK"

          echo ""
          echo "Java:"
          java -version

          echo ""


          if [ "$USE_WRAPPER" = "true" ]; then

            chmod +x ./gradlew

            ./gradlew \
              "$MODULE_TASK" \
              --no-daemon \
              --stacktrace \
              --console=plain \
              --warning-mode all \
              2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

          else

            gradle \
              "$MODULE_TASK" \
              --no-daemon \
              --stacktrace \
              --console=plain \
              --warning-mode all \
              2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

          fi


      # =========================================================
      # 15. FIND APK
      # =========================================================

      - name: Find APK
        if: success()
        shell: bash
        run: |
          set -e

          OUTPUT="$GITHUB_WORKSPACE/apk-output"

          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT"


          APK_FILE="$(
            find "$APP_MODULE" \
              -type f \
              -name "*.apk" \
              -path "*/build/outputs/*" \
              | sort \
              | head -n 1
          )"


          if [ -z "$APK_FILE" ]; then

            echo "ERROR: APK was not generated."

            find "$APP_MODULE" \
              -path "*/build/outputs/*" \
              -print \
              | sort \
              || true

            exit 1

          fi


          cp "$APK_FILE" \
            "$OUTPUT/TikTok-Downloader-debug.apk"


          sha256sum \
            "$OUTPUT/TikTok-Downloader-debug.apk" \
            > "$OUTPUT/SHA256SUMS.txt"


          echo ""
          echo "=============================================="
          echo "APK READY"
          echo "=============================================="

          ls -lh "$OUTPUT"


      # =========================================================
      # 16. UPLOAD APK
      # =========================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: TikTok-Downloader-APK
          path: |
            apk-output/TikTok-Downloader-debug.apk
            apk-output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30


      # =========================================================
      # 17. ALWAYS UPLOAD BUILD LOG
      # =========================================================

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TikTok-Downloader-Build-Log
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7
