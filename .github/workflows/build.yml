name: CinePro Cinema Camera APK Builder

on:
  push:
    branches:
      - main
    paths:
      - 'cinepro-cinema-camera.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cinepro-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build CinePro APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      JAVA_TOOL_OPTIONS: -Xmx4g -Dfile.encoding=UTF-8
      GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=1g
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # 4. Verify Android SDK
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d "$ANDROID_HOME"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found."
            exit 1
          fi

          echo "ANDROID_SDK_MANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --list_installed

          echo "Android SDK verified."

      # 5. Verify ZIP
      - name: Verify project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/cinepro-cinema-camera.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Project ZIP not found."
            exit 1
          fi

          if [ ! -s "$ZIP" ]; then
            echo "::error::Project ZIP is empty."
            exit 1
          fi

          unzip -tq "$ZIP"

          echo "Project archive is valid."
          ls -lh "$ZIP"

      # 6. Extract project safely
      - name: Extract and detect Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/cinepro-cinema-camera.zip"
          DEST="$GITHUB_WORKSPACE/.build/cinepro"

          rm -rf "$GITHUB_WORKSPACE/.build"
          mkdir -p "$DEST"

          python3 - "$ZIP" "$DEST" <<'PY'
          import pathlib
          import stat
          import sys
          import zipfile

          archive = pathlib.Path(sys.argv[1])
          destination = pathlib.Path(sys.argv[2]).resolve()

          with zipfile.ZipFile(archive) as z:
              entries = z.infolist()

              if not entries:
                  raise SystemExit("ZIP archive is empty.")

              for entry in entries:
                  target = (destination / entry.filename).resolve()

                  if not target.is_relative_to(destination):
                      raise SystemExit(
                          "Unsafe ZIP path: " + entry.filename
                      )

                  mode = entry.external_attr >> 16

                  if stat.S_ISLNK(mode):
                      raise SystemExit(
                          "Symbolic link found: " + entry.filename
                      )

              z.extractall(destination)

          settings = []

          for name in ("settings.gradle", "settings.gradle.kts"):
              settings.extend(destination.rglob(name))

          settings = [
              p for p in settings
              if "__MACOSX" not in p.parts
              and ".gradle" not in p.parts
              and "build" not in p.parts
          ]

          if not settings:
              raise SystemExit(
                  "Gradle settings file was not found."
              )

          roots = sorted(
              {p.parent.resolve() for p in settings},
              key=lambda p: len(p.parts)
          )

          root = roots[0]

          if not any(
              (root / name).is_file()
              for name in ("build.gradle", "build.gradle.kts")
          ):
              raise SystemExit(
                  "Root Gradle build file is missing."
              )

          if not list(root.rglob("AndroidManifest.xml")):
              raise SystemExit(
                  "AndroidManifest.xml was not found."
              )

          marker = destination.parent / "project-root.txt"
          marker.write_text(str(root))

          print("Project root:", root)
          print("Project validation completed.")
          PY

          PROJECT_DIR="$(cat "$GITHUB_WORKSPACE/.build/project-root.txt")"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f | head -100

      # 7. Detect compileSdk
      - name: Detect Android SDK version
        id: sdk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          SDK_VERSION="$(python3 - "$PROJECT_DIR" <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path(sys.argv[1])
          versions = []

          for path in root.rglob("*"):
              if not path.is_file():
                  continue

              if path.suffix not in (".gradle", ".kts", ".toml"):
                  continue

              if any(x in path.parts for x in (
                  ".gradle", "build", ".git"
              )):
                  continue

              try:
                  content = path.read_text(errors="ignore")
              except OSError:
                  continue

              patterns = [
                  r"\bcompileSdk(?:Version)?\s*[=(]?\s*(\d+)",
                  r"\bcompileSdk\s*=\s*(\d+)",
                  r"compileSdk\s*\(\s*(\d+)\s*\)"
              ]

              for pattern in patterns:
                  versions.extend(
                      int(x) for x in re.findall(pattern, content)
                  )

              if path.name == "libs.versions.toml":
                  for line in content.splitlines():
                      if re.search(r"compile.?sdk", line, re.I):
                          match = re.search(r'["\'](\d+)["\']', line)

                          if match:
                              versions.append(int(match.group(1)))

          print(max(versions) if versions else 35)
          PY
          )"

          if ! [[ "$SDK_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid Android SDK version."
            exit 1
          fi

          echo "Detected compileSdk: $SDK_VERSION"
          echo "version=$SDK_VERSION" >> "$GITHUB_OUTPUT"

      # 8. Install Android components
      - name: Install Android SDK components
        shell: bash
        env:
          SDK_VERSION: ${{ steps.sdk.outputs.version }}
        run: |
          set -euo pipefail

          "$ANDROID_SDK_MANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --install \
            "platform-tools" \
            "platforms;android-$SDK_VERSION" \
            "build-tools;36.0.0"

          echo "Android components installed."

      # 9. IMPORTANT: Gradle 9.3.1
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: false
          add-job-summary: always

      # 10. Verify build environment
      - name: Verify build environment
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          echo "Java:"
          java -version

          echo "Gradle:"
          gradle --version

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo "Project:"
          cd "$PROJECT_DIR"
          pwd
          ls -la

          GRADLE_VERSION="$(gradle --version | \
            awk '/^Gradle / {print $2; exit}')"

          if [ "$GRADLE_VERSION" != "9.3.1" ]; then
            echo "::error::Expected Gradle 9.3.1, got $GRADLE_VERSION"
            exit 1
          fi

          echo "Correct Gradle version confirmed."

      # 11. Build APK using installed Gradle
      # Do NOT use ./gradlew here.
      - name: Build Android Debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

          echo "Starting Android build..."
          echo "Using installed Gradle 9.3.1."

          gradle \
            --no-daemon \
            --stacktrace \
            --console=plain \
            --warning-mode all \
            assembleDebug

          echo "Gradle build completed."

      # 12. Find and collect APK
      - name: Collect APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          OUTPUT="$GITHUB_WORKSPACE/output"

          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT"

          python3 - "$PROJECT_DIR" "$OUTPUT" <<'PY'
          import pathlib
          import shutil
          import sys

          root = pathlib.Path(sys.argv[1])
          output = pathlib.Path(sys.argv[2])

          apks = [
              p for p in root.rglob("*.apk")
              if p.is_file()
              and "build" in p.parts
              and "outputs" in p.parts
              and "apk" in p.parts
              and p.stat().st_size > 0
          ]

          if not apks:
              raise SystemExit(
                  "No APK was generated by Gradle."
              )

          apks.sort()

          for index, apk in enumerate(apks, 1):
              if len(apks) == 1:
                  name = "CinePro-Cinema-Camera.apk"
              else:
                  name = f"CinePro-{index}-{apk.name}"

              target = output / name
              shutil.copy2(apk, target)

              print(
                  "APK:",
                  target.name,
                  "Size:",
                  target.stat().st_size,
                  "bytes"
              )
          PY

          ls -lh "$OUTPUT"

      # 13. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          COUNT="$(find output -maxdepth 1 \
            -type f -name '*.apk' | wc -l)"

          if [ "$COUNT" -lt 1 ]; then
            echo "::error::No APK available."
            exit 1
          fi

          find output -maxdepth 1 -type f -name '*.apk' \
            -exec file {} \;

          echo "APK verification completed."

      # 14. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CinePro-Cinema-Camera-APK
          path: output/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # 15. Build summary
      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "# CinePro Cinema Camera Build"
            echo ""
            echo "Commit: $GITHUB_SHA"
            echo ""

            if [ -d "$GITHUB_WORKSPACE/output" ]; then
              echo "## APK files"
              ls -lh "$GITHUB_WORKSPACE/output" || true
            else
              echo "APK was not generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
