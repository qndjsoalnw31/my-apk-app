
name: Build Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      project_zip:
        description: "ZIP path inside the repository, or auto"
        required: false
        default: auto
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    env:
      REQUESTED_PROJECT_ZIP: ${{ github.event.inputs.project_zip || 'auto' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "platforms;android-36.1" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Find and prepare Android project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          PROJECT_DIR=""
          ZIP_FILE=""

          # If a ZIP name was provided manually, use that file.
          if [[ -n "$REQUESTED_PROJECT_ZIP" && \
                "$REQUESTED_PROJECT_ZIP" != "auto" ]]; then

            case "$REQUESTED_PROJECT_ZIP" in
              /*|../*|*/../*|*/..)
                echo "ERROR: Use a path inside the repository."
                exit 1
                ;;
            esac

            ZIP_FILE="$ROOT/$REQUESTED_PROJECT_ZIP"

            if [[ ! -f "$ZIP_FILE" ]]; then
              echo "ERROR: ZIP file not found: $REQUESTED_PROJECT_ZIP"
              echo "Available ZIP files:"
              find "$ROOT" -maxdepth 3 \
                -type f -iname '*.zip' -print || true
              exit 1
            fi

          # Otherwise use Gradle project files already at the root.
          elif [[ -f "$ROOT/settings.gradle.kts" || \
                  -f "$ROOT/settings.gradle" ]]; then

            PROJECT_DIR="$ROOT"

          else
            # Prefer the Substack project if it has been uploaded.
            if [[ -f "$ROOT/substack-downloader.zip" ]]; then
              ZIP_FILE="$ROOT/substack-downloader.zip"
            else
              # Find the first ZIP containing a Gradle settings file.
              while IFS= read -r -d '' candidate; do
                if unzip -Z1 "$candidate" 2>/dev/null | \
                   grep -E \
                   '(^|/)settings\.gradle(\.kts)?$' \
                   >/dev/null; then
                  ZIP_FILE="$candidate"
                  break
                fi
              done < <(
                find "$ROOT" -maxdepth 3 \
                  -type f -iname '*.zip' \
                  -not -path '*/.git/*' -print0 | sort -z
              )
            fi
          fi

          # Extract the selected project archive.
          if [[ -n "$ZIP_FILE" ]]; then

            if ! unzip -Z1 "$ZIP_FILE" 2>/dev/null | \
                 grep -E \
                 '(^|/)settings\.gradle(\.kts)?$' \
                 >/dev/null; then
              echo "ERROR: The selected ZIP is not a Gradle project:"
              echo "$ZIP_FILE"
              exit 1
            fi

            EXTRACT_DIR="$RUNNER_TEMP/android-source"

            rm -rf "$EXTRACT_DIR"
            mkdir -p "$EXTRACT_DIR"

            unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

            SETTINGS_FILE="$(
              find "$EXTRACT_DIR" -type f \
                \( -name settings.gradle \
                   -o -name settings.gradle.kts \) \
                -not -path '*/.gradle/*' \
                -print -quit
            )"

            if [[ -z "$SETTINGS_FILE" ]]; then
              echo "ERROR: Gradle settings file not found."
              find "$EXTRACT_DIR" -maxdepth 5 \
                -type f -print | head -200
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

            echo "Selected ZIP: $ZIP_FILE"
          fi

          # Stop if no valid project was found.
          if [[ -z "$PROJECT_DIR" ]]; then
            echo "ERROR: Android Gradle project not found."
            echo "Add project source files or upload a ZIP containing"
            echo "settings.gradle or settings.gradle.kts."
            find "$ROOT" -maxdepth 3 \
              \( -name '*.zip' \
                 -o -name settings.gradle \
                 -o -name settings.gradle.kts \) \
              -print || true
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Selected project directory:"
          echo "$PROJECT_DIR"

          ls -la "$PROJECT_DIR"

      - name: Build Debug APK
        id: build_apk
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          # Use the project's wrapper if available.
          # Otherwise use Gradle 9.3.1 installed above.
          if [[ -f "./gradlew" ]]; then
            chmod +x ./gradlew
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="gradle"
          fi

          # The provided Substack project uses the app module.
          if [[ -f "app/build.gradle.kts" || \
                -f "app/build.gradle" ]]; then
            BUILD_TASK=":app:assembleDebug"
          else
            BUILD_TASK="assembleDebug"
          fi

          echo "Gradle version:"
          "$GRADLE_CMD" --version

          echo "Building APK..."
          "$GRADLE_CMD" --no-daemon \
            "$BUILD_TASK" --stacktrace

          # Locate the generated Debug APK.
          APK_PATH="$(
            find "$PROJECT_DIR" -type f \
              -path '*/build/outputs/apk/debug/*.apk' \
              -print -quit
          )"

          if [[ -z "$APK_PATH" ]]; then
            echo "ERROR: No Debug APK was generated."
            find "$PROJECT_DIR" -type f \
              -path '*/build/outputs/*' -print || true
            exit 1
          fi

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

          echo "APK created successfully:"
          echo "$APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Android-Debug-APK
          path: ${{ steps.build_apk.outputs.apk_path }}
          archive: false
          if-no-files-found: error
