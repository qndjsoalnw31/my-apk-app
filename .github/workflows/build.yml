name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    env:
      CI: true
      GRADLE_OPTS: >-
        -Xmx4g
        -XX:MaxMetaspaceSize=1g
        -Dfile.encoding=UTF-8

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. Verify ZIP
      # ==========================================================
      - name: Verify project ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository files:"
          find . -maxdepth 2 -type f | sort | head -200

          if [ ! -f "untitled.zip" ]; then
            echo ""
            echo "ERROR: untitled.zip not found"
            echo ""
            echo "ZIP files found:"
            find . -type f -iname "*.zip" -print || true
            exit 1
          fi

          echo ""
          echo "Found project archive:"
          ls -lh untitled.zip

      # ==========================================================
      # 3. Extract
      # ==========================================================
      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -o untitled.zip -d extracted

          echo ""
          echo "Archive extracted."

      # ==========================================================
      # 4. Locate Android project
      # ==========================================================
      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE=$(
            find extracted \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print -quit
          )

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No Android Gradle project found."
            echo ""
            find extracted -maxdepth 5 -type f | sort | head -400
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Android project:"
          echo "$PROJECT_DIR"

          shopt -s dotglob nullglob

          rm -rf workspace-project
          mkdir -p workspace-project

          cp -R "$PROJECT_DIR"/* workspace-project/

          echo ""
          echo "Project copied."

          cd workspace-project

          echo ""
          echo "Project structure:"
          find . -maxdepth 3 -type f | sort | head -300

      # ==========================================================
      # 5. Repair Android project configuration
      # ==========================================================
      - name: Repair project configuration
        shell: bash
        run: |
          set -euo pipefail

          cd workspace-project

          python3 <<'PY'
          from pathlib import Path
          import re

          print("========================================")
          print("REPAIRING PROJECT CONFIGURATION")
          print("========================================")

          # ------------------------------------------------------
          # app/build.gradle.kts
          # ------------------------------------------------------
          app = Path("app/build.gradle.kts")

          if not app.exists():
              raise SystemExit("ERROR: app/build.gradle.kts not found")

          text = app.read_text(encoding="utf-8")

          # Remove Google Services import.
          text = re.sub(
              r'^\s*import\s+com\.google\.gms\.googleservices\.GoogleServicesPlugin\.MissingGoogleServicesStrategy\s*$\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          # Remove Google Services plugin alias.
          text = re.sub(
              r'^\s*alias\(libs\.plugins\.google\.services\)\s*$\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          # Remove googleServices { ... } block.
          text = re.sub(
              r'\n?\s*googleServices\s*\{.*?\n\s*\}',
              '',
              text,
              flags=re.DOTALL
          )

          # Remove custom debug signing configuration.
          text = re.sub(
              r'\n\s*create\("debugConfig"\)\s*\{.*?\n\s*\}',
              '',
              text,
              flags=re.DOTALL
          )

          # Remove debugConfig assignment.
          text = re.sub(
              r'^\s*debug\s*\{\s*signingConfig\s*=\s*signingConfigs\.getByName\("debugConfig"\)\s*\}\s*$',
              'debug { }',
              text,
              flags=re.MULTILINE
          )

          # Remove any remaining references.
          text = re.sub(
              r'^\s*signingConfig\s*=\s*signingConfigs\.getByName\("debugConfig"\)\s*$\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          app.write_text(text, encoding="utf-8")

          print("Repaired app/build.gradle.kts")

          # ------------------------------------------------------
          # Root build.gradle.kts
          # ------------------------------------------------------
          root = Path("build.gradle.kts")

          if root.exists():
              text = root.read_text(encoding="utf-8")

              text = re.sub(
                  r'^\s*alias\(libs\.plugins\.google\.services\)\s*apply\s*false\s*$\n?',
                  '',
                  text,
                  flags=re.MULTILINE
              )

              root.write_text(text, encoding="utf-8")

              print("Repaired build.gradle.kts")

          # ------------------------------------------------------
          # Version catalog
          # ------------------------------------------------------
          catalog = Path("gradle/libs.versions.toml")

          if catalog.exists():
              text = catalog.read_text(encoding="utf-8")

              # Remove Google Services version.
              text = re.sub(
                  r'^\s*googleServices\s*=.*$\n?',
                  '',
                  text,
                  flags=re.MULTILINE
              )

              # Remove Google Services plugin declaration.
              text = re.sub(
                  r'^\s*google-services\s*=\s*\{\s*id\s*=\s*"com\.google\.gms\.google-services".*$\n?',
                  '',
                  text,
                  flags=re.MULTILINE
              )

              catalog.write_text(text, encoding="utf-8")

              print("Repaired gradle/libs.versions.toml")

          # ------------------------------------------------------
          # Remove Firebase configuration that requires the
          # Google Services Gradle plugin during the build.
          #
          # Firebase libraries themselves can remain available
          # unless the application actually requires runtime
          # Firebase configuration.
          # ------------------------------------------------------
          for name in [
              "google-services.json"
          ]:
              for file in Path(".").rglob(name):
                  try:
                      file.unlink()
                      print(f"Removed: {file}")
                  except Exception:
                      pass

          print("========================================")
          print("REPAIR COMPLETE")
          print("========================================")
          PY

      # ==========================================================
      # 6. Verify Google Services references are gone
      # ==========================================================
      - name: Verify Google Services removal
        shell: bash
        run: |
          set -euo pipefail

          cd workspace-project

          echo "Searching for invalid Google Services references..."

          FOUND=0

          if grep -Rni \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --include="*.toml" \
            --include="*.kt" \
            "MissingGoogleServicesStrategy" . 2>/dev/null; then
            FOUND=1
          fi

          if grep -Rni \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            "googleServices" . 2>/dev/null; then
            FOUND=1
          fi

          if grep -Rni \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            'libs.plugins.google.services' . 2>/dev/null; then
            FOUND=1
          fi

          if [ "$FOUND" -ne 0 ]; then
            echo ""
            echo "ERROR: Google Services references still exist."
            exit 1
          fi

          echo "OK: Google Services build configuration removed."

      # ==========================================================
      # 7. Setup JDK 17
      # ==========================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # 8. Setup Gradle 9.3.1
      # ==========================================================
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # ==========================================================
      # 9. Setup Android SDK
      # ==========================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo ""
          echo "Android SDK ready."

      # ==========================================================
      # 10. Generate Gradle Wrapper
      # ==========================================================
      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd workspace-project

          if [ ! -f "gradlew" ]; then
            echo "Gradle wrapper missing."
            echo "Generating Gradle 9.3.1 wrapper..."

            gradle wrapper \
              --gradle-version 9.3.1 \
              --distribution-type bin
          fi

          chmod +x gradlew

          echo ""
          echo "Gradle wrapper:"
          ./gradlew --version

      # ==========================================================
      # 11. Validate project
      # ==========================================================
      - name: Validate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          cd workspace-project

          ./gradlew projects \
            --no-daemon \
            --stacktrace

      # ==========================================================
      # 12. Clean
      # ==========================================================
      - name: Clean
        shell: bash
        run: |
          set -euo pipefail

          cd workspace-project

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      # ==========================================================
      # 13. Build APK
      # ==========================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          cd workspace-project

          echo "========================================"
          echo "BUILDING DEBUG APK"
          echo "========================================"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all \
            2>&1 | tee gradle-build.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "BUILD EXIT CODE: $EXIT_CODE"
          echo "========================================"

          if [ "$EXIT_CODE" -ne 0 ]; then

            echo ""
            echo "===== WHAT WENT WRONG ====="
            grep -A 30 -B 5 \
              "\* What went wrong" \
              gradle-build.log || true

            echo ""
            echo "===== CAUSED BY ====="
            grep -A 30 -B 5 \
              "Caused by:" \
              gradle-build.log | head -200 || true

            echo ""
            echo "===== FAILED TASKS ====="
            grep -Ei \
              "Execution failed for task|FAILED|FAILURE" \
              gradle-build.log | head -150 || true

            echo ""
            echo "===== CONFIGURATION ERRORS ====="
            grep -Ei \
              "google|firebase|keystore|signing|ksp|kotlin|compileSdk|buildTools|manifest|resource|duplicate|unresolved reference" \
              gradle-build.log | tail -200 || true

            echo ""
            echo "===== LAST 250 LINES ====="
            tail -250 gradle-build.log

            exit "$EXIT_CODE"
          fi

          echo ""
          echo "========================================"
          echo "APK BUILD SUCCESSFUL"
          echo "========================================"

      # ==========================================================
      # 14. Locate APK
      # ==========================================================
      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          cd workspace-project

          echo "Generated APK files:"

          find . \
            -type f \
            -path "*/build/outputs/apk/*/*.apk" \
            -print

          APK_FILE=$(
            find . \
              -type f \
              -path "*/build/outputs/apk/debug/*.apk" \
              | head -n 1
          )

          if [ -z "$APK_FILE" ]; then
            echo ""
            echo "ERROR: No debug APK generated."
            exit 1
          fi

          echo ""
          echo "APK:"
          echo "$APK_FILE"

      # ==========================================================
      # 15. Prepare artifact
      # ==========================================================
      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          cd workspace-project

          mkdir -p ../artifacts

          APK_FILE=$(
            find . \
              -type f \
              -path "*/build/outputs/apk/debug/*.apk" \
              | head -n 1
          )

          cp "$APK_FILE" \
            "../artifacts/APK-Builder-Mobile-debug.apk"

          echo ""
          echo "Final APK:"
          ls -lh "../artifacts/APK-Builder-Mobile-debug.apk"

      # ==========================================================
      # 16. Upload APK
      # ==========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Builder-Mobile
          path: artifacts/APK-Builder-Mobile-debug.apk
          if-no-files-found: error
          retention-days: 7

      # ==========================================================
      # 17. Upload logs on failure
      # ==========================================================
      - name: Upload Gradle logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Gradle-Build-Logs
          path: |
            workspace-project/gradle-build.log
          if-no-files-found: ignore
          retention-days: 7
