name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    env:
      CI: true
      GRADLE_OPTS: >-
        -Xmx4g
        -XX:MaxMetaspaceSize=1g
        -Dfile.encoding=UTF-8

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # 2. Extract the actual uploaded ZIP
      # ==========================================================
      - name: Extract untitled.zip
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "untitled.zip" ]; then
            echo "ERROR: untitled.zip not found"
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted

          unzip -q -o "untitled.zip" -d extracted

      # ==========================================================
      # 3. Locate Android project
      # ==========================================================
      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE=$(
            find extracted \
              -type f \
              \( \
                -name "settings.gradle.kts" \
                -o \
                -name "settings.gradle" \
              \) \
              -print -quit
          )

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android Gradle project not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Android project:"
          echo "$PROJECT_DIR"

          rm -rf project
          mkdir -p project

          cp -a "$PROJECT_DIR"/. project/

          if [ ! -f "project/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts not found"
            exit 1
          fi

      # ==========================================================
      # 4. Repair build configuration
      # ==========================================================
      - name: Sanitize build configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("project/build.gradle.kts"),
              Path("project/app/build.gradle.kts"),
          ]

          for path in files:
              if not path.exists():
                  continue

              text = path.read_text(encoding="utf-8")

              # Remove Google Services imports.
              text = re.sub(
                  r'^import com\.google\.gms\..*$\n?',
                  '',
                  text,
                  flags=re.MULTILINE,
              )

              # Remove Google Services plugin alias.
              text = re.sub(
                  r'^\s*alias\(libs\.plugins\.google\.services\).*\n?',
                  '',
                  text,
                  flags=re.MULTILINE,
              )

              # Remove googleServices { ... } block.
              text = re.sub(
                  r'\n?googleServices\s*\{.*?\}\s*\n',
                  '\n',
                  text,
                  flags=re.DOTALL,
              )

              # Remove custom debug signing.
              text = re.sub(
                  r'^\s*signingConfig\s*=\s*signingConfigs\.getByName\("debugConfig"\)\s*$\n?',
                  '',
                  text,
                  flags=re.MULTILINE,
              )

              text = re.sub(
                  r'\n\s*create\("debugConfig"\)\s*\{.*?\n\s*\}',
                  '',
                  text,
                  flags=re.DOTALL,
              )

              # Use Java 17.
              text = text.replace(
                  "sourceCompatibility = JavaVersion.VERSION_11",
                  "sourceCompatibility = JavaVersion.VERSION_17",
              )

              text = text.replace(
                  "targetCompatibility = JavaVersion.VERSION_11",
                  "targetCompatibility = JavaVersion.VERSION_17",
              )

              path.write_text(text, encoding="utf-8")

          # Remove Google Services entries from version catalog.
          catalog = Path("project/gradle/libs.versions.toml")

          if catalog.exists():
              text = catalog.read_text(encoding="utf-8")

              text = re.sub(
                  r'^googleServices\s*=.*\n?',
                  '',
                  text,
                  flags=re.MULTILINE,
              )

              text = re.sub(
                  r'^google-services\s*=.*\n?',
                  '',
                  text,
                  flags=re.MULTILINE,
              )

              catalog.write_text(text, encoding="utf-8")

          # Remove obsolete Google Services passthrough.
          properties = Path("project/gradle.properties")

          if properties.exists():
              text = properties.read_text(encoding="utf-8")

              text = re.sub(
                  r'^googleServices\.missing\.passthrough=.*\n?',
                  '',
                  text,
                  flags=re.MULTILINE,
              )

              properties.write_text(text, encoding="utf-8")

          # Delete any Firebase JSON configuration.
          for file in Path("project").rglob("google-services.json"):
              file.unlink()

          print("Build configuration sanitized successfully.")
          PY

      # ==========================================================
      # 5. JDK 17
      # ==========================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # 6. Gradle 9.3.1
      # ==========================================================
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # ==========================================================
      # 7. Android SDK
      # ==========================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # ==========================================================
      # 8. Gradle Wrapper
      # ==========================================================
      - name: Generate Gradle wrapper
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "gradlew" ]; then
            gradle wrapper \
              --gradle-version 9.3.1 \
              --distribution-type bin
          fi

          chmod +x gradlew

          ./gradlew --version

      # ==========================================================
      # 9. Validate configuration
      # ==========================================================
      - name: Validate project configuration
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:tasks \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ==========================================================
      # 10. Compile Kotlin separately
      # ==========================================================
      - name: Compile Kotlin only
        working-directory: project
        shell: bash
        run: |
          set -o pipefail

          ./gradlew \
            :app:compileDebugKotlin \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            2>&1 | tee kotlin-compile.log

          EXIT_CODE=${PIPESTATUS[0]}

          if [ "$EXIT_CODE" -ne 0 ]; then

            echo ""
            echo "========================================"
            echo "FIRST KOTLIN ERRORS"
            echo "========================================"

            grep -nE \
              '(^e: |error: |Unresolved reference|Type mismatch|Expecting |Cannot access|Overload resolution ambiguity)' \
              kotlin-compile.log \
              | head -120 || true

            echo ""
            echo "========================================"
            echo "KOTLIN ERROR CONTEXT"
            echo "========================================"

            grep -n -B 3 -A 8 \
              '^e: ' \
              kotlin-compile.log \
              | head -240 || true

            exit "$EXIT_CODE"
          fi

          echo "Kotlin compilation successful."

      # ==========================================================
      # 11. Build APK
      # ==========================================================
      - name: Build Debug APK
        working-directory: project
        shell: bash
        run: |
          set -o pipefail

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            2>&1 | tee build.log

          EXIT_CODE=${PIPESTATUS[0]}

          if [ "$EXIT_CODE" -ne 0 ]; then

            echo ""
            echo "========================================"
            echo "BUILD ERROR SUMMARY"
            echo "========================================"

            grep -nE \
              '(^e: |error: |Execution failed for task|What went wrong|Caused by:|FAILED)' \
              build.log \
              | head -160 || true

            echo ""
            echo "========================================"
            echo "LAST 200 LINES"
            echo "========================================"

            tail -200 build.log

            exit "$EXIT_CODE"
          fi

          echo ""
          echo "APK BUILD SUCCESSFUL"

      # ==========================================================
      # 12. Prepare APK
      # ==========================================================
      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          APK=$(
            find project/app/build/outputs/apk/debug \
              -type f \
              -name "*.apk" \
              -print -quit
          )

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          cp "$APK" \
            artifacts/APK-Builder-Mobile-debug.apk

          ls -lh \
            artifacts/APK-Builder-Mobile-debug.apk

      # ==========================================================
      # 13. Upload APK
      # ==========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Builder-Mobile
          path: artifacts/APK-Builder-Mobile-debug.apk
          if-no-files-found: error
          retention-days: 7

      # ==========================================================
      # 14. Upload diagnostics if anything fails
      # ==========================================================
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Diagnostics
          path: |
            project/kotlin-compile.log
            project/build.log
          if-no-files-found: ignore
          retention-days: 7
