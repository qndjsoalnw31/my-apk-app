name: Build CinePro Cinema Camera APK

on:
  push:
    branches:
      - main
    paths:
      - 'cinepro-cinema-camera.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cinepro-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build CinePro Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Verify and extract CinePro project
        id: extract
        shell: bash
        env:
          EXPECTED_SHA256: a7316216e038bfa5bf0b4c8a2ce9025b716e5cd4d9f791de84ecd3fb6e4b7bf7
        run: |
          set -euo pipefail

          ARCHIVE="$GITHUB_WORKSPACE/cinepro-cinema-camera.zip"
          PROJECT_DIR="$RUNNER_TEMP/cinepro-project"

          if [[ ! -f "$ARCHIVE" ]]; then
            echo "::error::cinepro-cinema-camera.zip was not found in the repository root."
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -iname '*.zip' -print || true
            exit 1
          fi

          echo "$EXPECTED_SHA256  $ARCHIVE" | sha256sum --check
          unzip -tq "$ARCHIVE"

          rm -rf "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR"

          python3 - "$ARCHIVE" "$PROJECT_DIR" <<'PY'
          import pathlib
          import sys
          import zipfile

          archive = pathlib.Path(sys.argv[1])
          destination = pathlib.Path(sys.argv[2]).resolve()

          with zipfile.ZipFile(archive) as zf:
              for entry in zf.infolist():
                  target = (destination / entry.filename).resolve()
                  if not target.is_relative_to(destination):
                      raise SystemExit(f"Unsafe ZIP path: {entry.filename}")
              zf.extractall(destination)

          required = [
              destination / "settings.gradle.kts",
              destination / "build.gradle.kts",
              destination / "app" / "build.gradle.kts",
              destination / "app" / "src" / "main" / "AndroidManifest.xml",
              destination / "gradle" / "libs.versions.toml",
          ]

          missing = [str(path) for path in required if not path.is_file()]

          if missing:
              raise SystemExit(
                  "Required CinePro project files are missing: " + ", ".join(missing)
              )
          PY

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "CinePro project extracted successfully."
          ls -la "$PROJECT_DIR"

      - name: Configure optional Gemini API key
        if: ${{ secrets.GEMINI_API_KEY != '' }}
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -euo pipefail
          printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > "$PROJECT_DIR/.env"

      - name: Create required debug keystore
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -euo pipefail

          KEYSTORE="$PROJECT_DIR/debug.keystore"

          keytool -genkeypair -v -noprompt \
            -keystore "$KEYSTORE" \
            -storetype JKS \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey

      - name: Build CinePro Debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -euo pipefail

          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > "$PROJECT_DIR/local.properties"

          java -version
          gradle --version

          gradle \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --console=plain \
            -p "$PROJECT_DIR" \
            :app:assembleDebug

          APK_SOURCE="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK_SOURCE" ]]; then
            echo "::error::Gradle completed but the expected APK was not created."
            find "$PROJECT_DIR/app/build/outputs" -type f -name '*.apk' -print || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK_SOURCE" \
            "$GITHUB_WORKSPACE/output/CinePro-Cinema-Camera.apk"

          ls -lh "$GITHUB_WORKSPACE/output/CinePro-Cinema-Camera.apk"

      - name: Upload CinePro APK
        uses: actions/upload-artifact@v7
        with:
          name: CinePro-Cinema-Camera-APK
          path: output/CinePro-Cinema-Camera.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
