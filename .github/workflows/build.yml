name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "platforms;android-34"
          sdkmanager "platforms;android-33"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "build-tools;34.0.0"
          sdkmanager "build-tools;33.0.2"

      - name: Extract ZIP
        run: |
          set -e
          test -f substack-downloader.zip
          rm -rf extracted
          mkdir -p extracted
          unzip -q substack-downloader.zip -d extracted

      - name: Find Project
        run: |
          set -e

          PROJECT=$(find extracted -type f -name settings.gradle.kts -print -quit)

          if [ -z "$PROJECT" ]; then
            PROJECT=$(find extracted -type f -name settings.gradle -print -quit)
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Gradle project not found"
            find extracted -maxdepth 5 -type f -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project:"
          echo "$PROJECT_DIR"

      - name: Create Gradle Wrapper
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            exit 0
          fi

          echo "gradlew not found."
          echo "Creating Gradle wrapper."

          mkdir -p gradle/wrapper

          wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip -O /tmp/gradle.zip

          rm -rf /tmp/gradle
          mkdir /tmp/gradle

          unzip -q /tmp/gradle.zip -d /tmp/gradle

          /tmp/gradle/gradle-8.13/bin/gradle wrapper --gradle-version 8.13

          chmod +x gradlew

      - name: Verify Project
        run: |
          set -e

          cd "$PROJECT_DIR"

          test -f settings.gradle.kts || test -f settings.gradle
          test -f gradlew

          chmod +x gradlew

          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          ./gradlew --version

      - name: Build APK
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          CODE=${PIPESTATUS[0]}

          if [ "$CODE" -ne 0 ]; then
            echo ""
            echo "BUILD FAILED"
            tail -150 "$GITHUB_WORKSPACE/build.log"
            exit "$CODE"
          fi

      - name: Find APK
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          mkdir -p artifacts
          cp "$APK" artifacts/Substack-Downloader-debug.apk

          echo "APK:"
          ls -lh artifacts/Substack-Downloader-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Substack-Downloader-APK
          path: artifacts/Substack-Downloader-debug.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Build-Log
          path: build.log
          if-no-files-found: ignore
