name: Build TikTok Downloader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "9.3.1"
  ANDROID_PLATFORM: "36.1"
  ANDROID_BUILD_TOOLS: "36.1.0"
  GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:

      # ============================================================
      # 01 - CHECKOUT
      # ============================================================
      - name: "01 - Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 02 - JAVA 17
      # ============================================================
      - name: "02 - Setup Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ============================================================
      # 03 - ANDROID SDK
      # ============================================================
      - name: "03 - Setup Android SDK"
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-36.1
            build-tools;36.1.0
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # ============================================================
      # 04 - VERIFY ENVIRONMENT
      # ============================================================
      - name: "04 - Verify build environment"
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "BUILD ENVIRONMENT"
          echo "============================================================"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo ""
          echo "Android SDK:"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

          echo ""
          echo "sdkmanager:"
          command -v sdkmanager || true
          sdkmanager --version || true

          echo ""
          echo "Installed SDK packages:"
          sdkmanager --list_installed 2>/dev/null || true

          echo ""
          echo "Required platform:"
          if [ ! -d "${ANDROID_SDK_ROOT}/platforms/android-36.1" ]; then
            echo "::error::Android SDK Platform 36.1 is missing."
            exit 1
          fi

          echo ""
          echo "Required build tools:"
          if [ ! -d "${ANDROID_SDK_ROOT}/build-tools/36.1.0" ]; then
            echo "::error::Android Build Tools 36.1.0 are missing."
            exit 1
          fi

          echo ""
          echo "SDK verification successful."

      # ============================================================
      # 05 - LOCATE ZIP
      # ============================================================
      - name: "05 - Locate TikTok Downloader ZIP"
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/tiktok-downloader.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::tiktok-downloader.zip was not found."
            echo ""
            echo "Repository contents:"
            find "$GITHUB_WORKSPACE" -maxdepth 5 -type f -print | sort
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "ZIP:"
          ls -lh "$ZIP_FILE"

      # ============================================================
      # 06 - VALIDATE ZIP
      # ============================================================
      - name: "06 - Validate ZIP"
        shell: bash
        run: |
          set -euo pipefail

          echo "Testing ZIP integrity..."
          unzip -t "$ZIP_FILE"

          echo "ZIP integrity: OK"

      # ============================================================
      # 07 - EXTRACT PROJECT
      # ============================================================
      - name: "07 - Extract Android project"
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$GITHUB_WORKSPACE/android-project"

          rm -rf "$PROJECT_ROOT"
          mkdir -p "$PROJECT_ROOT"

          unzip -q "$ZIP_FILE" -d "$PROJECT_ROOT"

          echo "Extracted files:"
          find "$PROJECT_ROOT" -maxdepth 8 -type f -print | sort

      # ============================================================
      # 08 - VERIFY EXACT PROJECT STRUCTURE
      # ============================================================
      - name: "08 - Verify project structure"
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/android-project"

          REQUIRED_FILES=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "app/build.gradle.kts"
            "gradle/libs.versions.toml"
            "gradle/wrapper/gradle-wrapper.properties"
            "app/src/main/AndroidManifest.xml"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "::error::Required project file is missing: $FILE"
              exit 1
            fi
          done

          echo "Project structure verified."

      # ============================================================
      # 09 - FORCE EXACT GRADLE VERSION
      # ============================================================
      - name: "09 - Configure Gradle 9.3.1"
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/android-project"

          mkdir -p gradle/wrapper

          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          networkTimeout=60000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          echo "Gradle wrapper configuration:"
          cat gradle/wrapper/gradle-wrapper.properties

      # ============================================================
      # 10 - INSTALL GRADLE 9.3.1
      # ============================================================
      - name: "10 - Setup Gradle 9.3.1"
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          cache-read-only: false
          add-job-summary: on-failure

      # ============================================================
      # 11 - CREATE LOCAL.PROPERTIES
      # ============================================================
      - name: "11 - Configure Android SDK path"
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/android-project"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "::error::ANDROID_SDK_ROOT is not defined."
            exit 1
          fi

          printf 'sdk.dir=%s\n' "$SDK_ROOT" > local.properties

          echo "local.properties:"
          cat local.properties

      # ============================================================
      # 12 - FORCE SAFE GRADLE PROPERTIES
      # ============================================================
      - name: "12 - Configure Gradle properties"
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/android-project"

          touch gradle.properties

          cat >> gradle.properties <<'EOF'

          # CI configuration
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.workers.max=4
          org.gradle.caching=true
          kotlin.compiler.execution.strategy=in-process
          googleServices.missing.passthrough=true
          EOF

          echo "Gradle properties:"
          cat gradle.properties

      # ============================================================
      # 13 - VERIFY PROJECT VERSIONS
      # ============================================================
      - name: "13 - Verify project toolchain versions"
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/android-project"

          echo "============================================================"
          echo "PROJECT TOOLCHAIN"
          echo "============================================================"

          echo ""
          echo "AGP:"
          grep -n 'agp =' gradle/libs.versions.toml

          echo ""
          echo "Kotlin:"
          grep -n '^kotlin =' gradle/libs.versions.toml

          echo ""
          echo "KSP:"
          grep -n 'googleDevtoolsKsp' gradle/libs.versions.toml

          echo ""
          echo "Gradle:"
          grep -n 'distributionUrl' gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "compileSdk:"
          grep -n -A4 -B2 'compileSdk' app/build.gradle.kts

          echo ""
          echo "applicationId:"
          grep -n 'applicationId' app/build.gradle.kts

      # ============================================================
      # 14 - VERIFY EXACT SDK
      # ============================================================
      - name: "14 - Verify Android 36.1 SDK"
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          echo "SDK root: $SDK_ROOT"

          echo ""
          echo "Platform 36.1:"
          ls -lah "$SDK_ROOT/platforms/android-36.1"

          echo ""
          echo "Build Tools 36.1.0:"
          ls -lah "$SDK_ROOT/build-tools/36.1.0"

          echo ""
          echo "android.jar:"
          test -f "$SDK_ROOT/platforms/android-36.1/android.jar" || true
          test -f "$SDK_ROOT/platforms/android-36.1/android.jar" || \
            echo "Base API 36 platform not required because project uses 36.1."

          test -f "$SDK_ROOT/platforms/android-36.1/android.jar"

          echo ""
          echo "SDK 36.1 verification successful."

      # ============================================================
      # 15 - VERIFY GRADLE
      # ============================================================
      - name: "15 - Verify Gradle"
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/android-project"

          gradle --version

      # ============================================================
      # 16 - GRADLE CONFIGURATION TEST
      # ============================================================
      - name: "16 - Validate Gradle configuration"
        shell: bash
        run: |
          set -uo pipefail

          cd "$GITHUB_WORKSPACE/android-project"

          echo "============================================================"
          echo "GRADLE CONFIGURATION VALIDATION"
          echo "============================================================"

          set +e

          gradle \
            help \
            --no-daemon \
            --stacktrace \
            --console=plain \
            --warning-mode=all \
            --no-configuration-cache \
            2>&1 | tee "$GITHUB_WORKSPACE/gradle-help.log"

          RC=${PIPESTATUS[0]}

          set -e

          echo ""
          echo "Gradle configuration exit code: $RC"

          if [ "$RC" -ne 0 ]; then
            echo ""
            echo "============================================================"
            echo "CONFIGURATION FAILURE"
            echo "============================================================"

            echo ""
            echo "Relevant Android/Kotlin/KSP errors:"
            grep -n -E \
              'FAILURE:|ERROR|error:|Exception|Caused by:|Android Gradle|Kotlin|KSP|Room|Moshi|Plugin' \
              "$GITHUB_WORKSPACE/gradle-help.log" \
              | tail -n 250 \
              || true

            echo ""
            echo "Last 300 lines:"
            tail -n 300 "$GITHUB_WORKSPACE/gradle-help.log"

            exit "$RC"
          fi

          echo "Gradle configuration is valid."

      # ============================================================
      # 17 - VERIFY TASK GRAPH
      # ============================================================
      - name: "17 - Verify Android tasks"
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/android-project"

          gradle \
            :app:tasks \
            --all \
            --no-daemon \
            --stacktrace \
            --console=plain \
            --warning-mode=all \
            --no-configuration-cache \
            2>&1 | tee "$GITHUB_WORKSPACE/gradle-tasks.log"

      # ============================================================
      # 18 - CLEAN
      # ============================================================
      - name: "18 - Clean project"
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/android-project"

          gradle \
            clean \
            --no-daemon \
            --stacktrace \
            --console=plain \
            --warning-mode=all \
            --no-configuration-cache

      # ============================================================
      # 19 - BUILD DEBUG APK
      # ============================================================
      - name: "19 - Build Debug APK"
        shell: bash
        run: |
          set -uo pipefail

          cd "$GITHUB_WORKSPACE/android-project"

          rm -f "$GITHUB_WORKSPACE/gradle-build.log"

          echo "============================================================"
          echo "BUILD DEBUG APK"
          echo "============================================================"

          set +e

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain \
            --warning-mode=all \
            --no-configuration-cache \
            --rerun-tasks \
            2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

          RC=${PIPESTATUS[0]}

          set -e

          if [ "$RC" -ne 0 ]; then
            echo ""
            echo "============================================================"
            echo "APK BUILD FAILED"
            echo "============================================================"

            echo ""
            echo "---------------- KSP ----------------"
            grep -n -E \
              'KSP|ksp|symbol-processing|ApplicationManager' \
              "$GITHUB_WORKSPACE/gradle-build.log" \
              | tail -n 200 \
              || true

            echo ""
            echo "---------------- SDK ----------------"
            grep -n -E \
              'compileSdk|36\.1|SDK|AAPT|resource .* not found|android.jar' \
              "$GITHUB_WORKSPACE/gradle-build.log" \
              | tail -n 200 \
              || true

            echo ""
            echo "---------------- Kotlin ----------------"
            grep -n -E \
              'Kotlin|KotlinCompile|JVM|jvmTarget|compiler' \
              "$GITHUB_WORKSPACE/gradle-build.log" \
              | tail -n 200 \
              || true

            echo ""
            echo "---------------- Dependencies ----------------"
            grep -n -E \
              'Could not resolve|Could not find|Could not download|TLS|SSL|PKIX|timeout|Connection reset|UnknownHost' \
              "$GITHUB_WORKSPACE/gradle-build.log" \
              | tail -n 200 \
              || true

            echo ""
            echo "---------------- Gradle ----------------"
            grep -n -E \
              'FAILURE:|Execution failed for task|Task .* FAILED|Exception|Caused by:|error:' \
              "$GITHUB_WORKSPACE/gradle-build.log" \
              | tail -n 300 \
              || true

            echo ""
            echo "---------------- LAST 400 LINES ----------------"
            tail -n 400 "$GITHUB_WORKSPACE/gradle-build.log"

            exit "$RC"
          fi

          echo ""
          echo "APK BUILD SUCCESSFUL."

      # ============================================================
      # 20 - FIND APK
      # ============================================================
      - name: "20 - Find generated APK"
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/android-project"

          OUTPUT_DIR="$GITHUB_WORKSPACE/apk-output"

          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::Expected APK was not generated:"
            echo "$APK"

            echo ""
            echo "All APK files:"
            find . \
              -type f \
              -name '*.apk' \
              -print \
              | sort

            exit 1
          fi

          cp "$APK" "$OUTPUT_DIR/TikTok-Downloader-debug.apk"

          echo ""
          echo "Generated APK:"
          ls -lh "$OUTPUT_DIR/TikTok-Downloader-debug.apk"

      # ============================================================
      # 21 - APK INFORMATION
      # ============================================================
      - name: "21 - Inspect APK"
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/apk-output/TikTok-Downloader-debug.apk"

          echo "============================================================"
          echo "APK INFORMATION"
          echo "============================================================"

          ls -lh "$APK"

          echo ""
          echo "File:"
          file "$APK"

          echo ""
          echo "SHA256:"
          sha256sum "$APK"

          echo ""
          echo "APK summary:"
          apkanalyzer apk summary "$APK" || true

      # ============================================================
      # 22 - UPLOAD APK
      # ============================================================
      - name: "22 - Upload APK"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-Downloader-APK
          path: apk-output/TikTok-Downloader-debug.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # ============================================================
      # 23 - COLLECT DIAGNOSTICS
      # ============================================================
      - name: "23 - Collect diagnostics"
        if: always()
        shell: bash
        run: |
          set +e

          DIAG="$GITHUB_WORKSPACE/diagnostics"

          rm -rf "$DIAG"
          mkdir -p "$DIAG"

          cp "$GITHUB_WORKSPACE/gradle-help.log" \
            "$DIAG/gradle-help.log" 2>/dev/null || true

          cp "$GITHUB_WORKSPACE/gradle-tasks.log" \
            "$DIAG/gradle-tasks.log" 2>/dev/null || true

          cp "$GITHUB_WORKSPACE/gradle-build.log" \
            "$DIAG/gradle-build.log" 2>/dev/null || true

          cp "$GITHUB_WORKSPACE/android-project/gradle.properties" \
            "$DIAG/gradle.properties" 2>/dev/null || true

          cp "$GITHUB_WORKSPACE/android-project/settings.gradle.kts" \
            "$DIAG/settings.gradle.kts" 2>/dev/null || true

          cp "$GITHUB_WORKSPACE/android-project/build.gradle.kts" \
            "$DIAG/build.gradle.kts" 2>/dev/null || true

          cp "$GITHUB_WORKSPACE/android-project/app/build.gradle.kts" \
            "$DIAG/app-build.gradle.kts" 2>/dev/null || true

          cp "$GITHUB_WORKSPACE/android-project/gradle/libs.versions.toml" \
            "$DIAG/libs.versions.toml" 2>/dev/null || true

          cp "$GITHUB_WORKSPACE/android-project/gradle/wrapper/gradle-wrapper.properties" \
            "$DIAG/gradle-wrapper.properties" 2>/dev/null || true

          {
            echo "============================================================"
            echo "ENVIRONMENT"
            echo "============================================================"
            echo "Java:"
            java -version 2>&1
            echo ""
            echo "JAVA_HOME:"
            echo "${JAVA_HOME:-unknown}"
            echo ""
            echo "Gradle:"
            gradle --version 2>&1
            echo ""
            echo "ANDROID_HOME:"
            echo "${ANDROID_HOME:-unknown}"
            echo ""
            echo "ANDROID_SDK_ROOT:"
            echo "${ANDROID_SDK_ROOT:-unknown}"
            echo ""
            echo "SDK packages:"
            sdkmanager --list_installed 2>&1 || true
          } > "$DIAG/environment.txt"

          echo "Diagnostics collected."

      # ============================================================
      # 24 - UPLOAD DIAGNOSTICS
      # ============================================================
      - name: "24 - Upload diagnostics"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-Downloader-Diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
