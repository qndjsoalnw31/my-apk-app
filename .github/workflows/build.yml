name: Build TikTok Downloader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  JAVA_VERSION: "17"
  GRADLE_FALLBACK: "9.3.1"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

jobs:
  build:
    name: Build TikTok Downloader APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v7

      # ============================================================
      # 2. CREATE LOG IMMEDIATELY
      # ============================================================

      - name: Initialize build log
        run: |
          set -u

          : > "$GITHUB_WORKSPACE/gradle-build.log"

          {
            echo "=============================================="
            echo "TikTok Downloader APK Build"
            echo "=============================================="
            echo "Date:"
            date
            echo
            echo "Runner:"
            uname -a
            echo
          } | tee -a "$GITHUB_WORKSPACE/gradle-build.log"

      # ============================================================
      # 3. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 4. ANDROID SDK - NODE 24 VERSION
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      # ============================================================
      # 5. ENVIRONMENT CHECK
      # ============================================================

      - name: Check build environment
        run: |
          set -u

          {
            echo
            echo "=============================================="
            echo "BUILD ENVIRONMENT"
            echo "=============================================="

            echo
            echo "JAVA:"
            java -version 2>&1 || true

            echo
            echo "JAVA_HOME:"
            echo "${JAVA_HOME:-}"

            echo
            echo "ANDROID_HOME:"
            echo "${ANDROID_HOME:-}"

            echo
            echo "ANDROID_SDK_ROOT:"
            echo "${ANDROID_SDK_ROOT:-}"

            echo
            echo "SDKMANAGER:"
            command -v sdkmanager || true

            echo
            echo "ADB:"
            command -v adb || true
            adb version 2>&1 || true

            echo
          } | tee -a "$GITHUB_WORKSPACE/gradle-build.log"

      # ============================================================
      # 6. FIND ZIP
      # ============================================================

      - name: Find TikTok Downloader ZIP
        run: |
          set -euo pipefail

          ZIP_FILE=""

          if [ -f "$GITHUB_WORKSPACE/tiktok-downloader.zip" ]; then
            ZIP_FILE="$GITHUB_WORKSPACE/tiktok-downloader.zip"
          else
            ZIP_FILE="$(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -iname "*.zip" \
                -not -path "*/.git/*" \
                | head -n 1
            )"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: tiktok-downloader.zip not found."

            echo
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 6 \
              -type f \
              | sort

            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          {
            echo
            echo "ZIP:"
            echo "$ZIP_FILE"
            echo
            echo "SIZE:"
            ls -lh "$ZIP_FILE"
          } | tee -a "$GITHUB_WORKSPACE/gradle-build.log"

      # ============================================================
      # 7. VALIDATE ZIP
      # ============================================================

      - name: Validate ZIP
        run: |
          set -euo pipefail

          unzip -t "$ZIP_FILE" \
            | tee -a "$GITHUB_WORKSPACE/gradle-build.log"

      # ============================================================
      # 8. SHOW ZIP CONTENTS
      # ============================================================

      - name: Inspect ZIP
        run: |
          set -euo pipefail

          {
            echo
            echo "=============================================="
            echo "ZIP CONTENTS"
            echo "=============================================="
          } | tee -a "$GITHUB_WORKSPACE/gradle-build.log"

          unzip -l "$ZIP_FILE" \
            | tee -a "$GITHUB_WORKSPACE/gradle-build.log"

      # ============================================================
      # 9. EXTRACT
      # ============================================================

      - name: Extract Android project
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/android-project"

          mkdir -p "$GITHUB_WORKSPACE/android-project"

          unzip -q \
            "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/android-project"

          {
            echo
            echo "=============================================="
            echo "EXTRACTED PROJECT"
            echo "=============================================="

            find "$GITHUB_WORKSPACE/android-project" \
              -maxdepth 10 \
              -type f \
              | sort
          } | tee -a "$GITHUB_WORKSPACE/gradle-build.log"

      # ============================================================
      # 10. FIND GRADLE PROJECT
      # ============================================================

      - name: Locate Android project
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/android-project"
          PROJECT_DIR=""

          SETTINGS_FILE="$(
            find "$ROOT" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -not -path "*/build/*" \
              | sort \
              | head -n 1
          )"

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            GRADLEW_FILE="$(
              find "$ROOT" \
                -type f \
                -name "gradlew" \
                -not -path "*/build/*" \
                | sort \
                | head -n 1
            )"

            if [ -n "$GRADLEW_FILE" ]; then
              PROJECT_DIR="$(dirname "$GRADLEW_FILE")"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."

            echo
            echo "Extracted tree:"
            find "$ROOT" \
              -maxdepth 12 \
              -print \
              | sort

            exit 1
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          {
            echo
            echo "ANDROID PROJECT:"
            echo "$PROJECT_DIR"
          } | tee -a "$GITHUB_WORKSPACE/gradle-build.log"

      # ============================================================
      # 11. FIND APP MODULE
      # ============================================================

      - name: Locate Android app module
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          APP_MODULE=""

          if [ -d "app" ] && \
             [ -f "app/build.gradle" -o -f "app/build.gradle.kts" ]; then
            APP_MODULE="app"
          fi

          if [ -z "$APP_MODULE" ]; then

            MANIFEST="$(
              find . \
                -type f \
                -path "*/src/main/AndroidManifest.xml" \
                -not -path "*/build/*" \
                | sort \
                | head -n 1
            )"

            if [ -n "$MANIFEST" ]; then

              MODULE_DIR="$(
                dirname \
                  "$(dirname \
                    "$(dirname "$MANIFEST")" \
                  )"
              )"

              MODULE_DIR="${MODULE_DIR#./}"

              if [ -f "$MODULE_DIR/build.gradle" ] || \
                 [ -f "$MODULE_DIR/build.gradle.kts" ]; then
                APP_MODULE="$MODULE_DIR"
              fi

            fi

          fi

          if [ -z "$APP_MODULE" ]; then
            echo "ERROR: Android application module not found."

            echo
            echo "Project tree:"
            find . \
              -maxdepth 10 \
              -print \
              | sort

            exit 1
          fi

          echo "APP_MODULE=$APP_MODULE" >> "$GITHUB_ENV"

          {
            echo
            echo "APP MODULE:"
            echo "$APP_MODULE"
          } | tee -a "$GITHUB_WORKSPACE/gradle-build.log"

      # ============================================================
      # 12. CHECK GRADLE WRAPPER
      # ============================================================

      - name: Detect Gradle Wrapper
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ] && \
             [ -f "./gradle/wrapper/gradle-wrapper.properties" ]; then

            chmod +x ./gradlew

            echo "USE_WRAPPER=true" >> "$GITHUB_ENV"

            echo "Existing Gradle wrapper detected."

          else

            echo "USE_WRAPPER=false" >> "$GITHUB_ENV"

            echo "No complete Gradle wrapper detected."

          fi

      # ============================================================
      # 13. READ WRAPPER VERSION
      # ============================================================

      - name: Read Gradle Wrapper version
        if: env.USE_WRAPPER == 'true'
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          VERSION="$(
            grep \
              -oE \
              'gradle-[0-9]+\.[0-9]+(\.[0-9]+)?' \
              gradle/wrapper/gradle-wrapper.properties \
              | head -n 1 \
              | sed 's/gradle-//'
          )"

          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not read Gradle wrapper version."
            exit 1
          fi

          echo "GRADLE_VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "Wrapper Gradle:"
          echo "$VERSION"

      # ============================================================
      # 14. DETECT AGP
      # ============================================================

      - name: Detect Android Gradle Plugin
        if: env.USE_WRAPPER == 'false'
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          AGP_VERSION=""

          # Modern plugins DSL
          AGP_VERSION="$(
            grep -RhoE \
              'com\.android\.application[^0-9]{0,120}[0-9]+\.[0-9]+(\.[0-9]+)?' \
              . \
              --include="*.gradle" \
              --include="*.gradle.kts" \
              --include="*.toml" \
              2>/dev/null \
              | grep -oE \
                '[0-9]+\.[0-9]+(\.[0-9]+)?' \
              | head -n 1 \
              || true
          )"

          # Legacy buildscript
          if [ -z "$AGP_VERSION" ]; then
            AGP_VERSION="$(
              grep -RhoE \
                'com\.android\.tools\.build:gradle:[0-9]+\.[0-9]+(\.[0-9]+)?' \
                . \
                --include="*.gradle" \
                --include="*.gradle.kts" \
                --include="*.toml" \
                2>/dev/null \
                | grep -oE \
                  '[0-9]+\.[0-9]+(\.[0-9]+)?' \
                | head -n 1 \
                || true
            )"
          fi

          # Version catalog
          if [ -z "$AGP_VERSION" ]; then
            AGP_VERSION="$(
              grep -RhoE \
                '(^|[^A-Za-z])(agp|androidGradlePlugin)[^0-9]*[=:][[:space:]]*"?[0-9]+\.[0-9]+(\.[0-9]+)?' \
                . \
                --include="*.toml" \
                --include="*.gradle" \
                --include="*.gradle.kts" \
                2>/dev/null \
                | grep -oE \
                  '[0-9]+\.[0-9]+(\.[0-9]+)?' \
                | head -n 1 \
                || true
            )"
          fi

          if [ -z "$AGP_VERSION" ]; then
            echo "AGP version could not be detected."
            echo "Using AGP 9.1 compatible Gradle as fallback."
            AGP_VERSION="9.1.1"
          fi

          echo "AGP_VERSION=$AGP_VERSION" >> "$GITHUB_ENV"

          echo
          echo "AGP:"
          echo "$AGP_VERSION"

      # ============================================================
      # 15. SELECT COMPATIBLE GRADLE
      # ============================================================

      - name: Select compatible Gradle
        if: env.USE_WRAPPER == 'false'
        run: |
          set -euo pipefail

          MAJOR="$(echo "$AGP_VERSION" | cut -d. -f1)"
          MINOR="$(echo "$AGP_VERSION" | cut -d. -f2)"

          case "${MAJOR}.${MINOR}" in

            9.4)
              GRADLE_VERSION="9.6.0"
              ;;

            9.3)
              GRADLE_VERSION="9.5.0"
              ;;

            9.2)
              GRADLE_VERSION="9.4.1"
              ;;

            9.1)
              GRADLE_VERSION="9.3.1"
              ;;

            9.0)
              GRADLE_VERSION="9.1.0"
              ;;

            8.13)
              GRADLE_VERSION="8.13"
              ;;

            8.12|8.11)
              GRADLE_VERSION="8.13"
              ;;

            8.10|8.9)
              GRADLE_VERSION="8.11.1"
              ;;

            8.8)
              GRADLE_VERSION="8.10.2"
              ;;

            8.7)
              GRADLE_VERSION="8.9"
              ;;

            8.6|8.5)
              GRADLE_VERSION="8.7"
              ;;

            8.4)
              GRADLE_VERSION="8.6"
              ;;

            8.3)
              GRADLE_VERSION="8.4"
              ;;

            8.2)
              GRADLE_VERSION="8.2"
              ;;

            8.1)
              GRADLE_VERSION="8.0"
              ;;

            8.0)
              GRADLE_VERSION="8.0"
              ;;

            7.4)
              GRADLE_VERSION="7.5"
              ;;

            7.3)
              GRADLE_VERSION="7.4"
              ;;

            7.2)
              GRADLE_VERSION="7.3.3"
              ;;

            7.1)
              GRADLE_VERSION="7.2"
              ;;

            7.0)
              GRADLE_VERSION="7.0"
              ;;

            *)
              GRADLE_VERSION="$GRADLE_FALLBACK"
              ;;

          esac

          echo "GRADLE_VERSION=$GRADLE_VERSION" >> "$GITHUB_ENV"

          echo
          echo "Selected Gradle:"
          echo "$GRADLE_VERSION"

      # ============================================================
      # 16. INSTALL GRADLE ONLY IF WRAPPER IS MISSING
      # ============================================================

      - name: Install Gradle
        if: env.USE_WRAPPER == 'false'
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/gradle-runtime"

          rm -rf "$ROOT"
          mkdir -p "$ROOT"

          echo "Downloading Gradle $GRADLE_VERSION"

          curl \
            -fL \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 30 \
            --max-time 600 \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o "$ROOT/gradle.zip"

          unzip -q \
            "$ROOT/gradle.zip" \
            -d "$ROOT"

          BIN="$ROOT/gradle-${GRADLE_VERSION}/bin/gradle"

          if [ ! -x "$BIN" ]; then
            echo "ERROR: Gradle binary missing."

            find "$ROOT" \
              -maxdepth 4 \
              -type f \
              | sort

            exit 1
          fi

          echo "GRADLE_BIN=$BIN" >> "$GITHUB_ENV"

          "$BIN" --version

      # ============================================================
      # 17. INSTALL COMMON ANDROID PLATFORMS
      # ============================================================

      - name: Prepare Android SDK
        run: |
          set -euo pipefail

          {
            echo
            echo "=============================================="
            echo "ANDROID SDK"
            echo "=============================================="
          } | tee -a "$GITHUB_WORKSPACE/gradle-build.log"

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "platforms;android-36" \
            "platforms;android-37" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            2>&1 \
            | tee -a "$GITHUB_WORKSPACE/gradle-build.log"

      # ============================================================
      # 18. SHOW PROJECT CONFIGURATION
      # ============================================================

      - name: Inspect Gradle configuration
        run: |
          set -u

          cd "$PROJECT_DIR"

          {
            echo
            echo "=============================================="
            echo "GRADLE CONFIGURATION"
            echo "=============================================="

            echo
            echo "Files:"
            find . \
              -type f \
              \( \
                -name "build.gradle" \
                -o \
                -name "build.gradle.kts" \
                -o \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
                -o \
                -name "gradle-wrapper.properties" \
                -o \
                -name "libs.versions.toml" \
              \) \
              -not -path "*/build/*" \
              | sort

            echo
            echo "Android Gradle Plugin declarations:"

            grep -RhnE \
              "com\.android\.application|com\.android\.tools\.build:gradle|agp[[:space:]]*=" \
              . \
              --include="*.gradle" \
              --include="*.gradle.kts" \
              --include="*.toml" \
              2>/dev/null \
              | head -n 50 \
              || true

            echo
            echo "Compile SDK declarations:"

            grep -RhnE \
              "compileSdk|compileSdkVersion" \
              . \
              --include="*.gradle" \
              --include="*.gradle.kts" \
              2>/dev/null \
              | head -n 50 \
              || true

          } | tee -a "$GITHUB_WORKSPACE/gradle-build.log"

      # ============================================================
      # 19. VERIFY GRADLE
      # ============================================================

      - name: Verify Gradle
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          {
            echo
            echo "=============================================="
            echo "GRADLE VERSION"
            echo "=============================================="

            if [ "$USE_WRAPPER" = "true" ]; then
              ./gradlew --version
            else
              "$GRADLE_BIN" --version
            fi

          } 2>&1 | tee -a "$GITHUB_WORKSPACE/gradle-build.log"

      # ============================================================
      # 20. CHECK GRADLE TASKS
      # ============================================================

      - name: Validate Gradle project
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          {
            echo
            echo "=============================================="
            echo "GRADLE TASK VALIDATION"
            echo "=============================================="

            if [ "$USE_WRAPPER" = "true" ]; then

              ./gradlew \
                tasks \
                --no-daemon \
                --stacktrace \
                --console=plain

            else

              "$GRADLE_BIN" \
                tasks \
                --no-daemon \
                --stacktrace \
                --console=plain

            fi

          } 2>&1 | tee -a "$GITHUB_WORKSPACE/gradle-build.log"

      # ============================================================
      # 21. BUILD DEBUG APK
      # ============================================================

      - name: Build Debug APK
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          BUILD_TASK=":${APP_MODULE//\//:}:assembleDebug"

          {
            echo
            echo "=============================================="
            echo "BUILD DEBUG APK"
            echo "=============================================="

            echo
            echo "Project:"
            echo "$PROJECT_DIR"

            echo
            echo "Module:"
            echo "$APP_MODULE"

            echo
            echo "Task:"
            echo "$BUILD_TASK"

            echo

            if [ "$USE_WRAPPER" = "true" ]; then

              ./gradlew \
                "$BUILD_TASK" \
                --no-daemon \
                --stacktrace \
                --warning-mode all \
                --console=plain

            else

              "$GRADLE_BIN" \
                "$BUILD_TASK" \
                --no-daemon \
                --stacktrace \
                --warning-mode all \
                --console=plain

            fi

          } 2>&1 | tee -a "$GITHUB_WORKSPACE/gradle-build.log"

      # ============================================================
      # 22. FIND APK
      # ============================================================

      - name: Locate generated APK
        if: success()
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          APK_FILE="$(
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -path "*/build/outputs/*" \
              -not -path "*/.gradle/*" \
              | sort \
              | head -n 1
          )"

          if [ -z "$APK_FILE" ]; then

            echo "ERROR: APK was not generated."

            echo
            echo "Output files:"
            find "$PROJECT_DIR" \
              -path "*/build/outputs/*" \
              -print \
              | sort

            exit 1
          fi

          cp \
            "$APK_FILE" \
            "$GITHUB_WORKSPACE/apk-output/TikTok-Downloader-debug.apk"

          {
            echo
            echo "=============================================="
            echo "APK CREATED"
            echo "=============================================="

            ls -lh \
              "$GITHUB_WORKSPACE/apk-output/TikTok-Downloader-debug.apk"

          } | tee -a "$GITHUB_WORKSPACE/gradle-build.log"

      # ============================================================
      # 23. UPLOAD APK
      # ============================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: TikTok-Downloader-APK
          path: apk-output/TikTok-Downloader-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 24. ALWAYS UPLOAD LOG
      # ============================================================

      - name: Upload complete build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: TikTok-Downloader-Build-Log
          path: gradle-build.log
          if-no-files-found: error
          retention-days: 14
