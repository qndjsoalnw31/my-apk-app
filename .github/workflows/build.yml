name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    env:
      CI: true
      GRADLE_OPTS: >-
        -Xmx4g
        -XX:MaxMetaspaceSize=1g
        -Dfile.encoding=UTF-8

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. Verify ZIP
      # ==========================================================
      - name: Verify ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "untitled.zip" ]; then
            echo "ERROR: untitled.zip not found"
            echo ""
            echo "Available ZIP files:"
            find . -type f -iname "*.zip" -print || true
            exit 1
          fi

          echo "Found:"
          ls -lh untitled.zip

      # ==========================================================
      # 3. Extract ZIP
      # ==========================================================
      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted project
          mkdir -p extracted project

          unzip -q -o untitled.zip -d extracted

          echo "ZIP extracted successfully."

      # ==========================================================
      # 4. Find Android project
      # ==========================================================
      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE=$(
            find extracted \
              -type f \
              \( \
                -name "settings.gradle.kts" \
                -o \
                -name "settings.gradle" \
              \) \
              -print -quit
          )

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android Gradle project not found."

            find extracted \
              -maxdepth 6 \
              -type f \
              | sort \
              | head -500

            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Project:"
          echo "$PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. project/

          if [ ! -f "project/app/build.gradle.kts" ]; then
            echo "ERROR: project/app/build.gradle.kts not found"
            exit 1
          fi

      # ==========================================================
      # 5. Repair app/build.gradle.kts
      # ==========================================================
      - name: Repair app Gradle Kotlin DSL
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re
          import unicodedata

          path = Path("project/app/build.gradle.kts")

          if not path.exists():
              raise SystemExit(
                  "ERROR: app/build.gradle.kts not found"
              )

          text = path.read_text(
              encoding="utf-8",
              errors="replace"
          )

          # ------------------------------------------------------
          # Normalize Unicode
          # ------------------------------------------------------
          text = text.replace("\ufeff", "")
          text = unicodedata.normalize("NFKC", text)

          for ch in [
              "\u00a0",
              "\u1680",
              "\u180e",
              "\u2000",
              "\u2001",
              "\u2002",
              "\u2003",
              "\u2004",
              "\u2005",
              "\u2006",
              "\u2007",
              "\u2008",
              "\u2009",
              "\u200a",
              "\u202f",
              "\u205f",
              "\u3000",
          ]:
              text = text.replace(ch, " ")

          for ch in [
              "\u200b",
              "\u200c",
              "\u200d",
              "\u2060",
              "\ufeff",
          ]:
              text = text.replace(ch, "")

          for old, new in {
              "“": '"',
              "”": '"',
              "„": '"',
              "‟": '"',
              "‘": "'",
              "’": "'",
              "‚": "'",
              "‛": "'",
              "＂": '"',
              "＇": "'",
          }.items():
              text = text.replace(old, new)

          text = text.replace('\\"', '"')
          text = text.replace("\\'", "'")

          # ------------------------------------------------------
          # Fix quoted dependency calls
          # ------------------------------------------------------
          dependency_functions = [
              "implementation",
              "api",
              "compileOnly",
              "runtimeOnly",
              "testImplementation",
              "testRuntimeOnly",
              "androidTestImplementation",
              "debugImplementation",
              "releaseImplementation",
              "debugApi",
              "releaseApi",
              "debugCompileOnly",
              "releaseCompileOnly",
              "debugRuntimeOnly",
              "releaseRuntimeOnly",
              "ksp",
              "kapt",
              "annotationProcessor",
          ]

          for function in dependency_functions:
              text = re.sub(
                  rf'["\']{re.escape(function)}["\']\s*\(',
                  f"{function}(",
                  text
              )

              text = re.sub(
                  rf'`{re.escape(function)}`\s*\(',
                  f"{function}(",
                  text
              )

              text = re.sub(
                  rf'\b{re.escape(function)}\s+\(',
                  f"{function}(",
                  text
              )

          # ------------------------------------------------------
          # Remove Google Services references
          # ------------------------------------------------------
          text = re.sub(
              r'^[ \t]*import[ \t]+com\.google\.gms\..*$\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          text = re.sub(
              r'^[ \t]*alias\s*\(\s*libs\.plugins\.google\.services\s*\).*$\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          text = re.sub(
              r'^[ \t]*id\s*\(\s*["\']com\.google\.gms\.google-services["\']\s*\).*$\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          text = re.sub(
              r'^[^\n]*MissingGoogleServicesStrategy[^\n]*$\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          text = re.sub(
              r'^[^\n]*missingGoogleServicesStrategy[^\n]*$\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          # ------------------------------------------------------
          # Remove debugConfig direct references
          # ------------------------------------------------------
          text = re.sub(
              r'^[^\n]*signingConfigs\.getByName\s*\(\s*["\']debugConfig["\']\s*\)[^\n]*$\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          text = re.sub(
              r'^[^\n]*debugConfig[^\n]*$\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          # ------------------------------------------------------
          # Kotlin-aware block remover
          # ------------------------------------------------------
          def remove_named_block(source, name):
              pattern = re.compile(
                  rf'(?m)^[ \t]*{re.escape(name)}\s*\{{'
              )

              match = pattern.search(source)

              while match:
                  start = match.start()
                  brace = source.find("{", match.start())

                  end = find_matching_brace(
                      source,
                      brace
                  )

                  if end is None:
                      # Leave it alone if malformed. Gradle will
                      # report the actual location later.
                      return source

                  source = (
                      source[:start]
                      + source[end + 1:]
                  )

                  match = pattern.search(source)

              return source

          def find_matching_brace(source, opening_index):
              depth = 0
              i = opening_index
              n = len(source)

              state = "code"

              while i < n:
                  ch = source[i]
                  nxt = source[i + 1] if i + 1 < n else ""

                  if state == "code":

                      if ch == "/" and nxt == "/":
                          state = "line_comment"
                          i += 2
                          continue

                      if ch == "/" and nxt == "*":
                          state = "block_comment"
                          i += 2
                          continue

                      if ch == '"' and source[i:i+3] == '"""':
                          state = "triple_string"
                          i += 3
                          continue

                      if ch == '"':
                          state = "double_string"
                          i += 1
                          continue

                      if ch == "'":
                          state = "char"
                          i += 1
                          continue

                      if ch == "{":
                          depth += 1

                      elif ch == "}":
                          depth -= 1

                          if depth == 0:
                              return i

                      i += 1
                      continue

                  if state == "line_comment":
                      if ch == "\n":
                          state = "code"
                      i += 1
                      continue

                  if state == "block_comment":
                      if ch == "*" and nxt == "/":
                          state = "code"
                          i += 2
                          continue
                      i += 1
                      continue

                  if state == "triple_string":
                      if source[i:i+3] == '"""':
                          state = "code"
                          i += 3
                          continue
                      i += 1
                      continue

                  if state == "double_string":
                      if ch == "\\":
                          i += 2
                          continue

                      if ch == '"':
                          state = "code"

                      i += 1
                      continue

                  if state == "char":
                      if ch == "\\":
                          i += 2
                          continue

                      if ch == "'":
                          state = "code"

                      i += 1
                      continue

              return None

          # Remove only the known bad blocks.
          text = remove_named_block(
              text,
              "googleServices"
          )

          text = remove_named_block(
              text,
              'create("debugConfig")'
          )

          # ------------------------------------------------------
          # Find dependencies block with Kotlin-aware scanner.
          # ------------------------------------------------------
          dependency_match = re.search(
              r'(?m)^[ \t]*dependencies\s*\{',
              text
          )

          if dependency_match:

              opening = text.find(
                  "{",
                  dependency_match.start()
              )

              closing = find_matching_brace(
                  text,
                  opening
              )

              if closing is not None:

                  old_block = text[
                      opening + 1:
                      closing
                  ]

                  recovered = []

                  # Recover normal single-line dependency calls.
                  dep_pattern = re.compile(
                      r'(?m)^[ \t]*('
                      + "|".join(
                          map(re.escape, dependency_functions)
                      )
                      + r')\s*\((.*?)\)\s*$'
                  )

                  for match in dep_pattern.finditer(
                      old_block
                  ):
                      function = match.group(1)
                      argument = match.group(2).strip()

                      if not argument:
                          continue

                      if "\n" in argument:
                          continue

                      item = (
                          function,
                          argument
                      )

                      if item not in recovered:
                          recovered.append(item)

                  if recovered:

                      new_lines = [
                          "dependencies {"
                      ]

                      for function, argument in recovered:
                          new_lines.append(
                              f"    {function}({argument})"
                          )

                      new_lines.append("}")

                      new_block = "\n".join(
                          new_lines
                      )

                      text = (
                          text[:dependency_match.start()]
                          + new_block
                          + text[closing + 1:]
                      )

                      print(
                          f"Recovered {len(recovered)} dependency declarations."
                      )

          # ------------------------------------------------------
          # Final whitespace normalization
          # ------------------------------------------------------
          text = text.replace("\r\n", "\n")
          text = text.replace("\r", "\n")
          text = re.sub(r"\n{4,}", "\n\n", text)

          path.write_text(
              text,
              encoding="utf-8",
              newline="\n"
          )

          print("========================================")
          print("APP GRADLE REPAIR COMPLETE")
          print("========================================")
          PY

      # ==========================================================
      # 6. Repair root Gradle files
      # ==========================================================
      - name: Repair root Gradle files
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re
          import unicodedata

          for filename in [
              "project/build.gradle.kts",
              "project/build.gradle",
          ]:

              path = Path(filename)

              if not path.exists():
                  continue

              text = path.read_text(
                  encoding="utf-8",
                  errors="replace"
              )

              text = text.replace("\ufeff", "")
              text = unicodedata.normalize(
                  "NFKC",
                  text
              )

              replacements = {
                  "\u00a0": " ",
                  "\u1680": " ",
                  "\u180e": " ",
                  "\u2000": " ",
                  "\u2001": " ",
                  "\u2002": " ",
                  "\u2003": " ",
                  "\u2004": " ",
                  "\u2005": " ",
                  "\u2006": " ",
                  "\u2007": " ",
                  "\u2008": " ",
                  "\u2009": " ",
                  "\u200a": " ",
                  "\u202f": " ",
                  "\u205f": " ",
                  "\u3000": " ",
                  "“": '"',
                  "”": '"',
                  "„": '"',
                  "‘": "'",
                  "’": "'",
                  "\u200b": "",
                  "\u200c": "",
                  "\u200d": "",
                  "\u2060": "",
              }

              for old, new in replacements.items():
                  text = text.replace(old, new)

              text = re.sub(
                  r'^[^\n]*(google-services|googleServices)[^\n]*$\n?',
                  '',
                  text,
                  flags=re.MULTILINE
              )

              path.write_text(
                  text,
                  encoding="utf-8",
                  newline="\n"
              )

              print(f"Repaired: {path}")
          PY

      # ==========================================================
      # 7. Normalize Version Catalog
      # ==========================================================
      - name: Normalize libs.versions.toml
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import unicodedata

          path = Path(
              "project/gradle/libs.versions.toml"
          )

          if not path.exists():
              print(
                  "libs.versions.toml not found."
              )
              raise SystemExit(0)

          text = path.read_text(
              encoding="utf-8",
              errors="replace"
          )

          text = text.replace("\ufeff", "")
          text = unicodedata.normalize(
              "NFKC",
              text
          )

          for ch in [
              "\u00a0",
              "\u1680",
              "\u180e",
              "\u2000",
              "\u2001",
              "\u2002",
              "\u2003",
              "\u2004",
              "\u2005",
              "\u2006",
              "\u2007",
              "\u2008",
              "\u2009",
              "\u200a",
              "\u202f",
              "\u205f",
              "\u3000",
          ]:
              text = text.replace(ch, " ")

          for old, new in {
              "“": '"',
              "”": '"',
              "„": '"',
              "‘": "'",
              "’": "'",
              "\u200b": "",
              "\u200c": "",
              "\u200d": "",
              "\u2060": "",
          }.items():
              text = text.replace(old, new)

          path.write_text(
              text,
              encoding="utf-8",
              newline="\n"
          )

          print(
              "Version catalog normalized."
          )
          PY

      # ==========================================================
      # 8. Remove google-services.json
      # ==========================================================
      - name: Remove Google Services JSON
        shell: bash
        run: |
          set -euo pipefail

          find project \
            -type f \
            -name "google-services.json" \
            -delete \
            || true

          echo "Google Services JSON removed if present."

      # ==========================================================
      # 9. Robust Gradle syntax validation
      # ==========================================================
      - name: Validate Gradle syntax
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          def scan_braces(text):
              """
              Kotlin-aware brace scanner.

              Ignores:
              - // comments
              - /* comments */
              - "strings"
              - """triple strings"""
              - 'chars'
              """

              depth = 0
              stack = []

              i = 0
              n = len(text)

              state = "code"

              while i < n:

                  ch = text[i]
                  nxt = (
                      text[i + 1]
                      if i + 1 < n
                      else ""
                  )

                  if state == "code":

                      if ch == "/" and nxt == "/":
                          state = "line_comment"
                          i += 2
                          continue

                      if ch == "/" and nxt == "*":
                          state = "block_comment"
                          i += 2
                          continue

                      if text[i:i+3] == '"""':
                          state = "triple_string"
                          i += 3
                          continue

                      if ch == '"':
                          state = "double_string"
                          i += 1
                          continue

                      if ch == "'":
                          state = "char"
                          i += 1
                          continue

                      if ch == "{":
                          depth += 1
                          stack.append(i)

                      elif ch == "}":

                          if depth == 0:
                              return False, i, (
                                  "closing brace without "
                                  "matching opening brace"
                              )

                          depth -= 1
                          stack.pop()

                      i += 1
                      continue

                  if state == "line_comment":

                      if ch == "\n":
                          state = "code"

                      i += 1
                      continue

                  if state == "block_comment":

                      if ch == "*" and nxt == "/":
                          state = "code"
                          i += 2
                          continue

                      i += 1
                      continue

                  if state == "triple_string":

                      if text[i:i+3] == '"""':
                          state = "code"
                          i += 3
                          continue

                      i += 1
                      continue

                  if state == "double_string":

                      if ch == "\\":
                          i += 2
                          continue

                      if ch == '"':
                          state = "code"

                      i += 1
                      continue

                  if state == "char":

                      if ch == "\\":
                          i += 2
                          continue

                      if ch == "'":
                          state = "code"

                      i += 1
                      continue

              if depth != 0:
                  return False, stack[-1], (
                      f"unclosed opening brace "
                      f"(depth={depth})"
                  )

              return True, None, None

          files = list(
              Path("project").rglob("*.gradle.kts")
          )

          files += list(
              Path("project").rglob("*.gradle")
          )

          for path in files:

              text = path.read_text(
                  encoding="utf-8",
                  errors="replace"
              )

              valid, position, error = scan_braces(
                  text
              )

              if not valid:

                  line = (
                      text.count(
                          "\n",
                          0,
                          position
                      )
                      + 1
                  )

                  print(
                      f"ERROR: {path}"
                  )
                  print(
                      f"ERROR: line {line}"
                  )
                  print(
                      f"ERROR: {error}"
                  )

                  start = max(
                      0,
                      position - 150
                  )

                  end = min(
                      len(text),
                      position + 150
                  )

                  print("")
                  print(
                      "Context:"
                  )
                  print(
                      text[start:end]
                  )

                  raise SystemExit(1)

              print(
                  f"OK: {path}"
              )

          # ------------------------------------------------------
          # Specific dependency validations.
          # ------------------------------------------------------
          app = Path(
              "project/app/build.gradle.kts"
          )

          text = app.read_text(
              encoding="utf-8"
          )

          forbidden = [
              "debugConfig",
              "MissingGoogleServicesStrategy",
              "missingGoogleServicesStrategy",
              "libs.plugins.google.services",
          ]

          for item in forbidden:
              if item in text:
                  raise SystemExit(
                      f"ERROR: forbidden reference remains: {item}"
                  )

          quoted = re.findall(
              r'["\']'
              r'(implementation|api|compileOnly|runtimeOnly|'
              r'testImplementation|testRuntimeOnly|'
              r'androidTestImplementation|debugImplementation|'
              r'releaseImplementation|ksp|kapt|annotationProcessor)'
              r'["\']\s*\(',
              text
          )

          if quoted:
              raise SystemExit(
                  "ERROR: quoted dependency functions remain: "
                  + ", ".join(quoted)
              )

          print(
              "Gradle syntax validation successful."
          )
          PY

      # ==========================================================
      # 10. Setup JDK 17
      # ==========================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # 11. Setup Gradle 9.3.1
      # ==========================================================
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # ==========================================================
      # 12. Android SDK
      # ==========================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses \
            >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # ==========================================================
      # 13. Generate Gradle Wrapper
      # ==========================================================
      - name: Generate Gradle wrapper
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "gradlew" ]; then
            gradle wrapper \
              --gradle-version 9.3.1 \
              --distribution-type bin
          fi

          chmod +x gradlew

          ./gradlew --version

      # ==========================================================
      # 14. Gradle configuration
      # ==========================================================
      - name: Test Gradle configuration
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:tasks \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ==========================================================
      # 15. Compile Kotlin
      # ==========================================================
      - name: Compile Kotlin
        working-directory: project
        shell: bash
        run: |
          set -o pipefail

          ./gradlew \
            :app:compileDebugKotlin \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            2>&1 | tee kotlin-compile.log

          EXIT_CODE=${PIPESTATUS[0]}

          if [ "$EXIT_CODE" -ne 0 ]; then

            echo ""
            echo "========================================"
            echo "KOTLIN ERRORS"
            echo "========================================"

            grep -E \
              '(^e: |error: |Unresolved reference|Type mismatch|Expecting |Cannot access|Overload resolution ambiguity|Unexpected symbol|Unexpected tokens)' \
              kotlin-compile.log \
              | head -200 \
              || true

            echo ""
            echo "========================================"
            echo "ERROR CONTEXT"
            echo "========================================"

            grep -n \
              -B 3 \
              -A 8 \
              '^e: ' \
              kotlin-compile.log \
              | head -300 \
              || true

            exit "$EXIT_CODE"
          fi

          echo "Kotlin compilation successful."

      # ==========================================================
      # 16. Build APK
      # ==========================================================
      - name: Build Debug APK
        working-directory: project
        shell: bash
        run: |
          set -o pipefail

          echo "========================================"
          echo "BUILDING APK"
          echo "========================================"

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            2>&1 | tee build.log

          EXIT_CODE=${PIPESTATUS[0]}

          if [ "$EXIT_CODE" -ne 0 ]; then

            echo ""
            echo "========================================"
            echo "BUILD FAILURE SUMMARY"
            echo "========================================"

            grep -E \
              'Execution failed for task|(^e: )|error: |What went wrong|Caused by:|FAILED|FAILURE|Unexpected symbol|Unexpected tokens' \
              build.log \
              | head -250 \
              || true

            echo ""
            echo "========================================"
            echo "LAST 250 LINES"
            echo "========================================"

            tail -250 build.log

            exit "$EXIT_CODE"
          fi

          echo ""
          echo "========================================"
          echo "APK BUILD SUCCESSFUL"
          echo "========================================"

      # ==========================================================
      # 17. Find APK
      # ==========================================================
      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(
            find project/app/build/outputs/apk/debug \
              -type f \
              -name "*.apk" \
              -print -quit
          )

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

      # ==========================================================
      # 18. Prepare APK
      # ==========================================================
      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          APK=$(
            find project/app/build/outputs/apk/debug \
              -type f \
              -name "*.apk" \
              -print -quit
          )

          cp "$APK" \
            artifacts/APK-Builder-Mobile-debug.apk

          ls -lh \
            artifacts/APK-Builder-Mobile-debug.apk

      # ==========================================================
      # 19. Upload APK
      # ==========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Builder-Mobile
          path: artifacts/APK-Builder-Mobile-debug.apk
          if-no-files-found: error
          retention-days: 7

      # ==========================================================
      # 20. Upload diagnostics
      # ==========================================================
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Diagnostics
          path: |
            project/kotlin-compile.log
            project/build.log
          if-no-files-found: ignore
          retention-days: 7
