name: Build Substack Downloader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v5

      # =========================================================
      # 2. JDK 17
      # =========================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # 3. Android SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # =========================================================
      # 4. Android licenses
      # =========================================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      # =========================================================
      # 5. Android packages
      # =========================================================
      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      # =========================================================
      # 6. Extract ZIP
      # =========================================================
      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          if [ -d "extracted" ]; then
            echo "extracted/ already exists"
          else
            ZIP_FILE=""

            if [ -f "substack-downloader.zip" ]; then
              ZIP_FILE="substack-downloader.zip"
            else
              ZIP_FILE="$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1 || true)"
            fi

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No ZIP file found"
              exit 1
            fi

            echo "Using ZIP: $ZIP_FILE"

            mkdir -p extracted
            unzip -o "$ZIP_FILE" -d extracted
          fi

      # =========================================================
      # 7. Locate Android project
      # =========================================================
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          if [ -f "extracted/settings.gradle.kts" ] || [ -f "extracted/settings.gradle" ]; then
            PROJECT_DIR="$(realpath extracted)"

          elif [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            PROJECT_DIR="$PWD"

          else
            SETTINGS_FILE="$(
              find . \
                -type f \
                \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
                -not -path './.git/*' \
                | head -n 1 \
                || true
            )"

            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_DIR="$(realpath "$(dirname "$SETTINGS_FILE")")"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No Android Gradle project found"

            echo
            echo "Repository files:"
            find . \
              -maxdepth 6 \
              -type f \
              -not -path './.git/*' \
              | sort

            exit 1
          fi

          echo "=============================================="
          echo "ANDROID PROJECT FOUND"
          echo "=============================================="

          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # =========================================================
      # 8. Remove Google Services BEFORE Gradle
      # =========================================================
      - name: Remove Google Services references
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          find . \
            -type f \
            \( \
              -name 'build.gradle' \
              -o \
              -name 'build.gradle.kts' \
              -o \
              -name 'libs.versions.toml' \
            \) \
            -not -path './.gradle/*' \
            -print0 |
          while IFS= read -r -d '' FILE; do

            echo "Repairing: $FILE"

            sed -i \
              -e '/libs\.plugins\.google\.services/d' \
              -e '/com\.google\.gms\.google-services/d' \
              -e '/google-services/d' \
              -e '/googleServices/d' \
              "$FILE"

          done

          find . \
            -type f \
            -name 'google-services.json' \
            -delete || true

          echo
          echo "Remaining Google Services references:"

          grep -Rni \
            --exclude-dir=.git \
            --exclude-dir=.gradle \
            -E \
            'google-services|googleServices|libs\.plugins\.google\.services|com\.google\.gms\.google-services' \
            . \
            || true

      # =========================================================
      # 9. Configure Gradle properties
      # =========================================================
      - name: Configure Gradle properties
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          touch gradle.properties

          sed -i \
            -e '/^org\.gradle\.daemon=/d' \
            -e '/^org\.gradle\.parallel=/d' \
            -e '/^org\.gradle\.caching=/d' \
            -e '/^org\.gradle\.jvmargs=/d' \
            -e '/^android\.useAndroidX=/d' \
            -e '/^android\.nonTransitiveRClass=/d' \
            gradle.properties

          printf '%s\n' \
            'org.gradle.daemon=false' \
            'org.gradle.parallel=true' \
            'org.gradle.caching=true' \
            'org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
            'android.useAndroidX=true' \
            'android.nonTransitiveRClass=false' \
            >> gradle.properties

      # =========================================================
      # 10. Install Gradle 9.3.1
      # =========================================================
      - name: Install Gradle 9.3.1
        shell: bash
        run: |
          set -e

          VERSION="9.3.1"
          DIR="/opt/gradle-${VERSION}"

          if [ ! -d "$DIR" ]; then

            curl -fL \
              "https://services.gradle.org/distributions/gradle-${VERSION}-bin.zip" \
              -o /tmp/gradle.zip

            unzip -q \
              /tmp/gradle.zip \
              -d /opt/

          fi

          echo "$DIR/bin" >> "$GITHUB_PATH"

          "$DIR/bin/gradle" --version

      # =========================================================
      # 11. Debug keystore
      # =========================================================
      - name: Create debug keystore
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android"

          KEYSTORE="$HOME/.android/debug.keystore"

          if [ ! -f "$KEYSTORE" ]; then

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

          fi

          cp \
            "$KEYSTORE" \
            "$PROJECT_DIR/debug.keystore"

          if [ -d "$PROJECT_DIR/app" ]; then
            cp \
              "$KEYSTORE" \
              "$PROJECT_DIR/app/debug.keystore"
          fi

          echo "Debug keystore ready."

      # =========================================================
      # 12. Inspect repaired project
      # =========================================================
      - name: Inspect repaired Gradle files
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "================ SETTINGS ================"

          if [ -f settings.gradle.kts ]; then
            cat settings.gradle.kts
          fi

          if [ -f settings.gradle ]; then
            cat settings.gradle
          fi

          echo
          echo "================ ROOT BUILD ================"

          if [ -f build.gradle.kts ]; then
            cat build.gradle.kts
          fi

          if [ -f build.gradle ]; then
            cat build.gradle
          fi

          echo
          echo "================ APP BUILD ================"

          if [ -f app/build.gradle.kts ]; then
            cat app/build.gradle.kts
          fi

          if [ -f app/build.gradle ]; then
            cat app/build.gradle
          fi

          echo
          echo "================ VERSION CATALOG ================"

          if [ -f gradle/libs.versions.toml ]; then
            cat gradle/libs.versions.toml
          fi

      # =========================================================
      # 13. Build APK
      # =========================================================
      - name: Build Debug APK
        shell: bash
        env:
          CI: true
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m"
        run: |
          set -e

          cd "$PROJECT_DIR"

          export PATH="/opt/gradle-9.3.1/bin:$PATH"

          echo "Gradle:"
          gradle --version

          echo
          echo "Running clean assembleDebug..."

          gradle \
            clean \
            assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # =========================================================
      # 14. Find APK
      # =========================================================
      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK="$(
            find "$PROJECT_DIR" \
              -type f \
              -name '*.apk' \
              -not -path '*/.gradle/*' \
              | grep -E 'debug.*\.apk$' \
              | head -n 1 \
              || true
          )"

          if [ -z "$APK" ]; then
            APK="$(
              find "$PROJECT_DIR" \
                -type f \
                -name '*.apk' \
                -not -path '*/.gradle/*' \
                | head -n 1 \
                || true
            )"
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated"

            echo
            echo "Build directories:"

            find "$PROJECT_DIR" \
              -type d \
              -name build \
              | sort \
              || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p "$PROJECT_DIR/output"

          cp \
            "$APK" \
            "$PROJECT_DIR/output/Substack-Downloader-debug.apk"

          echo
          echo "Final APK:"
          du -h \
            "$PROJECT_DIR/output/Substack-Downloader-debug.apk"

      # =========================================================
      # 15. Upload APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Substack-Downloader-debug
          path: ${{ env.PROJECT_DIR }}/output/Substack-Downloader-debug.apk
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 16. Summary
      # =========================================================
      - name: Build summary
        if: success()
        shell: bash
        run: |
          echo "=============================================="
          echo "SUBSTACK DOWNLOADER BUILD SUCCESSFUL"
          echo "=============================================="
          echo
          echo "Artifact: Substack-Downloader-debug"
