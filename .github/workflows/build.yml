name: Build Substack Downloader APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: substack-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Substack Downloader
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

    steps:
      # 1. Download repository files
      - name: Checkout repository
        uses: actions/checkout@v6

      # Initialize a diagnostic log even if setup fails.
      - name: Initialize diagnostics
        shell: bash
        run: |
          set -eu
          {
            echo "Substack Downloader build diagnostics"
            echo "Run ID: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "Runner: $RUNNER_OS"
            echo "Started: $(date -u)"
          } > "$GITHUB_WORKSPACE/gradle-build.log"

      # 2. Install Java 21 because the app targets Java 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # 3. Configure Android SDK.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      # 4. Install the Gradle version compatible with AGP 9.1.1.
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      # 5. Verify and extract the exact archive.
      - name: Extract substack-downloader.zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/substack-downloader.zip"
          EXTRACT_DIR="$RUNNER_TEMP/substack-downloader"

          echo "Checking project archive..."

          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "::error::substack-downloader.zip was not found."
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 -type f -iname '*.zip' -print || true
            exit 1
          fi

          if ! unzip -tq "$ZIP_FILE"; then
            echo "::error::The ZIP archive is damaged."
            exit 1
          fi

          if ! unzip -Z1 "$ZIP_FILE" | \
            grep -E '(^|/)settings\.gradle(\.kts)?$' \
            >/dev/null; then
            echo "::error::Gradle settings file is missing from ZIP."
            exit 1
          fi

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          SETTINGS_FILE="$(
            find "$EXTRACT_DIR" -type f \
              \( -name settings.gradle.kts \
                 -o -name settings.gradle \) \
              -not -path '*/.gradle/*' \
              -print -quit
          )"

          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "::error::Could not locate Gradle project root."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [[ ! -f "$PROJECT_DIR/build.gradle.kts" && \
                ! -f "$PROJECT_DIR/build.gradle" ]]; then
            echo "::error::Root Gradle build file is missing."
            exit 1
          fi

          if [[ ! -f "$PROJECT_DIR/app/build.gradle.kts" && \
                ! -f "$PROJECT_DIR/app/build.gradle" ]]; then
            echo "::error::Android app module is missing."
            exit 1
          fi

          if [[ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]]; then
            echo "::error::AndroidManifest.xml is missing."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project root: $PROJECT_DIR"
          echo "Project files:"
          ls -la "$PROJECT_DIR"

      # 6. Configure the Android SDK path.
      - name: Configure local.properties
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [[ -z "${ANDROID_HOME:-}" ]]; then
            echo "::error::ANDROID_HOME is not defined."
            exit 1
          fi

          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

          echo "Android SDK configured."

      # 7. IMPORTANT:
      # The project's app/build.gradle.kts uses
      # ${rootDir}/debug.keystore for debugConfig.
      # The ZIP does not contain this ignored file.
      # Generate the expected key before Gradle builds the APK.
      - name: Create missing Debug keystore
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE="$PROJECT_DIR/debug.keystore"

          if keytool -list \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              >/dev/null 2>&1; then
            echo "A usable Debug keystore already exists."
          else
            echo "Creating Android Debug keystore..."

            rm -f "$KEYSTORE"

            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storetype JKS \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt
          fi

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey

      # 8. Compile and capture the full Gradle output.
      - name: Build Debug APK
        id: build_apk
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          LOG_FILE="$GITHUB_WORKSPACE/gradle-build.log"

          echo "Java version:"
          java -version

          echo "Gradle version:"
          gradle --version

          echo "Starting Android APK build..."

          set +e
          gradle \
            --no-daemon \
            --no-configuration-cache \
            --no-build-cache \
            --stacktrace \
            --console=plain \
            :app:assembleDebug \
            2>&1 | tee "$LOG_FILE"

          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          if [[ "$BUILD_STATUS" -ne 0 ]]; then
            echo ""
            echo "========== GRADLE ERROR SUMMARY =========="

            grep -n -E \
              'FAILURE:|What went wrong:|Execution failed|Task .* FAILED|Caused by:|error:|Could not resolve|Could not find|Keystore|signing' \
              "$LOG_FILE" | tail -n 200 || true

            echo ""
            echo "========== LAST 250 LOG LINES =========="

            tail -n 250 "$LOG_FILE" || true

            exit "$BUILD_STATUS"
          fi

          echo "Gradle build completed."

          # Locate the APK instead of assuming an output path.
          APK_SOURCE="$(
            find "$PROJECT_DIR/app/build/outputs/apk" \
              -type f -name '*.apk' -print -quit 2>/dev/null || true
          )"

          if [[ -z "$APK_SOURCE" || ! -f "$APK_SOURCE" ]]; then
            echo "::error::Build finished but no APK was found."
            find "$PROJECT_DIR" \
              -type f -name '*.apk' -print || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK_SOURCE" \
            "$GITHUB_WORKSPACE/output/Substack-Downloader-debug.apk"

          echo "APK_SOURCE=$APK_SOURCE" >> "$GITHUB_ENV"

          echo "APK successfully created:"
          ls -lh "$GITHUB_WORKSPACE/output/Substack-Downloader-debug.apk"

      # 9. Upload APK only when the build succeeds.
      - name: Upload Substack Downloader APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Substack-Downloader-APK
          path: output/Substack-Downloader-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # 10. Keep the complete build log even if compilation fails.
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Substack-Build-Diagnostics-${{ github.run_number }}
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 7
