name: Build TikTok Downloader APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "9.3.1"

  ANDROID_HOME: "/usr/local/lib/android/sdk"
  ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"

  ANDROID_PLATFORM: "36.1"
  ANDROID_BUILD_TOOLS: "36.1.0"

  GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    steps:

      # ============================================================
      # 01 - CHECKOUT
      # ============================================================
      - name: "01 - Checkout repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # ============================================================
      # 02 - JAVA 17
      # ============================================================
      - name: "02 - Setup Java 17"
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 03 - VERIFY RUNNER AND PREINSTALLED ANDROID SDK
      #
      # IMPORTANT:
      # ubuntu-24.04 already contains:
      # - Android SDK Platform 36.1
      # - Android Build Tools 36.1.0
      # - Platform Tools
      #
      # Therefore setup-android is intentionally NOT used.
      # ============================================================
      - name: "03 - Verify Android SDK"
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "ANDROID SDK ENVIRONMENT"
          echo "============================================================"

          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "::error::Android SDK directory does not exist."
            exit 1
          fi

          echo ""
          echo "Android SDK root:"
          ls -ld "$ANDROID_HOME"

          echo ""
          echo "SDK Platform 36.1:"

          if [ ! -f "$ANDROID_HOME/platforms/android-36.1/android.jar" ]; then
            echo "::error::Android SDK Platform 36.1 is missing from the GitHub runner."
            exit 1
          fi

          ls -lh \
            "$ANDROID_HOME/platforms/android-36.1/android.jar"

          echo ""
          echo "Build Tools 36.1.0:"

          if [ ! -f "$ANDROID_HOME/build-tools/36.1.0/aapt2" ]; then
            echo "::error::Android Build Tools 36.1.0 are missing."
            exit 1
          fi

          ls -lh \
            "$ANDROID_HOME/build-tools/36.1.0/aapt2"

          echo ""
          echo "Platform Tools:"

          if [ ! -f "$ANDROID_HOME/platform-tools/adb" ]; then
            echo "::error::Android Platform Tools are missing."
            exit 1
          fi

          ls -lh \
            "$ANDROID_HOME/platform-tools/adb"

          echo ""
          echo "Android SDK is ready."

      # ============================================================
      # 04 - FIND PROJECT ZIP
      # ============================================================
      - name: "04 - Locate TikTok Downloader ZIP"
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/tiktok-downloader.zip"

          if [ ! -f "$ZIP_FILE" ]; then

            ZIP_FILE="$({
              find "$GITHUB_WORKSPACE" \
                -type f \
                -iname '*.zip' \
                -not -path '*/.git/*' \
                -print \
                -quit \
                2>/dev/null || true
            })"

          fi

          if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then

            echo "::error::No Android project ZIP was found."

            echo ""
            echo "Repository contents:"

            find "$GITHUB_WORKSPACE" \
              -maxdepth 8 \
              -type f \
              -print \
              | sort \
              || true

            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo ""
          echo "Selected ZIP:"
          echo "$ZIP_FILE"

          ls -lh "$ZIP_FILE"

      # ============================================================
      # 05 - VALIDATE ZIP
      # ============================================================
      - name: "05 - Validate ZIP"
        run: |
          set -euo pipefail

          echo "Testing ZIP integrity..."

          unzip -t "$ZIP_FILE"

          echo ""
          echo "ZIP integrity OK."

      # ============================================================
      # 06 - EXTRACT PROJECT
      # ============================================================
      - name: "06 - Extract Android project"
        run: |
          set -euo pipefail

          EXTRACT_ROOT="$GITHUB_WORKSPACE/android-project"

          rm -rf "$EXTRACT_ROOT"

          mkdir -p "$EXTRACT_ROOT"

          unzip -q \
            "$ZIP_FILE" \
            -d "$EXTRACT_ROOT"

          echo ""
          echo "Extracted project files:"

          find "$EXTRACT_ROOT" \
            -maxdepth 12 \
            -type f \
            -print \
            | sort

      # ============================================================
      # 07 - LOCATE PROJECT ROOT
      # ============================================================
      - name: "07 - Locate Gradle project"
        run: |
          set -euo pipefail

          SEARCH_ROOT="$GITHUB_WORKSPACE/android-project"

          SETTINGS_FILE="$({
            find "$SEARCH_ROOT" \
              -type f \
              \( \
                -name 'settings.gradle.kts' \
                -o -name 'settings.gradle' \
              \) \
              -print \
              -quit \
              2>/dev/null || true
          })"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle(.kts) not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$(realpath "$SETTINGS_FILE")")"

          if [ ! -f "$PROJECT_DIR/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/build.gradle" ]; then

            echo "::error::Root Gradle build file not found."
            exit 1

          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then

            echo "::error::app Gradle module not found."
            exit 1

          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Project root:"
          echo "$PROJECT_DIR"

      # ============================================================
      # 08 - VERIFY EXACT PROJECT STRUCTURE
      # ============================================================
      - name: "08 - Verify project structure"
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          REQUIRED_FILES=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "app/build.gradle.kts"
            "gradle/libs.versions.toml"
            "gradle/wrapper/gradle-wrapper.properties"
            "app/src/main/AndroidManifest.xml"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do

            if [ ! -f "$FILE" ]; then
              echo "::error::Required file missing: $FILE"
              exit 1
            fi

          done

          echo "Project structure OK."

      # ============================================================
      # 09 - SHOW PROJECT TOOLCHAIN
      # ============================================================
      - name: "09 - Inspect project toolchain"
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "============================================================"
          echo "VERSION CATALOG"
          echo "============================================================"

          cat gradle/libs.versions.toml

          echo ""
          echo "============================================================"
          echo "APP BUILD"
          echo "============================================================"

          cat app/build.gradle.kts

          echo ""
          echo "============================================================"
          echo "SETTINGS"
          echo "============================================================"

          cat settings.gradle.kts

          echo ""
          echo "============================================================"
          echo "GRADLE PROPERTIES"
          echo "============================================================"

          cat gradle.properties

          echo ""
          echo "============================================================"
          echo "WRAPPER"
          echo "============================================================"

          cat gradle/wrapper/gradle-wrapper.properties

      # ============================================================
      # 10 - CONFIGURE LOCAL SDK
      # ============================================================
      - name: "10 - Configure local.properties"
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

          echo "local.properties:"
          cat local.properties

      # ============================================================
      # 11 - FORCE CI GRADLE SETTINGS
      # ============================================================
      - name: "11 - Configure CI Gradle settings"
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          touch gradle.properties

          if grep -q '^org\.gradle\.jvmargs=' gradle.properties; then

            sed -i \
              "s#^org\.gradle\.jvmargs=.*#org.gradle.jvmargs=${GRADLE_OPTS}#" \
              gradle.properties

          else

            printf '\norg.gradle.jvmargs=%s\n' \
              "$GRADLE_OPTS" \
              >> gradle.properties

          fi

          if grep -q '^org\.gradle\.configuration-cache=' gradle.properties; then

            sed -i \
              's#^org\.gradle\.configuration-cache=.*#org.gradle.configuration-cache=false#' \
              gradle.properties

          else

            printf '\norg.gradle.configuration-cache=false\n' \
              >> gradle.properties

          fi

          if grep -q '^org\.gradle\.caching=' gradle.properties; then

            sed -i \
              's#^org\.gradle\.caching=.*#org.gradle.caching=false#' \
              gradle.properties

          else

            printf '\norg.gradle.caching=false\n' \
              >> gradle.properties

          fi

          if ! grep -q '^org\.gradle\.workers.max=' gradle.properties; then

            printf '\norg.gradle.workers.max=4\n' \
              >> gradle.properties

          fi

          if ! grep -q '^kotlin.compiler.execution.strategy=' gradle.properties; then

            printf '\nkotlin.compiler.execution.strategy=in-process\n' \
              >> gradle.properties

          fi

          echo ""
          echo "Final CI Gradle properties:"

          grep -E \
            '^(org\.gradle\.jvmargs|org\.gradle\.configuration-cache|org\.gradle\.caching|org\.gradle\.workers.max|kotlin.compiler.execution.strategy)=' \
            gradle.properties \
            || true

      # ============================================================
      # 12 - FIX KSP 2.3.5 CI ISSUE
      # ============================================================
      - name: "12 - Set KSP 2.3.6 for CI"
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          VERSION_FILE="gradle/libs.versions.toml"

          echo "Original KSP:"

          grep -n \
            'googleDevtoolsKsp' \
            "$VERSION_FILE" \
            || true

          if grep -q \
            'googleDevtoolsKsp = "2\.3\.5"' \
            "$VERSION_FILE"
          then

            echo ""
            echo "KSP 2.3.5 detected."
            echo "Using KSP 2.3.6 in CI."

            cp \
              "$VERSION_FILE" \
              "$GITHUB_WORKSPACE/libs.versions.toml.original"

            sed -i \
              's/googleDevtoolsKsp = "2\.3\.5"/googleDevtoolsKsp = "2.3.6"/' \
              "$VERSION_FILE"

          fi

          echo ""
          echo "CI KSP:"

          grep -n \
            'googleDevtoolsKsp' \
            "$VERSION_FILE"

      # ============================================================
      # 13 - CREATE DEBUG KEYSTORE
      # ============================================================
      - name: "13 - Create debug keystore"
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          KEYSTORE="$PROJECT_DIR/debug.keystore"

          if [ ! -f "$KEYSTORE" ]; then

            echo "Creating debug.keystore..."

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

          else

            echo "debug.keystore already exists."

          fi

          test -f "$KEYSTORE"

          keytool \
            -list \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            >/dev/null

          echo "debug.keystore verified."

      # ============================================================
      # 14 - SETUP GRADLE
      #
      # Cache disabled intentionally.
      # ============================================================
      - name: "14 - Setup Gradle 9.3.1"
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"
          cache-disabled: true
          validate-wrappers: false
          add-job-summary: on-failure

      # ============================================================
      # 15 - VERIFY JAVA / GRADLE
      # ============================================================
      - name: "15 - Verify Java and Gradle"
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "JAVA"
          echo "============================================================"

          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo ""
          echo "============================================================"
          echo "GRADLE"
          echo "============================================================"

          gradle --version

      # ============================================================
      # 16 - VERIFY ANDROID TOOLS AGAIN
      # ============================================================
      - name: "16 - Verify Android build tools"
        run: |
          set -euo pipefail

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Platform:"
          test -f \
            "$ANDROID_HOME/platforms/android-36.1/android.jar"

          echo "Platform 36.1 OK."

          echo ""
          echo "Build Tools:"
          test -f \
            "$ANDROID_HOME/build-tools/36.1.0/aapt2"

          echo "Build Tools 36.1.0 OK."

          echo ""
          echo "AAPT2 version:"
          "$ANDROID_HOME/build-tools/36.1.0/aapt2" version || true

      # ============================================================
      # 17 - GRADLE CONFIGURATION
      # ============================================================
      - name: "17 - Validate Gradle configuration"
        run: |
          set -uo pipefail

          cd "$PROJECT_DIR"

          LOG="$GITHUB_WORKSPACE/gradle-help.log"

          rm -f "$LOG"

          echo "============================================================"
          echo "GRADLE CONFIGURATION"
          echo "============================================================"

          set +e

          gradle \
            help \
            --no-daemon \
            --no-configuration-cache \
            --no-build-cache \
            --stacktrace \
            --console=plain \
            --warning-mode=all \
            2>&1 \
            | tee "$LOG"

          RC=${PIPESTATUS[0]}

          set -e

          if [ "$RC" -ne 0 ]; then

            echo ""
            echo "============================================================"
            echo "GRADLE CONFIGURATION FAILED"
            echo "============================================================"

            echo ""
            echo "Relevant errors:"

            grep -n -E \
              'FAILURE:|Exception|Caused by:|error:|ERROR|KSP|Kotlin|Plugin|AGP|Gradle|Room|Moshi|google-services|secrets' \
              "$LOG" \
              | tail -n 350 \
              || true

            echo ""
            echo "Last 500 lines:"

            tail -n 500 "$LOG"

            exit "$RC"
          fi

          echo ""
          echo "Gradle configuration OK."

      # ============================================================
      # 18 - VERIFY APP TASKS
      # ============================================================
      - name: "18 - Verify app tasks"
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle \
            :app:tasks \
            --all \
            --no-daemon \
            --no-configuration-cache \
            --no-build-cache \
            --stacktrace \
            --console=plain \
            --warning-mode=all \
            2>&1 \
            | tee "$GITHUB_WORKSPACE/gradle-tasks.log"

      # ============================================================
      # 19 - CLEAN
      # ============================================================
      - name: "19 - Clean project"
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle \
            clean \
            --no-daemon \
            --no-configuration-cache \
            --no-build-cache \
            --stacktrace \
            --console=plain

      # ============================================================
      # 20 - BUILD DEBUG APK
      # ============================================================
      - name: "20 - Build Debug APK"
        run: |
          set -uo pipefail

          cd "$PROJECT_DIR"

          LOG="$GITHUB_WORKSPACE/gradle-build.log"

          rm -f "$LOG"

          echo "============================================================"
          echo "BUILDING DEBUG APK"
          echo "============================================================"

          set +e

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --no-build-cache \
            --rerun-tasks \
            --stacktrace \
            --console=plain \
            --warning-mode=all \
            2>&1 \
            | tee "$LOG"

          RC=${PIPESTATUS[0]}

          set -e

          if [ "$RC" -ne 0 ]; then

            echo ""
            echo "============================================================"
            echo "APK BUILD FAILED"
            echo "============================================================"

            echo ""
            echo "KSP:"

            grep -n -E \
              'KSP|ksp|symbol-processing|ApplicationManager' \
              "$LOG" \
              | tail -n 250 \
              || true

            echo ""
            echo "Android SDK / AAPT:"

            grep -n -E \
              'compileSdk|36\.1|android\.jar|AAPT|aapt2|resource .* not found|Manifest merger|SDK' \
              "$LOG" \
              | tail -n 250 \
              || true

            echo ""
            echo "Kotlin / Java:"

            grep -n -E \
              'Kotlin|KotlinCompile|jvmTarget|JVM target|Unsupported class file|Inconsistent JVM|Java|OutOfMemory|Metaspace' \
              "$LOG" \
              | tail -n 250 \
              || true

            echo ""
            echo "Dependencies:"

            grep -n -E \
              'Could not resolve|Could not find|Could not download|TLS|SSL|PKIX|timeout|timed out|Connection reset|Connection refused|UnknownHost' \
              "$LOG" \
              | tail -n 250 \
              || true

            echo ""
            echo "Google Services / Secrets:"

            grep -n -E \
              'google-services|googleServices|google-services.json|secrets|GEMINI_API_KEY|MissingGoogleServices' \
              "$LOG" \
              | tail -n 200 \
              || true

            echo ""
            echo "Gradle:"

            grep -n -E \
              'FAILURE:|Execution failed for task|Task .* FAILED|Exception|Caused by:|error:' \
              "$LOG" \
              | tail -n 400 \
              || true

            echo ""
            echo "LAST 600 LINES:"

            tail -n 600 "$LOG"

            exit "$RC"
          fi

          echo ""
          echo "============================================================"
          echo "APK BUILD SUCCESSFUL"
          echo "============================================================"

      # ============================================================
      # 21 - VERIFY EXPECTED APK
      # ============================================================
      - name: "21 - Verify generated APK"
        if: success()
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then

            echo "::error::app-debug.apk was not generated."

            echo ""
            echo "All APKs:"

            find . \
              -type f \
              -name '*.apk' \
              -print \
              | sort \
              || true

            exit 1
          fi

          echo "APK exists:"
          ls -lh "$APK"

      # ============================================================
      # 22 - COPY APK
      # ============================================================
      - name: "22 - Prepare APK artifact"
        if: success()
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          OUTPUT="$GITHUB_WORKSPACE/apk-output"

          rm -rf "$OUTPUT"

          mkdir -p "$OUTPUT"

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            "$OUTPUT/TikTok-Downloader-debug.apk"

          echo ""
          echo "Final artifact:"
          ls -lh \
            "$OUTPUT/TikTok-Downloader-debug.apk"

      # ============================================================
      # 23 - INSPECT APK
      # ============================================================
      - name: "23 - Inspect APK"
        if: success()
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/apk-output/TikTok-Downloader-debug.apk"

          test -f "$APK"

          echo "============================================================"
          echo "APK INFORMATION"
          echo "============================================================"

          echo ""
          echo "File:"
          file "$APK"

          echo ""
          echo "Size:"
          ls -lh "$APK"

          echo ""
          echo "SHA256:"
          sha256sum "$APK"

          echo ""
          echo "APK summary:"

          apkanalyzer apk summary "$APK" || true

      # ============================================================
      # 24 - UPLOAD APK
      # ============================================================
      - name: "24 - Upload APK"
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: TikTok-Downloader-APK
          path: apk-output/TikTok-Downloader-debug.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # ============================================================
      # 25 - DIAGNOSTICS
      # ============================================================
      - name: "25 - Collect diagnostics"
        if: always()
        run: |
          set +e

          DIAG="$GITHUB_WORKSPACE/diagnostics"

          rm -rf "$DIAG"

          mkdir -p "$DIAG"

          copy_if_exists() {
            local SRC="$1"
            local DST="$2"

            if [ -f "$SRC" ]; then
              cp "$SRC" "$DST" || true
            fi
          }

          copy_if_exists \
            "$GITHUB_WORKSPACE/gradle-help.log" \
            "$DIAG/gradle-help.log"

          copy_if_exists \
            "$GITHUB_WORKSPACE/gradle-tasks.log" \
            "$DIAG/gradle-tasks.log"

          copy_if_exists \
            "$GITHUB_WORKSPACE/gradle-build.log" \
            "$DIAG/gradle-build.log"

          copy_if_exists \
            "$GITHUB_WORKSPACE/libs.versions.toml.original" \
            "$DIAG/libs.versions.toml.original"

          if [ -n "${PROJECT_DIR:-}" ] && \
             [ -d "$PROJECT_DIR" ]; then

            copy_if_exists \
              "$PROJECT_DIR/settings.gradle.kts" \
              "$DIAG/settings.gradle.kts"

            copy_if_exists \
              "$PROJECT_DIR/build.gradle.kts" \
              "$DIAG/root-build.gradle.kts"

            copy_if_exists \
              "$PROJECT_DIR/app/build.gradle.kts" \
              "$DIAG/app-build.gradle.kts"

            copy_if_exists \
              "$PROJECT_DIR/gradle/libs.versions.toml" \
              "$DIAG/libs.versions.toml"

            copy_if_exists \
              "$PROJECT_DIR/gradle.properties" \
              "$DIAG/gradle.properties"

            copy_if_exists \
              "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties" \
              "$DIAG/gradle-wrapper.properties"

            copy_if_exists \
              "$PROJECT_DIR/local.properties" \
              "$DIAG/local.properties"

            find "$PROJECT_DIR" \
              -maxdepth 12 \
              -type f \
              -print \
              | sort \
              > "$DIAG/project-tree.txt" \
              || true
          fi

          {
            echo "============================================================"
            echo "ENVIRONMENT"
            echo "============================================================"

            echo ""
            echo "Runner:"
            cat /etc/os-release || true

            echo ""
            echo "Java:"
            java -version 2>&1 || true

            echo ""
            echo "JAVA_HOME:"
            echo "${JAVA_HOME:-unknown}"

            echo ""
            echo "Gradle:"
            gradle --version 2>&1 || true

            echo ""
            echo "ANDROID_HOME:"
            echo "${ANDROID_HOME:-unknown}"

            echo ""
            echo "ANDROID_SDK_ROOT:"
            echo "${ANDROID_SDK_ROOT:-unknown}"

            echo ""
            echo "Platform 36.1:"
            ls -ld \
              "$ANDROID_HOME/platforms/android-36.1" \
              2>&1 || true

            echo ""
            echo "Build Tools:"
            ls -ld \
              "$ANDROID_HOME/build-tools/36.1.0" \
              2>&1 || true

          } > "$DIAG/environment.txt"

          echo "Diagnostics collected."

      # ============================================================
      # 26 - UPLOAD DIAGNOSTICS
      # ============================================================
      - name: "26 - Upload diagnostics"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: TikTok-Downloader-Diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
