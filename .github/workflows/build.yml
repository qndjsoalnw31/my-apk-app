name: Build TikTok Downloader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      JAVA_VERSION: "17"
      FALLBACK_GRADLE_VERSION: "9.3.1"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v5

      # =========================================================
      # JAVA
      # =========================================================
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # =========================================================
      # ANDROID SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # =========================================================
      # INITIAL DIAGNOSTIC LOG
      # =========================================================
      - name: Initialize diagnostics
        shell: bash
        run: |
          set -u

          : > "$GITHUB_WORKSPACE/gradle-build.log"

          {
            echo "=========================================="
            echo "TikTok Downloader Android Build"
            echo "=========================================="
            echo "Date:"
            date
            echo
            echo "Java:"
            java -version 2>&1 || true
            echo
            echo "Gradle command:"
            command -v gradle || true
            echo
            echo "Android SDK:"
            echo "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            echo
            echo "PATH:"
            echo "$PATH"
            echo
          } | tee -a "$GITHUB_WORKSPACE/gradle-build.log"

      # =========================================================
      # ANDROID SDK PACKAGES
      # =========================================================
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER=""

          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -x "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/bin/sdkmanager" ]; then
            SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/bin/sdkmanager"
          fi

          if [ -n "$SDKMANAGER" ]; then
            echo "Using sdkmanager: $SDKMANAGER"

            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

            "$SDKMANAGER" \
              "platform-tools" \
              "platforms;android-36" \
              "build-tools;36.0.0" \
              || true

          else
            echo "sdkmanager not found."
            echo "Using preinstalled Android SDK packages."
          fi

      # =========================================================
      # FIND ZIP
      # =========================================================
      - name: Find TikTok ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=""

          if [ -f "$GITHUB_WORKSPACE/tiktok-downloader.zip" ]; then
            ZIP_FILE="$GITHUB_WORKSPACE/tiktok-downloader.zip"
          else
            ZIP_FILE="$(
              find "$GITHUB_WORKSPACE" \
                -type f \
                \( -iname "tiktok-downloader.zip" -o -iname "*.zip" \) \
                -not -path "*/.git/*" \
                | head -n 1
            )"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: tiktok-downloader.zip was not found."

            echo
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 4 \
              -type f \
              | sort

            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "Found ZIP:"
          echo "$ZIP_FILE"

      # =========================================================
      # EXTRACT
      # =========================================================
      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/android-project"

          mkdir -p "$GITHUB_WORKSPACE/android-project"

          unzip -q \
            "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/android-project"

          echo "ZIP extracted successfully."

      # =========================================================
      # LOCATE ANDROID PROJECT
      # =========================================================
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          ROOT="$GITHUB_WORKSPACE/android-project"
          PROJECT=""

          SETTINGS="$(
            find "$ROOT" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -not -path "*/build/*" \
              | head -n 1
          )"

          if [ -n "$SETTINGS" ]; then
            PROJECT="$(dirname "$SETTINGS")"
          fi

          if [ -z "$PROJECT" ]; then
            GRADLEW="$(
              find "$ROOT" \
                -type f \
                -name "gradlew" \
                -not -path "*/build/*" \
                | head -n 1
            )"

            if [ -n "$GRADLEW" ]; then
              PROJECT="$(dirname "$GRADLEW")"
            fi
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android Gradle project was not found."
            echo
            echo "ZIP contents:"
            find "$ROOT" \
              -maxdepth 10 \
              -print \
              | sort

            exit 1
          fi

          PROJECT="$(realpath "$PROJECT")"

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT"

      # =========================================================
      # FIND APP MODULE
      # =========================================================
      - name: Locate app module
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MODULE=""

          if [ -d "app" ]; then
            MODULE="app"
          fi

          if [ -z "$MODULE" ]; then
            MANIFEST="$(
              find . \
                -type f \
                -path "*/src/main/AndroidManifest.xml" \
                -not -path "*/build/*" \
                | head -n 1
            )"

            if [ -n "$MANIFEST" ]; then
              MODULE="$(
                dirname \
                  "$(dirname \
                    "$(dirname "$MANIFEST")" \
                  )"
              )"

              MODULE="${MODULE#./}"
            fi
          fi

          if [ -z "$MODULE" ]; then
            echo "ERROR: Android app module not found."

            echo
            echo "Project structure:"
            find . \
              -maxdepth 8 \
              -type d \
              | sort

            exit 1
          fi

          echo "APP_MODULE=$MODULE" >> "$GITHUB_ENV"

          if [ "$MODULE" = "app" ]; then
            BUILD_TASK="assembleDebug"
          else
            MODULE_TASK="${MODULE//\//:}"
            BUILD_TASK=":${MODULE_TASK}:assembleDebug"
          fi

          echo "BUILD_TASK=$BUILD_TASK" >> "$GITHUB_ENV"

          echo "App module:"
          echo "$MODULE"

          echo "Build task:"
          echo "$BUILD_TASK"

      # =========================================================
      # USE PROJECT WRAPPER WHEN AVAILABLE
      # =========================================================
      - name: Detect Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x "./gradlew"

            echo "GRADLE_MODE=wrapper" >> "$GITHUB_ENV"
            echo "Gradle mode: project wrapper"

          else
            echo "GRADLE_MODE=system" >> "$GITHUB_ENV"
            echo "GRADLE_MODE=system" >> "$GITHUB_ENV"

            echo "Gradle mode: system"
            echo "Required fallback Gradle: $FALLBACK_GRADLE_VERSION"
          fi

      # =========================================================
      # FALLBACK GRADLE
      # =========================================================
      - name: Setup fallback Gradle
        if: env.GRADLE_MODE == 'system'
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ env.FALLBACK_GRADLE_VERSION }}

      # =========================================================
      # PROJECT INFORMATION
      # =========================================================
      - name: Inspect project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          {
            echo
            echo "=========================================="
            echo "PROJECT INSPECTION"
            echo "=========================================="

            echo
            echo "Project:"
            pwd

            echo
            echo "Gradle files:"
            find . \
              -maxdepth 5 \
              -type f \
              \( \
                -name "build.gradle" \
                -o \
                -name "build.gradle.kts" \
                -o \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
                -o \
                -name "gradle-wrapper.properties" \
              \) \
              | sort

            echo
            echo "Wrapper:"
            if [ -f "./gradlew" ]; then
              echo "present"
            else
              echo "not present"
            fi

            echo
            echo "AGP declarations:"
            grep -RhnE \
              "com\.android\.(application|library)|com\.android\.tools\.build:gradle" \
              . \
              --include="*.gradle" \
              --include="*.gradle.kts" \
              --include="*.toml" \
              2>/dev/null \
              | head -n 30 \
              || true

            echo
            echo "Compile SDK:"
            grep -RhnE \
              "compileSdk(Version)?[[:space:]]*=?[[:space:]]*[0-9]+" \
              . \
              --include="*.gradle" \
              --include="*.gradle.kts" \
              2>/dev/null \
              | head -n 20 \
              || true

          } | tee -a "$GITHUB_WORKSPACE/gradle-build.log"

      # =========================================================
      # BUILD
      # =========================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          {
            echo
            echo "=========================================="
            echo "STARTING BUILD"
            echo "=========================================="
            echo "Project: $PROJECT_DIR"
            echo "Module: $APP_MODULE"
            echo "Task: $BUILD_TASK"
            echo "Gradle mode: $GRADLE_MODE"
            echo

          } | tee -a "$GITHUB_WORKSPACE/gradle-build.log"

          if [ "$GRADLE_MODE" = "wrapper" ]; then

            ./gradlew \
              "$BUILD_TASK" \
              --no-daemon \
              --stacktrace \
              --warning-mode all \
              --console=plain \
              2>&1 | tee -a "$GITHUB_WORKSPACE/gradle-build.log"

          else

            gradle \
              "$BUILD_TASK" \
              --no-daemon \
              --stacktrace \
              --warning-mode all \
              --console=plain \
              2>&1 | tee -a "$GITHUB_WORKSPACE/gradle-build.log"

          fi

      # =========================================================
      # FIND APK
      # =========================================================
      - name: Find APK
        if: success()
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          APK="$(
            find "$PROJECT_DIR" \
              -type f \
              -name "*-debug.apk" \
              -path "*/build/outputs/*" \
              | sort \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            APK="$(
              find "$PROJECT_DIR" \
                -type f \
                -name "*.apk" \
                -path "*/build/outputs/*" \
                | sort \
                | head -n 1
            )"
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo
            echo "Build outputs:"
            find "$PROJECT_DIR" \
              -path "*/build/outputs/*" \
              -print \
              | sort

            exit 1
          fi

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk-output/TikTok-Downloader-debug.apk"

          echo
          echo "APK generated:"
          ls -lh "$GITHUB_WORKSPACE/apk-output/"

      # =========================================================
      # UPLOAD APK
      # =========================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-Downloader-APK
          path: apk-output/TikTok-Downloader-debug.apk
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # ALWAYS UPLOAD LOG
      # =========================================================
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-Downloader-Build-Log
          path: gradle-build.log
          if-no-files-found: error
          retention-days: 14
