name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    env:
      CI: true
      GRADLE_OPTS: >-
        -Xmx4g
        -XX:MaxMetaspaceSize=1g
        -Dfile.encoding=UTF-8

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. Verify ZIP
      # ==========================================================
      - name: Verify project ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "untitled.zip" ]; then
            echo "ERROR: untitled.zip not found"

            echo ""
            echo "ZIP files available:"
            find . -type f -iname "*.zip" -print || true

            exit 1
          fi

          echo "Found:"
          ls -lh untitled.zip

      # ==========================================================
      # 3. Extract ZIP
      # ==========================================================
      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q -o untitled.zip -d extracted

          echo "ZIP extracted."

      # ==========================================================
      # 4. Find Android project
      # ==========================================================
      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE=$(
            find extracted \
              -type f \
              \( \
                -name "settings.gradle.kts" \
                -o \
                -name "settings.gradle" \
              \) \
              -print -quit
          )

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android Gradle project not found."

            find extracted -maxdepth 5 -type f | sort | head -400

            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Android project:"
          echo "$PROJECT_DIR"

          rm -rf project
          mkdir -p project

          cp -a "$PROJECT_DIR"/. project/

          if [ ! -f "project/app/build.gradle.kts" ]; then
            echo "ERROR: project/app/build.gradle.kts not found"
            exit 1
          fi

      # ==========================================================
      # 5. FIX APP GRADLE FILE
      # ==========================================================
      - name: Repair app build.gradle.kts
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re
          import unicodedata

          path = Path("project/app/build.gradle.kts")

          if not path.exists():
              raise SystemExit(
                  "ERROR: app/build.gradle.kts does not exist"
              )

          text = path.read_text(
              encoding="utf-8",
              errors="replace"
          )

          print("========================================")
          print("REPAIRING app/build.gradle.kts")
          print("========================================")

          # ------------------------------------------------------
          # 1. Remove BOM / normalize Unicode
          # ------------------------------------------------------
          text = text.replace("\ufeff", "")

          # Normalize Unicode characters.
          text = unicodedata.normalize("NFKC", text)

          # ------------------------------------------------------
          # 2. Replace invisible / invalid whitespace
          # ------------------------------------------------------
          invisible_chars = [
              "\u00a0",  # non-breaking space
              "\u1680",
              "\u180e",
              "\u2000",
              "\u2001",
              "\u2002",
              "\u2003",
              "\u2004",
              "\u2005",
              "\u2006",
              "\u2007",
              "\u2008",
              "\u2009",
              "\u200a",
              "\u202f",
              "\u205f",
              "\u3000",
          ]

          for char in invisible_chars:
              text = text.replace(char, " ")

          # Remove zero-width characters.
          for char in [
              "\u200b",
              "\u200c",
              "\u200d",
              "\u2060",
              "\ufeff",
          ]:
              text = text.replace(char, "")

          # ------------------------------------------------------
          # 3. Normalize smart quotes
          # ------------------------------------------------------
          quote_map = {
              "“": '"',
              "”": '"',
              "„": '"',
              "‟": '"',
              "‘": "'",
              "’": "'",
              "‚": "'",
              "‛": "'",
              "＂": '"',
              "＇": "'",
          }

          for old, new in quote_map.items():
              text = text.replace(old, new)

          # ------------------------------------------------------
          # 4. Remove invalid control characters
          # ------------------------------------------------------
          cleaned = []

          for char in text:
              code = ord(char)

              if char in "\n\r\t":
                  cleaned.append(char)
                  continue

              # Keep printable Unicode.
              if code >= 32:
                  cleaned.append(char)

          text = "".join(cleaned)

          # ------------------------------------------------------
          # 5. Fix quoted Kotlin DSL function calls.
          #
          # Bad:
          #
          # "implementation"(libs.foo)
          # "debugImplementation"(libs.foo)
          # "testImplementation"(libs.foo)
          # "ksp"(libs.foo)
          #
          # Good:
          #
          # implementation(libs.foo)
          # debugImplementation(libs.foo)
          # testImplementation(libs.foo)
          # ksp(libs.foo)
          # ------------------------------------------------------
          dependency_functions = [
              "implementation",
              "api",
              "compileOnly",
              "runtimeOnly",
              "testImplementation",
              "testRuntimeOnly",
              "androidTestImplementation",
              "debugImplementation",
              "releaseImplementation",
              "debugApi",
              "releaseApi",
              "debugCompileOnly",
              "releaseCompileOnly",
              "debugRuntimeOnly",
              "releaseRuntimeOnly",
              "ksp",
              "annotationProcessor",
              "kapt",
          ]

          for func in dependency_functions:
              text = re.sub(
                  rf'["\']{re.escape(func)}["\']\s*\(',
                  f"{func}(",
                  text
              )

              text = re.sub(
                  rf'`{re.escape(func)}`\s*\(',
                  f"{func}(",
                  text
              )

          # ------------------------------------------------------
          # 6. Fix accidentally quoted plugin functions.
          # ------------------------------------------------------
          plugin_functions = [
              "alias",
              "id",
              "implementation",
              "ksp",
              "kapt",
          ]

          for func in plugin_functions:
              text = re.sub(
                  rf'["\']{re.escape(func)}["\']\s*\(',
                  f"{func}(",
                  text
              )

          # ------------------------------------------------------
          # 7. Fix broken spaces between function name and '('
          # ------------------------------------------------------
          for func in dependency_functions:
              text = re.sub(
                  rf'\b{re.escape(func)}\s+\(',
                  f"{func}(",
                  text
              )

          # ------------------------------------------------------
          # 8. Fix escaped quotes accidentally inserted into DSL
          # ------------------------------------------------------
          text = text.replace('\\"', '"')
          text = text.replace("\\'", "'")

          # ------------------------------------------------------
          # 9. Remove Google Services import
          # ------------------------------------------------------
          text = re.sub(
              r'^[ \t]*import[ \t]+com\.google\.gms\..*$\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          # ------------------------------------------------------
          # 10. Remove Google Services plugin alias
          # ------------------------------------------------------
          text = re.sub(
              r'^[ \t]*alias\s*\(\s*libs\.plugins\.google\.services\s*\).*$\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          # ------------------------------------------------------
          # 11. Remove direct Google Services plugin
          # ------------------------------------------------------
          text = re.sub(
              r'^[ \t]*id\s*\(\s*["\']com\.google\.gms\.google-services["\']\s*\).*$\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          # ------------------------------------------------------
          # 12. Remove debugConfig reference
          # ------------------------------------------------------
          text = re.sub(
              r'^[ \t]*signingConfig[ \t]*=[ \t]*signingConfigs\.getByName\s*\(\s*["\']debugConfig["\']\s*\)[ \t]*$\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          # ------------------------------------------------------
          # 13. Remove any remaining debugConfig lines
          # ------------------------------------------------------
          text = re.sub(
              r'^[^\n]*debugConfig[^\n]*$\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          # ------------------------------------------------------
          # 14. Remove googleServices { ... } safely
          # ------------------------------------------------------
          def remove_block(lines, pattern):
              result = []
              i = 0

              while i < len(lines):
                  line = lines[i]

                  if re.search(pattern, line):
                      brace_count = (
                          line.count("{")
                          - line.count("}")
                      )

                      i += 1

                      while (
                          i < len(lines)
                          and brace_count > 0
                      ):
                          brace_count += (
                              lines[i].count("{")
                              - lines[i].count("}")
                          )
                          i += 1

                      continue

                  result.append(line)
                  i += 1

              return result

          lines = text.splitlines()

          lines = remove_block(
              lines,
              r'^\s*googleServices\s*\{'
          )

          lines = remove_block(
              lines,
              r'^\s*create\s*\(\s*["\']debugConfig["\']\s*\)\s*\{'
          )

          text = "\n".join(lines) + "\n"

          # ------------------------------------------------------
          # 15. Remove Google Services strategy references
          # ------------------------------------------------------
          text = re.sub(
              r'^[^\n]*MissingGoogleServicesStrategy[^\n]*$\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          text = re.sub(
              r'^[^\n]*missingGoogleServicesStrategy[^\n]*$\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          # ------------------------------------------------------
          # 16. Normalize blank lines
          # ------------------------------------------------------
          text = re.sub(
              r'\n{4,}',
              '\n\n',
              text
          )

          # ------------------------------------------------------
          # 17. Write repaired file
          # ------------------------------------------------------
          path.write_text(
              text,
              encoding="utf-8",
              newline="\n"
          )

          print("========================================")
          print("REPAIRED app/build.gradle.kts")
          print("========================================")
          print(text)
          PY

      # ==========================================================
      # 6. Repair ROOT Gradle files
      # ==========================================================
      - name: Repair root Gradle files
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re
          import unicodedata

          files = []

          for filename in [
              "project/build.gradle.kts",
              "project/build.gradle",
          ]:
              path = Path(filename)

              if path.exists():
                  files.append(path)

          for path in files:
              text = path.read_text(
                  encoding="utf-8",
                  errors="replace"
              )

              text = text.replace("\ufeff", "")
              text = unicodedata.normalize("NFKC", text)

              # Normalize spaces.
              for char in [
                  "\u00a0",
                  "\u1680",
                  "\u180e",
                  "\u2000",
                  "\u2001",
                  "\u2002",
                  "\u2003",
                  "\u2004",
                  "\u2005",
                  "\u2006",
                  "\u2007",
                  "\u2008",
                  "\u2009",
                  "\u200a",
                  "\u202f",
                  "\u205f",
                  "\u3000",
              ]:
                  text = text.replace(char, " ")

              # Normalize quotes.
              for old, new in {
                  "“": '"',
                  "”": '"',
                  "„": '"',
                  "‘": "'",
                  "’": "'",
                  "＂": '"',
                  "＇": "'",
              }.items():
                  text = text.replace(old, new)

              text = re.sub(
                  r'^[ \t]*alias\s*\(\s*libs\.plugins\.google\.services\s*\).*$\n?',
                  '',
                  text,
                  flags=re.MULTILINE
              )

              text = re.sub(
                  r'^[ \t]*id\s*\(\s*["\']com\.google\.gms\.google-services["\']\s*\).*$\n?',
                  '',
                  text,
                  flags=re.MULTILINE
              )

              path.write_text(
                  text,
                  encoding="utf-8",
                  newline="\n"
              )

              print(f"Repaired: {path}")

      # ==========================================================
      # 7. Repair Version Catalog WITHOUT destroying it
      # ==========================================================
      - name: Repair libs.versions.toml
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import unicodedata

          path = Path("project/gradle/libs.versions.toml")

          if not path.exists():
              print("libs.versions.toml not found. Skipping.")
              raise SystemExit(0)

          text = path.read_text(
              encoding="utf-8",
              errors="replace"
          )

          text = text.replace("\ufeff", "")
          text = unicodedata.normalize("NFKC", text)

          for char in [
              "\u00a0",
              "\u1680",
              "\u180e",
              "\u2000",
              "\u2001",
              "\u2002",
              "\u2003",
              "\u2004",
              "\u2005",
              "\u2006",
              "\u2007",
              "\u2008",
              "\u2009",
              "\u200a",
              "\u202f",
              "\u205f",
              "\u3000",
          ]:
              text = text.replace(char, " ")

          for old, new in {
              "“": '"',
              "”": '"',
              "„": '"',
              "‘": "'",
              "’": "'",
          }.items():
              text = text.replace(old, new)

          path.write_text(
              text,
              encoding="utf-8",
              newline="\n"
          )

          print("libs.versions.toml normalized.")
          PY

      # ==========================================================
      # 8. Remove Google Services JSON
      # ==========================================================
      - name: Remove Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          find project \
            -type f \
            -name "google-services.json" \
            -delete \
            || true

          echo "google-services.json removed if present."

      # ==========================================================
      # 9. FINAL SOURCE SANITIZATION
      # ==========================================================
      - name: Sanitize all Kotlin Gradle scripts
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import unicodedata

          for path in Path("project").rglob("*.gradle.kts"):

              text = path.read_text(
                  encoding="utf-8",
                  errors="replace"
              )

              original = text

              text = text.replace("\ufeff", "")
              text = unicodedata.normalize("NFKC", text)

              replacements = {
                  "\u00a0": " ",
                  "\u1680": " ",
                  "\u180e": " ",
                  "\u2000": " ",
                  "\u2001": " ",
                  "\u2002": " ",
                  "\u2003": " ",
                  "\u2004": " ",
                  "\u2005": " ",
                  "\u2006": " ",
                  "\u2007": " ",
                  "\u2008": " ",
                  "\u2009": " ",
                  "\u200a": " ",
                  "\u202f": " ",
                  "\u205f": " ",
                  "\u3000": " ",
                  "“": '"',
                  "”": '"',
                  "„": '"',
                  "‘": "'",
                  "’": "'",
                  "‚": "'",
                  "‛": "'",
                  "＂": '"',
                  "＇": "'",
                  "\u200b": "",
                  "\u200c": "",
                  "\u200d": "",
                  "\u2060": "",
              }

              for old, new in replacements.items():
                  text = text.replace(old, new)

              if text != original:
                  path.write_text(
                      text,
                      encoding="utf-8",
                      newline="\n"
                  )

                  print(
                      f"Normalized hidden/Unicode characters: {path}"
                  )
          PY

      # ==========================================================
      # 10. Verify dependency syntax
      # ==========================================================
      - name: Verify Kotlin DSL dependency syntax
        shell: bash
        run: |
          set -euo pipefail

          FILE="project/app/build.gradle.kts"

          echo "Checking:"
          echo "$FILE"

          # ------------------------------------------------------
          # Illegal quoted dependency functions.
          # ------------------------------------------------------
          if grep -nE \
            '["'\''](implementation|api|compileOnly|runtimeOnly|testImplementation|testRuntimeOnly|androidTestImplementation|debugImplementation|releaseImplementation|ksp|kapt|annotationProcessor)["'\'']\s*\(' \
            "$FILE"; then

            echo ""
            echo "ERROR: Quoted Kotlin dependency function remains."
            exit 1
          fi

          # ------------------------------------------------------
          # Illegal debugConfig references.
          # ------------------------------------------------------
          if grep -n \
            "debugConfig" \
            "$FILE"; then

            echo ""
            echo "ERROR: debugConfig reference remains."
            exit 1
          fi

          # ------------------------------------------------------
          # Illegal Google Services references.
          # ------------------------------------------------------
          if grep -nE \
            "googleServices|MissingGoogleServicesStrategy|libs\.plugins\.google\.services" \
            "$FILE"; then

            echo ""
            echo "ERROR: Google Services reference remains."
            exit 1
          fi

          # ------------------------------------------------------
          # Detect common non-standard quotation characters.
          # ------------------------------------------------------
          if grep -nP \
            '[\x{201C}\x{201D}\x{2018}\x{2019}\x{00A0}\x{200B}\x{200C}\x{200D}]' \
            "$FILE"; then

            echo ""
            echo "ERROR: Hidden or non-standard Unicode characters remain."
            exit 1
          fi

          echo ""
          echo "Kotlin DSL dependency syntax is clean."

      # ==========================================================
      # 11. Java 17
      # ==========================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # 12. Gradle 9.3.1
      # ==========================================================
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # ==========================================================
      # 13. Android SDK
      # ==========================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # ==========================================================
      # 14. Generate Gradle Wrapper
      # ==========================================================
      - name: Generate Gradle wrapper
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "gradlew" ]; then
            gradle wrapper \
              --gradle-version 9.3.1 \
              --distribution-type bin
          fi

          chmod +x gradlew

          ./gradlew --version

      # ==========================================================
      # 15. Gradle configuration test
      # ==========================================================
      - name: Test Gradle configuration
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:tasks \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ==========================================================
      # 16. Compile Kotlin
      # ==========================================================
      - name: Compile Kotlin
        working-directory: project
        shell: bash
        run: |
          set -o pipefail

          ./gradlew \
            :app:compileDebugKotlin \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            2>&1 | tee kotlin-compile.log

          EXIT_CODE=${PIPESTATUS[0]}

          if [ "$EXIT_CODE" -ne 0 ]; then

            echo ""
            echo "========================================"
            echo "KOTLIN ERRORS"
            echo "========================================"

            grep -E \
              '(^e: |error: |Unresolved reference|Type mismatch|Expecting |Cannot access|Overload resolution ambiguity|Unexpected symbol|Unexpected tokens)' \
              kotlin-compile.log \
              | head -200 \
              || true

            echo ""
            echo "========================================"
            echo "ERROR CONTEXT"
            echo "========================================"

            grep -n \
              -B 3 \
              -A 8 \
              '^e: ' \
              kotlin-compile.log \
              | head -300 \
              || true

            exit "$EXIT_CODE"
          fi

          echo "Kotlin compilation successful."

      # ==========================================================
      # 17. Build APK
      # ==========================================================
      - name: Build Debug APK
        working-directory: project
        shell: bash
        run: |
          set -o pipefail

          echo "========================================"
          echo "BUILDING APK"
          echo "========================================"

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            2>&1 | tee build.log

          EXIT_CODE=${PIPESTATUS[0]}

          if [ "$EXIT_CODE" -ne 0 ]; then

            echo ""
            echo "========================================"
            echo "BUILD FAILURE SUMMARY"
            echo "========================================"

            grep -E \
              'Execution failed for task|(^e: )|error: |What went wrong|Caused by:|FAILED|FAILURE|Unexpected symbol|Unexpected tokens' \
              build.log \
              | head -250 \
              || true

            echo ""
            echo "========================================"
            echo "LAST 250 LINES"
            echo "========================================"

            tail -250 build.log

            exit "$EXIT_CODE"
          fi

          echo ""
          echo "========================================"
          echo "APK BUILD SUCCESSFUL"
          echo "========================================"

      # ==========================================================
      # 18. Find APK
      # ==========================================================
      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(
            find project/app/build/outputs/apk/debug \
              -type f \
              -name "*.apk" \
              -print -quit
          )

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

      # ==========================================================
      # 19. Prepare APK
      # ==========================================================
      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          APK=$(
            find project/app/build/outputs/apk/debug \
              -type f \
              -name "*.apk" \
              -print -quit
          )

          cp "$APK" \
            artifacts/APK-Builder-Mobile-debug.apk

          ls -lh \
            artifacts/APK-Builder-Mobile-debug.apk

      # ==========================================================
      # 20. Upload APK
      # ==========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Builder-Mobile
          path: artifacts/APK-Builder-Mobile-debug.apk
          if-no-files-found: error
          retention-days: 7

      # ==========================================================
      # 21. Upload diagnostics if failed
      # ==========================================================
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Diagnostics
          path: |
            project/kotlin-compile.log
            project/build.log
          if-no-files-found: ignore
          retention-days: 7
