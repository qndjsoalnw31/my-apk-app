name: Build TikTok Downloader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:

      # =====================================================
      # Checkout
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v5

      # =====================================================
      # Java
      # =====================================================

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # =====================================================
      # Android SDK
      # =====================================================

      - name: Setup Android
        uses: android-actions/setup-android@v3

      # =====================================================
      # Find ZIP
      # =====================================================

      - name: Find ZIP
        shell: bash
        run: |
          set -e

          if [ -f "tiktok-downloader.zip" ]; then
            ZIP_FILE="tiktok-downloader.zip"
          else
            ZIP_FILE="$(find . -type f -iname "*.zip" | head -n 1)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: tiktok-downloader.zip not found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "Using:"
          echo "$ZIP_FILE"

      # =====================================================
      # Extract
      # =====================================================

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/android-project"

          mkdir -p "$GITHUB_WORKSPACE/android-project"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/android-project"

          echo "Project extracted."

      # =====================================================
      # Locate Gradle project
      # =====================================================

      - name: Locate project
        shell: bash
        run: |
          set -e

          ROOT="$GITHUB_WORKSPACE/android-project"

          PROJECT=""

          SETTINGS="$(
            find "$ROOT" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -not -path "*/build/*" \
              | head -n 1
          )"

          if [ -n "$SETTINGS" ]; then
            PROJECT="$(dirname "$SETTINGS")"
          fi

          if [ -z "$PROJECT" ]; then
            GRADLEW="$(
              find "$ROOT" \
                -type f \
                -name "gradlew" \
                -not -path "*/build/*" \
                | head -n 1
            )"

            if [ -n "$GRADLEW" ]; then
              PROJECT="$(dirname "$GRADLEW")"
            fi
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android Gradle project not found."

            echo
            echo "ZIP CONTENTS:"
            find "$ROOT" -maxdepth 10 -print | sort

            exit 1
          fi

          PROJECT="$(realpath "$PROJECT")"

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

          echo "PROJECT:"
          echo "$PROJECT"

      # =====================================================
      # Detect application module
      # =====================================================

      - name: Detect app module
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MODULE=""

          if [ -d "app" ]; then
            MODULE="app"
          fi

          if [ -z "$MODULE" ]; then
            MANIFEST="$(
              find . \
                -type f \
                -path "*/src/main/AndroidManifest.xml" \
                -not -path "*/build/*" \
                | head -n 1
            )"

            if [ -n "$MANIFEST" ]; then
              MODULE="$(dirname \
                "$(dirname \
                  "$(dirname "$MANIFEST")"
                )"
              )"

              MODULE="${MODULE#./}"
            fi
          fi

          if [ -z "$MODULE" ]; then
            echo "ERROR: Android app module not found."

            find . -maxdepth 8 -type d | sort

            exit 1
          fi

          if [ "$MODULE" = "app" ]; then
            BUILD_TASK="assembleDebug"
          else
            MODULE_TASK="${MODULE//\//:}"
            BUILD_TASK=":${MODULE_TASK}:assembleDebug"
          fi

          echo "APP_MODULE=$MODULE" >> "$GITHUB_ENV"
          echo "BUILD_TASK=$BUILD_TASK" >> "$GITHUB_ENV"

          echo "MODULE:"
          echo "$MODULE"

          echo "TASK:"
          echo "$BUILD_TASK"

      # =====================================================
      # Detect AGP
      # =====================================================

      - name: Detect AGP
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          AGP=""

          # buildscript dependency
          AGP="$(
            grep -RhoE \
              'com\.android\.tools\.build:gradle:[0-9]+\.[0-9]+(\.[0-9]+)?' \
              . \
              --include='*.gradle' \
              --include='*.gradle.kts' \
              2>/dev/null \
              | sed 's/.*://' \
              | sort -V \
              | tail -n 1 \
              || true
          )"

          # plugins syntax
          if [ -z "$AGP" ]; then
            AGP="$(
              grep -RhoE \
                'com\.android\.(application|library)[^[:cntrl:]\r\n]*version[[:space:]]*["'\''][0-9]+\.[0-9]+(\.[0-9]+)?["'\'']' \
                . \
                --include='*.gradle' \
                --include='*.gradle.kts' \
                2>/dev/null \
                | grep -oE \
                  '[0-9]+\.[0-9]+(\.[0-9]+)?' \
                | sort -V \
                | tail -n 1 \
                || true
            )"
          fi

          if [ -z "$AGP" ]; then
            echo "WARNING: AGP not detected."
            echo "Using Gradle 8.13."
            AGP="unknown"
            GRADLE="8.13"
          else

            MAJOR_MINOR="$(echo "$AGP" | cut -d. -f1,2)"

            case "$MAJOR_MINOR" in

              9.4)
                GRADLE="9.6.0"
                ;;

              9.3)
                GRADLE="9.5.0"
                ;;

              9.2)
                GRADLE="9.4.1"
                ;;

              9.1)
                GRADLE="9.3.1"
                ;;

              9.0)
                GRADLE="9.1.0"
                ;;

              8.13)
                GRADLE="8.13"
                ;;

              8.12)
                GRADLE="8.13"
                ;;

              8.11)
                GRADLE="8.13"
                ;;

              8.10)
                GRADLE="8.11.1"
                ;;

              8.9)
                GRADLE="8.11.1"
                ;;

              8.8)
                GRADLE="8.10.2"
                ;;

              8.7)
                GRADLE="8.9"
                ;;

              8.6)
                GRADLE="8.7"
                ;;

              8.5)
                GRADLE="8.7"
                ;;

              8.4)
                GRADLE="8.6"
                ;;

              8.3)
                GRADLE="8.4"
                ;;

              8.2)
                GRADLE="8.2"
                ;;

              8.1)
                GRADLE="8.0"
                ;;

              8.0)
                GRADLE="8.0"
                ;;

              7.4)
                GRADLE="7.5"
                ;;

              7.3)
                GRADLE="7.4"
                ;;

              7.2)
                GRADLE="7.3.3"
                ;;

              7.1)
                GRADLE="7.2"
                ;;

              7.0)
                GRADLE="7.0"
                ;;

              *)
                echo "ERROR: Unsupported AGP: $AGP"
                exit 1
                ;;

            esac
          fi

          echo "AGP_VERSION=$AGP" >> "$GITHUB_ENV"
          echo "GRADLE_VERSION=$GRADLE" >> "$GITHUB_ENV"

          echo "AGP:"
          echo "$AGP"

          echo "Gradle:"
          echo "$GRADLE"

      # =====================================================
      # Setup Gradle
      # =====================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # =====================================================
      # Build
      # =====================================================

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          touch "$GITHUB_WORKSPACE/gradle-build.log"

          echo "=========================================="
          echo "BUILD"
          echo "=========================================="

          echo "Project: $PROJECT_DIR"
          echo "Module: $APP_MODULE"
          echo "Task: $BUILD_TASK"
          echo "AGP: $AGP_VERSION"
          echo "Gradle: $GRADLE_VERSION"

          echo

          gradle "$BUILD_TASK" \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

      # =====================================================
      # Find APK
      # =====================================================

      - name: Find APK
        if: success()
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          APK="$(
            find "$PROJECT_DIR" \
              -type f \
              -name "*-debug.apk" \
              -path "*/build/outputs/*" \
              | sort \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            APK="$(
              find "$PROJECT_DIR" \
                -type f \
                -name "*.apk" \
                -path "*/build/outputs/*" \
                | sort \
                | head -n 1
            )"
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo
            echo "OUTPUT:"
            find "$PROJECT_DIR" \
              -path "*/build/outputs/*" \
              -print \
              | sort

            exit 1
          fi

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk-output/TikTok-Downloader-debug.apk"

          echo
          echo "APK:"
          ls -lh "$GITHUB_WORKSPACE/apk-output/"

      # =====================================================
      # Upload APK
      # =====================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-Downloader-APK
          path: apk-output/TikTok-Downloader-debug.apk
          if-no-files-found: error
          retention-days: 30

      # =====================================================
      # Always create/upload log
      # =====================================================

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-Downloader-Gradle-Log
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 14
