name: Build SAM Advanced APK Analyzer

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Find SAM ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="$GITHUB_WORKSPACE/remix-sam_-advanced-apk-analyzer.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "SAM ZIP not found."
            echo "Available ZIP files:"
            find "$GITHUB_WORKSPACE" -type f -name "*.zip" -print
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Found: $ZIP_FILE"

      - name: Extract SAM project
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -o "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"

          echo "ZIP extracted successfully."

      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=""

          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Android Gradle project not found."

            echo "Extracted files:"
            find "$GITHUB_WORKSPACE/extracted" \
              -maxdepth 8 \
              -type f \
              | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Verify SAM project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo
          echo "Project files:"

          ls -la

          echo
          echo "Checking Gradle configuration..."

          test -f "settings.gradle.kts" || test -f "settings.gradle"
          test -f "build.gradle.kts" || test -f "build.gradle"

          if [ ! -d "app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          if [ ! -f "app/build.gradle.kts" ] && [ ! -f "app/build.gradle" ]; then
            echo "ERROR: app Gradle build file not found."
            exit 1
          fi

          echo "SAM project structure is valid."

      - name: Read Gradle version
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          WRAPPER_FILE="gradle/wrapper/gradle-wrapper.properties"

          if [ ! -f "$WRAPPER_FILE" ]; then
            echo "ERROR: gradle-wrapper.properties not found."
            exit 1
          fi

          GRADLE_VERSION=$(grep "distributionUrl=" "$WRAPPER_FILE" \
            | sed -n 's/.*gradle-\([0-9.]*\)-bin.zip.*/\1/p')

          if [ -z "$GRADLE_VERSION" ]; then
            echo "ERROR: Could not detect Gradle version."
            cat "$WRAPPER_FILE"
            exit 1
          fi

          echo "GRADLE_VERSION=$GRADLE_VERSION" >> "$GITHUB_ENV"

          echo "Gradle version: $GRADLE_VERSION"

      - name: Install Gradle
        shell: bash
        run: |
          set -e

          VERSION="$GRADLE_VERSION"
          INSTALL_DIR="/opt/gradle-$VERSION"

          if [ ! -d "$INSTALL_DIR" ]; then
            curl -fL --retry 3 \
              "https://services.gradle.org/distributions/gradle-$VERSION-bin.zip" \
              -o "/tmp/gradle.zip"

            unzip -q "/tmp/gradle.zip" -d /opt
          fi

          echo "$INSTALL_DIR/bin" >> "$GITHUB_PATH"

          "$INSTALL_DIR/bin/gradle" --version

      - name: Create debug keystore
        shell: bash
        run: |
          set -e

          KEYSTORE="$GITHUB_WORKSPACE/debug.keystore"

          if [ ! -f "$KEYSTORE" ]; then
            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          cp "$KEYSTORE" "$PROJECT_DIR/debug.keystore"

          if [ -d "$PROJECT_DIR/app" ]; then
            cp "$KEYSTORE" "$PROJECT_DIR/app/debug.keystore"
          fi

          echo "Debug keystore ready."

      - name: Verify Gradle
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle \
            tasks \
            --no-daemon \
            --stacktrace

      - name: Build SAM APK
        shell: bash
        env:
          CI: "true"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "BUILDING SAM"
          echo "========================================"

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

          echo "Build completed."

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."

            echo
            echo "Available APK files:"
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          mkdir -p "$PROJECT_DIR/output"

          cp "$APK_FILE" \
            "$PROJECT_DIR/output/SAM-Advanced-APK-Analyzer-debug.apk"

          sha256sum \
            "$PROJECT_DIR/output/SAM-Advanced-APK-Analyzer-debug.apk" \
            > "$PROJECT_DIR/output/SHA256SUMS.txt"

          echo "APK_PATH=$PROJECT_DIR/output/SAM-Advanced-APK-Analyzer-debug.apk" >> "$GITHUB_ENV"

          echo
          echo "APK generated:"
          ls -lh "$PROJECT_DIR/output/SAM-Advanced-APK-Analyzer-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: SAM-Advanced-APK-Analyzer-debug
          path: |
            ${{ env.PROJECT_DIR }}/output/SAM-Advanced-APK-Analyzer-debug.apk
            ${{ env.PROJECT_DIR }}/output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Build successful
        if: success()
        shell: bash
        run: |
          echo "========================================"
          echo "SAM BUILD SUCCESSFUL"
          echo "========================================"
          echo "SAM-Advanced-APK-Analyzer-debug.apk"
