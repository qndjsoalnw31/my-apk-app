name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-35" \
            "platforms;android-34" \
            "platforms;android-33" \
            "build-tools;36.0.0" \
            "build-tools;35.0.0" \
            "build-tools;34.0.0" \
            "build-tools;33.0.2"

      - name: Extract Project
        shell: bash
        run: |
          set -e

          if [ ! -f "substack-downloader.zip" ]; then
            echo "::error::substack-downloader.zip not found"
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted

          unzip -q "substack-downloader.zip" -d extracted

          echo "ZIP extracted successfully."

      - name: Find Android Project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(
            find extracted \
              -type f \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              -print -quit
          )

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle or settings.gradle.kts not found"

            find extracted -maxdepth 6 -type f -print | head -300

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project:"
          echo "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/build.gradle.kts" ] && [ ! -f "$PROJECT_DIR/build.gradle" ]; then
            echo "::error::Root build.gradle or build.gradle.kts not found"
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::app module was not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Detect Android Gradle Plugin
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "DETECTING ANDROID GRADLE PLUGIN"
          echo "========================================"

          AGP_VERSION=$(
            grep -RhoE \
              'com\.android\.application[^0-9]*[0-9]+\.[0-9]+(\.[0-9]+)?' \
              "$PROJECT_DIR" \
              --include='*.gradle' \
              --include='*.gradle.kts' \
              --include='*.toml' \
              2>/dev/null |
            grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' |
            head -1 ||
            true
          )

          if [ -z "$AGP_VERSION" ]; then
            AGP_VERSION=$(
              grep -RhoE \
                'agp[[:space:]]*=[[:space:]]*"?[0-9]+\.[0-9]+(\.[0-9]+)?' \
                "$PROJECT_DIR" \
                --include='*.toml' \
                2>/dev/null |
              grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' |
              head -1 ||
              true
            )
          fi

          if [ -z "$AGP_VERSION" ]; then
            echo "::warning::AGP version could not be detected."
            AGP_VERSION="9.1.1"
          fi

          AGP_MAJOR=$(echo "$AGP_VERSION" | cut -d. -f1)
          AGP_MINOR=$(echo "$AGP_VERSION" | cut -d. -f2)

          echo "Detected AGP: $AGP_VERSION"

          if [ "$AGP_MAJOR" -ge 9 ]; then
            case "$AGP_MINOR" in
              0)
                GRADLE_VERSION="9.1.0"
                ;;
              1)
                GRADLE_VERSION="9.3.1"
                ;;
              2)
                GRADLE_VERSION="9.4.1"
                ;;
              3)
                GRADLE_VERSION="9.5.0"
                ;;
              *)
                GRADLE_VERSION="9.5.0"
                ;;
            esac
          else
            case "$AGP_MINOR" in
              13|12|11)
                GRADLE_VERSION="8.13"
                ;;
              10)
                GRADLE_VERSION="8.11.1"
                ;;
              9)
                GRADLE_VERSION="8.11.1"
                ;;
              8)
                GRADLE_VERSION="8.10.2"
                ;;
              7)
                GRADLE_VERSION="8.9"
                ;;
              6|5)
                GRADLE_VERSION="8.7"
                ;;
              4)
                GRADLE_VERSION="8.6"
                ;;
              3)
                GRADLE_VERSION="8.4"
                ;;
              2)
                GRADLE_VERSION="8.2"
                ;;
              1|0)
                GRADLE_VERSION="8.0"
                ;;
              *)
                GRADLE_VERSION="8.13"
                ;;
            esac
          fi

          echo "Selected Gradle: $GRADLE_VERSION"

          echo "AGP_VERSION=$AGP_VERSION" >> "$GITHUB_ENV"
          echo "GRADLE_VERSION=$GRADLE_VERSION" >> "$GITHUB_ENV"

      - name: Download Gradle
        shell: bash
        run: |
          set -e

          cd /tmp

          wget -q \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -O gradle.zip

          rm -rf "gradle-${GRADLE_VERSION}"

          unzip -q gradle.zip

          "/tmp/gradle-${GRADLE_VERSION}/bin/gradle" --version

      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            chmod +x gradlew
            echo "Existing Gradle Wrapper found."
            exit 0
          fi

          "/tmp/gradle-${GRADLE_VERSION}/bin/gradle" wrapper \
            --gradle-version "$GRADLE_VERSION" \
            --distribution-type bin

          chmod +x gradlew

          echo "Gradle Wrapper generated."

      - name: Remove Google Services Completely
        shell: bash
        run: |
          set -e

          echo "Removing Google Services..."

          find "$PROJECT_DIR" \
            -type f \
            -name "google-services.json" \
            -print \
            -delete || true

          while IFS= read -r -d '' FILE; do
            echo "Cleaning: $FILE"

            sed -i '/google\.services/d' "$FILE" || true
            sed -i '/google-services/d' "$FILE" || true
            sed -i '/com\.google\.gms/d' "$FILE" || true
            sed -i '/MissingGoogleServicesStrategy/d' "$FILE" || true
            sed -i '/missingGoogleServicesStrategy/d' "$FILE" || true

          done < <(
            find "$PROJECT_DIR" \
              -type f \
              \( \
                -name "*.gradle" \
                -o \
                -name "*.gradle.kts" \
                -o \
                -name "*.toml" \
              \) \
              -print0
          )

      - name: Remove Problematic googleServices Blocks
        shell: bash
        run: |
          set -e

          while IFS= read -r -d '' FILE; do
            echo "Checking: $FILE"

            sed -i \
              '/googleServices[[:space:]]*{/,/^[[:space:]]*}/d' \
              "$FILE" || true

            sed -i \
              '/googleServices[[:space:]]*{.*}/d' \
              "$FILE" || true

            sed -i \
              '/^[[:space:]]*googleServices[[:space:]]*$/d' \
              "$FILE" || true

            sed -i \
              '/googleServices/d' \
              "$FILE" || true

          done < <(
            find "$PROJECT_DIR" \
              -type f \
              \( \
                -name "*.gradle" \
                -o \
                -name "*.gradle.kts" \
              \) \
              -print0
          )

      - name: Repair Gradle Kotlin DSL
        shell: bash
        run: |
          set -e

          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"
          ROOT_GRADLE="$PROJECT_DIR/build.gradle.kts"

          if [ -f "$APP_GRADLE" ]; then
            sed -i \
              '/googleServices[[:space:]]*{/d' \
              "$APP_GRADLE" || true

            sed -i \
              '/MissingGoogleServicesStrategy/d' \
              "$APP_GRADLE" || true

            sed -i \
              '/missingGoogleServicesStrategy/d' \
              "$APP_GRADLE" || true

            sed -i \
              '/googleServices/d' \
              "$APP_GRADLE" || true
          fi

          if [ -f "$ROOT_GRADLE" ]; then
            sed -i \
              '/libs\.plugins\.google\.services/d' \
              "$ROOT_GRADLE" || true

            sed -i \
              '/google\.services/d' \
              "$ROOT_GRADLE" || true

            sed -i \
              '/google-services/d' \
              "$ROOT_GRADLE" || true

            sed -i \
              '/com\.google\.gms/d' \
              "$ROOT_GRADLE" || true
          fi

      - name: Inject Missing Dependencies Automatically
        shell: bash
        run: |
          set -e

          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "::error::app/build.gradle.kts not found"
            exit 1
          fi

          echo "========================================"
          echo "ANALYZING SOURCE CODE"
          echo "========================================"

          NEED_COROUTINES=0
          NEED_ROOM=0
          NEED_LIFECYCLE=0
          NEED_ACTIVITY_COMPOSE=0

          if grep -Rqs \
            'kotlinx\.coroutines' \
            "$PROJECT_DIR/app/src" \
            --include='*.kt' \
            --include='*.java' \
            2>/dev/null; then
            NEED_COROUTINES=1
          fi

          if grep -Rqs \
            'androidx\.room' \
            "$PROJECT_DIR/app/src" \
            --include='*.kt' \
            --include='*.java' \
            2>/dev/null; then
            NEED_ROOM=1
          fi

          if grep -Rqs \
            'androidx\.lifecycle' \
            "$PROJECT_DIR/app/src" \
            --include='*.kt' \
            --include='*.java' \
            2>/dev/null; then
            NEED_LIFECYCLE=1
          fi

          if grep -Rqs \
            'androidx\.compose' \
            "$PROJECT_DIR/app/src" \
            --include='*.kt' \
            --include='*.java' \
            2>/dev/null; then
            NEED_ACTIVITY_COMPOSE=1
          fi

          echo "Coroutines needed: $NEED_COROUTINES"
          echo "Room needed: $NEED_ROOM"
          echo "Lifecycle needed: $NEED_LIFECYCLE"
          echo "Compose needed: $NEED_ACTIVITY_COMPOSE"

          TEMP_DEPS=$(mktemp)

          if [ "$NEED_COROUTINES" -eq 1 ]; then

            if ! grep -q 'kotlinx-coroutines-android' "$APP_GRADLE"; then
              echo 'implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")' >> "$TEMP_DEPS"
            fi

            if ! grep -q 'kotlinx-coroutines-core' "$APP_GRADLE"; then
              echo 'implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2")' >> "$TEMP_DEPS"
            fi
          fi

          if [ "$NEED_ROOM" -eq 1 ]; then

            if ! grep -q 'androidx.room:room-runtime' "$APP_GRADLE"; then
              echo 'implementation("androidx.room:room-runtime:2.8.4")' >> "$TEMP_DEPS"
            fi

            if ! grep -q 'androidx.room:room-ktx' "$APP_GRADLE"; then
              echo 'implementation("androidx.room:room-ktx:2.8.4")' >> "$TEMP_DEPS"
            fi

            if grep -qE '^[[:space:]]*ksp[[:space:]]*\(' "$APP_GRADLE"; then
              if ! grep -q 'androidx.room:room-compiler' "$APP_GRADLE"; then
                echo 'ksp("androidx.room:room-compiler:2.8.4")' >> "$TEMP_DEPS"
              fi
            else
              echo 'implementation("androidx.room:room-compiler:2.8.4")' >> "$TEMP_DEPS"
            fi
          fi

          if [ "$NEED_LIFECYCLE" -eq 1 ]; then

            if ! grep -q 'androidx.lifecycle:lifecycle-viewmodel-ktx' "$APP_GRADLE"; then
              echo 'implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0")' >> "$TEMP_DEPS"
            fi

            if [ "$NEED_ACTIVITY_COMPOSE" -eq 1 ]; then
              if ! grep -q 'androidx.lifecycle:lifecycle-runtime-compose' "$APP_GRADLE"; then
                echo 'implementation("androidx.lifecycle:lifecycle-runtime-compose:2.11.0")' >> "$TEMP_DEPS"
              fi
            fi
          fi

          if [ "$NEED_ACTIVITY_COMPOSE" -eq 1 ]; then

            if ! grep -q 'androidx.activity:activity-compose' "$APP_GRADLE"; then
              echo 'implementation("androidx.activity:activity-compose:1.13.0")' >> "$TEMP_DEPS"
            fi
          fi

          if [ -s "$TEMP_DEPS" ]; then

            echo ""
            echo "Missing dependencies detected."

            {
              echo ""
              echo "dependencies {"
              cat "$TEMP_DEPS"
              echo "}"
            } >> "$APP_GRADLE"

            echo ""
            echo "Dependencies injected:"
            cat "$TEMP_DEPS"

          else
            echo ""
            echo "No missing dependencies detected."
          fi

          rm -f "$TEMP_DEPS"

      - name: Add Common Android Dependencies If Missing
        shell: bash
        run: |
          set -e

          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"

          {
            echo ""
            echo "dependencies {"

            if ! grep -q 'androidx.core:core-ktx' "$APP_GRADLE"; then
              echo 'implementation("androidx.core:core-ktx:1.18.0")'
            fi

            if ! grep -q 'androidx.appcompat:appcompat' "$APP_GRADLE"; then
              echo 'implementation("androidx.appcompat:appcompat:1.7.1")'
            fi

            echo "}"
          } > /tmp/common-deps.txt

          if grep -q 'implementation' /tmp/common-deps.txt; then
            cat /tmp/common-deps.txt >> "$APP_GRADLE"
          fi

          rm -f /tmp/common-deps.txt

      - name: Verify Google Services Cleanup
        shell: bash
        run: |
          set -e

          echo "Checking remaining Google Services references..."

          if grep -RniE \
            'google\.services|google-services|com\.google\.gms|MissingGoogleServicesStrategy|missingGoogleServicesStrategy' \
            "$PROJECT_DIR" \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            --include='*.toml' \
            >/tmp/google-services.txt 2>/dev/null; then

            echo "Remaining references:"
            cat /tmp/google-services.txt

            echo ""
            echo "Removing remaining references..."

            while IFS= read -r FILE; do
              sed -i '/google\.services/d' "$FILE" || true
              sed -i '/google-services/d' "$FILE" || true
              sed -i '/com\.google\.gms/d' "$FILE" || true
              sed -i '/MissingGoogleServicesStrategy/d' "$FILE" || true
              sed -i '/missingGoogleServicesStrategy/d' "$FILE" || true
            done < <(
              find "$PROJECT_DIR" \
                -type f \
                \( \
                  -name "*.gradle" \
                  -o \
                  -name "*.gradle.kts" \
                  -o \
                  -name "*.toml" \
                \)
            )

          else
            echo "Google Services cleanup verified."
          fi

      - name: Generate Debug Keystore
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "GENERATING DEBUG KEYSTORE"
          echo "========================================"

          if [ ! -f "debug.keystore" ]; then
            keytool \
              -genkeypair \
              -v \
              -keystore "debug.keystore" \
              -storepass "android" \
              -alias "androiddebugkey" \
              -keypass "android" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Existing debug.keystore found."
          fi

          keytool \
            -list \
            -keystore "debug.keystore" \
            -storepass "android"

      - name: Configure Gradle
        shell: bash
        run: |
          set -e

          touch "$PROJECT_DIR/gradle.properties"

          sed -i \
            '/^[[:space:]]*org\.gradle\.jvmargs[[:space:]]*=/d' \
            "$PROJECT_DIR/gradle.properties" || true

          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
            'org.gradle.daemon=false' \
            'org.gradle.parallel=true' \
            'org.gradle.caching=true' \
            >> "$PROJECT_DIR/gradle.properties"

      - name: Verify Gradle Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x gradlew

          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "::error::settings.gradle not found"
            exit 1
          fi

          if [ ! -f "debug.keystore" ]; then
            echo "::error::debug.keystore not found"
            exit 1
          fi

          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          ./gradlew --version

      - name: Validate Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew help \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Clean Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew clean \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "BUILDING DEBUG APK"
          echo "========================================"

          echo ""
          echo "Project:"
          pwd

          echo ""
          echo "Keystore:"
          ls -lh debug.keystore

          echo ""
          echo "Running assembleDebug..."

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "BUILD RESULT"
          echo "EXIT CODE: $EXIT_CODE"
          echo "========================================"

          if [ "$EXIT_CODE" -ne 0 ]; then

            echo ""
            echo "===== WHAT WENT WRONG ====="

            grep -A 40 -B 5 \
              "\* What went wrong" \
              "$GITHUB_WORKSPACE/gradle-build.log" || true

            echo ""
            echo "===== UNRESOLVED REFERENCES ====="

            grep -E \
              "Unresolved reference|Could not find|Could not resolve|not found" \
              "$GITHUB_WORKSPACE/gradle-build.log" \
              | tail -100 || true

            echo ""
            echo "===== DEPENDENCY ERRORS ====="

            grep -Ei \
              "dependency|dependencies|Could not resolve|Could not find" \
              "$GITHUB_WORKSPACE/gradle-build.log" \
              | tail -100 || true

            echo ""
            echo "===== SIGNING ERRORS ====="

            grep -Ei \
              "keystore|signingConfig|validateSigning" \
              "$GITHUB_WORKSPACE/gradle-build.log" \
              | tail -100 || true

            echo ""
            echo "===== LAST 200 LINES ====="

            tail -200 "$GITHUB_WORKSPACE/gradle-build.log"

            exit "$EXIT_CODE"
          fi

          echo ""
          echo "========================================"
          echo "APK BUILD SUCCESSFUL"
          echo "========================================"

      - name: Locate APK
        shell: bash
        run: |
          set -e

          APK=$(
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -path "*/build/outputs/apk/*" \
              -print \
              -quit
          )

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated."

            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p artifacts

          cp "$APK" \
            "artifacts/Substack-Downloader-debug.apk"

          ls -lh \
            "artifacts/Substack-Downloader-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Substack-Downloader-APK
          path: artifacts/Substack-Downloader-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Gradle-Build-Log
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7
