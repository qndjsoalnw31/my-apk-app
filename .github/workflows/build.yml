
name: CinePro Cinema Camera APK Builder

on:
  push:
    branches:
      - main
    paths:
      - 'cinepro-cinema-camera.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cinepro-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build CinePro APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      JAVA_TOOL_OPTIONS: -Xmx4g -Dfile.encoding=UTF-8
      GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=1g
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # 1. تحميل المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد Java
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. إعداد Android SDK
      # مهم: لا نطلب حزمة tools القديمة
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # 4. التحقق من أدوات Android
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "::error::Android SDK directory not found."
            exit 1
          fi

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found."
            exit 1
          fi

          echo "SDK Manager: $SDKMANAGER"
          echo "ANDROID_SDK_MANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses >/dev/null 2>&1 || true

          echo "Android SDK verification completed."

      # 5. التحقق من ملف ZIP
      - name: Verify project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/cinepro-cinema-camera.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::cinepro-cinema-camera.zip was not found."
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f
            exit 1
          fi

          if [ ! -s "$ZIP" ]; then
            echo "::error::ZIP file is empty."
            exit 1
          fi

          if ! unzip -tq "$ZIP"; then
            echo "::error::ZIP archive is corrupted."
            exit 1
          fi

          echo "ZIP archive is valid."
          ls -lh "$ZIP"

      # 6. استخراج المشروع وفحص بنيته
      - name: Extract and detect Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/cinepro-cinema-camera.zip"
          DEST="$GITHUB_WORKSPACE/.build/cinepro"

          rm -rf "$GITHUB_WORKSPACE/.build"
          mkdir -p "$DEST"

          python3 - "$ZIP" "$DEST" <<'PY'
          import pathlib
          import stat
          import sys
          import zipfile

          archive = pathlib.Path(sys.argv[1])
          destination = pathlib.Path(sys.argv[2]).resolve()

          with zipfile.ZipFile(archive) as z:
              entries = z.infolist()

              if not entries:
                  raise SystemExit("ZIP archive is empty.")

              for entry in entries:
                  target = (destination / entry.filename).resolve()

                  if not target.is_relative_to(destination):
                      raise SystemExit(
                          "Unsafe ZIP path: " + entry.filename
                      )

                  mode = entry.external_attr >> 16

                  if stat.S_ISLNK(mode):
                      raise SystemExit(
                          "Symbolic link found: " + entry.filename
                      )

              z.extractall(destination)

          settings = []

          for name in ("settings.gradle", "settings.gradle.kts"):
              settings.extend(destination.rglob(name))

          settings = [
              p for p in settings
              if "__MACOSX" not in p.parts
              and ".gradle" not in p.parts
              and "build" not in p.parts
          ]

          if not settings:
              raise SystemExit(
                  "No settings.gradle or settings.gradle.kts found. "
                  "The ZIP does not appear to contain a Gradle project."
              )

          roots = sorted(
              {p.parent.resolve() for p in settings},
              key=lambda p: len(p.parts)
          )

          root = roots[0]

          if not any(
              (root / name).is_file()
              for name in ("build.gradle", "build.gradle.kts")
          ):
              raise SystemExit(
                  "Root build.gradle or build.gradle.kts is missing."
              )

          manifests = list(root.rglob("AndroidManifest.xml"))

          if not manifests:
              raise SystemExit("AndroidManifest.xml was not found.")

          if not (root / "gradlew").is_file():
              print("Gradle wrapper script is missing.")
              print("The workflow will use installed Gradle.")

          print("Project root:", root)
          print("Manifest files:", len(manifests))

          marker = destination.parent / "project-root.txt"
          marker.write_text(str(root))

          PY

          PROJECT_DIR="$(cat "$GITHUB_WORKSPACE/.build/project-root.txt")"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f | head -100

      # 7. اكتشاف compileSdk
      - name: Detect Android SDK version
        id: sdk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          SDK_VERSION="$(python3 - "$PROJECT_DIR" <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path(sys.argv[1])
          candidates = []

          for path in root.rglob("*"):
              if not path.is_file():
                  continue

              if path.suffix not in (".gradle", ".kts", ".toml"):
                  continue

              if any(x in path.parts for x in (
                  ".gradle", "build", ".git"
              )):
                  continue

              try:
                  content = path.read_text(errors="ignore")
              except OSError:
                  continue

              patterns = (
                  r"\bcompileSdk(?:Version)?\s*[=(]?\s*(\d+)",
                  r"\bcompileSdk\s*=\s*(\d+)",
                  r"compileSdk\s*\(\s*(\d+)\s*\)"
              )

              for pattern in patterns:
                  candidates.extend(
                      int(x) for x in re.findall(pattern, content)
                  )

              if path.name == "libs.versions.toml":
                  for line in content.splitlines():
                      if re.search(
                          r"compile.?sdk",
                          line,
                          re.IGNORECASE
                      ):
                          match = re.search(r'["\'](\d+)["\']', line)

                          if match:
                              candidates.append(int(match.group(1)))

          print(max(candidates) if candidates else 35)
          PY
          )"

          if ! [[ "$SDK_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid compileSdk value."
            exit 1
          fi

          echo "Detected compileSdk: $SDK_VERSION"
          echo "version=$SDK_VERSION" >> "$GITHUB_OUTPUT"

      # 8. تثبيت منصة Android المطلوبة
      - name: Install Android SDK components
        shell: bash
        env:
          SDK_VERSION: ${{ steps.sdk.outputs.version }}
        run: |
          set -euo pipefail

          echo "Installing Android SDK packages..."

          yes | "$ANDROID_SDK_MANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses >/dev/null 2>&1 || true

          "$ANDROID_SDK_MANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --install \
            "platform-tools" \
            "platforms;android-$SDK_VERSION" \
            "build-tools;36.0.0"

          echo "Installed SDK packages:"
          "$ANDROID_SDK_MANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --list_installed

      # 9. إعداد Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          cache-disabled: false
          add-job-summary: always

      # 10. فحص بيئة البناء
      - name: Check build environment
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          echo "Java:"
          java -version

          echo "Gradle:"
          gradle --version

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo "Project:"
          cd "$PROJECT_DIR"
          pwd

          echo "Project structure:"
          ls -la

          if [ ! -f "settings.gradle" ] && \
             [ ! -f "settings.gradle.kts" ]; then
            echo "::error::Gradle settings file is missing."
            exit 1
          fi

      # 11. بناء APK
      - name: Build Android Debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

          if [ -f "./gradlew" ]; then
            echo "Using project Gradle Wrapper."

            chmod +x ./gradlew

            ./gradlew \
              --no-daemon \
              --stacktrace \
              --console=plain \
              --warning-mode all \
              assembleDebug

          else
            echo "Using installed Gradle."

            gradle \
              --no-daemon \
              --stacktrace \
              --console=plain \
              --warning-mode all \
              assembleDebug
          fi

          echo "Gradle build command completed."

      # 12. جمع ملفات APK
      - name: Collect APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          OUTPUT="$GITHUB_WORKSPACE/output"

          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT"

          python3 - "$PROJECT_DIR" "$OUTPUT" <<'PY'
          import pathlib
          import shutil
          import sys

          root = pathlib.Path(sys.argv[1])
          output = pathlib.Path(sys.argv[2])

          apks = [
              p for p in root.rglob("*.apk")
              if p.is_file()
              and "build" in p.parts
              and "outputs" in p.parts
              and "apk" in p.parts
              and p.stat().st_size > 0
          ]

          if not apks:
              raise SystemExit(
                  "Build finished but no APK file was found."
              )

          apks.sort()

          for index, apk in enumerate(apks, 1):
              if len(apks) == 1:
                  name = "CinePro-Cinema-Camera.apk"
              else:
                  name = f"CinePro-{index}-{apk.name}"

              target = output / name
              shutil.copy2(apk, target)

              print(
                  target.name,
                  target.stat().st_size,
                  "bytes"
              )

          PY

          echo "APK files:"
          ls -lh "$OUTPUT"

      # 13. فحص APK
      - name: Verify APK files
        shell: bash
        run: |
          set -euo pipefail

          COUNT="$(find output -maxdepth 1 -type f -name '*.apk' | wc -l)"

          if [ "$COUNT" -lt 1 ]; then
            echo "::error::No APK files available."
            exit 1
          fi

          while IFS= read -r APK; do
            if [ ! -s "$APK" ]; then
              echo "::error::Empty APK: $APK"
              exit 1
            fi

            echo "Verified: $APK"
            file "$APK"

          done < <(find output -maxdepth 1 -type f -name '*.apk')

      # 14. رفع APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CinePro-Cinema-Camera-APK
          path: output/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # 15. ملخص النتيجة
      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "# CinePro APK Build"
            echo ""

            if [ -d "$GITHUB_WORKSPACE/output" ]; then
              echo "## Generated APK files"
              ls -lh "$GITHUB_WORKSPACE/output" || true
            else
              echo "No APK output directory was generated."
            fi

            echo ""
            echo "Commit: $GITHUB_SHA"
            echo ""
            echo "Workflow: $GITHUB_WORKFLOW"
          } >> "$GITHUB_STEP_SUMMARY"
