name: Build TikTok Downloader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.13"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5

      # ============================================================
      # 2. JAVA
      #
      # IMPORTANT:
      # No Gradle cache here because the Android project is inside
      # tiktok-downloader.zip, not in repository root.
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 3. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 4. BASIC ENVIRONMENT
      # ============================================================

      - name: Inspect runner
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "RUNNER"
          echo "=========================================="

          echo ""
          echo "Working directory:"
          pwd

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "${JAVA_HOME:-unknown}"

          echo ""
          echo "ANDROID_HOME:"
          echo "${ANDROID_HOME:-unknown}"

          echo ""
          echo "Repository:"
          find . -maxdepth 4 -type f | sort

      # ============================================================
      # 5. FIND ZIP
      # ============================================================

      - name: Find TikTok Downloader ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          if [ -f "tiktok-downloader.zip" ]; then
            ZIP_FILE="tiktok-downloader.zip"
          else
            ZIP_FILE="$(
              find . \
                -type f \
                -iname "*.zip" \
                -not -path "./.git/*" \
                | head -n 1 \
                || true
            )"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo ""
            echo "ERROR: ZIP file not found."
            echo ""
            find . -maxdepth 8 -print | sort
            exit 1
          fi

          echo ""
          echo "ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # ============================================================
      # 6. VALIDATE ZIP
      # ============================================================

      - name: Validate ZIP
        shell: bash
        run: |
          set -euo pipefail

          test -f "$ZIP_FILE"

          echo "=========================================="
          echo "ZIP INFORMATION"
          echo "=========================================="

          ls -lh "$ZIP_FILE"

          echo ""
          echo "ZIP CONTENTS:"
          unzip -l "$ZIP_FILE" | sed -n '1,300p'

      # ============================================================
      # 7. EXTRACT PROJECT
      # ============================================================

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ZIP_FILE" -d android-project

          echo "=========================================="
          echo "EXTRACTED PROJECT"
          echo "=========================================="

          find android-project -maxdepth 10 -type f | sort

      # ============================================================
      # 8. LOCATE GRADLE ROOT
      # ============================================================

      - name: Locate Android Gradle project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          # --------------------------------------------------------
          # settings.gradle
          # --------------------------------------------------------

          SETTINGS_FILE="$(
            find android-project \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              | sort \
              | head -n 1 \
              || true
          )"

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          # --------------------------------------------------------
          # gradlew fallback
          # --------------------------------------------------------

          if [ -z "$PROJECT_DIR" ]; then

            GRADLEW_FILE="$(
              find android-project \
                -type f \
                -name "gradlew" \
                | sort \
                | head -n 1 \
                || true
            )"

            if [ -n "$GRADLEW_FILE" ]; then
              PROJECT_DIR="$(dirname "$GRADLEW_FILE")"
            fi

          fi

          # --------------------------------------------------------
          # app + build.gradle fallback
          # --------------------------------------------------------

          if [ -z "$PROJECT_DIR" ]; then

            BUILD_FILE="$(
              find android-project \
                -type f \
                \( \
                  -name "build.gradle" \
                  -o \
                  -name "build.gradle.kts" \
                \) \
                | sort \
                | head -n 1 \
                || true
            )"

            if [ -n "$BUILD_FILE" ]; then

              CANDIDATE="$(dirname "$BUILD_FILE")"

              if [ -d "$CANDIDATE/app" ]; then
                PROJECT_DIR="$CANDIDATE"
              fi

            fi

          fi

          # --------------------------------------------------------
          # VALIDATE
          # --------------------------------------------------------

          if [ -z "$PROJECT_DIR" ]; then

            echo ""
            echo "ERROR: Android Gradle project was not found."

            echo ""
            echo "Extracted tree:"
            find android-project -maxdepth 12 -print | sort

            exit 1
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo ""
          echo "=========================================="
          echo "PROJECT ROOT"
          echo "=========================================="

          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ============================================================
      # 9. INSPECT PROJECT
      # ============================================================

      - name: Inspect Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "ANDROID PROJECT"
          echo "=========================================="

          echo ""
          echo "Root:"
          pwd

          echo ""
          echo "Files:"
          ls -la

          echo ""
          echo "Important Gradle files:"

          find . \
            -maxdepth 8 \
            -type f \
            \( \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
              -o \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
              -o \
              -name "gradle.properties" \
              -o \
              -name "libs.versions.toml" \
              -o \
              -name "gradle-wrapper.properties" \
            \) \
            | sort

      # ============================================================
      # 10. FIND APP MODULE
      # ============================================================

      - name: Find Android app module
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          APP_MODULE=""

          # Standard app module
          if [ -d "app" ]; then
            APP_MODULE="app"
          fi

          # Search for manifest if standard module doesn't exist
          if [ -z "$APP_MODULE" ]; then

            MANIFEST="$(
              find . \
                -type f \
                -path "*/src/main/AndroidManifest.xml" \
                | sort \
                | head -n 1 \
                || true
            )"

            if [ -n "$MANIFEST" ]; then
              APP_MODULE="$(dirname "$(dirname "$(dirname "$MANIFEST")")")"
            fi

          fi

          if [ -z "$APP_MODULE" ]; then

            echo ""
            echo "ERROR: Android app module not found."

            echo ""
            echo "Directories:"
            find . -maxdepth 8 -type d | sort

            exit 1
          fi

          APP_MODULE="$(realpath "$APP_MODULE")"

          echo ""
          echo "APP MODULE:"
          echo "$APP_MODULE"

          echo "APP_MODULE=$APP_MODULE" >> "$GITHUB_ENV"

      # ============================================================
      # 11. SETUP GRADLE
      #
      # This happens AFTER extracting the project.
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # ============================================================
      # 12. ACCEPT ANDROID LICENSES
      # ============================================================

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +e

          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null 2>&1
          fi

          set -e

      # ============================================================
      # 13. DETECT compileSdk
      # ============================================================

      - name: Detect Android SDK version
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          COMPILE_SDK=""

          # compileSdk 35
          COMPILE_SDK="$(
            grep -RhoE \
              'compileSdk(Version)?[[:space:]]*[=:]?[[:space:]]*[0-9]+' \
              . \
              --include='*.gradle' \
              --include='*.gradle.kts' \
              2>/dev/null \
              | grep -oE '[0-9]+' \
              | tail -n 1 \
              || true
          )"

          # compileSdk = 35
          if [ -z "$COMPILE_SDK" ]; then

            COMPILE_SDK="$(
              grep -RhoE \
                'compileSdk[[:space:]]*=[[:space:]]*[0-9]+' \
                . \
                --include='*.gradle.kts' \
                2>/dev/null \
                | grep -oE '[0-9]+' \
                | tail -n 1 \
                || true
            )"

          fi

          # Safe fallback
          if [ -z "$COMPILE_SDK" ]; then
            COMPILE_SDK="35"
          fi

          echo ""
          echo "compileSdk:"
          echo "$COMPILE_SDK"

          echo "COMPILE_SDK=$COMPILE_SDK" >> "$GITHUB_ENV"

      # ============================================================
      # 14. INSTALL REQUIRED SDK
      # ============================================================

      - name: Install required Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="

          echo "compileSdk=$COMPILE_SDK"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}"

      # ============================================================
      # 15. PREPARE GRADLE WRAPPER
      #
      # NEVER overwrite an existing wrapper.
      # ============================================================

      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "GRADLE WRAPPER"
          echo "=========================================="

          if [ -f "./gradlew" ]; then

            echo "Existing Gradle Wrapper found."
            echo "Keeping original project wrapper."

            chmod +x ./gradlew

          else

            echo "No Gradle Wrapper found."
            echo "Creating Gradle $GRADLE_VERSION wrapper."

            gradle wrapper \
              --gradle-version "$GRADLE_VERSION" \
              --distribution-type bin

            chmod +x ./gradlew

          fi

          echo ""
          echo "Gradle version:"
          ./gradlew --version

      # ============================================================
      # 16. KSP CI FIX
      #
      # Only changes explicit KSP 2.3.5 -> 2.3.6.
      # Application code is untouched.
      # ============================================================

      - name: Fix KSP CI compatibility
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python3 <<'PY'
          import re
          from pathlib import Path

          root = Path.cwd()

          candidates = []

          for path in root.rglob("*"):

              if not path.is_file():
                  continue

              if (
                  path.name.endswith(".gradle")
                  or path.name.endswith(".gradle.kts")
                  or path.name == "libs.versions.toml"
              ):
                  candidates.append(path)

          changed = []

          for path in candidates:

              try:
                  original = path.read_text(encoding="utf-8")
              except Exception:
                  continue

              updated = original

              # Only modify files that actually mention KSP.
              if "com.google.devtools.ksp" in updated:

                  updated = re.sub(
                      r"(?<![\w.])2\.3\.5(?![\w.])",
                      "2.3.6",
                      updated
                  )

              if path.name == "libs.versions.toml":

                  updated = re.sub(
                      r'(?m)^(\s*ksp\s*=\s*["\'])2\.3\.5(["\'])',
                      r"\g<1>2.3.6\g<2>",
                      updated
                  )

              if updated != original:

                  path.write_text(
                      updated,
                      encoding="utf-8"
                  )

                  changed.append(
                      str(path.relative_to(root))
                  )

          print("==========================================")
          print("KSP CHECK")
          print("==========================================")

          if changed:

              print("Changed:")
              for item in changed:
                  print(" -", item)

          else:

              print(
                  "No KSP 2.3.5 declaration found."
              )

          print("")
          print("KSP references:")

          for path in candidates:

              try:
                  text = path.read_text(
                      encoding="utf-8"
                  )
              except Exception:
                  continue

              if "com.google.devtools.ksp" in text:

                  print("")
                  print(
                      f"--- {path.relative_to(root)} ---"
                  )

                  for line in text.splitlines():

                      if "com.google.devtools.ksp" in line:
                          print(line)
          PY

      # ============================================================
      # 17. VERIFY GRADLE
      # ============================================================

      - name: Verify Gradle project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew --version

      # ============================================================
      # 18. SHOW TASKS
      # ============================================================

      - name: Verify Gradle tasks
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew tasks \
            --no-daemon \
            --stacktrace \
            --console=plain

      # ============================================================
      # 19. CLEAN
      # ============================================================

      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew clean \
            --no-daemon \
            --stacktrace \
            --console=plain

      # ============================================================
      # 20. BUILD DEBUG APK
      # ============================================================

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "BUILD DEBUG APK"
          echo "=========================================="

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain \
            2>&1 | tee \
              "$GITHUB_WORKSPACE/gradle-build.log"

      # ============================================================
      # 21. FIND APK
      # ============================================================

      - name: Find APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FIND APK"
          echo "=========================================="

          rm -rf "$GITHUB_WORKSPACE/apk-output"

          mkdir -p \
            "$GITHUB_WORKSPACE/apk-output"

          APK_FILE="$(
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -path "*/build/outputs/*" \
              | sort \
              | head -n 1 \
              || true
          )"

          if [ -z "$APK_FILE" ]; then

            echo ""
            echo "ERROR: APK not found."

            echo ""
            echo "APK files:"
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              | sort \
              || true

            exit 1
          fi

          echo ""
          echo "APK:"
          echo "$APK_FILE"

          cp \
            "$APK_FILE" \
            "$GITHUB_WORKSPACE/apk-output/TikTok-Downloader-debug.apk"

          echo ""
          echo "OUTPUT:"
          ls -lh \
            "$GITHUB_WORKSPACE/apk-output"

      # ============================================================
      # 22. UPLOAD APK
      # ============================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: TikTok-Downloader-APK
          path: apk-output/TikTok-Downloader-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 23. UPLOAD BUILD LOG
      # ============================================================

      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Gradle-Build-Log
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7

      # ============================================================
      # 24. FINAL SUMMARY
      # ============================================================

      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "FINAL SUMMARY"
          echo "=========================================="

          echo ""
          echo "Project:"
          echo "${PROJECT_DIR:-unknown}"

          echo ""
          echo "App module:"
          echo "${APP_MODULE:-unknown}"

          echo ""
          echo "compileSdk:"
          echo "${COMPILE_SDK:-unknown}"

          echo ""
          echo "APK output:"

          if [ -d "$GITHUB_WORKSPACE/apk-output" ]; then
            ls -lah "$GITHUB_WORKSPACE/apk-output"
          else
            echo "No APK output."
          fi
