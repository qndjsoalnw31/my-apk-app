name: Build TikTok Downloader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.13"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:

      # =========================================================
      # 1. Download repository
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v5

      # =========================================================
      # 2. Java
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # =========================================================
      # 3. Android SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # =========================================================
      # 4. Show repository
      # =========================================================
      - name: Inspect repository
        shell: bash
        run: |
          set -eux

          echo "======================================"
          echo "REPOSITORY"
          echo "======================================"

          pwd

          echo ""
          echo "Files:"
          find . -maxdepth 4 -type f | sort

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "ADB:"
          adb version || true

          echo ""
          echo "SDK:"
          echo "$ANDROID_HOME"

      # =========================================================
      # 5. Find ZIP
      # =========================================================
      - name: Find TikTok project ZIP
        shell: bash
        run: |
          set -e

          ZIP=""

          if [ -f "tiktok-downloader.zip" ]; then
            ZIP="tiktok-downloader.zip"
          else
            ZIP=$(find . -type f -iname "*.zip" | head -n 1 || true)
          fi

          if [ -z "$ZIP" ]; then
            echo "ERROR: tiktok-downloader.zip was not found."
            exit 1
          fi

          echo "ZIP=$ZIP"

          echo "ZIP_FILE=$ZIP" >> "$GITHUB_ENV"

      # =========================================================
      # 6. Extract ZIP
      # =========================================================
      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf android-project

          mkdir -p android-project

          unzip -q "$ZIP_FILE" -d android-project

          echo "======================================"
          echo "EXTRACTED PROJECT"
          echo "======================================"

          find android-project -maxdepth 7 -type f | sort

      # =========================================================
      # 7. Locate Gradle project
      # =========================================================
      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          PROJECT=""

          # settings.gradle
          SETTINGS=$(find android-project \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            | head -n 1 || true)

          if [ -n "$SETTINGS" ]; then
            PROJECT=$(dirname "$SETTINGS")
          fi

          # fallback: gradlew
          if [ -z "$PROJECT" ]; then

            GRADLEW=$(find android-project \
              -type f \
              -name "gradlew" \
              | head -n 1 || true)

            if [ -n "$GRADLEW" ]; then
              PROJECT=$(dirname "$GRADLEW")
            fi

          fi

          if [ -z "$PROJECT" ]; then

            echo ""
            echo "======================================"
            echo "ERROR"
            echo "======================================"
            echo "No Android Gradle project found."
            echo ""
            echo "The ZIP must contain one of:"
            echo "settings.gradle"
            echo "settings.gradle.kts"
            echo ""
            echo "Complete extracted tree:"
            find android-project -maxdepth 10 -print

            exit 1
          fi

          PROJECT=$(realpath "$PROJECT")

          echo ""
          echo "PROJECT DIRECTORY:"
          echo "$PROJECT"

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      # =========================================================
      # 8. Inspect Android project
      # =========================================================
      - name: Inspect Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "ANDROID PROJECT"
          echo "======================================"

          echo "Directory:"
          pwd

          echo ""
          echo "Root files:"
          ls -la

          echo ""
          echo "Important files:"

          find . \
            -maxdepth 5 \
            -type f \
            \( \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
              -o \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
              -o \
              -name "gradle.properties" \
              -o \
              -name "AndroidManifest.xml" \
            \) \
            -print

          echo ""
          echo "Gradle files:"
          find . -maxdepth 4 -type f -name "*.gradle*" -print

      # =========================================================
      # 9. Check Android module
      # =========================================================
      - name: Find Android module
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MODULE=""

          if [ -d "app" ]; then
            MODULE="app"
          else

            MANIFEST=$(find . \
              -type f \
              -path "*/src/main/AndroidManifest.xml" \
              | head -n 1 || true)

            if [ -n "$MANIFEST" ]; then
              MODULE=$(dirname "$(dirname "$(dirname "$MANIFEST")")")
            fi

          fi

          if [ -z "$MODULE" ]; then
            echo "ERROR: Android app module was not found."
            echo ""
            echo "Project structure:"
            find . -maxdepth 6 -type d | sort
            exit 1
          fi

          echo "Android module: $MODULE"

          echo "APP_MODULE=$MODULE" >> "$GITHUB_ENV"

      # =========================================================
      # 10. Install Gradle
      # =========================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # =========================================================
      # 11. Generate wrapper
      # =========================================================
      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Generating Gradle wrapper..."

          gradle wrapper \
            --gradle-version "$GRADLE_VERSION" \
            --distribution-type bin

          chmod +x gradlew

          echo ""
          echo "Wrapper generated."

          ls -la gradlew
          ls -la gradle/wrapper

      # =========================================================
      # 12. Verify Gradle
      # =========================================================
      - name: Verify Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew --version

      # =========================================================
      # 13. List Gradle tasks
      # =========================================================
      - name: Inspect Gradle tasks
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          ./gradlew tasks \
            --no-daemon \
            --console=plain \
            --stacktrace \
            || true

      # =========================================================
      # 14. Clean
      # =========================================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew clean \
            --no-daemon \
            --stacktrace \
            --console=plain

      # =========================================================
      # 15. Build APK
      # =========================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILDING APK"
          echo "======================================"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

      # =========================================================
      # 16. Find APK
      # =========================================================
      - name: Find APK
        if: success()
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING APK"
          echo "======================================"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          FOUND=0

          while IFS= read -r APK; do

            echo "APK:"
            echo "$APK"

            cp "$APK" \
              "$GITHUB_WORKSPACE/apk-output/TikTok-Downloader-debug.apk"

            FOUND=1

            break

          done < <(
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -path "*/build/outputs/*" \
              | sort
          )

          if [ "$FOUND" -eq 0 ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "APK successfully found."

          ls -lh "$GITHUB_WORKSPACE/apk-output"

      # =========================================================
      # 17. Upload APK
      # =========================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-Downloader-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 18. Upload Gradle log if build fails
      # =========================================================
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gradle-Build-Log
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7
