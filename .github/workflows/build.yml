name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: >-
        -Xmx4g
        -XX:MaxMetaspaceSize=1g
        -Dfile.encoding=UTF-8
      CI: true

    steps:
      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Verify uploaded ZIP
      # ---------------------------------------------------------
      - name: Verify project ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository contents:"
          ls -la

          if [ ! -f "untitled.zip" ]; then
            echo ""
            echo "ERROR: untitled.zip not found"
            echo ""
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -iname "*.zip" -print || true
            exit 1
          fi

          echo ""
          echo "Found: untitled.zip"
          ls -lh "untitled.zip"

      # ---------------------------------------------------------
      # 3. Extract ZIP
      # ---------------------------------------------------------
      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -o "untitled.zip" -d extracted

          echo ""
          echo "ZIP extracted successfully"
          echo ""
          echo "Top-level contents:"
          find extracted -maxdepth 2 -print | sort | head -200

      # ---------------------------------------------------------
      # 4. Locate Android project
      # ---------------------------------------------------------
      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(
            find extracted \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print -quit
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle/settings.gradle.kts not found"
            echo ""
            echo "Extracted project tree:"
            find extracted -maxdepth 4 -type f | sort | head -300
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "========================================"
          echo "ANDROID PROJECT FOUND"
          echo "========================================"
          echo "Project directory: $PROJECT_DIR"

          # Copy project contents into workspace root.
          shopt -s dotglob nullglob
          cp -R "$PROJECT_DIR"/* .

          echo ""
          echo "Project copied to workspace root."

      # ---------------------------------------------------------
      # 5. Verify Android project files
      # ---------------------------------------------------------
      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "===== ROOT FILES ====="
          find . -maxdepth 2 -type f | sort | head -300

          echo ""
          echo "===== REQUIRED FILES ====="

          for file in \
            "settings.gradle.kts" \
            "build.gradle.kts" \
            "gradle/libs.versions.toml" \
            "app/build.gradle.kts" \
            "app/src/main/AndroidManifest.xml"
          do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing required file: $file"
              exit 1
            fi

            echo "OK: $file"
          done

      # ---------------------------------------------------------
      # 6. Remove Google Services dependency for CI build
      # ---------------------------------------------------------
      - name: Disable Google Services plugin
        shell: bash
        run: |
          set -euo pipefail

          echo "Disabling Google Services plugin because no Firebase configuration"
          echo "file is supplied in the uploaded project."

          python3 <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("build.gradle.kts"),
              Path("app/build.gradle.kts"),
          ]

          for path in files:
              if not path.exists():
                  continue

              text = path.read_text(encoding="utf-8")

              # Remove Google Services plugin aliases.
              text = re.sub(
                  r'^\s*alias\(libs\.plugins\.google\.services\)\s*(?:apply\s+false)?\s*$\n?',
                  '',
                  text,
                  flags=re.MULTILINE,
              )

              # Remove direct Google Services plugin id lines.
              text = re.sub(
                  r'^\s*id\(["\']com\.google\.gms\.google-services["\']\).*$\n?',
                  '',
                  text,
                  flags=re.MULTILINE,
              )

              path.write_text(text, encoding="utf-8")

              print(f"Updated: {path}")
          PY

          # Remove any Google Services JSON files if present.
          find . \
            -type f \
            -name "google-services.json" \
            -delete

          echo "Google Services configuration disabled."

      # ---------------------------------------------------------
      # 7. Remove custom debug signing config
      # ---------------------------------------------------------
      - name: Normalize debug signing
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          # Remove custom debug signing block.
          text = re.sub(
              r'\s*create\("debugConfig"\)\s*\{.*?\n\s*\}\s*(?=\n\s*\})',
              '',
              text,
              flags=re.DOTALL,
          )

          # Remove explicit debug signing assignment.
          text = re.sub(
              r'^\s*debug\s*\{\s*signingConfig\s*=\s*signingConfigs\.getByName\("debugConfig"\)\s*\}\s*$',
              'debug { }',
              text,
              flags=re.MULTILINE,
          )

          # Remove any remaining references just in case.
          text = re.sub(
              r'^\s*signingConfig\s*=\s*signingConfigs\.getByName\("debugConfig"\)\s*$\n?',
              '',
              text,
              flags=re.MULTILINE,
          )

          path.write_text(text, encoding="utf-8")

          print("Normalized app/build.gradle.kts")
          PY

          echo ""
          echo "Checking for remaining debugConfig references:"
          grep -R "debugConfig" app/build.gradle.kts || true

      # ---------------------------------------------------------
      # 8. Setup Java 17
      # ---------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------
      # 9. Setup Gradle 9.3.1
      # ---------------------------------------------------------
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # ---------------------------------------------------------
      # 10. Check Java / Gradle
      # ---------------------------------------------------------
      - name: Check build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "===== JAVA ====="
          java -version

          echo ""
          echo "===== GRADLE ====="
          gradle --version

      # ---------------------------------------------------------
      # 11. Generate Gradle Wrapper
      # ---------------------------------------------------------
      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "gradlew" ]; then
            echo "Gradle wrapper is missing from uploaded ZIP."
            echo "Generating wrapper using Gradle 9.3.1..."

            gradle wrapper \
              --gradle-version 9.3.1 \
              --distribution-type bin

            echo "Gradle wrapper generated."
          else
            echo "Gradle wrapper already exists."
          fi

          chmod +x ./gradlew

          echo ""
          echo "===== WRAPPER VERSION ====="
          ./gradlew --version

      # ---------------------------------------------------------
      # 12. Install Android SDK packages
      # ---------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo ""
          echo "Android SDK components installed."

      # ---------------------------------------------------------
      # 13. Validate Gradle configuration
      # ---------------------------------------------------------
      - name: Validate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "GRADLE PROJECTS"
          echo "========================================"

          ./gradlew projects \
            --no-daemon \
            --stacktrace

      # ---------------------------------------------------------
      # 14. Clean
      # ---------------------------------------------------------
      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      # ---------------------------------------------------------
      # 15. Build Debug APK
      # ---------------------------------------------------------
      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          echo "========================================"
          echo "BUILDING DEBUG APK"
          echo "========================================"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all \
            2>&1 | tee gradle-build.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "BUILD RESULT"
          echo "EXIT CODE: $EXIT_CODE"
          echo "========================================"

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo ""
            echo "===== WHAT WENT WRONG ====="
            grep -A 25 -B 5 \
              "\* What went wrong" \
              gradle-build.log || true

            echo ""
            echo "===== CAUSED BY ====="
            grep -A 25 -B 5 \
              "Caused by:" \
              gradle-build.log | head -160 || true

            echo ""
            echo "===== FAILED TASK ====="
            grep -E \
              "Execution failed for task|FAILED|FAILURE" \
              gradle-build.log | head -120 || true

            echo ""
            echo "===== COMMON CONFIGURATION ERRORS ====="
            grep -Ei \
              "google-services|keystore|signing|compileSdk|buildTools|Gradle|Kotlin|KSP|resource|manifest" \
              gradle-build.log | tail -150 || true

            echo ""
            echo "===== LAST 200 LINES ====="
            tail -200 gradle-build.log

            exit "$EXIT_CODE"
          fi

          echo ""
          echo "========================================"
          echo "APK BUILD SUCCESSFUL"
          echo "========================================"

      # ---------------------------------------------------------
      # 16. Locate generated APK
      # ---------------------------------------------------------
      - name: Find generated APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for generated APK files..."

          find . \
            -type f \
            -path "*/build/outputs/apk/*/*.apk" \
            -print

          APK_COUNT=$(
            find . \
              -type f \
              -path "*/build/outputs/apk/*/*.apk" \
              | wc -l
          )

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo ""
          echo "APK files found: $APK_COUNT"

      # ---------------------------------------------------------
      # 17. Rename APK to a predictable name
      # ---------------------------------------------------------
      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          APK_FILE=$(
            find . \
              -type f \
              -path "*/build/outputs/apk/debug/*.apk" \
              | head -n 1
          )

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Debug APK not found."
            exit 1
          fi

          cp "$APK_FILE" "artifacts/APK-Builder-Mobile-debug.apk"

          echo "APK copied to:"
          ls -lh "artifacts/APK-Builder-Mobile-debug.apk"

      # ---------------------------------------------------------
      # 18. Upload APK
      # ---------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Builder-Mobile
          path: artifacts/APK-Builder-Mobile-debug.apk
          if-no-files-found: error
          retention-days: 7

      # ---------------------------------------------------------
      # 19. Upload build log if build fails
      # ---------------------------------------------------------
      - name: Upload Gradle build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Gradle-Build-Log
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7
