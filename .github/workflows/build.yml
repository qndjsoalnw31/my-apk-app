name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    env:
      CI: true
      GRADLE_OPTS: >-
        -Xmx4g
        -XX:MaxMetaspaceSize=1g
        -Dfile.encoding=UTF-8

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. Verify ZIP
      # ==========================================================
      - name: Verify project ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "untitled.zip" ]; then
            echo "ERROR: untitled.zip not found"

            echo ""
            echo "ZIP files available:"
            find . -type f -iname "*.zip" -print || true

            exit 1
          fi

          echo "Found:"
          ls -lh untitled.zip

      # ==========================================================
      # 3. Extract ZIP
      # ==========================================================
      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q -o untitled.zip -d extracted

          echo "ZIP extracted."

      # ==========================================================
      # 4. Find Android project
      # ==========================================================
      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE=$(
            find extracted \
              -type f \
              \( \
                -name "settings.gradle.kts" \
                -o \
                -name "settings.gradle" \
              \) \
              -print -quit
          )

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android Gradle project not found."

            find extracted -maxdepth 5 -type f | sort | head -400

            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Android project:"
          echo "$PROJECT_DIR"

          rm -rf project
          mkdir -p project

          cp -a "$PROJECT_DIR"/. project/

          if [ ! -f "project/app/build.gradle.kts" ]; then
            echo "ERROR: project/app/build.gradle.kts not found"
            exit 1
          fi

      # ==========================================================
      # 5. FIX APP GRADLE FILE
      # ==========================================================
      - name: Repair app build.gradle.kts
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("project/app/build.gradle.kts")

          if not path.exists():
              raise SystemExit(
                  "ERROR: app/build.gradle.kts does not exist"
              )

          text = path.read_text(encoding="utf-8")

          print("========================================")
          print("ORIGINAL app/build.gradle.kts")
          print("========================================")
          print(text)

          # ------------------------------------------------------
          # Remove Google Services import
          # ------------------------------------------------------
          text = re.sub(
              r'^[ \t]*import[ \t]+com\.google\.gms\..*$\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          # ------------------------------------------------------
          # Remove Google Services plugin alias
          # ------------------------------------------------------
          text = re.sub(
              r'^[ \t]*alias\s*\(\s*libs\.plugins\.google\.services\s*\).*$\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          # ------------------------------------------------------
          # Remove direct Google Services plugin
          # ------------------------------------------------------
          text = re.sub(
              r'^[ \t]*id\s*\(\s*["\']com\.google\.gms\.google-services["\']\s*\).*$\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          # ------------------------------------------------------
          # Remove every direct debugConfig reference.
          #
          # This is the exact error from the current build:
          #
          # signingConfig =
          # signingConfigs.getByName("debugConfig")
          # ------------------------------------------------------
          text = re.sub(
              r'^[ \t]*signingConfig[ \t]*=[ \t]*signingConfigs\.getByName\s*\(\s*["\']debugConfig["\']\s*\)[ \t]*$\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          # ------------------------------------------------------
          # Also remove references even if formatting differs.
          # ------------------------------------------------------
          text = re.sub(
              r'^[^\n]*debugConfig[^\n]*$\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          # ------------------------------------------------------
          # Remove googleServices { ... } using brace counting.
          # Regex alone is unreliable with nested Kotlin blocks.
          # ------------------------------------------------------
          lines = text.splitlines()
          output = []

          i = 0

          while i < len(lines):
              line = lines[i]

              if re.search(r'^\s*googleServices\s*\{', line):
                  brace_count = line.count("{") - line.count("}")

                  i += 1

                  while i < len(lines) and brace_count > 0:
                      brace_count += (
                          lines[i].count("{")
                          - lines[i].count("}")
                      )
                      i += 1

                  continue

              output.append(line)
              i += 1

          text = "\n".join(output) + "\n"

          # ------------------------------------------------------
          # Remove Google Services strategy references if any
          # ------------------------------------------------------
          text = re.sub(
              r'^[^\n]*MissingGoogleServicesStrategy[^\n]*$\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          text = re.sub(
              r'^[^\n]*missingGoogleServicesStrategy[^\n]*$\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          # ------------------------------------------------------
          # Remove custom debug signing block.
          #
          # Handles:
          #
          # create("debugConfig") {
          #     ...
          # }
          # ------------------------------------------------------
          lines = text.splitlines()
          output = []

          i = 0

          while i < len(lines):
              line = lines[i]

              if re.search(
                  r'^\s*create\s*\(\s*["\']debugConfig["\']\s*\)\s*\{',
                  line
              ):
                  brace_count = line.count("{") - line.count("}")

                  i += 1

                  while i < len(lines) and brace_count > 0:
                      brace_count += (
                          lines[i].count("{")
                          - lines[i].count("}")
                      )
                      i += 1

                  continue

              output.append(line)
              i += 1

          text = "\n".join(output) + "\n"

          path.write_text(
              text,
              encoding="utf-8"
          )

          print("========================================")
          print("REPAIRED app/build.gradle.kts")
          print("========================================")
          print(text)
          PY

      # ==========================================================
      # 6. Remove Google Services from root configuration
      # ==========================================================
      - name: Repair root Gradle files
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          files = []

          root = Path("project/build.gradle.kts")
          if root.exists():
              files.append(root)

          root_groovy = Path("project/build.gradle")
          if root_groovy.exists():
              files.append(root_groovy)

          for path in files:
              text = path.read_text(encoding="utf-8")

              text = re.sub(
                  r'^[ \t]*alias\s*\(\s*libs\.plugins\.google\.services\s*\).*$\n?',
                  '',
                  text,
                  flags=re.MULTILINE
              )

              text = re.sub(
                  r'^[ \t]*id\s*\(\s*["\']com\.google\.gms\.google-services["\']\s*\).*$\n?',
                  '',
                  text,
                  flags=re.MULTILINE
              )

              path.write_text(
                  text,
                  encoding="utf-8"
              )

              print(f"Repaired {path}")

          # ------------------------------------------------------
          # Remove Google Services from version catalog
          # ------------------------------------------------------
          catalog = Path("project/gradle/libs.versions.toml")

          if catalog.exists():
              text = catalog.read_text(
                  encoding="utf-8"
              )

              text = re.sub(
                  r'^.*google-services.*$\n?',
                  '',
                  text,
                  flags=re.MULTILINE
              )

              text = re.sub(
                  r'^.*googleServices.*$\n?',
                  '',
                  text,
                  flags=re.MULTILINE
              )

              catalog.write_text(
                  text,
                  encoding="utf-8"
              )

              print("Repaired libs.versions.toml")

      # ==========================================================
      # 7. Remove Google Services JSON
      # ==========================================================
      - name: Remove Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          find project \
            -type f \
            -name "google-services.json" \
            -delete \
            || true

          echo "google-services.json removed if present."

      # ==========================================================
      # 8. FINAL validation BEFORE Gradle
      # ==========================================================
      - name: Validate repaired source
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VALIDATING PROJECT"
          echo "========================================"

          echo ""
          echo "Searching for debugConfig..."

          if grep -Rni \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            "debugConfig" \
            project 2>/dev/null; then

            echo ""
            echo "ERROR: debugConfig still exists."
            echo "Build stopped before Gradle."
            exit 1
          fi

          echo "OK: debugConfig does not exist."

          echo ""
          echo "Searching for Google Services..."

          if grep -Rni \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            "google-services" \
            project 2>/dev/null; then

            echo ""
            echo "ERROR: Google Services plugin reference remains."
            exit 1
          fi

          if grep -Rni \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            "googleServices" \
            project 2>/dev/null; then

            echo ""
            echo "ERROR: googleServices block/reference remains."
            exit 1
          fi

          echo "OK: Google Services build configuration removed."

          echo ""
          echo "Searching for Firebase missing strategy..."

          if grep -Rni \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            "MissingGoogleServicesStrategy" \
            project 2>/dev/null; then

            echo ""
            echo "ERROR: MissingGoogleServicesStrategy remains."
            exit 1
          fi

          echo "OK."

      # ==========================================================
      # 9. Java 17
      # ==========================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # 10. Gradle 9.3.1
      # ==========================================================
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # ==========================================================
      # 11. Android SDK
      # ==========================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # ==========================================================
      # 12. Create Gradle Wrapper
      # ==========================================================
      - name: Generate Gradle wrapper
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "gradlew" ]; then
            gradle wrapper \
              --gradle-version 9.3.1 \
              --distribution-type bin
          fi

          chmod +x gradlew

          ./gradlew --version

      # ==========================================================
      # 13. Gradle configuration test
      # ==========================================================
      - name: Test Gradle configuration
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:tasks \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ==========================================================
      # 14. Kotlin compilation
      # ==========================================================
      - name: Compile Kotlin
        working-directory: project
        shell: bash
        run: |
          set -o pipefail

          ./gradlew \
            :app:compileDebugKotlin \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            2>&1 | tee kotlin-compile.log

          EXIT_CODE=${PIPESTATUS[0]}

          if [ "$EXIT_CODE" -ne 0 ]; then

            echo ""
            echo "========================================"
            echo "KOTLIN ERRORS"
            echo "========================================"

            grep -E \
              '(^e: |error: |Unresolved reference|Type mismatch|Expecting |Cannot access|Overload resolution ambiguity)' \
              kotlin-compile.log \
              | head -150 \
              || true

            echo ""
            echo "========================================"
            echo "ERROR CONTEXT"
            echo "========================================"

            grep -n \
              -B 3 \
              -A 8 \
              '^e: ' \
              kotlin-compile.log \
              | head -250 \
              || true

            exit "$EXIT_CODE"
          fi

          echo "Kotlin compilation successful."

      # ==========================================================
      # 15. Build APK
      # ==========================================================
      - name: Build Debug APK
        working-directory: project
        shell: bash
        run: |
          set -o pipefail

          echo "========================================"
          echo "BUILDING APK"
          echo "========================================"

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            2>&1 | tee build.log

          EXIT_CODE=${PIPESTATUS[0]}

          if [ "$EXIT_CODE" -ne 0 ]; then

            echo ""
            echo "========================================"
            echo "BUILD FAILURE SUMMARY"
            echo "========================================"

            grep -E \
              'Execution failed for task|(^e: )|error: |What went wrong|Caused by:|FAILED|FAILURE' \
              build.log \
              | head -200 \
              || true

            echo ""
            echo "========================================"
            echo "LAST 250 LINES"
            echo "========================================"

            tail -250 build.log

            exit "$EXIT_CODE"
          fi

          echo ""
          echo "========================================"
          echo "APK BUILD SUCCESSFUL"
          echo "========================================"

      # ==========================================================
      # 16. Find APK
      # ==========================================================
      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(
            find project/app/build/outputs/apk/debug \
              -type f \
              -name "*.apk" \
              -print -quit
          )

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

      # ==========================================================
      # 17. Prepare APK
      # ==========================================================
      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          APK=$(
            find project/app/build/outputs/apk/debug \
              -type f \
              -name "*.apk" \
              -print -quit
          )

          cp "$APK" \
            artifacts/APK-Builder-Mobile-debug.apk

          ls -lh \
            artifacts/APK-Builder-Mobile-debug.apk

      # ==========================================================
      # 18. Upload APK
      # ==========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Builder-Mobile
          path: artifacts/APK-Builder-Mobile-debug.apk
          if-no-files-found: error
          retention-days: 7

      # ==========================================================
      # 19. Upload logs if failed
      # ==========================================================
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Diagnostics
          path: |
            project/kotlin-compile.log
            project/build.log
          if-no-files-found: ignore
          retention-days: 7
