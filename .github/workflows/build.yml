name: Build Android APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP directly to root
        run: |
          unzip -o substack-downloader.zip
          # إذا كان ZIP يحتوي مجلداً رئيسياً واحداً، ننقل كل ما بداخل المجلد للمسار الرئيسي
          ROOT_DIR=$(find . -maxdepth 2 -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          DIR_PATH=$(dirname "$ROOT_DIR")
          if [ "$DIR_PATH" != "." ]; then
            rsync -a "$DIR_PATH/" .
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-App-APK
          path: app/build/outputs/apk/debug/*.apk
