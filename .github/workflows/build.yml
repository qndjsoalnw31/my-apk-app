name: Build TikTok Downloader APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "9.3.1"

  # Project uses:
  # compileSdk { version = release(36) { minorApiLevel = 1 } }
  ANDROID_PLATFORM: "36.1"

  # Android Build Tools
  ANDROID_BUILD_TOOLS: "36.1.0"

  GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:

      # ============================================================
      # 01 - CHECKOUT
      # ============================================================
      - name: "01 - Checkout repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # ============================================================
      # 02 - JAVA 17
      #
      # Do NOT enable Gradle cache here.
      # The actual Gradle project is stored inside the ZIP.
      # ============================================================
      - name: "02 - Setup Java 17"
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 03 - FIND ZIP
      # ============================================================
      - name: "03 - Locate TikTok Downloader ZIP"
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          if [ -f "$GITHUB_WORKSPACE/tiktok-downloader.zip" ]; then
            ZIP_FILE="$GITHUB_WORKSPACE/tiktok-downloader.zip"
          else
            ZIP_FILE="$({
              find "$GITHUB_WORKSPACE" \
                -type f \
                -iname '*.zip' \
                -not -path '*/.git/*' \
                -print \
                -quit \
                2>/dev/null || true
            })"
          fi

          if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "::error::tiktok-downloader.zip was not found."

            echo ""
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 8 \
              -type f \
              -print \
              | sort \
              || true

            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo ""
          echo "Using ZIP:"
          ls -lh "$ZIP_FILE"

      # ============================================================
      # 04 - VALIDATE ZIP
      # ============================================================
      - name: "04 - Validate ZIP archive"
        shell: bash
        run: |
          set -euo pipefail

          unzip -t "$ZIP_FILE"

          echo ""
          echo "ZIP integrity: OK"

      # ============================================================
      # 05 - EXTRACT PROJECT
      # ============================================================
      - name: "05 - Extract Android project"
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_ROOT="$GITHUB_WORKSPACE/android-project"

          rm -rf "$EXTRACT_ROOT"
          mkdir -p "$EXTRACT_ROOT"

          unzip -q "$ZIP_FILE" -d "$EXTRACT_ROOT"

          echo ""
          echo "Extracted project:"
          find "$EXTRACT_ROOT" \
            -maxdepth 12 \
            -type f \
            -print \
            | sort

      # ============================================================
      # 06 - LOCATE PROJECT ROOT
      # ============================================================
      - name: "06 - Locate Gradle project"
        shell: bash
        run: |
          set -euo pipefail

          SEARCH_ROOT="$GITHUB_WORKSPACE/android-project"

          SETTINGS_FILE="$({
            find "$SEARCH_ROOT" \
              -type f \
              \( \
                -name 'settings.gradle.kts' \
                -o -name 'settings.gradle' \
              \) \
              -print \
              -quit \
              2>/dev/null || true
          })"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::No settings.gradle.kts or settings.gradle found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$(realpath "$SETTINGS_FILE")")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then

            echo "::error::The app Gradle module was not found."

            echo ""
            echo "Project directory:"
            echo "$PROJECT_DIR"

            find "$PROJECT_DIR" \
              -maxdepth 6 \
              -type f \
              -print \
              | sort \
              || true

            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Gradle project:"
          echo "$PROJECT_DIR"

      # ============================================================
      # 07 - VERIFY PROJECT FILES
      # ============================================================
      - name: "07 - Verify project files"
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          REQUIRED_FILES=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "app/build.gradle.kts"
            "gradle/libs.versions.toml"
            "gradle/wrapper/gradle-wrapper.properties"
            "app/src/main/AndroidManifest.xml"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "::error::Required file is missing: $FILE"
              exit 1
            fi
          done

          echo "All required project files exist."

      # ============================================================
      # 08 - SETUP ANDROID SDK
      #
      # This action:
      # - installs Android command-line tools
      # - accepts SDK licenses
      # - installs requested SDK packages
      #
      # There is deliberately NO manual `yes | sdkmanager --licenses`
      # step anymore.
      # ============================================================
      - name: "08 - Setup Android SDK"
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "15859902"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: |
            platform-tools
            platforms;android-36.1
            build-tools;36.1.0

      # ============================================================
      # 09 - VERIFY ANDROID SDK
      # ============================================================
      - name: "09 - Verify Android SDK"
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK root is empty."
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT"

          echo ""
          echo "SDK manager:"
          command -v sdkmanager
          sdkmanager --version

          echo ""
          echo "Platform 36.1:"
          test -f \
            "$SDK_ROOT/platforms/android-36.1/android.jar"

          ls -lh \
            "$SDK_ROOT/platforms/android-36.1/android.jar"

          echo ""
          echo "Build Tools 36.1.0:"
          test -x \
            "$SDK_ROOT/build-tools/36.1.0/aapt2"

          ls -lh \
            "$SDK_ROOT/build-tools/36.1.0/aapt2"

          echo ""
          echo "Platform Tools:"
          test -x \
            "$SDK_ROOT/platform-tools/adb"

          ls -lh \
            "$SDK_ROOT/platform-tools/adb"

          echo ""
          echo "Installed Android SDK components:"
          sdkmanager --list_installed 2>/dev/null || true

          echo ""
          echo "Android SDK verification successful."

      # ============================================================
      # 10 - CONFIGURE SDK PATH
      # ============================================================
      - name: "10 - Configure local.properties"
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "::error::SDK root is empty."
            exit 1
          fi

          printf 'sdk.dir=%s\n' "$SDK_ROOT" > local.properties

          echo ""
          echo "local.properties:"
          cat local.properties

      # ============================================================
      # 11 - CI GRADLE SETTINGS
      #
      # Disable configuration cache for the CI build.
      # The source ZIP remains untouched; only the extracted copy
      # is modified.
      # ============================================================
      - name: "11 - Configure CI Gradle properties"
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          touch gradle.properties

          if grep -q '^org\.gradle\.jvmargs=' gradle.properties; then
            sed -i \
              "s#^org\\.gradle\\.jvmargs=.*#org.gradle.jvmargs=${GRADLE_OPTS}#" \
              gradle.properties
          else
            printf '\norg.gradle.jvmargs=%s\n' "$GRADLE_OPTS" \
              >> gradle.properties
          fi

          if grep -q '^org\.gradle\.configuration-cache=' gradle.properties; then
            sed -i \
              's#^org\.gradle\.configuration-cache=.*#org.gradle.configuration-cache=false#' \
              gradle.properties
          else
            printf '\norg.gradle.configuration-cache=false\n' \
              >> gradle.properties
          fi

          if ! grep -q '^org\.gradle\.workers.max=' gradle.properties; then
            printf '\norg.gradle.workers.max=4\n' \
              >> gradle.properties
          fi

          if ! grep -q '^kotlin.compiler.execution.strategy=' gradle.properties; then
            printf '\nkotlin.compiler.execution.strategy=in-process\n' \
              >> gradle.properties
          fi

          echo ""
          echo "CI Gradle properties:"
          grep -E \
            '^(org\.gradle\.jvmargs|org\.gradle\.configuration-cache|org\.gradle\.workers.max|kotlin\.compiler\.execution\.strategy)=' \
            gradle.properties \
            || true

      # ============================================================
      # 12 - KSP COMPATIBILITY
      #
      # Project ZIP contains KSP 2.3.5.
      # KSP 2.3.6 includes a fix for the KSP 2.3.5 CI failure.
      #
      # Only the extracted CI copy is changed.
      # ============================================================
      - name: "12 - Apply KSP CI compatibility fix"
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          VERSION_FILE="gradle/libs.versions.toml"

          echo "Current KSP:"
          grep -n \
            'googleDevtoolsKsp' \
            "$VERSION_FILE" \
            || true

          if grep -q \
            'googleDevtoolsKsp = "2\.3\.5"' \
            "$VERSION_FILE"
          then

            echo ""
            echo "KSP 2.3.5 detected."
            echo "Using KSP 2.3.6 for CI."

            sed -i \
              's/googleDevtoolsKsp = "2\.3\.5"/googleDevtoolsKsp = "2.3.6"/' \
              "$VERSION_FILE"

          fi

          echo ""
          echo "Final KSP:"
          grep -n \
            'googleDevtoolsKsp' \
            "$VERSION_FILE" \
            || true

      # ============================================================
      # 13 - CREATE DEBUG KEYSTORE
      #
      # Project explicitly references:
      # ${rootDir}/debug.keystore
      #
      # The ZIP does not contain it, therefore create it here.
      # ============================================================
      - name: "13 - Create debug keystore"
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          KEYSTORE="$PROJECT_DIR/debug.keystore"

          if [ ! -f "$KEYSTORE" ]; then

            echo "Generating debug.keystore..."

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

          else

            echo "debug.keystore already exists."

          fi

          test -f "$KEYSTORE"

          keytool \
            -list \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            >/dev/null

          echo "Debug keystore verified."

      # ============================================================
      # 14 - SETUP GRADLE
      #
      # No cache.
      #
      # This completely avoids the earlier cache-discovery problem
      # caused by the project being stored inside a ZIP.
      # ============================================================
      - name: "14 - Setup Gradle 9.3.1"
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"
          cache-disabled: true
          validate-wrappers: false
          add-job-summary: on-failure

      # ============================================================
      # 15 - VERIFY JAVA + GRADLE
      # ============================================================
      - name: "15 - Verify Java and Gradle"
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "JAVA"
          echo "============================================================"

          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo ""
          echo "============================================================"
          echo "GRADLE"
          echo "============================================================"

          gradle --version

      # ============================================================
      # 16 - VERIFY PROJECT TOOLCHAIN
      # ============================================================
      - name: "16 - Verify project toolchain"
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "============================================================"
          echo "AGP"
          echo "============================================================"

          grep -n \
            '^agp[[:space:]]*=' \
            gradle/libs.versions.toml

          echo ""
          echo "============================================================"
          echo "KOTLIN"
          echo "============================================================"

          grep -n \
            '^kotlin[[:space:]]*=' \
            gradle/libs.versions.toml

          echo ""
          echo "============================================================"
          echo "KSP"
          echo "============================================================"

          grep -n \
            'googleDevtoolsKsp' \
            gradle/libs.versions.toml

          echo ""
          echo "============================================================"
          echo "ANDROID CONFIG"
          echo "============================================================"

          grep -n \
            -A8 \
            -B2 \
            'compileSdk' \
            app/build.gradle.kts

          echo ""
          echo "applicationId:"
          grep -n \
            'applicationId' \
            app/build.gradle.kts

          echo ""
          echo "targetSdk:"
          grep -n \
            'targetSdk' \
            app/build.gradle.kts

          echo ""
          echo "minSdk:"
          grep -n \
            'minSdk' \
            app/build.gradle.kts

      # ============================================================
      # 17 - GRADLE CONFIGURATION
      # ============================================================
      - name: "17 - Validate Gradle configuration"
        shell: bash
        run: |
          set -uo pipefail

          cd "$PROJECT_DIR"

          LOG="$GITHUB_WORKSPACE/gradle-help.log"

          rm -f "$LOG"

          echo "============================================================"
          echo "VALIDATING GRADLE CONFIGURATION"
          echo "============================================================"

          set +e

          gradle \
            help \
            --no-daemon \
            --stacktrace \
            --console=plain \
            --warning-mode=all \
            --no-configuration-cache \
            2>&1 \
            | tee "$LOG"

          RC=${PIPESTATUS[0]}

          set -e

          if [ "$RC" -ne 0 ]; then

            echo ""
            echo "============================================================"
            echo "GRADLE CONFIGURATION FAILED"
            echo "============================================================"

            echo ""
            echo "Relevant errors:"

            grep -n -E \
              'FAILURE:|Exception|Caused by:|error:|ERROR|KSP|Kotlin|Plugin|Gradle|Android Gradle|Room|Moshi' \
              "$LOG" \
              | tail -n 300 \
              || true

            echo ""
            echo "Last 400 lines:"

            tail -n 400 "$LOG"

            exit "$RC"
          fi

          echo ""
          echo "Gradle configuration is valid."

      # ============================================================
      # 18 - VERIFY APP TASKS
      # ============================================================
      - name: "18 - Verify app Gradle tasks"
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle \
            :app:tasks \
            --all \
            --no-daemon \
            --stacktrace \
            --console=plain \
            --warning-mode=all \
            --no-configuration-cache \
            2>&1 \
            | tee "$GITHUB_WORKSPACE/gradle-tasks.log"

      # ============================================================
      # 19 - CLEAN
      # ============================================================
      - name: "19 - Clean project"
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle \
            clean \
            --no-daemon \
            --stacktrace \
            --console=plain \
            --warning-mode=all \
            --no-configuration-cache

      # ============================================================
      # 20 - BUILD APK
      # ============================================================
      - name: "20 - Build Debug APK"
        shell: bash
        run: |
          set -uo pipefail

          cd "$PROJECT_DIR"

          LOG="$GITHUB_WORKSPACE/gradle-build.log"

          rm -f "$LOG"

          echo "============================================================"
          echo "BUILD DEBUG APK"
          echo "============================================================"

          echo ""
          echo "Project:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Java:"
          java -version 2>&1 || true

          echo ""
          echo "Gradle:"
          gradle --version || true

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"

          set +e

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain \
            --warning-mode=all \
            --no-configuration-cache \
            --no-build-cache \
            --rerun-tasks \
            2>&1 \
            | tee "$LOG"

          RC=${PIPESTATUS[0]}

          set -e

          if [ "$RC" -ne 0 ]; then

            echo ""
            echo "============================================================"
            echo "APK BUILD FAILED"
            echo "============================================================"

            echo ""
            echo "---------------- KSP ----------------"

            grep -n -E \
              'KSP|ksp|symbol-processing|ApplicationManager' \
              "$LOG" \
              | tail -n 250 \
              || true

            echo ""
            echo "---------------- SDK / AAPT ----------------"

            grep -n -E \
              'compileSdk|36\.1|android\.jar|AAPT|aapt2|resource .* not found|Manifest merger|SDK' \
              "$LOG" \
              | tail -n 250 \
              || true

            echo ""
            echo "---------------- Kotlin / Java ----------------"

            grep -n -E \
              'Kotlin|KotlinCompile|jvmTarget|JVM target|Unsupported class file|Inconsistent JVM|Java|OutOfMemory|Metaspace' \
              "$LOG" \
              | tail -n 250 \
              || true

            echo ""
            echo "---------------- Dependencies ----------------"

            grep -n -E \
              'Could not resolve|Could not find|Could not download|TLS|SSL|PKIX|timeout|timed out|Connection reset|Connection refused|UnknownHost' \
              "$LOG" \
              | tail -n 250 \
              || true

            echo ""
            echo "---------------- Signing ----------------"

            grep -n -E \
              'signing|keystore|androiddebugkey|storePassword|keyPassword' \
              "$LOG" \
              | tail -n 150 \
              || true

            echo ""
            echo "---------------- Gradle ----------------"

            grep -n -E \
              'FAILURE:|Execution failed for task|Task .* FAILED|Exception|Caused by:|error:' \
              "$LOG" \
              | tail -n 350 \
              || true

            echo ""
            echo "---------------- LAST 500 LINES ----------------"

            tail -n 500 "$LOG"

            exit "$RC"
          fi

          echo ""
          echo "============================================================"
          echo "APK BUILD SUCCESSFUL"
          echo "============================================================"

      # ============================================================
      # 21 - FIND APK
      # ============================================================
      - name: "21 - Find generated APK"
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          OUTPUT_DIR="$GITHUB_WORKSPACE/apk-output"

          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"

          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$EXPECTED_APK" ]; then

            echo "::error::Expected APK was not generated."

            echo ""
            echo "All APK files:"

            find . \
              -type f \
              -name '*.apk' \
              -path '*/build/outputs/*' \
              -print \
              | sort \
              || true

            exit 1
          fi

          cp \
            "$EXPECTED_APK" \
            "$OUTPUT_DIR/TikTok-Downloader-debug.apk"

          echo ""
          echo "Generated APK:"
          ls -lh \
            "$OUTPUT_DIR/TikTok-Downloader-debug.apk"

      # ============================================================
      # 22 - INSPECT APK
      # ============================================================
      - name: "22 - Inspect generated APK"
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/apk-output/TikTok-Downloader-debug.apk"

          test -f "$APK"

          echo "============================================================"
          echo "APK INFORMATION"
          echo "============================================================"

          echo ""
          echo "File:"
          file "$APK"

          echo ""
          echo "Size:"
          ls -lh "$APK"

          echo ""
          echo "SHA256:"
          sha256sum "$APK"

          echo ""
          echo "APK summary:"
          apkanalyzer apk summary "$APK" || true

      # ============================================================
      # 23 - UPLOAD APK
      # ============================================================
      - name: "23 - Upload APK"
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: TikTok-Downloader-APK
          path: apk-output/TikTok-Downloader-debug.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # ============================================================
      # 24 - DIAGNOSTICS
      # ============================================================
      - name: "24 - Collect diagnostics"
        if: always()
        shell: bash
        run: |
          set +e

          DIAG="$GITHUB_WORKSPACE/diagnostics"

          rm -rf "$DIAG"
          mkdir -p "$DIAG"

          copy_if_exists() {
            local SRC="$1"
            local DST="$2"

            if [ -f "$SRC" ]; then
              cp "$SRC" "$DST" || true
            fi
          }

          copy_if_exists \
            "$GITHUB_WORKSPACE/gradle-help.log" \
            "$DIAG/gradle-help.log"

          copy_if_exists \
            "$GITHUB_WORKSPACE/gradle-tasks.log" \
            "$DIAG/gradle-tasks.log"

          copy_if_exists \
            "$GITHUB_WORKSPACE/gradle-build.log" \
            "$DIAG/gradle-build.log"

          if [ -n "${PROJECT_DIR:-}" ] && \
             [ -d "$PROJECT_DIR" ]; then

            copy_if_exists \
              "$PROJECT_DIR/settings.gradle.kts" \
              "$DIAG/settings.gradle.kts"

            copy_if_exists \
              "$PROJECT_DIR/build.gradle.kts" \
              "$DIAG/root-build.gradle.kts"

            copy_if_exists \
              "$PROJECT_DIR/app/build.gradle.kts" \
              "$DIAG/app-build.gradle.kts"

            copy_if_exists \
              "$PROJECT_DIR/gradle/libs.versions.toml" \
              "$DIAG/libs.versions.toml"

            copy_if_exists \
              "$PROJECT_DIR/gradle.properties" \
              "$DIAG/gradle.properties"

            copy_if_exists \
              "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties" \
              "$DIAG/gradle-wrapper.properties"

            find "$PROJECT_DIR" \
              -maxdepth 12 \
              -type f \
              -print \
              | sort \
              > "$DIAG/project-tree.txt" \
              || true
          fi

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          {
            echo "============================================================"
            echo "BUILD ENVIRONMENT"
            echo "============================================================"

            echo "Repository: ${GITHUB_REPOSITORY:-unknown}"
            echo "Commit: ${GITHUB_SHA:-unknown}"
            echo "Run: ${GITHUB_RUN_ID:-unknown}"

            echo ""
            echo "Project:"
            echo "${PROJECT_DIR:-unknown}"

            echo ""
            echo "Java:"
            java -version 2>&1 || true

            echo ""
            echo "JAVA_HOME:"
            echo "${JAVA_HOME:-unknown}"

            echo ""
            echo "Gradle:"
            gradle --version 2>&1 || true

            echo ""
            echo "Android SDK:"
            echo "${SDK_ROOT:-unknown}"

            echo ""
            echo "Required Platform:"
            echo "${ANDROID_PLATFORM}"

            echo ""
            echo "Required Build Tools:"
            echo "${ANDROID_BUILD_TOOLS}"

            echo ""
            echo "Installed SDK packages:"

            if [ -n "$SDK_ROOT" ] && \
               command -v sdkmanager >/dev/null 2>&1
            then
              sdkmanager \
                --list_installed \
                2>&1 \
                || true
            fi

          } > "$DIAG/environment.txt"

          echo ""
          echo "Diagnostics collected."

      # ============================================================
      # 25 - UPLOAD DIAGNOSTICS
      # ============================================================
      - name: "25 - Upload diagnostics"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: TikTok-Downloader-Diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
