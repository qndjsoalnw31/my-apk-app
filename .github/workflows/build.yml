name: Build TikTok Downloader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "9.3.1"

  # Android 16 QPR2
  ANDROID_PLATFORM: "36.1"

  # Latest stable Build Tools 36.1
  ANDROID_BUILD_TOOLS: "36.1.0"

  GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

  # Direct Google SDK archives used only as fallback.
  ANDROID_PLATFORM_URL: "https://dl.google.com/android/repository/platform-36.1_r01.zip"
  ANDROID_BUILD_TOOLS_URL: "https://dl.google.com/android/repository/build-tools_r36.1_linux.zip"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:

      # ============================================================
      # 01 - CHECKOUT
      # ============================================================
      - name: "01 - Checkout repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # ============================================================
      # 02 - JAVA 17
      #
      # IMPORTANT:
      # DO NOT enable Gradle cache here.
      #
      # The actual Gradle project is inside the ZIP and has not been
      # extracted yet.
      # ============================================================
      - name: "02 - Setup Java 17"
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 03 - ANDROID SDK TOOLS
      #
      # Only install command-line tools here.
      # SDK platform/build-tools are installed later after the ZIP
      # has been inspected.
      # ============================================================
      - name: "03 - Setup Android SDK command line tools"
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # ============================================================
      # 04 - LOCATE ZIP
      # ============================================================
      - name: "04 - Locate TikTok Downloader ZIP"
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          if [ -f "$GITHUB_WORKSPACE/tiktok-downloader.zip" ]; then
            ZIP_FILE="$GITHUB_WORKSPACE/tiktok-downloader.zip"
          else
            ZIP_FILE="$({
              find "$GITHUB_WORKSPACE" \
                -type f \
                -iname '*.zip' \
                -not -path '*/.git/*' \
                -print \
                -quit \
                2>/dev/null || true
            })"
          fi

          if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "::error::No Android project ZIP was found."

            echo ""
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 8 \
              -type f \
              -print \
              | sort \
              || true

            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo ""
          echo "Selected ZIP:"
          ls -lh "$ZIP_FILE"

      # ============================================================
      # 05 - VALIDATE ZIP
      # ============================================================
      - name: "05 - Validate ZIP"
        shell: bash
        run: |
          set -euo pipefail

          echo "Testing ZIP integrity..."

          unzip -t "$ZIP_FILE"

          echo ""
          echo "ZIP integrity: OK"

      # ============================================================
      # 06 - EXTRACT PROJECT
      # ============================================================
      - name: "06 - Extract Android project"
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_ROOT="$GITHUB_WORKSPACE/android-project"

          rm -rf "$EXTRACT_ROOT"

          mkdir -p "$EXTRACT_ROOT"

          unzip -q "$ZIP_FILE" -d "$EXTRACT_ROOT"

          echo ""
          echo "Extracted project tree:"

          find "$EXTRACT_ROOT" \
            -maxdepth 12 \
            -print \
            | sort

      # ============================================================
      # 07 - FIND GRADLE ROOT
      # ============================================================
      - name: "07 - Locate Gradle project root"
        shell: bash
        run: |
          set -euo pipefail

          SEARCH_ROOT="$GITHUB_WORKSPACE/android-project"

          SETTINGS_FILE="$({
            find "$SEARCH_ROOT" \
              -type f \
              \( \
                -name 'settings.gradle.kts' \
                -o -name 'settings.gradle' \
              \) \
              -print \
              -quit \
              2>/dev/null || true
          })"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::No settings.gradle.kts or settings.gradle was found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$(realpath "$SETTINGS_FILE")")"

          if [ ! -f "$PROJECT_DIR/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/build.gradle" ]; then
            echo "::error::Root Gradle build file is missing."
            echo "PROJECT_DIR=$PROJECT_DIR"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::Android app module build file is missing."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Gradle project root:"
          echo "$PROJECT_DIR"

      # ============================================================
      # 08 - INSPECT ACTUAL PROJECT
      # ============================================================
      - name: "08 - Inspect project configuration"
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "============================================================"
          echo "PROJECT CONFIGURATION"
          echo "============================================================"

          echo ""
          echo "settings.gradle.kts:"
          cat settings.gradle.kts

          echo ""
          echo "root build.gradle.kts:"
          cat build.gradle.kts

          echo ""
          echo "app/build.gradle.kts:"
          cat app/build.gradle.kts

          echo ""
          echo "gradle/libs.versions.toml:"
          cat gradle/libs.versions.toml

          echo ""
          echo "gradle.properties:"
          cat gradle.properties

          echo ""
          echo "Gradle wrapper properties:"
          cat gradle/wrapper/gradle-wrapper.properties

      # ============================================================
      # 09 - VERIFY EXACT TOOLCHAIN
      # ============================================================
      - name: "09 - Verify expected toolchain"
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "============================================================"
          echo "EXPECTED TOOLCHAIN"
          echo "============================================================"

          AGP_VERSION="$({
            grep -E '^agp[[:space:]]*=' gradle/libs.versions.toml \
              | sed -E 's/.*=[[:space:]]*"([^"]+)".*/\1/' \
              | head -n 1 \
              || true
          })"

          KOTLIN_VERSION="$({
            grep -E '^kotlin[[:space:]]*=' gradle/libs.versions.toml \
              | sed -E 's/.*=[[:space:]]*"([^"]+)".*/\1/' \
              | head -n 1 \
              || true
          })"

          KSP_VERSION="$({
            grep -E '^googleDevtoolsKsp[[:space:]]*=' gradle/libs.versions.toml \
              | sed -E 's/.*=[[:space:]]*"([^"]+)".*/\1/' \
              | head -n 1 \
              || true
          })"

          echo "AGP     = ${AGP_VERSION:-unknown}"
          echo "Kotlin  = ${KOTLIN_VERSION:-unknown}"
          echo "KSP     = ${KSP_VERSION:-unknown}"
          echo "Gradle  = ${GRADLE_VERSION}"
          echo "Java    = ${JAVA_VERSION}"
          echo "SDK     = ${ANDROID_PLATFORM}"
          echo "Tools   = ${ANDROID_BUILD_TOOLS}"

      # ============================================================
      # 10 - CONFIGURE CI TOOLCHAIN
      #
      # KSP 2.3.5 has a known CI error fixed in KSP 2.3.6.
      # Patch only the extracted CI copy.
      #
      # This does NOT modify the original ZIP in the repository.
      # ============================================================
      - name: "10 - Apply CI compatibility fixes"
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "============================================================"
          echo "CI COMPATIBILITY FIXES"
          echo "============================================================"

          VERSION_FILE="gradle/libs.versions.toml"

          if grep -q \
            'googleDevtoolsKsp = "2\.3\.5"' \
            "$VERSION_FILE"
          then
            echo "KSP 2.3.5 detected."
            echo "Updating CI copy to KSP 2.3.6."

            sed -i \
              's/googleDevtoolsKsp = "2\.3\.5"/googleDevtoolsKsp = "2.3.6"/' \
              "$VERSION_FILE"
          fi

          # CI should not depend on a previous configuration cache.
          if grep -q '^org\.gradle\.configuration-cache=' gradle.properties; then
            sed -i \
              's/^org\.gradle\.configuration-cache=.*/org.gradle.configuration-cache=false/' \
              gradle.properties
          else
            printf '\norg.gradle.configuration-cache=false\n' \
              >> gradle.properties
          fi

          # Ensure CI memory settings are present.
          if grep -q '^org\.gradle\.jvmargs=' gradle.properties; then
            sed -i \
              "s#^org\\.gradle\\.jvmargs=.*#org.gradle.jvmargs=${GRADLE_OPTS}#" \
              gradle.properties
          else
            printf '\norg.gradle.jvmargs=%s\n' "$GRADLE_OPTS" \
              >> gradle.properties
          fi

          echo ""
          echo "KSP:"
          grep -n 'googleDevtoolsKsp' "$VERSION_FILE" || true

          echo ""
          echo "Configuration cache:"
          grep -n 'org.gradle.configuration-cache' gradle.properties || true

          echo ""
          echo "Gradle JVM:"
          grep -n 'org.gradle.jvmargs' gradle.properties || true

      # ============================================================
      # 11 - SDK ROOT + SDKMANAGER
      # ============================================================
      - name: "11 - Locate Android SDK manager"
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "::error::ANDROID_SDK_ROOT / ANDROID_HOME is empty."
            exit 1
          fi

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ] && \
             [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$({
              find "$SDK_ROOT/cmdline-tools" \
                -type f \
                -name sdkmanager \
                -print \
                -quit \
                2>/dev/null || true
            })"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager executable not found."
            exit 1
          fi

          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo ""
          echo "SDK_ROOT=$SDK_ROOT"
          echo "SDKMANAGER=$SDKMANAGER"

          echo ""
          echo "sdkmanager version:"
          "$SDKMANAGER" --version || true

      # ============================================================
      # 12 - ACCEPT LICENSES
      # ============================================================
      - name: "12 - Accept Android SDK licenses"
        shell: bash
        run: |
          set -uo pipefail

          echo "Accepting Android SDK licenses..."

          yes | timeout 180 \
            "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --licenses \
            > "$GITHUB_WORKSPACE/sdk-licenses.log" \
            2>&1

          RC=$?

          if [ "$RC" -ne 0 ]; then
            echo "License command returned $RC."
            tail -n 100 "$GITHUB_WORKSPACE/sdk-licenses.log" || true
            echo "Continuing because setup-android already accepted the licenses."
          else
            echo "Android licenses accepted."
          fi

      # ============================================================
      # 13 - INSTALL PLATFORM 36.1 + BUILD TOOLS
      #
      # Primary:
      #   sdkmanager
      #
      # Fallback:
      #   Direct download from Google's official repository.
      #
      # This is the important fix for Run 36052270695.
      # ============================================================
      - name: "13 - Install Android 36.1 SDK with fallback"
        shell: bash
        run: |
          set -uo pipefail

          DIAG="$GITHUB_WORKSPACE/sdk-diagnostics"

          rm -rf "$DIAG"
          mkdir -p "$DIAG"

          echo "============================================================"
          echo "ANDROID SDK INSTALLATION"
          echo "============================================================"

          echo ""
          echo "SDK root:"
          echo "$SDK_ROOT"

          echo ""
          echo "Requested:"
          echo "  Platform:     $ANDROID_PLATFORM"
          echo "  Build Tools:  $ANDROID_BUILD_TOOLS"

          # --------------------------------------------------------
          # Helper: verify platform
          # --------------------------------------------------------
          platform_ok() {
            [ -f \
              "$SDK_ROOT/platforms/android-${ANDROID_PLATFORM}/android.jar" \
            ]
          }

          # --------------------------------------------------------
          # Helper: verify build tools
          # --------------------------------------------------------
          build_tools_ok() {
            [ -x \
              "$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}/aapt2" \
            ] || \
            [ -x \
              "$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}/aapt" \
            ]
          }

          # --------------------------------------------------------
          # PLATFORM
          # --------------------------------------------------------
          echo ""
          echo "============================================================"
          echo "PLATFORM 36.1"
          echo "============================================================"

          if platform_ok; then
            echo "Platform 36.1 already exists."
          else

            echo "Trying sdkmanager..."

            set +e

            timeout 1200 \
              "$SDKMANAGER" \
              --sdk_root="$SDK_ROOT" \
              --channel=0 \
              "platforms;android-${ANDROID_PLATFORM}" \
              > "$DIAG/platform-sdkmanager.log" \
              2>&1

            PLATFORM_RC=$?

            set -e

            if [ "$PLATFORM_RC" -eq 0 ] && platform_ok; then

              echo "Platform 36.1 installed successfully through sdkmanager."

            else

              echo ""
              echo "sdkmanager could not provide a verified Platform 36.1."
              echo "Using direct Google archive fallback."

              tail -n 120 \
                "$DIAG/platform-sdkmanager.log" \
                || true

              TEMP_DIR="$RUNNER_TEMP/android-platform-36.1"

              rm -rf "$TEMP_DIR"

              mkdir -p "$TEMP_DIR"

              PLATFORM_ZIP="$TEMP_DIR/platform-36.1_r01.zip"

              echo ""
              echo "Downloading:"
              echo "$ANDROID_PLATFORM_URL"

              curl \
                --fail \
                --show-error \
                --location \
                --retry 6 \
                --retry-delay 5 \
                --connect-timeout 30 \
                --max-time 1200 \
                "$ANDROID_PLATFORM_URL" \
                --output "$PLATFORM_ZIP"

              echo ""
              echo "Downloaded platform archive:"
              ls -lh "$PLATFORM_ZIP"

              echo ""
              echo "Testing archive:"
              unzip -t "$PLATFORM_ZIP" > "$DIAG/platform-unzip-test.log"

              PLATFORM_SHA1="$({
                sha1sum "$PLATFORM_ZIP" \
                  | awk '{print $1}'
              })"

              EXPECTED_PLATFORM_SHA1="f87dc23b7ddba6934908da6cfb58fd5b258077ce"

              echo "Platform SHA1:"
              echo "$PLATFORM_SHA1"

              echo "Expected SHA1:"
              echo "$EXPECTED_PLATFORM_SHA1"

              if [ "$PLATFORM_SHA1" != "$EXPECTED_PLATFORM_SHA1" ]; then
                echo "::error::Platform 36.1 archive checksum mismatch."
                exit 1
              fi

              EXTRACT_DIR="$TEMP_DIR/extracted"

              rm -rf "$EXTRACT_DIR"

              mkdir -p "$EXTRACT_DIR"

              unzip -q \
                "$PLATFORM_ZIP" \
                -d "$EXTRACT_DIR"

              PLATFORM_SOURCE="$({
                find "$EXTRACT_DIR" \
                  -type f \
                  -name android.jar \
                  -print \
                  -quit \
                  2>/dev/null || true
              })"

              if [ -z "$PLATFORM_SOURCE" ]; then
                echo "::error::android.jar was not found in the downloaded Platform 36.1 archive."
                find "$EXTRACT_DIR" -maxdepth 5 -print || true
                exit 1
              fi

              PLATFORM_SOURCE_DIR="$(dirname "$PLATFORM_SOURCE")"

              PLATFORM_DEST="$SDK_ROOT/platforms/android-${ANDROID_PLATFORM}"

              rm -rf "$PLATFORM_DEST"

              mkdir -p "$PLATFORM_DEST"

              cp -a \
                "$PLATFORM_SOURCE_DIR"/. \
                "$PLATFORM_DEST"/

              if ! platform_ok; then
                echo "::error::Platform 36.1 direct installation failed."
                exit 1
              fi

              echo "Platform 36.1 direct installation successful."
            fi
          fi

          # --------------------------------------------------------
          # BUILD TOOLS
          # --------------------------------------------------------
          echo ""
          echo "============================================================"
          echo "BUILD TOOLS 36.1.0"
          echo "============================================================"

          if build_tools_ok; then
            echo "Build Tools 36.1.0 already exists."
          else

            echo "Trying sdkmanager..."

            set +e

            timeout 1200 \
              "$SDKMANAGER" \
              --sdk_root="$SDK_ROOT" \
              --channel=0 \
              "build-tools;${ANDROID_BUILD_TOOLS}" \
              > "$DIAG/build-tools-sdkmanager.log" \
              2>&1

            BUILD_TOOLS_RC=$?

            set -e

            if [ "$BUILD_TOOLS_RC" -eq 0 ] && build_tools_ok; then

              echo "Build Tools 36.1.0 installed through sdkmanager."

            else

              echo ""
              echo "sdkmanager could not provide verified Build Tools 36.1.0."
              echo "Using direct Google archive fallback."

              tail -n 120 \
                "$DIAG/build-tools-sdkmanager.log" \
                || true

              TEMP_DIR="$RUNNER_TEMP/android-build-tools-36.1"

              rm -rf "$TEMP_DIR"

              mkdir -p "$TEMP_DIR"

              BUILD_TOOLS_ZIP="$TEMP_DIR/build-tools_r36.1_linux.zip"

              echo ""
              echo "Downloading:"
              echo "$ANDROID_BUILD_TOOLS_URL"

              curl \
                --fail \
                --show-error \
                --location \
                --retry 6 \
                --retry-delay 5 \
                --connect-timeout 30 \
                --max-time 1200 \
                "$ANDROID_BUILD_TOOLS_URL" \
                --output "$BUILD_TOOLS_ZIP"

              echo ""
              echo "Downloaded build tools archive:"
              ls -lh "$BUILD_TOOLS_ZIP"

              echo ""
              echo "Testing archive:"
              unzip -t "$BUILD_TOOLS_ZIP" \
                > "$DIAG/build-tools-unzip-test.log"

              EXTRACT_DIR="$TEMP_DIR/extracted"

              rm -rf "$EXTRACT_DIR"

              mkdir -p "$EXTRACT_DIR"

              unzip -q \
                "$BUILD_TOOLS_ZIP" \
                -d "$EXTRACT_DIR"

              BUILD_TOOL_BINARY="$({
                find "$EXTRACT_DIR" \
                  -type f \
                  \( \
                    -name aapt2 \
                    -o -name aapt \
                  \) \
                  -print \
                  -quit \
                  2>/dev/null || true
              })"

              if [ -z "$BUILD_TOOL_BINARY" ]; then
                echo "::error::aapt/aapt2 not found in Build Tools archive."
                find "$EXTRACT_DIR" \
                  -maxdepth 6 \
                  -print \
                  | sort \
                  | tail -n 300 \
                  || true
                exit 1
              fi

              BUILD_TOOLS_SOURCE_DIR="$(dirname "$BUILD_TOOL_BINARY")"

              BUILD_TOOLS_DEST="$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}"

              rm -rf "$BUILD_TOOLS_DEST"

              mkdir -p "$BUILD_TOOLS_DEST"

              cp -a \
                "$BUILD_TOOLS_SOURCE_DIR"/. \
                "$BUILD_TOOLS_DEST"/

              chmod +x \
                "$BUILD_TOOLS_DEST"/* \
                2>/dev/null || true

              if ! build_tools_ok; then
                echo "::error::Build Tools 36.1.0 direct installation failed."
                exit 1
              fi

              echo "Build Tools 36.1.0 direct installation successful."
            fi
          fi

          # --------------------------------------------------------
          # PLATFORM TOOLS
          # --------------------------------------------------------
          if [ ! -x "$SDK_ROOT/platform-tools/adb" ]; then

            echo ""
            echo "Installing platform-tools..."

            set +e

            timeout 600 \
              "$SDKMANAGER" \
              --sdk_root="$SDK_ROOT" \
              "platform-tools" \
              > "$DIAG/platform-tools.log" \
              2>&1

            PLATFORM_TOOLS_RC=$?

            set -e

            if [ "$PLATFORM_TOOLS_RC" -ne 0 ] || \
               [ ! -x "$SDK_ROOT/platform-tools/adb" ]
            then

              echo "::error::platform-tools could not be installed."

              tail -n 120 \
                "$DIAG/platform-tools.log" \
                2>/dev/null \
                || true

              exit 1
            fi
          fi

          # --------------------------------------------------------
          # FINAL VERIFICATION
          # --------------------------------------------------------
          echo ""
          echo "============================================================"
          echo "FINAL SDK VERIFICATION"
          echo "============================================================"

          echo ""
          echo "Platform:"
          test -f \
            "$SDK_ROOT/platforms/android-${ANDROID_PLATFORM}/android.jar"

          echo "OK: Platform 36.1"

          echo ""
          echo "Build Tools:"
          test -x \
            "$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}/aapt2" \
            || \
          test -x \
            "$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}/aapt"

          echo "OK: Build Tools 36.1.0"

          echo ""
          echo "Platform Tools:"
          test -x \
            "$SDK_ROOT/platform-tools/adb"

          echo "OK: platform-tools"

          echo ""
          echo "SDK installation completed successfully."

      # ============================================================
      # 14 - CONFIGURE LOCAL.PROPERTIES
      # ============================================================
      - name: "14 - Configure Android SDK path"
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          printf 'sdk.dir=%s\n' "$SDK_ROOT" > local.properties

          echo "local.properties:"
          cat local.properties

      # ============================================================
      # 15 - CREATE DEBUG KEYSTORE
      # ============================================================
      - name: "15 - Generate debug keystore"
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          DEBUG_KEYSTORE="$PROJECT_DIR/debug.keystore"

          if [ -f "$DEBUG_KEYSTORE" ]; then

            echo "debug.keystore already exists."

          else

            echo "Creating debug.keystore..."

            keytool \
              -genkeypair \
              -v \
              -keystore "$DEBUG_KEYSTORE" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

          fi

          test -f "$DEBUG_KEYSTORE"

          keytool \
            -list \
            -keystore "$DEBUG_KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            >/dev/null

          echo "debug.keystore verified."

      # ============================================================
      # 16 - SETUP GRADLE
      #
      # This is intentionally AFTER ZIP extraction.
      # ============================================================
      - name: "16 - Setup Gradle 9.3.1"
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"
          cache-read-only: false
          validate-wrappers: false
          add-job-summary: on-failure

      # ============================================================
      # 17 - VERIFY JAVA / GRADLE / SDK
      # ============================================================
      - name: "17 - Verify complete build environment"
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "============================================================"
          echo "JAVA"
          echo "============================================================"

          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo ""
          echo "============================================================"
          echo "GRADLE"
          echo "============================================================"

          gradle --version

          echo ""
          echo "============================================================"
          echo "ANDROID SDK"
          echo "============================================================"

          echo "SDK_ROOT=$SDK_ROOT"

          echo ""
          echo "android.jar:"
          ls -lh \
            "$SDK_ROOT/platforms/android-${ANDROID_PLATFORM}/android.jar"

          echo ""
          echo "aapt2:"
          ls -lh \
            "$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}/aapt2"

          echo ""
          echo "adb:"
          ls -lh \
            "$SDK_ROOT/platform-tools/adb"

      # ============================================================
      # 18 - GRADLE CONFIGURATION CHECK
      # ============================================================
      - name: "18 - Validate Gradle configuration"
        shell: bash
        run: |
          set -uo pipefail

          cd "$PROJECT_DIR"

          LOG="$GITHUB_WORKSPACE/gradle-help.log"

          rm -f "$LOG"

          echo "============================================================"
          echo "GRADLE CONFIGURATION"
          echo "============================================================"

          set +e

          gradle \
            help \
            --no-daemon \
            --stacktrace \
            --console=plain \
            --warning-mode=all \
            --no-configuration-cache \
            2>&1 | tee "$LOG"

          RC=${PIPESTATUS[0]}

          set -e

          if [ "$RC" -ne 0 ]; then

            echo ""
            echo "============================================================"
            echo "GRADLE CONFIGURATION FAILED"
            echo "============================================================"

            echo ""
            echo "Relevant errors:"
            grep -n -E \
              'FAILURE:|ERROR|error:|Exception|Caused by:|KSP|Room|Moshi|Plugin|Gradle|Android Gradle|Kotlin' \
              "$LOG" \
              | tail -n 300 \
              || true

            echo ""
            echo "Last 400 lines:"
            tail -n 400 "$LOG"

            exit "$RC"
          fi

          echo ""
          echo "Gradle configuration is valid."

      # ============================================================
      # 19 - VERIFY APP TASKS
      # ============================================================
      - name: "19 - Verify Android application tasks"
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle \
            :app:tasks \
            --all \
            --no-daemon \
            --stacktrace \
            --console=plain \
            --warning-mode=all \
            --no-configuration-cache \
            2>&1 | tee "$GITHUB_WORKSPACE/gradle-tasks.log"

      # ============================================================
      # 20 - BUILD DEBUG APK
      # ============================================================
      - name: "20 - Build Debug APK"
        shell: bash
        run: |
          set -uo pipefail

          cd "$PROJECT_DIR"

          LOG="$GITHUB_WORKSPACE/gradle-build.log"

          rm -f "$LOG"

          echo "============================================================"
          echo "BUILD DEBUG APK"
          echo "============================================================"

          echo ""
          echo "Project:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Gradle:"
          gradle --version || true

          echo ""
          echo "Java:"
          java -version 2>&1 || true

          echo ""
          echo "SDK:"
          echo "$SDK_ROOT"

          set +e

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain \
            --warning-mode=all \
            --no-configuration-cache \
            --rerun-tasks \
            --no-build-cache \
            2>&1 | tee "$LOG"

          RC=${PIPESTATUS[0]}

          set -e

          if [ "$RC" -ne 0 ]; then

            echo ""
            echo "============================================================"
            echo "APK BUILD FAILED"
            echo "============================================================"

            echo ""
            echo "---------------- KSP ----------------"

            grep -n -E \
              'KSP|ksp|symbol-processing|ApplicationManager' \
              "$LOG" \
              | tail -n 250 \
              || true

            echo ""
            echo "---------------- SDK / AAPT ----------------"

            grep -n -E \
              'compileSdk|36\.1|android\.jar|AAPT|aapt2|resource .* not found|Manifest merger|SDK' \
              "$LOG" \
              | tail -n 250 \
              || true

            echo ""
            echo "---------------- Kotlin / Java ----------------"

            grep -n -E \
              'Kotlin|KotlinCompile|jvmTarget|JVM target|Unsupported class file|Inconsistent JVM|Java|OutOfMemory|Metaspace' \
              "$LOG" \
              | tail -n 250 \
              || true

            echo ""
            echo "---------------- Dependencies ----------------"

            grep -n -E \
              'Could not resolve|Could not find|Could not download|TLS|SSL|PKIX|timeout|timed out|Connection reset|Connection refused|UnknownHost' \
              "$LOG" \
              | tail -n 250 \
              || true

            echo ""
            echo "---------------- Gradle ----------------"

            grep -n -E \
              'FAILURE:|Execution failed for task|Task .* FAILED|Exception|Caused by:|error:' \
              "$LOG" \
              | tail -n 350 \
              || true

            echo ""
            echo "---------------- LAST 500 LINES ----------------"

            tail -n 500 "$LOG"

            exit "$RC"
          fi

          echo ""
          echo "============================================================"
          echo "BUILD SUCCESSFUL"
          echo "============================================================"

      # ============================================================
      # 21 - FIND APK
      # ============================================================
      - name: "21 - Locate generated APK"
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          OUTPUT_DIR="$GITHUB_WORKSPACE/apk-output"

          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"

          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "Expected APK:"
          echo "$EXPECTED_APK"

          if [ ! -f "$EXPECTED_APK" ]; then

            echo "::error::Expected APK does not exist."

            echo ""
            echo "All APK files found:"

            find . \
              -type f \
              -name '*.apk' \
              -path '*/build/outputs/*' \
              -print \
              | sort \
              || true

            exit 1
          fi

          cp \
            "$EXPECTED_APK" \
            "$OUTPUT_DIR/TikTok-Downloader-debug.apk"

          echo ""
          echo "APK:"
          ls -lh \
            "$OUTPUT_DIR/TikTok-Downloader-debug.apk"

      # ============================================================
      # 22 - INSPECT APK
      # ============================================================
      - name: "22 - Inspect generated APK"
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/apk-output/TikTok-Downloader-debug.apk"

          test -f "$APK"

          echo "============================================================"
          echo "APK INFORMATION"
          echo "============================================================"

          echo ""
          echo "File:"
          file "$APK"

          echo ""
          echo "Size:"
          ls -lh "$APK"

          echo ""
          echo "SHA256:"
          sha256sum "$APK"

          echo ""
          echo "APK summary:"
          apkanalyzer apk summary "$APK" || true

      # ============================================================
      # 23 - UPLOAD APK
      # ============================================================
      - name: "23 - Upload APK"
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: TikTok-Downloader-APK
          path: apk-output/TikTok-Downloader-debug.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # ============================================================
      # 24 - COLLECT DIAGNOSTICS
      # ============================================================
      - name: "24 - Collect diagnostics"
        if: always()
        shell: bash
        run: |
          set +e

          DIAG="$GITHUB_WORKSPACE/diagnostics"

          rm -rf "$DIAG"
          mkdir -p "$DIAG"

          copy_if_exists() {
            local SRC="$1"
            local DST="$2"

            if [ -f "$SRC" ]; then
              cp "$SRC" "$DST" || true
            fi
          }

          copy_if_exists \
            "$GITHUB_WORKSPACE/gradle-help.log" \
            "$DIAG/gradle-help.log"

          copy_if_exists \
            "$GITHUB_WORKSPACE/gradle-tasks.log" \
            "$DIAG/gradle-tasks.log"

          copy_if_exists \
            "$GITHUB_WORKSPACE/gradle-build.log" \
            "$DIAG/gradle-build.log"

          copy_if_exists \
            "$GITHUB_WORKSPACE/sdk-licenses.log" \
            "$DIAG/sdk-licenses.log"

          if [ -d "$GITHUB_WORKSPACE/sdk-diagnostics" ]; then
            cp -R \
              "$GITHUB_WORKSPACE/sdk-diagnostics" \
              "$DIAG/sdk-diagnostics" \
              || true
          fi

          if [ -n "${PROJECT_DIR:-}" ] && \
             [ -d "$PROJECT_DIR" ]; then

            copy_if_exists \
              "$PROJECT_DIR/settings.gradle.kts" \
              "$DIAG/settings.gradle.kts"

            copy_if_exists \
              "$PROJECT_DIR/build.gradle.kts" \
              "$DIAG/root-build.gradle.kts"

            copy_if_exists \
              "$PROJECT_DIR/app/build.gradle.kts" \
              "$DIAG/app-build.gradle.kts"

            copy_if_exists \
              "$PROJECT_DIR/gradle/libs.versions.toml" \
              "$DIAG/libs.versions.toml"

            copy_if_exists \
              "$PROJECT_DIR/gradle.properties" \
              "$DIAG/gradle.properties"

            copy_if_exists \
              "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties" \
              "$DIAG/gradle-wrapper.properties"

            copy_if_exists \
              "$PROJECT_DIR/local.properties" \
              "$DIAG/local.properties"

            find "$PROJECT_DIR" \
              -maxdepth 12 \
              -type f \
              -print \
              | sort \
              > "$DIAG/project-tree.txt" \
              || true
          fi

          SDK_ROOT_SAFE="${SDK_ROOT:-}"

          {
            echo "============================================================"
            echo "BUILD ENVIRONMENT"
            echo "============================================================"

            echo "Repository: ${GITHUB_REPOSITORY:-unknown}"
            echo "Commit: ${GITHUB_SHA:-unknown}"
            echo "Run: ${GITHUB_RUN_ID:-unknown}"

            echo ""
            echo "Project:"
            echo "${PROJECT_DIR:-unknown}"

            echo ""
            echo "Java:"
            java -version 2>&1 || true

            echo ""
            echo "JAVA_HOME:"
            echo "${JAVA_HOME:-unknown}"

            echo ""
            echo "Gradle:"
            gradle --version 2>&1 || true

            echo ""
            echo "Android SDK:"
            echo "${SDK_ROOT_SAFE:-unknown}"

            echo ""
            echo "Required platform:"
            echo "${ANDROID_PLATFORM}"

            echo ""
            echo "Required build tools:"
            echo "${ANDROID_BUILD_TOOLS}"

            echo ""
            echo "Installed SDK packages:"
            if [ -n "$SDK_ROOT_SAFE" ] && \
               [ -x "$SDKMANAGER" ]; then

              "$SDKMANAGER" \
                --sdk_root="$SDK_ROOT_SAFE" \
                --list_installed \
                2>&1 \
                || true
            fi

          } > "$DIAG/environment.txt"

          echo "Diagnostics collected."

      # ============================================================
      # 25 - UPLOAD DIAGNOSTICS
      # ============================================================
      - name: "25 - Upload diagnostics"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: TikTok-Downloader-Diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
