name: Build TikTok Downloader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # =========================================================
      # 2. JAVA 17
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # 3. ANDROID SDK
      # =========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # =========================================================
      # 4. FIND ZIP
      # =========================================================

      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          if [ -f "tiktok-downloader.zip" ]; then
            ZIP_FILE="tiktok-downloader.zip"
          else
            ZIP_FILE="$(
              find . \
                -type f \
                -iname "*.zip" \
                -not -path "./.git/*" \
                | head -n 1
            )"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP project found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "ZIP:"
          echo "$ZIP_FILE"


      # =========================================================
      # 5. EXTRACT
      # =========================================================

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/project"

          mkdir -p "$GITHUB_WORKSPACE/project"

          unzip -q \
            "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/project"

          echo "Project extracted."


      # =========================================================
      # 6. LOCATE PROJECT
      # =========================================================

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          ROOT="$GITHUB_WORKSPACE/project"
          PROJECT_DIR=""

          # First priority:
          # settings.gradle + app/
          while IFS= read -r SETTINGS; do

            CANDIDATE="$(dirname "$SETTINGS")"

            if [ -d "$CANDIDATE/app" ]; then
              PROJECT_DIR="$CANDIDATE"
              break
            fi

          done < <(
            find "$ROOT" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -not -path "*/build/*" \
              | sort
          )


          # Second priority:
          # any settings.gradle
          if [ -z "$PROJECT_DIR" ]; then

            SETTINGS="$(
              find "$ROOT" \
                -type f \
                \( \
                  -name "settings.gradle" \
                  -o \
                  -name "settings.gradle.kts" \
                \) \
                -not -path "*/build/*" \
                | head -n 1
            )"

            if [ -n "$SETTINGS" ]; then
              PROJECT_DIR="$(dirname "$SETTINGS")"
            fi

          fi


          # Third priority:
          # gradlew
          if [ -z "$PROJECT_DIR" ]; then

            GRADLEW="$(
              find "$ROOT" \
                -type f \
                -name "gradlew" \
                -not -path "*/build/*" \
                | head -n 1
            )"

            if [ -n "$GRADLEW" ]; then
              PROJECT_DIR="$(dirname "$GRADLEW")"
            fi

          fi


          if [ -z "$PROJECT_DIR" ]; then

            echo "ERROR: Android project was not found."

            find "$ROOT" -maxdepth 10 -print | sort

            exit 1

          fi


          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "PROJECT:"
          echo "$PROJECT_DIR"


      # =========================================================
      # 7. INSPECT PROJECT
      # =========================================================

      - name: Inspect project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "ANDROID PROJECT"
          echo "========================================"

          pwd

          echo ""
          echo "ROOT:"
          ls -la

          echo ""
          echo "GRADLE FILES:"

          find . \
            -maxdepth 5 \
            -type f \
            \( \
              -name "*.gradle" \
              -o \
              -name "*.gradle.kts" \
              -o \
              -name "gradle-wrapper.properties" \
              -o \
              -name "gradlew" \
            \) \
            -print \
            | sort


      # =========================================================
      # 8. DETECT APP MODULE
      # =========================================================

      - name: Detect app module
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APP_DIR=""

          if [ -d "app" ]; then

            APP_DIR="$PROJECT_DIR/app"

          else

            MANIFEST="$(
              find . \
                -type f \
                -path "*/src/main/AndroidManifest.xml" \
                | head -n 1
            )"

            if [ -n "$MANIFEST" ]; then

              APP_DIR="$(
                realpath \
                "$(dirname \
                "$(dirname \
                "$(dirname "$MANIFEST")")")"
              )"

            fi

          fi


          if [ -z "$APP_DIR" ]; then

            echo "ERROR: app module not found."

            find . -maxdepth 8 -type d | sort

            exit 1

          fi


          APP_DIR="$(realpath "$APP_DIR")"

          RELATIVE_APP="${APP_DIR#$PROJECT_DIR/}"

          if [ "$RELATIVE_APP" = "$APP_DIR" ]; then
            RELATIVE_APP="app"
          fi


          GRADLE_TASK=":${RELATIVE_APP//\//:}:assembleDebug"


          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "GRADLE_TASK=$GRADLE_TASK" >> "$GITHUB_ENV"


          echo ""
          echo "APP:"
          echo "$APP_DIR"

          echo ""
          echo "TASK:"
          echo "$GRADLE_TASK"


      # =========================================================
      # 9. DETECT GRADLE WRAPPER
      # =========================================================

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then

            chmod +x ./gradlew

            echo "USE_WRAPPER=true" >> "$GITHUB_ENV"

            echo "Existing Gradle Wrapper found."

          else

            echo "USE_WRAPPER=false" >> "$GITHUB_ENV"

            echo "No Gradle Wrapper found."

          fi


      # =========================================================
      # 10. DETECT AGP
      # =========================================================

      - name: Detect Android Gradle Plugin
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          AGP=""

          # plugins block
          AGP="$(
            grep -RhoE \
              'com\.android\.application[^0-9]{0,100}[0-9]+\.[0-9]+\.[0-9]+' \
              . \
              --include="*.gradle" \
              --include="*.gradle.kts" \
              2>/dev/null \
              | grep -oE \
                '[0-9]+\.[0-9]+\.[0-9]+' \
              | head -n 1 \
              || true
          )"


          # buildscript
          if [ -z "$AGP" ]; then

            AGP="$(
              grep -RhoE \
                'com\.android\.tools\.build:gradle:[0-9]+\.[0-9]+\.[0-9]+' \
                . \
                --include="*.gradle" \
                --include="*.gradle.kts" \
                2>/dev/null \
                | grep -oE \
                  '[0-9]+\.[0-9]+\.[0-9]+' \
                | head -n 1 \
                || true
            )"

          fi


          echo "AGP_VERSION=$AGP" >> "$GITHUB_ENV"

          echo ""
          echo "AGP:"
          echo "${AGP:-not detected}"


      # =========================================================
      # 11. SETUP GRADLE ONLY IF NO WRAPPER
      # =========================================================

      - name: Setup Gradle
        if: env.USE_WRAPPER == 'false'
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"
          cache-disabled: true


      # =========================================================
      # 12. VERIFY GRADLE
      # =========================================================

      - name: Verify Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ "$USE_WRAPPER" = "true" ]; then

            ./gradlew --version

          else

            gradle --version

          fi


      # =========================================================
      # 13. SHOW AVAILABLE TASKS
      # =========================================================

      - name: Inspect Gradle tasks
        shell: bash
        run: |
          set +e

          cd "$PROJECT_DIR"

          if [ "$USE_WRAPPER" = "true" ]; then

            ./gradlew tasks \
              --no-daemon \
              --console=plain

          else

            gradle tasks \
              --no-daemon \
              --console=plain

          fi

          EXIT_CODE=$?

          echo ""
          echo "Gradle task inspection exit code: $EXIT_CODE"

          exit 0


      # =========================================================
      # 14. CLEAN
      # =========================================================

      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ "$USE_WRAPPER" = "true" ]; then

            ./gradlew clean \
              --no-daemon \
              --stacktrace \
              --console=plain

          else

            gradle clean \
              --no-daemon \
              --stacktrace \
              --console=plain

          fi


      # =========================================================
      # 15. BUILD APP MODULE
      # =========================================================

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "BUILDING APK"
          echo "========================================"

          echo ""
          echo "Project:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Module:"
          echo "$APP_DIR"

          echo ""
          echo "Gradle task:"
          echo "$GRADLE_TASK"

          echo ""
          echo "AGP:"
          echo "${AGP_VERSION:-unknown}"

          echo ""
          echo "Java:"
          java -version

          echo ""


          if [ "$USE_WRAPPER" = "true" ]; then

            ./gradlew \
              "$GRADLE_TASK" \
              --no-daemon \
              --stacktrace \
              --info \
              --console=plain \
              2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

          else

            gradle \
              "$GRADLE_TASK" \
              --no-daemon \
              --stacktrace \
              --info \
              --console=plain \
              2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

          fi


      # =========================================================
      # 16. FIND APK
      # =========================================================

      - name: Find generated APK
        if: success()
        shell: bash
        run: |
          set -e

          OUTPUT="$GITHUB_WORKSPACE/apk-output"

          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT"


          APK="$(
            find "$APP_DIR" \
              -type f \
              -name "*.apk" \
              -path "*/build/outputs/*" \
              | sort \
              | head -n 1
          )"


          if [ -z "$APK" ]; then

            echo "ERROR: APK was not generated."

            echo ""
            echo "Available build outputs:"

            find "$PROJECT_DIR" \
              -path "*/build/outputs/*" \
              -print \
              | sort

            exit 1

          fi


          echo "APK:"
          echo "$APK"


          cp "$APK" \
            "$OUTPUT/TikTok-Downloader-debug.apk"


          sha256sum \
            "$OUTPUT/TikTok-Downloader-debug.apk" \
            > "$OUTPUT/SHA256SUMS.txt"


          echo ""
          echo "APK READY"

          ls -lh "$OUTPUT"


      # =========================================================
      # 17. UPLOAD APK
      # =========================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-Downloader-APK
          path: |
            apk-output/TikTok-Downloader-debug.apk
            apk-output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30


      # =========================================================
      # 18. ALWAYS UPLOAD LOG
      # =========================================================

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-Downloader-Build-Log
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7
