name: Build Substack Downloader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v5

      # =========================================================
      # 2. JDK 17
      # =========================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # 3. ANDROID SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # =========================================================
      # 4. ACCEPT SDK LICENSES
      # =========================================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      # =========================================================
      # 5. INSTALL SDK COMPONENTS
      # =========================================================
      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      # =========================================================
      # 6. EXTRACT ZIP
      # =========================================================
      - name: Extract Substack Downloader ZIP
        shell: bash
        run: |
          set -e

          if [ -d "extracted" ]; then
            echo "extracted/ already exists."
          else

            ZIP_FILE=""

            if [ -f "substack-downloader.zip" ]; then
              ZIP_FILE="substack-downloader.zip"
            else
              ZIP_FILE="$(
                find . \
                  -maxdepth 2 \
                  -type f \
                  -name '*.zip' \
                  | head -n 1 \
                  || true
              )"
            fi

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No ZIP file found."
              exit 1
            fi

            echo "ZIP:"
            echo "$ZIP_FILE"

            mkdir -p extracted

            unzip -o "$ZIP_FILE" -d extracted
          fi

      # =========================================================
      # 7. FIND ANDROID PROJECT
      # =========================================================
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          if [ -f "extracted/settings.gradle.kts" ] || \
             [ -f "extracted/settings.gradle" ]; then

            PROJECT_DIR="$(realpath extracted)"

          elif [ -f "settings.gradle.kts" ] || \
               [ -f "settings.gradle" ]; then

            PROJECT_DIR="$PWD"

          else

            SETTINGS_FILE="$(
              find . \
                -type f \
                \( \
                  -name 'settings.gradle.kts' \
                  -o \
                  -name 'settings.gradle' \
                \) \
                -not -path './.git/*' \
                | head -n 1 \
                || true
            )"

            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_DIR="$(
                realpath "$(dirname "$SETTINGS_FILE")"
              )"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."

            echo
            echo "Repository contents:"

            find . \
              -maxdepth 6 \
              -type f \
              -not -path './.git/*' \
              | sort

            exit 1
          fi

          echo "=============================================="
          echo "ANDROID PROJECT"
          echo "=============================================="

          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # =========================================================
      # 8. REMOVE GOOGLE SERVICES COMPLETELY
      # =========================================================
      - name: Remove Google Services completely
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo "REMOVING GOOGLE SERVICES"
          echo "=============================================="

          export PROJECT_DIR

          python3 <<'PY'
          from pathlib import Path
          import re
          import os

          root = Path(os.environ["PROJECT_DIR"])

          gradle_files = []

          for pattern in (
              "**/build.gradle",
              "**/build.gradle.kts",
              "**/settings.gradle",
              "**/settings.gradle.kts",
              "**/libs.versions.toml",
          ):
              gradle_files.extend(root.glob(pattern))

          gradle_files = sorted(set(gradle_files))

          print("Files to inspect:")
          for file in gradle_files:
              print(" -", file)

          def remove_block(text, block_name):
              pattern = re.compile(
                  rf'(?m)^[ \t]*{re.escape(block_name)}\s*\{{'
              )

              while True:
                  match = pattern.search(text)

                  if not match:
                      break

                  start = match.start()
                  brace_start = text.find("{", match.start())

                  depth = 0
                  end = None

                  for i in range(brace_start, len(text)):
                      if text[i] == "{":
                          depth += 1
                      elif text[i] == "}":
                          depth -= 1

                          if depth == 0:
                              end = i + 1
                              break

                  if end is None:
                      break

                  text = text[:start] + text[end:]

              return text

          for file in gradle_files:
              try:
                  text = file.read_text(encoding="utf-8")
              except Exception:
                  continue

              original = text

              lines = text.splitlines()

              cleaned = []

              for line in lines:
                  stripped = line.strip()

                  # Remove Google Services imports
                  if stripped.startswith(
                      "import com.google.gms.googleservices"
                  ):
                      continue

                  # Remove direct Google Services plugin
                  if "com.google.gms.google-services" in line:
                      continue

                  # Remove version catalog Google Services alias
                  if "libs.plugins.google.services" in line:
                      continue

                  # Remove old plugin syntax
                  if "apply plugin" in line and "google-services" in line:
                      continue

                  # Remove Google Services plugin declarations
                  if "id(\"com.google.gms.google-services\")" in line:
                      continue

                  if "id('com.google.gms.google-services')" in line:
                      continue

                  # Remove MissingGoogleServicesStrategy references
                  if "MissingGoogleServicesStrategy" in line:
                      continue

                  cleaned.append(line)

              text = "\n".join(cleaned)

              # Remove whole googleServices { ... } blocks
              text = remove_block(text, "googleServices")

              # Remove remaining references
              text = re.sub(
                  r'(?m)^[ \t]*.*google-services.*$\n?',
                  "",
                  text,
                  flags=re.IGNORECASE,
              )

              text = re.sub(
                  r'(?m)^[ \t]*.*googleServices.*$\n?',
                  "",
                  text,
              )

              file.write_text(
                  text.rstrip() + "\n",
                  encoding="utf-8",
              )

              if text != original:
                  print("Modified:", file)

          # Delete every google-services.json
          for file in root.rglob("google-services.json"):
              try:
                  file.unlink()
                  print("Deleted:", file)
              except Exception:
                  pass

          print("Google Services cleanup complete.")
          PY

      # =========================================================
      # 9. VERIFY GOOGLE SERVICES IS GONE
      # =========================================================
      - name: Verify Google Services removal
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Searching for forbidden Google Services references..."

          FOUND=0

          if grep -Rni \
            --exclude-dir=.git \
            --exclude-dir=.gradle \
            -E \
            'com\.google\.gms\.googleservices|com\.google\.gms\.google-services|google-services|googleServices|MissingGoogleServicesStrategy|libs\.plugins\.google\.services' \
            .; then

            FOUND=1

          fi

          if [ "$FOUND" -ne 0 ]; then
            echo
            echo "ERROR: Google Services references still exist."
            exit 1
          fi

          echo "No Google Services references remain."

      # =========================================================
      # 10. GRADLE PROPERTIES
      # =========================================================
      - name: Configure Gradle properties
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          touch gradle.properties

          sed -i \
            -e '/^org\.gradle\.daemon=/d' \
            -e '/^org\.gradle\.parallel=/d' \
            -e '/^org\.gradle\.caching=/d' \
            -e '/^org\.gradle\.jvmargs=/d' \
            -e '/^android\.useAndroidX=/d' \
            -e '/^android\.nonTransitiveRClass=/d' \
            gradle.properties

          printf '%s\n' \
            'org.gradle.daemon=false' \
            'org.gradle.parallel=true' \
            'org.gradle.caching=true' \
            'org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
            'android.useAndroidX=true' \
            'android.nonTransitiveRClass=false' \
            >> gradle.properties

      # =========================================================
      # 11. GRADLE 9.3.1
      # =========================================================
      - name: Install Gradle 9.3.1
        shell: bash
        run: |
          set -e

          VERSION="9.3.1"
          DIR="/opt/gradle-${VERSION}"

          if [ ! -d "$DIR" ]; then

            curl -fL \
              "https://services.gradle.org/distributions/gradle-${VERSION}-bin.zip" \
              -o /tmp/gradle.zip

            unzip -q \
              /tmp/gradle.zip \
              -d /opt/
          fi

          echo "$DIR/bin" >> "$GITHUB_PATH"

          "$DIR/bin/gradle" --version

      # =========================================================
      # 12. DEBUG KEYSTORE
      # =========================================================
      - name: Create debug keystore
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android"

          KEYSTORE="$HOME/.android/debug.keystore"

          if [ ! -f "$KEYSTORE" ]; then

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

          fi

          cp \
            "$KEYSTORE" \
            "$PROJECT_DIR/debug.keystore"

          if [ -d "$PROJECT_DIR/app" ]; then

            cp \
              "$KEYSTORE" \
              "$PROJECT_DIR/app/debug.keystore"

          fi

      # =========================================================
      # 13. FINAL PROJECT CHECK
      # =========================================================
      - name: Show final Gradle files
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo "settings.gradle.kts"
          echo "=============================================="

          if [ -f settings.gradle.kts ]; then
            cat settings.gradle.kts
          fi

          echo
          echo "=============================================="
          echo "build.gradle.kts"
          echo "=============================================="

          if [ -f build.gradle.kts ]; then
            cat build.gradle.kts
          fi

          echo
          echo "=============================================="
          echo "app/build.gradle.kts"
          echo "=============================================="

          if [ -f app/build.gradle.kts ]; then
            cat app/build.gradle.kts
          fi

          echo
          echo "=============================================="
          echo "libs.versions.toml"
          echo "=============================================="

          if [ -f gradle/libs.versions.toml ]; then
            cat gradle/libs.versions.toml
          fi

      # =========================================================
      # 14. BUILD
      # =========================================================
      - name: Build Debug APK
        shell: bash
        env:
          CI: true
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m"
        run: |
          set -e

          cd "$PROJECT_DIR"

          export PATH="/opt/gradle-9.3.1/bin:$PATH"

          echo "Gradle version:"
          gradle --version

          echo
          echo "=============================================="
          echo "RUNNING CLEAN"
          echo "=============================================="

          gradle \
            clean \
            --no-daemon \
            --stacktrace

          echo
          echo "=============================================="
          echo "RUNNING ASSEMBLE DEBUG"
          echo "=============================================="

          gradle \
            assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # =========================================================
      # 15. FIND APK
      # =========================================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK="$(
            find "$PROJECT_DIR" \
              -type f \
              -name '*.apk' \
              -not -path '*/.gradle/*' \
              | grep -E 'debug.*\.apk$' \
              | head -n 1 \
              || true
          )"

          if [ -z "$APK" ]; then

            APK="$(
              find "$PROJECT_DIR" \
                -type f \
                -name '*.apk' \
                -not -path '*/.gradle/*' \
                | head -n 1 \
                || true
            )"

          fi

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo
            echo "APK search:"
            find "$PROJECT_DIR" \
              -type f \
              -name '*.apk' \
              -print \
              || true

            echo
            echo "Build directories:"
            find "$PROJECT_DIR" \
              -type d \
              -name build \
              -print \
              | sort \
              || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p "$PROJECT_DIR/output"

          cp \
            "$APK" \
            "$PROJECT_DIR/output/Substack-Downloader-debug.apk"

          echo
          echo "Final APK size:"
          du -h \
            "$PROJECT_DIR/output/Substack-Downloader-debug.apk"

      # =========================================================
      # 16. UPLOAD APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Substack-Downloader-debug
          path: ${{ env.PROJECT_DIR }}/output/Substack-Downloader-debug.apk
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 17. SUCCESS
      # =========================================================
      - name: Build successful
        if: success()
        shell: bash
        run: |
          echo "=============================================="
          echo "SUBSTACK DOWNLOADER BUILD SUCCESSFUL"
          echo "=============================================="
          echo
          echo "Artifact:"
          echo "Substack-Downloader-debug"
