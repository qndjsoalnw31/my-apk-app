name: Build Android APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP directly to root
        run: |
          unzip -o substack-downloader.zip
          ROOT_DIR=$(find . -maxdepth 2 -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          DIR_PATH=$(dirname "$ROOT_DIR")
          if [ "$DIR_PATH" != "." ]; then
            rsync -a "$DIR_PATH/" .
          fi

      - name: Fix missing google-services.json
        run: |
          mkdir -p app
          echo '{"project_info":{"project_number":"1","project_id":"dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:1:android:1","android_client_info":{"package_name":"com.dummy"}},"api_key":[{"current_key":"dummy"}],"oauth_client": [],"services": {"appinvite_service": {"other_platform_oauth_client": []}}}]}' > app/google-services.json

      - name: Auto-Patch Kotlin & Compose Versions
        run: |
          if [ -f "gradle/libs.versions.toml" ]; then
            sed -i -E 's/(kotlin\s*=\s*")[^"]+"/\11.9.24"/' gradle/libs.versions.toml
            sed -i -E 's/(ksp\s*=\s*")[^"]+"/\11.9.24-1.0.20"/' gradle/libs.versions.toml
            sed -i -E 's/(compose[_-]compiler\s*=\s*")[^"]+"/\11.5.14"/' gradle/libs.versions.toml
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Make gradlew executable
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-App-APK
          path: app/build/outputs/apk/debug/*.apk
