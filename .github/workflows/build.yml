name: Build TikTok Downloader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # ============================================================
      # Find ZIP
      # ============================================================
      - name: Find project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          if [ -f "$GITHUB_WORKSPACE/tiktok-downloader.zip" ]; then
            ZIP_FILE="$GITHUB_WORKSPACE/tiktok-downloader.zip"
          else
            ZIP_FILE="$(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -iname "*.zip" \
                -not -path "*/.git/*" \
                | head -n 1 || true
            )"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            find "$GITHUB_WORKSPACE" -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Using ZIP: $ZIP_FILE"

      # ============================================================
      # Validate ZIP
      # ============================================================
      - name: Validate ZIP
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "$ZIP_FILE" >/dev/null
          echo "ZIP is valid."

      # ============================================================
      # Extract
      # ============================================================
      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/project"
          mkdir -p "$GITHUB_WORKSPACE/project"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/project"

          echo "Extracted files:"
          find "$GITHUB_WORKSPACE/project" \
            -maxdepth 10 \
            -type f \
            | sort

      # ============================================================
      # Locate Android project
      # ============================================================
      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/project"
          PROJECT_DIR=""

          while IFS= read -r SETTINGS; do
            CANDIDATE="$(dirname "$SETTINGS")"

            if [ -d "$CANDIDATE/app" ]; then
              PROJECT_DIR="$CANDIDATE"
              break
            fi

            if find "$CANDIDATE" \
              -type f \
              -path "*/src/main/AndroidManifest.xml" \
              | grep -q .; then
              PROJECT_DIR="$CANDIDATE"
              break
            fi

            if [ -z "$PROJECT_DIR" ]; then
              PROJECT_DIR="$CANDIDATE"
            fi
          done < <(
            find "$ROOT" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -not -path "*/build/*" \
              | sort
          )

          if [ -z "$PROJECT_DIR" ]; then
            GRADLEW="$(
              find "$ROOT" \
                -type f \
                -name "gradlew" \
                -not -path "*/build/*" \
                | head -n 1 || true
            )"

            if [ -n "$GRADLEW" ]; then
              PROJECT_DIR="$(dirname "$GRADLEW")"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            find "$ROOT" -maxdepth 12 -print | sort
            exit 1
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      # ============================================================
      # Detect app module
      # ============================================================
      - name: Detect app module
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          APP_DIR=""

          if [ -d "app" ]; then
            APP_DIR="$PROJECT_DIR/app"
          fi

          if [ -z "$APP_DIR" ]; then
            MANIFEST="$(
              find . \
                -type f \
                -path "*/src/main/AndroidManifest.xml" \
                | head -n 1 || true
            )"

            if [ -n "$MANIFEST" ]; then
              APP_DIR="$(realpath "$(dirname "$(dirname "$(dirname "$MANIFEST")")")")"
            fi
          fi

          if [ -z "$APP_DIR" ]; then
            echo "ERROR: Android app module not found."
            find . -maxdepth 8 -print | sort
            exit 1
          fi

          APP_DIR="$(realpath "$APP_DIR")"

          REL_APP="${APP_DIR#$PROJECT_DIR/}"

          if [ "$REL_APP" = "$APP_DIR" ] || [ -z "$REL_APP" ]; then
            BUILD_TASK="assembleDebug"
          else
            MODULE_NAME="${REL_APP//\//:}"
            BUILD_TASK=":${MODULE_NAME}:assembleDebug"
          fi

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "BUILD_TASK=$BUILD_TASK" >> "$GITHUB_ENV"

          echo "APP_DIR:"
          echo "$APP_DIR"

          echo "BUILD_TASK:"
          echo "$BUILD_TASK"

      # ============================================================
      # Detect AGP + compileSdk
      # ============================================================
      - name: Detect Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python3 <<'PY'
          import re
          from pathlib import Path

          root = Path(".").resolve()

          files = []

          for p in root.rglob("*"):
              if not p.is_file():
                  continue

              if any(x in {".git", ".gradle", "build", "node_modules"} for x in p.parts):
                  continue

              if p.suffix in {".gradle", ".kts", ".toml", ".properties"}:
                  try:
                      if p.stat().st_size < 2_000_000:
                          files.append(p)
                  except OSError:
                      pass

          texts = []

          for p in files:
              try:
                  texts.append((p, p.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  )))
              except Exception:
                  pass

          full_text = "\n".join(x[1] for x in texts)

          # --------------------------------------------------------
          # AGP
          # --------------------------------------------------------
          agp = ""

          patterns = [
              r'com\.android\.tools\.build:gradle:([0-9]+\.[0-9]+(?:\.[0-9]+)?)',

              r'id\s*\(\s*["\']com\.android\.(?:application|library)["\']\s*\)'
              r'\s*version\s*["\']([0-9]+\.[0-9]+(?:\.[0-9]+)?)["\']',

              r'id\s+["\']com\.android\.(?:application|library)["\']'
              r'\s+version\s+["\']([0-9]+\.[0-9]+(?:\.[0-9]+)?)["\']',
          ]

          for pattern in patterns:
              m = re.search(pattern, full_text)
              if m:
                  agp = m.group(1)
                  break

          # Version catalog
          if not agp:
              for _, text in texts:
                  m = re.search(
                      r'(?m)^\s*agp\s*=\s*["\']'
                      r'([0-9]+\.[0-9]+(?:\.[0-9]+)?)'
                      r'["\']',
                      text
                  )
                  if m:
                      agp = m.group(1)
                      break

          # --------------------------------------------------------
          # compileSdk
          # --------------------------------------------------------
          compile_sdk = ""

          compile_patterns = [
              r'\bcompileSdk(?:Version)?\s*=\s*["\']?([0-9]{2,3})',
              r'\bcompileSdk(?:Version)?\s+([0-9]{2,3})',
          ]

          for pattern in compile_patterns:
              m = re.search(pattern, full_text)
              if m:
                  compile_sdk = m.group(1)
                  break

          # Version catalog compileSdk
          if not compile_sdk:
              for _, text in texts:
                  m = re.search(
                      r'(?m)^\s*compileSdk\s*=\s*["\']([0-9]{2,3})["\']',
                      text
                  )
                  if m:
                      compile_sdk = m.group(1)
                      break

          # --------------------------------------------------------
          # AGP -> compatible Gradle
          # --------------------------------------------------------
          gradle_map = {
              "9.4": "9.6.0",
              "9.3": "9.5.0",
              "9.2": "9.4.1",
              "9.1": "9.3.1",
              "9.0": "9.1.0",

              "8.13": "8.13",
              "8.12": "8.13",
              "8.11": "8.13",
              "8.10": "8.11.1",
              "8.9": "8.11.1",
              "8.8": "8.10.2",
              "8.7": "8.9",
              "8.6": "8.7",
              "8.5": "8.7",
              "8.4": "8.6",
              "8.3": "8.4",
              "8.2": "8.2",
              "8.1": "8.0",
              "8.0": "8.0",

              "7.4": "7.5",
              "7.3": "7.4",
              "7.2": "7.3.3",
              "7.1": "7.2",
              "7.0": "7.0",
          }

          if agp:
              parts = agp.split(".")
              key = ".".join(parts[:2])
              gradle = gradle_map.get(key, "8.13")
          else:
              gradle = "8.13"

          # --------------------------------------------------------
          # Safe compileSdk fallback
          # --------------------------------------------------------
          if not compile_sdk:
              if agp.startswith("9.4"):
                  compile_sdk = "37"
              else:
                  compile_sdk = "36"

          with open("$GITHUB_ENV", "a", encoding="utf-8") as out:
              out.write(f"AGP_VERSION={agp}\n")
              out.write(f"GRADLE_VERSION={gradle}\n")
              out.write(f"COMPILE_SDK={compile_sdk}\n")

          print("==============================================")
          print("ANDROID TOOLCHAIN")
          print("==============================================")
          print("AGP        :", agp or "unknown")
          print("Gradle     :", gradle)
          print("compileSdk :", compile_sdk)
          PY

      # ============================================================
      # Install exact SDK needed
      # ============================================================
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;36.0.0"

      # ============================================================
      # Setup exact Gradle
      # ============================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-disabled: true

      # ============================================================
      # Verify toolchain
      # ============================================================
      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "JAVA"
          echo "=============================================="
          java -version

          echo
          echo "=============================================="
          echo "GRADLE"
          echo "=============================================="
          gradle --version

          echo
          echo "=============================================="
          echo "ANDROID SDK"
          echo "=============================================="
          sdkmanager --list | grep -E \
            "platforms;android-${COMPILE_SDK}|build-tools;36.0.0" \
            | head -n 20 || true

      # ============================================================
      # Build
      # ============================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo "BUILDING APK"
          echo "=============================================="
          echo "AGP        : $AGP_VERSION"
          echo "Gradle     : $GRADLE_VERSION"
          echo "compileSdk : $COMPILE_SDK"
          echo "Task       : $BUILD_TASK"
          echo "=============================================="

          gradle "$BUILD_TASK" \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

      # ============================================================
      # Find APK
      # ============================================================
      - name: Find APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          OUT="$GITHUB_WORKSPACE/apk-output"

          rm -rf "$OUT"
          mkdir -p "$OUT"

          APK="$(
            find "$PROJECT_DIR" \
              -type f \
              -name "*-debug.apk" \
              -path "*/build/outputs/*" \
              | sort \
              | head -n 1 || true
          )"

          if [ -z "$APK" ]; then
            APK="$(
              find "$PROJECT_DIR" \
                -type f \
                -name "*.apk" \
                -path "*/build/outputs/*" \
                | sort \
                | head -n 1 || true
            )"
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            find "$PROJECT_DIR" \
              -path "*/build/outputs/*" \
              -print \
              | sort || true

            exit 1
          fi

          echo "APK:"
          echo "$APK"

          cp "$APK" \
            "$OUT/TikTok-Downloader-debug.apk"

          sha256sum \
            "$OUT/TikTok-Downloader-debug.apk" \
            > "$OUT/SHA256SUMS.txt"

          ls -lh "$OUT"

      # ============================================================
      # Upload APK
      # ============================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-Downloader-APK
          path: |
            apk-output/TikTok-Downloader-debug.apk
            apk-output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # Always upload build log
      # ============================================================
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-Downloader-Build-Logs
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 14

      # ============================================================
      # Upload project diagnostics
      # ============================================================
      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          {
            echo "PROJECT_DIR=$PROJECT_DIR"
            echo "APP_DIR=$APP_DIR"
            echo "BUILD_TASK=$BUILD_TASK"
            echo "AGP_VERSION=$AGP_VERSION"
            echo "GRADLE_VERSION=$GRADLE_VERSION"
            echo "COMPILE_SDK=$COMPILE_SDK"

            echo
            echo "JAVA:"
            java -version 2>&1 || true

            echo
            echo "GRADLE:"
            gradle --version 2>&1 || true

            echo
            echo "PROJECT FILES:"
            find "$PROJECT_DIR" \
              -maxdepth 5 \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
                -o \
                -name "build.gradle" \
                -o \
                -name "build.gradle.kts" \
                -o \
                -name "gradle.properties" \
                -o \
                -name "libs.versions.toml" \
              \) \
              | sort
          } > diagnostic.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-Downloader-Diagnostics
          path: diagnostic.txt
          if-no-files-found: warn
          retention-days: 14
