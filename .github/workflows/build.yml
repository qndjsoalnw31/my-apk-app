name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-35" \
            "platforms;android-34" \
            "platforms;android-33" \
            "build-tools;36.0.0" \
            "build-tools;35.0.0" \
            "build-tools;34.0.0" \
            "build-tools;33.0.2"

      - name: Extract Project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "substack-downloader.zip" ]; then
            echo "::error::substack-downloader.zip not found"
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted

          unzip -q "substack-downloader.zip" -d extracted

          echo "ZIP extracted successfully."

      - name: Find Project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(
            find extracted \
              -type f \
              \( \
                -name "settings.gradle.kts" \
                -o \
                -name "settings.gradle" \
              \) \
              -print \
              -quit
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle or settings.gradle.kts not found"

            echo ""
            echo "Extracted files:"
            find extracted -maxdepth 6 -type f -print | head -300

            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::app module not found"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/build.gradle.kts" ] && [ ! -f "$PROJECT_DIR/build.gradle" ]; then
            echo "::error::Root build.gradle or build.gradle.kts not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Select Gradle Version
        shell: bash
        run: |
          set -euo pipefail

          AGP_VERSION="$(
            grep -RhoE \
              'com\.android\.application[^0-9]*[0-9]+\.[0-9]+(\.[0-9]+)?' \
              "$PROJECT_DIR" \
              --include='*.gradle' \
              --include='*.gradle.kts' \
              --include='*.toml' \
              2>/dev/null |
            grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' |
            head -1 ||
            true
          )"

          if [ -z "$AGP_VERSION" ]; then
            AGP_VERSION="$(
              grep -RhoE \
                'agp[[:space:]]*=[[:space:]]*"?[0-9]+\.[0-9]+(\.[0-9]+)?' \
                "$PROJECT_DIR" \
                --include='*.toml' \
                2>/dev/null |
              grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' |
              head -1 ||
              true
            )"
          fi

          if [ -z "$AGP_VERSION" ]; then
            AGP_VERSION="9.1.1"
          fi

          AGP_MAJOR="$(echo "$AGP_VERSION" | cut -d. -f1)"
          AGP_MINOR="$(echo "$AGP_VERSION" | cut -d. -f2)"

          echo "Detected AGP: $AGP_VERSION"

          if [ "$AGP_MAJOR" -ge 9 ]; then
            case "$AGP_MINOR" in
              0)
                GRADLE_VERSION="9.1.0"
                ;;
              1)
                GRADLE_VERSION="9.3.1"
                ;;
              2)
                GRADLE_VERSION="9.4.1"
                ;;
              3)
                GRADLE_VERSION="9.5.0"
                ;;
              *)
                GRADLE_VERSION="9.5.0"
                ;;
            esac
          else
            case "$AGP_MAJOR.$AGP_MINOR" in
              8.13|8.12|8.11)
                GRADLE_VERSION="8.13"
                ;;
              8.10|8.9)
                GRADLE_VERSION="8.11.1"
                ;;
              8.8)
                GRADLE_VERSION="8.10.2"
                ;;
              8.7)
                GRADLE_VERSION="8.9"
                ;;
              8.6|8.5)
                GRADLE_VERSION="8.7"
                ;;
              8.4)
                GRADLE_VERSION="8.6"
                ;;
              8.3)
                GRADLE_VERSION="8.4"
                ;;
              8.2)
                GRADLE_VERSION="8.2"
                ;;
              8.1|8.0)
                GRADLE_VERSION="8.0"
                ;;
              *)
                GRADLE_VERSION="8.13"
                ;;
            esac
          fi

          echo "Selected Gradle: $GRADLE_VERSION"
          echo "AGP_VERSION=$AGP_VERSION" >> "$GITHUB_ENV"
          echo "GRADLE_VERSION=$GRADLE_VERSION" >> "$GITHUB_ENV"

      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            cd /tmp

            wget -q \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -O gradle.zip

            rm -rf "gradle-${GRADLE_VERSION}"
            unzip -q gradle.zip

            cd "$GITHUB_WORKSPACE/$PROJECT_DIR"

            "/tmp/gradle-${GRADLE_VERSION}/bin/gradle" wrapper \
              --gradle-version "$GRADLE_VERSION" \
              --distribution-type bin
          fi

          chmod +x gradlew

      - name: Remove Google Services
        shell: bash
        run: |
          set -euo pipefail

          find "$PROJECT_DIR" \
            -type f \
            -name "google-services.json" \
            -delete || true

          while IFS= read -r -d '' FILE; do
            sed -i '/google\.services/d' "$FILE" || true
            sed -i '/google-services/d' "$FILE" || true
            sed -i '/com\.google\.gms/d' "$FILE" || true
            sed -i '/MissingGoogleServicesStrategy/d' "$FILE" || true
            sed -i '/missingGoogleServicesStrategy/d' "$FILE" || true
          done < <(
            find "$PROJECT_DIR" \
              -type f \
              \( \
                -name "*.gradle" \
                -o \
                -name "*.gradle.kts" \
                -o \
                -name "*.toml" \
              \) \
              -print0
          )

      - name: Remove Google Services Blocks
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' FILE; do
            sed -i \
              '/googleServices[[:space:]]*{/,/^[[:space:]]*}/d' \
              "$FILE" || true

            sed -i \
              '/googleServices[[:space:]]*{.*}/d' \
              "$FILE" || true

            sed -i \
              '/googleServices/d' \
              "$FILE" || true

            sed -i \
              '/MissingGoogleServicesStrategy/d' \
              "$FILE" || true

            sed -i \
              '/missingGoogleServicesStrategy/d' \
              "$FILE" || true
          done < <(
            find "$PROJECT_DIR" \
              -type f \
              \( \
                -name "*.gradle" \
                -o \
                -name "*.gradle.kts" \
              \) \
              -print0
          )

      - name: Configure Java 21
        shell: bash
        run: |
          set -euo pipefail

          APP_KTS="$PROJECT_DIR/app/build.gradle.kts"
          APP_GROOVY="$PROJECT_DIR/app/build.gradle"

          if [ -f "$APP_KTS" ]; then
            sed -i -E \
              's/sourceCompatibility[[:space:]]*=[[:space:]]*JavaVersion\.VERSION_[0-9]+/sourceCompatibility = JavaVersion.VERSION_21/g' \
              "$APP_KTS" || true

            sed -i -E \
              's/targetCompatibility[[:space:]]*=[[:space:]]*JavaVersion\.VERSION_[0-9]+/targetCompatibility = JavaVersion.VERSION_21/g' \
              "$APP_KTS" || true

            sed -i -E \
              's/jvmTarget[[:space:]]*=[[:space:]]*"([0-9]+|JVM_[0-9]+)"/jvmTarget = "21"/g' \
              "$APP_KTS" || true

            sed -i -E \
              's/jvmTarget[[:space:]]*=[[:space:]]*JvmTarget\.JVM_[0-9]+/jvmTarget = JvmTarget.JVM_21/g' \
              "$APP_KTS" || true
          fi

          if [ -f "$APP_GROOVY" ]; then
            sed -i -E \
              's/sourceCompatibility[[:space:]]+JavaVersion\.VERSION_[0-9]+/sourceCompatibility JavaVersion.VERSION_21/g' \
              "$APP_GROOVY" || true

            sed -i -E \
              's/targetCompatibility[[:space:]]+JavaVersion\.VERSION_[0-9]+/targetCompatibility JavaVersion.VERSION_21/g' \
              "$APP_GROOVY" || true
          fi

      - name: Force Compile SDK 36
        shell: bash
        run: |
          set -euo pipefail

          APP_KTS="$PROJECT_DIR/app/build.gradle.kts"
          APP_GROOVY="$PROJECT_DIR/app/build.gradle"

          if [ -f "$APP_KTS" ]; then
            sed -i -E \
              's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+(\.[0-9]+)?/compileSdk = 36/g' \
              "$APP_KTS" || true

            sed -i -E \
              's/compileSdk[[:space:]]+[0-9]+(\.[0-9]+)?/compileSdk 36/g' \
              "$APP_KTS" || true

            if ! grep -Eq \
              'compileSdk[[:space:]]*=[[:space:]]*36|compileSdk[[:space:]]+36' \
              "$APP_KTS"; then
              sed -i \
                '0,/android[[:space:]]*{/s//android {\n    compileSdk = 36/' \
                "$APP_KTS"
            fi
          fi

          if [ -f "$APP_GROOVY" ]; then
            sed -i -E \
              's/compileSdk[[:space:]]+[0-9]+(\.[0-9]+)?/compileSdk 36/g' \
              "$APP_GROOVY" || true
          fi

      - name: Pin Compatible Libraries
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' FILE; do
            sed -i \
              's/androidx\.lifecycle:lifecycle-runtime-compose:[0-9][0-9.]*/androidx.lifecycle:lifecycle-runtime-compose:2.10.0/g' \
              "$FILE" || true

            sed -i \
              's/androidx\.lifecycle:lifecycle-viewmodel-ktx:[0-9][0-9.]*/androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0/g' \
              "$FILE" || true

            sed -i \
              's/androidx\.lifecycle:lifecycle-viewmodel-compose:[0-9][0-9.]*/androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0/g' \
              "$FILE" || true

            sed -i \
              's/androidx\.activity:activity-compose:[0-9][0-9.]*/androidx.activity:activity-compose:1.12.0/g' \
              "$FILE" || true

            sed -i \
              's/androidx\.activity:activity-ktx:[0-9][0-9.]*/androidx.activity:activity-ktx:1.12.0/g' \
              "$FILE" || true

            sed -i \
              's/androidx\.activity:activity:[0-9][0-9.]*/androidx.activity:activity:1.12.0/g' \
              "$FILE" || true
          done < <(
            find "$PROJECT_DIR" \
              -type f \
              \( \
                -name "*.gradle" \
                -o \
                -name "*.gradle.kts" \
                -o \
                -name "*.toml" \
              \) \
              -print0
          )

      - name: Inject Missing Dependencies
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "::error::app/build.gradle.kts not found"
            exit 1
          fi

          NEED_COROUTINES=0
          NEED_ROOM=0
          NEED_LIFECYCLE=0
          NEED_ACTIVITY_COMPOSE=0

          if grep -Rqs \
            'kotlinx\.coroutines' \
            "$PROJECT_DIR/app/src" \
            --include='*.kt' \
            --include='*.java' \
            2>/dev/null; then
            NEED_COROUTINES=1
          fi

          if grep -Rqs \
            'androidx\.room' \
            "$PROJECT_DIR/app/src" \
            --include='*.kt' \
            --include='*.java' \
            2>/dev/null; then
            NEED_ROOM=1
          fi

          if grep -Rqs \
            'androidx\.lifecycle' \
            "$PROJECT_DIR/app/src" \
            --include='*.kt' \
            --include='*.java' \
            2>/dev/null; then
            NEED_LIFECYCLE=1
          fi

          if grep -Rqs \
            'androidx\.compose' \
            "$PROJECT_DIR/app/src" \
            --include='*.kt' \
            --include='*.java' \
            2>/dev/null; then
            NEED_ACTIVITY_COMPOSE=1
          fi

          TEMP_DEPS="$(mktemp)"

          if [ "$NEED_COROUTINES" -eq 1 ]; then
            if ! grep -q 'kotlinx-coroutines-android' "$APP_GRADLE"; then
              echo 'implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")' >> "$TEMP_DEPS"
            fi

            if ! grep -q 'kotlinx-coroutines-core' "$APP_GRADLE"; then
              echo 'implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2")' >> "$TEMP_DEPS"
            fi
          fi

          if [ "$NEED_ROOM" -eq 1 ]; then
            if ! grep -q 'androidx.room:room-runtime' "$APP_GRADLE"; then
              echo 'implementation("androidx.room:room-runtime:2.8.4")' >> "$TEMP_DEPS"
            fi

            if ! grep -q 'androidx.room:room-ktx' "$APP_GRADLE"; then
              echo 'implementation("androidx.room:room-ktx:2.8.4")' >> "$TEMP_DEPS"
            fi

            if grep -qE '^[[:space:]]*ksp[[:space:]]*\(' "$APP_GRADLE"; then
              if ! grep -q 'androidx.room:room-compiler' "$APP_GRADLE"; then
                echo 'ksp("androidx.room:room-compiler:2.8.4")' >> "$TEMP_DEPS"
              fi
            fi
          fi

          if [ "$NEED_LIFECYCLE" -eq 1 ]; then
            if ! grep -q 'androidx.lifecycle:lifecycle-viewmodel-ktx' "$APP_GRADLE"; then
              echo 'implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0")' >> "$TEMP_DEPS"
            fi

            if ! grep -q 'androidx.lifecycle:lifecycle-runtime-compose' "$APP_GRADLE"; then
              echo 'implementation("androidx.lifecycle:lifecycle-runtime-compose:2.10.0")' >> "$TEMP_DEPS"
            fi
          fi

          if [ "$NEED_ACTIVITY_COMPOSE" -eq 1 ]; then
            if ! grep -q 'androidx.activity:activity-compose' "$APP_GRADLE"; then
              echo 'implementation("androidx.activity:activity-compose:1.12.0")' >> "$TEMP_DEPS"
            fi
          fi

          if [ -s "$TEMP_DEPS" ]; then
            {
              echo ""
              echo "dependencies {"
              cat "$TEMP_DEPS"
              echo "}"
            } >> "$APP_GRADLE"
          fi

          rm -f "$TEMP_DEPS"

      - name: Generate Debug Keystore
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ ! -f "debug.keystore" ]; then
            keytool \
              -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          keytool \
            -list \
            -keystore debug.keystore \
            -storepass android >/dev/null

      - name: Configure Gradle
        shell: bash
        run: |
          set -euo pipefail

          touch "$PROJECT_DIR/gradle.properties"

          sed -i \
            '/^[[:space:]]*org\.gradle\.jvmargs[[:space:]]*=/d' \
            "$PROJECT_DIR/gradle.properties" || true

          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
            'org.gradle.daemon=false' \
            'org.gradle.parallel=true' \
            'org.gradle.caching=true' \
            >> "$PROJECT_DIR/gradle.properties"

      - name: Verify Configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Java:"
          java -version

          echo ""
          echo "Javac:"
          javac -version

          echo ""
          echo "Gradle:"
          ./gradlew --version

          echo ""
          echo "Compile SDK:"
          grep -RniE \
            'compileSdk' \
            app \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            || true

          echo ""
          echo "Java configuration:"
          grep -RniE \
            'sourceCompatibility|targetCompatibility|jvmTarget|jvmToolchain|JavaLanguageVersion' \
            app \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            || true

      - name: Validate Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew help \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Clean Project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew clean \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "BUILDING DEBUG APK"
          echo "========================================"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

          CODE="${PIPESTATUS[0]}"

          if [ "$CODE" -ne 0 ]; then
            echo ""
            echo "===== BUILD FAILURE ====="

            grep -A 50 -B 5 \
              "\* What went wrong" \
              "$GITHUB_WORKSPACE/gradle-build.log" \
              || true

            echo ""
            echo "===== JAVA ERRORS ====="

            grep -Ei \
              "invalid source|invalid target|source release|target release|javac|JDK|Java" \
              "$GITHUB_WORKSPACE/gradle-build.log" \
              | tail -100 \
              || true

            echo ""
            echo "===== SDK ERRORS ====="

            grep -Ei \
              "compileSdk|requires libraries|compile against|AAR metadata|CheckAarMetadata" \
              "$GITHUB_WORKSPACE/gradle-build.log" \
              | tail -100 \
              || true

            echo ""
            echo "===== DEPENDENCY ERRORS ====="

            grep -Ei \
              "Could not resolve|Could not find|dependency|dependencies" \
              "$GITHUB_WORKSPACE/gradle-build.log" \
              | tail -100 \
              || true

            echo ""
            echo "===== LAST 200 LINES ====="

            tail -200 "$GITHUB_WORKSPACE/gradle-build.log"

            exit "$CODE"
          fi

          echo ""
          echo "========================================"
          echo "APK BUILD SUCCESSFUL"
          echo "========================================"

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -path "*/build/outputs/apk/*" \
              -print \
              -quit
          )"

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated"
            find "$PROJECT_DIR" -type f -name "*.apk" -print || true
            exit 1
          fi

          mkdir -p artifacts

          cp "$APK" \
            "artifacts/Substack-Downloader-debug.apk"

          ls -lh \
            "artifacts/Substack-Downloader-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Substack-Downloader-APK
          path: artifacts/Substack-Downloader-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Gradle-Build-Log
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7
