
name: Build CinePro Cinema Camera APK

on:
  push:
    branches:
      - main
    paths:
      - 'cinepro-cinema-camera.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cinepro-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      JAVA_TOOL_OPTIONS: -Xmx4g -Dfile.encoding=UTF-8
      GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=1g

    steps:
      # 1. تحميل ملفات المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. تثبيت Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. تثبيت Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses || true

      # 4. التأكد من وجود ملف ZIP وفحص سلامته
      - name: Verify ZIP archive
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$GITHUB_WORKSPACE/cinepro-cinema-camera.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "::error::cinepro-cinema-camera.zip is missing."
            echo "ZIP files found:"
            find "$GITHUB_WORKSPACE" -type f -iname '*.zip'
            exit 1
          fi

          if [ ! -s "$ARCHIVE" ]; then
            echo "::error::ZIP archive is empty."
            exit 1
          fi

          echo "Archive size:"
          ls -lh "$ARCHIVE"

          echo "Testing ZIP integrity..."
          unzip -tq "$ARCHIVE"

          echo "ZIP archive is valid."

      # 5. استخراج المشروع واكتشاف مجلده تلقائياً
      - name: Extract Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$GITHUB_WORKSPACE/cinepro-cinema-camera.zip"
          DEST="$RUNNER_TEMP/cinepro-extracted"

          rm -rf "$DEST"
          mkdir -p "$DEST"

          python3 - "$ARCHIVE" "$DEST" <<'PY'
          import pathlib
          import stat
          import sys
          import zipfile

          archive = pathlib.Path(sys.argv[1])
          destination = pathlib.Path(sys.argv[2]).resolve()

          with zipfile.ZipFile(archive) as z:
              entries = z.infolist()

              if not entries:
                  raise SystemExit("The ZIP archive is empty.")

              for entry in entries:
                  target = (destination / entry.filename).resolve()

                  if not target.is_relative_to(destination):
                      raise SystemExit(
                          f"Unsafe ZIP path detected: {entry.filename}"
                      )

                  mode = entry.external_attr >> 16

                  if stat.S_ISLNK(mode):
                      raise SystemExit(
                          f"Symbolic links are not allowed: {entry.filename}"
                      )

              z.extractall(destination)

          settings_files = list(destination.rglob("settings.gradle"))
          settings_files += list(destination.rglob("settings.gradle.kts"))

          settings_files = [
              p for p in settings_files
              if "__MACOSX" not in p.parts
              and ".gradle" not in p.parts
          ]

          if not settings_files:
              raise SystemExit(
                  "Android project not found: settings.gradle or settings.gradle.kts is missing."
              )

          roots = sorted(
              {p.parent.resolve() for p in settings_files},
              key=lambda p: len(p.parts)
          )

          project_root = roots[0]

          build_files = [
              project_root / "build.gradle",
              project_root / "build.gradle.kts"
          ]

          if not any(p.is_file() for p in build_files):
              raise SystemExit(
                  "Root build.gradle or build.gradle.kts is missing."
              )

          manifests = list(
              project_root.rglob("AndroidManifest.xml")
          )

          if not manifests:
              raise SystemExit(
                  "No AndroidManifest.xml found in the project."
              )

          print("Project root:", project_root)
          print("Manifest files:", len(manifests))

          with open(
              pathlib.Path(sys.argv[2]).parent / "project-root.txt",
              "w"
          ) as f:
              f.write(str(project_root))
          PY

          PROJECT_DIR="$(cat "$RUNNER_TEMP/project-root.txt")"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Detected project:"
          find "$PROJECT_DIR" -maxdepth 3 -type f | head -100

      # 6. اكتشاف compileSdk وتثبيت المنصة المطلوبة
      - name: Install required Android platform
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          SDK_VERSION="$(python3 - "$PROJECT_DIR" <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path(sys.argv[1])
          patterns = [
              r"\bcompileSdk(?:Version)?\s*[=(]?\s*(\d+)",
              r"\bcompileSdk\s*=\s*(\d+)"
          ]

          found = []

          for path in root.rglob("*"):
              if not path.is_file():
                  continue

              if path.suffix not in (".gradle", ".kts"):
                  continue

              if any(x in path.parts for x in (
                  ".gradle", "build", ".git"
              )):
                  continue

              try:
                  content = path.read_text(errors="ignore")
              except OSError:
                  continue

              for pattern in patterns:
                  found.extend(
                      int(x) for x in re.findall(pattern, content)
                  )

          print(max(found) if found else 35)
          PY
          )"

          echo "Detected compileSdk: $SDK_VERSION"

          sdkmanager "platform-tools" "platforms;android-$SDK_VERSION"

      # 7. إعداد Gradle احتياطياً إذا لم يوجد Wrapper
      - name: Set up Gradle fallback
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # 8. فحص إعدادات المشروع
      - name: Validate project configuration
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "Gradle Wrapper configuration found."
            cat gradle/wrapper/gradle-wrapper.properties
          else
            echo "No Gradle Wrapper found. Using installed Gradle."
          fi

          echo "Java:"
          java -version

          echo "Android SDK:"
          sdkmanager --list_installed

      # 9. بناء APK
      - name: Build Debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

          chmod +x gradlew 2>/dev/null || true

          if [ -f "./gradlew" ]; then
            echo "Building with project Gradle Wrapper."

            ./gradlew \
              --no-daemon \
              --stacktrace \
              --console=plain \
              assembleDebug

          else
            echo "Building with installed Gradle."

            gradle \
              --no-daemon \
              --stacktrace \
              --console=plain \
              assembleDebug
          fi

      # 10. جمع ملفات APK مهما كان اسم وحدة التطبيق
      - name: Collect APK files
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          OUTPUT="$GITHUB_WORKSPACE/output"

          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT"

          python3 - "$PROJECT_DIR" "$OUTPUT" <<'PY'
          import pathlib
          import shutil
          import sys

          root = pathlib.Path(sys.argv[1])
          output = pathlib.Path(sys.argv[2])

          apk_files = list(
              root.rglob("build/outputs/apk/**/*.apk")
          )

          apk_files = [
              p for p in apk_files
              if p.is_file() and p.stat().st_size > 0
          ]

          if not apk_files:
              raise SystemExit(
                  "Build finished but no APK files were found."
              )

          for index, apk in enumerate(apk_files, 1):
              if len(apk_files) == 1:
                  name = "CinePro-Cinema-Camera.apk"
              else:
                  name = f"CinePro-{index}-{apk.name}"

              destination = output / name
              shutil.copy2(apk, destination)

              print(
                  f"APK: {destination.name} "
                  f"({destination.stat().st_size} bytes)"
              )
          PY

          echo "Collected APK files:"
          ls -lh "$OUTPUT"

      # 11. رفع APK كملف قابل للتنزيل
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CinePro-Cinema-Camera-APK
          path: output/*.apk
          if-no-files-found: error
          retention-days: 14

      # 12. إظهار نتيجة البناء
      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo "## CinePro APK Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -d "$GITHUB_WORKSPACE/output" ]; then
            echo "### Generated APK files" >> "$GITHUB_STEP_SUMMARY"
            ls -lh "$GITHUB_WORKSPACE/output" >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "No APK output directory was generated." >> "$GITHUB_STEP_SUMMARY"
          fi
