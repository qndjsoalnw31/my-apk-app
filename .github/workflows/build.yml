name: Build Substack Downloader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v5

      # =========================================================
      # 2. JDK 17
      # =========================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # 3. ANDROID SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # =========================================================
      # 4. ACCEPT SDK LICENSES
      # =========================================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      # =========================================================
      # 5. INSTALL SDK PACKAGES
      # =========================================================
      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      # =========================================================
      # 6. EXTRACT ZIP
      # =========================================================
      - name: Extract Substack Downloader ZIP
        shell: bash
        run: |
          set -e

          if [ -d "extracted" ]; then
            echo "extracted/ already exists."
          else

            ZIP_FILE=""

            if [ -f "substack-downloader.zip" ]; then
              ZIP_FILE="substack-downloader.zip"
            else
              ZIP_FILE="$(
                find . \
                  -maxdepth 2 \
                  -type f \
                  -name '*.zip' \
                  | head -n 1 \
                  || true
              )"
            fi

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No ZIP file found."
              exit 1
            fi

            echo "Using ZIP: $ZIP_FILE"

            mkdir -p extracted

            unzip -o "$ZIP_FILE" -d extracted
          fi

      # =========================================================
      # 7. LOCATE ANDROID PROJECT
      # =========================================================
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          if [ -f "extracted/settings.gradle.kts" ] || \
             [ -f "extracted/settings.gradle" ]; then

            PROJECT_DIR="$(realpath extracted)"

          elif [ -f "settings.gradle.kts" ] || \
               [ -f "settings.gradle" ]; then

            PROJECT_DIR="$PWD"

          else

            SETTINGS_FILE="$(
              find . \
                -type f \
                \( \
                  -name 'settings.gradle.kts' \
                  -o \
                  -name 'settings.gradle' \
                \) \
                -not -path './.git/*' \
                | head -n 1 \
                || true
            )"

            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_DIR="$(
                realpath "$(dirname "$SETTINGS_FILE")"
              )"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."

            echo
            echo "Repository contents:"

            find . \
              -maxdepth 6 \
              -type f \
              -not -path './.git/*' \
              | sort

            exit 1
          fi

          echo "=============================================="
          echo "ANDROID PROJECT FOUND"
          echo "=============================================="

          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # =========================================================
      # 8. REMOVE GOOGLE SERVICES FROM ALL GRADLE FILES
      # =========================================================
      - name: Remove Google Services completely
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()

          patterns = [
              r'com\.google\.gms\.googleservices',
              r'com\.google\.gms\.google-services',
              r'google-services',
              r'googleServices',
              r'MissingGoogleServicesStrategy',
              r'libs\.plugins\.google\.services',
          ]

          files = []

          for pattern in [
              "**/build.gradle",
              "**/build.gradle.kts",
              "**/settings.gradle",
              "**/settings.gradle.kts",
              "**/libs.versions.toml",
          ]:
              files.extend(root.glob(pattern))

          for file in sorted(set(files)):
              try:
                  text = file.read_text(encoding="utf-8")
              except Exception:
                  continue

              original = text

              output = []

              for line in text.splitlines():
                  remove = False

                  for pattern in patterns:
                      if re.search(pattern, line, re.IGNORECASE):
                          remove = True
                          break

                  if not remove:
                      output.append(line)

              text = "\n".join(output)

              file.write_text(
                  text.rstrip() + "\n",
                  encoding="utf-8"
              )

              if text != original:
                  print("Modified:", file)

          # Delete every google-services.json
          for file in root.rglob("google-services.json"):
              try:
                  file.unlink()
                  print("Deleted:", file)
              except Exception:
                  pass
          PY

      # =========================================================
      # 9. REBUILD gradle.properties FROM SCRATCH
      # =========================================================
      - name: Rebuild gradle.properties
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          rm -f gradle.properties

          cat > gradle.properties <<'EOF'
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=false
          EOF

          echo "Clean gradle.properties created."

      # =========================================================
      # 10. REMOVE GENERATED/OLD GRADLE STATE
      # =========================================================
      - name: Remove old Gradle state
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          rm -rf .gradle
          rm -rf build

          if [ -d "app/build" ]; then
            rm -rf app/build
          fi

          echo "Old Gradle state removed."

      # =========================================================
      # 11. FINAL GOOGLE SERVICES VERIFICATION
      # =========================================================
      - name: Verify Google Services cleanup
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Checking Gradle files..."

          FOUND=0

          FILES="$(
            find . \
              -type f \
              \( \
                -name 'build.gradle' \
                -o \
                -name 'build.gradle.kts' \
                -o \
                -name 'settings.gradle' \
                -o \
                -name 'settings.gradle.kts' \
                -o \
                -name 'libs.versions.toml' \
                -o \
                -name 'gradle.properties' \
              \) \
              -not -path './.gradle/*'
          )"

          while IFS= read -r FILE; do

            [ -z "$FILE" ] && continue

            if grep -nEi \
              'google-services|googleservices|googleServices|MissingGoogleServicesStrategy|libs\.plugins\.google\.services|com\.google\.gms' \
              "$FILE" >/dev/null 2>&1; then

              echo "FORBIDDEN REFERENCE FOUND IN:"
              echo "$FILE"

              grep -nEi \
                'google-services|googleservices|googleServices|MissingGoogleServicesStrategy|libs\.plugins\.google\.services|com\.google\.gms' \
                "$FILE" \
                || true

              FOUND=1
            fi

          done <<< "$FILES"

          if find . \
            -type f \
            -name 'google-services.json' \
            -print \
            | grep -q .; then

            echo "google-services.json still exists."

            find . \
              -type f \
              -name 'google-services.json' \
              -print

            FOUND=1
          fi

          if [ "$FOUND" -ne 0 ]; then
            echo
            echo "ERROR: Google Services cleanup failed."
            exit 1
          fi

          echo
          echo "Google Services cleanup verified successfully."

      # =========================================================
      # 12. INSTALL GRADLE 9.3.1
      # =========================================================
      - name: Install Gradle 9.3.1
        shell: bash
        run: |
          set -e

          VERSION="9.3.1"
          DIR="/opt/gradle-${VERSION}"

          if [ ! -d "$DIR" ]; then

            curl -fL \
              "https://services.gradle.org/distributions/gradle-${VERSION}-bin.zip" \
              -o /tmp/gradle.zip

            unzip -q \
              /tmp/gradle.zip \
              -d /opt/
          fi

          echo "$DIR/bin" >> "$GITHUB_PATH"

          "$DIR/bin/gradle" --version

      # =========================================================
      # 13. CREATE DEBUG KEYSTORE
      # =========================================================
      - name: Create debug keystore
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android"

          KEYSTORE="$HOME/.android/debug.keystore"

          if [ ! -f "$KEYSTORE" ]; then

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

          fi

          cp "$KEYSTORE" "$PROJECT_DIR/debug.keystore"

          if [ -d "$PROJECT_DIR/app" ]; then
            cp "$KEYSTORE" "$PROJECT_DIR/app/debug.keystore"
          fi

      # =========================================================
      # 14. CHECK PROJECT
      # =========================================================
      - name: Check Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo "SETTINGS"
          echo "=============================================="

          if [ -f settings.gradle.kts ]; then
            cat settings.gradle.kts
          elif [ -f settings.gradle ]; then
            cat settings.gradle
          fi

          echo
          echo "=============================================="
          echo "ROOT BUILD"
          echo "=============================================="

          if [ -f build.gradle.kts ]; then
            cat build.gradle.kts
          elif [ -f build.gradle ]; then
            cat build.gradle
          fi

          echo
          echo "=============================================="
          echo "APP BUILD"
          echo "=============================================="

          if [ -f app/build.gradle.kts ]; then
            cat app/build.gradle.kts
          elif [ -f app/build.gradle ]; then
            cat app/build.gradle
          fi

          echo
          echo "=============================================="
          echo "GRADLE PROPERTIES"
          echo "=============================================="

          cat gradle.properties

      # =========================================================
      # 15. BUILD
      # =========================================================
      - name: Build Debug APK
        shell: bash
        env:
          CI: true
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m"
        run: |
          set -e

          cd "$PROJECT_DIR"

          export PATH="/opt/gradle-9.3.1/bin:$PATH"

          echo "=============================================="
          echo "GRADLE VERSION"
          echo "=============================================="

          gradle --version

          echo
          echo "=============================================="
          echo "CLEAN"
          echo "=============================================="

          gradle \
            clean \
            --no-daemon \
            --stacktrace

          echo
          echo "=============================================="
          echo "ASSEMBLE DEBUG"
          echo "=============================================="

          gradle \
            assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # =========================================================
      # 16. FIND APK
      # =========================================================
      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK="$(
            find "$PROJECT_DIR" \
              -type f \
              -name '*.apk' \
              -not -path '*/.gradle/*' \
              | grep -E 'debug.*\.apk$' \
              | head -n 1 \
              || true
          )"

          if [ -z "$APK" ]; then
            APK="$(
              find "$PROJECT_DIR" \
                -type f \
                -name '*.apk' \
                -not -path '*/.gradle/*' \
                | head -n 1 \
                || true
            )"
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: No APK generated."

            echo
            echo "All APK files:"
            find "$PROJECT_DIR" \
              -type f \
              -name '*.apk' \
              -print \
              || true

            echo
            echo "Build directories:"
            find "$PROJECT_DIR" \
              -type d \
              -name build \
              -print \
              | sort \
              || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p "$PROJECT_DIR/output"

          cp \
            "$APK" \
            "$PROJECT_DIR/output/Substack-Downloader-debug.apk"

          echo
          echo "Final APK size:"
          du -h \
            "$PROJECT_DIR/output/Substack-Downloader-debug.apk"

      # =========================================================
      # 17. UPLOAD APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Substack-Downloader-debug
          path: ${{ env.PROJECT_DIR }}/output/Substack-Downloader-debug.apk
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 18. SUCCESS
      # =========================================================
      - name: Build successful
        if: success()
        shell: bash
        run: |
          echo "=============================================="
          echo "SUBSTACK DOWNLOADER BUILD SUCCESSFUL"
          echo "=============================================="
          echo
          echo "Artifact:"
          echo "Substack-Downloader-debug"
