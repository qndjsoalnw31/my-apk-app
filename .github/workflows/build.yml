name: Build Substack Downloader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v5

      # =========================================================
      # 2. SETUP JDK 21
      # =========================================================
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # =========================================================
      # 3. VERIFY JAVA
      # =========================================================
      - name: Verify Java
        shell: bash
        run: |
          set -e

          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo
          echo "Java version:"
          java -version

          echo
          echo "Javac version:"
          javac -version

      # =========================================================
      # 4. ANDROID SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # =========================================================
      # 5. ACCEPT ANDROID LICENSES
      # =========================================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      # =========================================================
      # 6. INSTALL ANDROID SDK COMPONENTS
      # =========================================================
      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      # =========================================================
      # 7. EXTRACT ZIP
      # =========================================================
      - name: Extract Substack Downloader ZIP
        shell: bash
        run: |
          set -e

          if [ -d "extracted" ]; then
            echo "extracted/ already exists."
          else

            ZIP_FILE=""

            if [ -f "substack-downloader.zip" ]; then
              ZIP_FILE="substack-downloader.zip"
            else
              ZIP_FILE="$(
                find . \
                  -maxdepth 2 \
                  -type f \
                  -name '*.zip' \
                  | head -n 1 \
                  || true
              )"
            fi

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No ZIP file found."
              exit 1
            fi

            echo "Using ZIP:"
            echo "$ZIP_FILE"

            mkdir -p extracted

            unzip -o "$ZIP_FILE" -d extracted
          fi

      # =========================================================
      # 8. LOCATE ANDROID PROJECT
      # =========================================================
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          if [ -f "extracted/settings.gradle.kts" ] || \
             [ -f "extracted/settings.gradle" ]; then

            PROJECT_DIR="$(realpath extracted)"

          elif [ -f "settings.gradle.kts" ] || \
               [ -f "settings.gradle" ]; then

            PROJECT_DIR="$PWD"

          else

            SETTINGS_FILE="$(
              find . \
                -type f \
                \( \
                  -name 'settings.gradle.kts' \
                  -o \
                  -name 'settings.gradle' \
                \) \
                -not -path './.git/*' \
                | head -n 1 \
                || true
            )"

            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_DIR="$(
                realpath "$(dirname "$SETTINGS_FILE")"
              )"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."

            echo
            echo "Repository contents:"

            find . \
              -maxdepth 6 \
              -type f \
              -not -path './.git/*' \
              | sort

            exit 1
          fi

          echo "=============================================="
          echo "ANDROID PROJECT FOUND"
          echo "=============================================="

          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # =========================================================
      # 9. REMOVE GOOGLE SERVICES COMPLETELY
      # =========================================================
      - name: Remove Google Services
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()

          patterns = [
              r'com\.google\.gms\.googleservices',
              r'com\.google\.gms\.google-services',
              r'google-services',
              r'googleServices',
              r'MissingGoogleServicesStrategy',
              r'libs\.plugins\.google\.services',
          ]

          files = []

          for pattern in [
              "**/build.gradle",
              "**/build.gradle.kts",
              "**/settings.gradle",
              "**/settings.gradle.kts",
              "**/libs.versions.toml",
          ]:
              files.extend(root.glob(pattern))

          for file in sorted(set(files)):

              try:
                  text = file.read_text(encoding="utf-8")
              except Exception:
                  continue

              original = text
              output = []

              for line in text.splitlines():

                  remove = False

                  for pattern in patterns:
                      if re.search(pattern, line, re.IGNORECASE):
                          remove = True
                          break

                  if not remove:
                      output.append(line)

              text = "\n".join(output)

              file.write_text(
                  text.rstrip() + "\n",
                  encoding="utf-8"
              )

              if text != original:
                  print("Modified:", file)

          # Remove every google-services.json
          for file in root.rglob("google-services.json"):
              try:
                  file.unlink()
                  print("Deleted:", file)
              except Exception:
                  pass

          print("Google Services cleanup completed.")
          PY

      # =========================================================
      # 10. REBUILD gradle.properties
      # =========================================================
      - name: Rebuild gradle.properties
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          rm -f gradle.properties

          printf '%s\n' \
            'org.gradle.daemon=false' \
            'org.gradle.parallel=true' \
            'org.gradle.caching=true' \
            'org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
            'android.useAndroidX=true' \
            'android.nonTransitiveRClass=false' \
            > gradle.properties

          echo "Clean gradle.properties created."

      # =========================================================
      # 11. REMOVE OLD GRADLE STATE
      # =========================================================
      - name: Remove old Gradle state
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          rm -rf .gradle
          rm -rf build
          rm -rf app/build

          echo "Old Gradle state removed."

      # =========================================================
      # 12. VERIFY GOOGLE SERVICES CLEANUP
      # =========================================================
      - name: Verify Google Services cleanup
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          FOUND=0

          FILES="$(
            find . \
              -type f \
              \( \
                -name 'build.gradle' \
                -o \
                -name 'build.gradle.kts' \
                -o \
                -name 'settings.gradle' \
                -o \
                -name 'settings.gradle.kts' \
                -o \
                -name 'libs.versions.toml' \
                -o \
                -name 'gradle.properties' \
              \) \
              -not -path './.gradle/*'
          )"

          while IFS= read -r FILE; do

            [ -z "$FILE" ] && continue

            if grep -nEi \
              'google-services|googleservices|googleServices|MissingGoogleServicesStrategy|libs\.plugins\.google\.services|com\.google\.gms' \
              "$FILE" >/dev/null 2>&1; then

              echo "Forbidden Google Services reference:"
              echo "$FILE"

              grep -nEi \
                'google-services|googleservices|googleServices|MissingGoogleServicesStrategy|libs\.plugins\.google\.services|com\.google\.gms' \
                "$FILE" \
                || true

              FOUND=1
            fi

          done <<< "$FILES"

          JSON_FILES="$(
            find . \
              -type f \
              -name 'google-services.json' \
              -print \
              || true
          )"

          if [ -n "$JSON_FILES" ]; then
            echo "google-services.json files found:"
            echo "$JSON_FILES"
            FOUND=1
          fi

          if [ "$FOUND" -ne 0 ]; then
            echo
            echo "ERROR: Google Services cleanup failed."
            exit 1
          fi

          echo "Google Services cleanup verified."

      # =========================================================
      # 13. INSTALL GRADLE 9.3.1
      # =========================================================
      - name: Install Gradle 9.3.1
        shell: bash
        run: |
          set -e

          VERSION="9.3.1"
          DIR="/opt/gradle-${VERSION}"

          if [ ! -d "$DIR" ]; then

            curl -fL \
              "https://services.gradle.org/distributions/gradle-${VERSION}-bin.zip" \
              -o /tmp/gradle.zip

            unzip -q \
              /tmp/gradle.zip \
              -d /opt/

          fi

          echo "$DIR/bin" >> "$GITHUB_PATH"

          "$DIR/bin/gradle" --version

      # =========================================================
      # 14. VERIFY GRADLE + JAVA 21
      # =========================================================
      - name: Verify build environment
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "JAVA"
          echo "=============================================="

          java -version
          javac -version

          echo
          echo "=============================================="
          echo "GRADLE"
          echo "=============================================="

          gradle --version

      # =========================================================
      # 15. CREATE DEBUG KEYSTORE
      # =========================================================
      - name: Create debug keystore
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android"

          KEYSTORE="$HOME/.android/debug.keystore"

          if [ ! -f "$KEYSTORE" ]; then

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

          fi

          cp \
            "$KEYSTORE" \
            "$PROJECT_DIR/debug.keystore"

          if [ -d "$PROJECT_DIR/app" ]; then

            cp \
              "$KEYSTORE" \
              "$PROJECT_DIR/app/debug.keystore"

          fi

          echo "Debug keystore ready."

      # =========================================================
      # 16. INSPECT JAVA CONFIGURATION
      # =========================================================
      - name: Inspect Java configuration
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Java-related configuration:"

          grep -Rni \
            --exclude-dir=.git \
            --exclude-dir=.gradle \
            -E \
            'JavaVersion|jvmToolchain|sourceCompatibility|targetCompatibility|kotlinOptions|jvmTarget' \
            . \
            || true

      # =========================================================
      # 17. CLEAN
      # =========================================================
      - name: Gradle clean
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m"
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle \
            clean \
            --no-daemon \
            --stacktrace

      # =========================================================
      # 18. BUILD DEBUG APK
      # =========================================================
      - name: Build Debug APK
        shell: bash
        env:
          CI: true
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m"
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo "BUILDING DEBUG APK"
          echo "=============================================="

          gradle \
            assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # =========================================================
      # 19. FIND APK
      # =========================================================
      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK="$(
            find "$PROJECT_DIR" \
              -type f \
              -name '*.apk' \
              -not -path '*/.gradle/*' \
              | grep -E 'debug.*\.apk$' \
              | head -n 1 \
              || true
          )"

          if [ -z "$APK" ]; then

            APK="$(
              find "$PROJECT_DIR" \
                -type f \
                -name '*.apk' \
                -not -path '*/.gradle/*' \
                | head -n 1 \
                || true
            )"

          fi

          if [ -z "$APK" ]; then

            echo "ERROR: APK was not generated."

            echo
            echo "All APK files:"

            find "$PROJECT_DIR" \
              -type f \
              -name '*.apk' \
              -print \
              || true

            echo
            echo "Build directories:"

            find "$PROJECT_DIR" \
              -type d \
              -name build \
              -print \
              | sort \
              || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p "$PROJECT_DIR/output"

          cp \
            "$APK" \
            "$PROJECT_DIR/output/Substack-Downloader-debug.apk"

          echo
          echo "Final APK:"
          ls -lh \
            "$PROJECT_DIR/output/Substack-Downloader-debug.apk"

      # =========================================================
      # 20. UPLOAD APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Substack-Downloader-debug
          path: ${{ env.PROJECT_DIR }}/output/Substack-Downloader-debug.apk
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 21. SUCCESS
      # =========================================================
      - name: Build successful
        if: success()
        shell: bash
        run: |
          echo "=============================================="
          echo "SUBSTACK DOWNLOADER BUILD SUCCESSFUL"
          echo "=============================================="
          echo
          echo "APK artifact:"
          echo "Substack-Downloader-debug"
