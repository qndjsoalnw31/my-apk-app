name: Build TikTok Downloader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.13"
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"

jobs:
  build:

    name: Build Android APK

    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # ==========================================================
      # 2. JAVA
      #
      # IMPORTANT:
      # Do NOT use cache: gradle here.
      # The Gradle project is inside the ZIP.
      # ==========================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================================
      # 3. ANDROID SDK
      # ==========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ==========================================================
      # 4. INSTALL REQUIRED ANDROID SDK
      # ==========================================================

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

          echo ""
          echo "Android SDK installed successfully."

          sdkmanager --list_installed | head -100


      # ==========================================================
      # 5. INSPECT REPOSITORY
      # ==========================================================

      - name: Inspect repository
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "REPOSITORY"
          echo "=============================================="

          echo "Working directory:"
          pwd

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Repository files:"
          find . -maxdepth 4 -type f | sort


      # ==========================================================
      # 6. FIND ZIP
      # ==========================================================

      - name: Find TikTok Downloader ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=""

          if [ -f "tiktok-downloader.zip" ]; then
            ZIP_FILE="tiktok-downloader.zip"
          else
            ZIP_FILE="$(
              find . \
                -type f \
                -iname "*.zip" \
                -not -path "./.git/*" \
                | head -n 1
            )"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo ""
            echo "ERROR: No ZIP file was found."
            echo ""
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "ZIP FILE:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ==========================================================
      # 7. VERIFY ZIP
      # ==========================================================

      - name: Verify ZIP
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ZIP CONTENT"
          echo "=============================================="

          unzip -l "$ZIP_FILE"

          echo ""
          echo "Testing ZIP integrity..."

          unzip -t "$ZIP_FILE" >/dev/null

          echo "ZIP integrity: OK"


      # ==========================================================
      # 8. EXTRACT PROJECT
      # ==========================================================

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/android-project"

          mkdir -p "$GITHUB_WORKSPACE/android-project"

          unzip -q \
            "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/android-project"

          echo "=============================================="
          echo "EXTRACTED PROJECT"
          echo "=============================================="

          find "$GITHUB_WORKSPACE/android-project" \
            -maxdepth 8 \
            -type f \
            | sort


      # ==========================================================
      # 9. LOCATE GRADLE PROJECT
      # ==========================================================

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          ROOT="$GITHUB_WORKSPACE/android-project"

          PROJECT_DIR=""

          # ------------------------------------------------------
          # First try settings.gradle
          # ------------------------------------------------------

          SETTINGS_FILE="$(
            find "$ROOT" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -not -path "*/build/*" \
              | head -n 1
          )"

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi


          # ------------------------------------------------------
          # Second try gradlew
          # ------------------------------------------------------

          if [ -z "$PROJECT_DIR" ]; then

            GRADLEW_FILE="$(
              find "$ROOT" \
                -type f \
                -name "gradlew" \
                -not -path "*/build/*" \
                | head -n 1
            )"

            if [ -n "$GRADLEW_FILE" ]; then
              PROJECT_DIR="$(dirname "$GRADLEW_FILE")"
            fi

          fi


          # ------------------------------------------------------
          # Third try build.gradle
          # ------------------------------------------------------

          if [ -z "$PROJECT_DIR" ]; then

            BUILD_FILE="$(
              find "$ROOT" \
                -type f \
                \( \
                  -name "build.gradle" \
                  -o \
                  -name "build.gradle.kts" \
                \) \
                -not -path "*/build/*" \
                | head -n 1
            )"

            if [ -n "$BUILD_FILE" ]; then
              PROJECT_DIR="$(dirname "$BUILD_FILE")"
            fi

          fi


          # ------------------------------------------------------
          # Nothing found
          # ------------------------------------------------------

          if [ -z "$PROJECT_DIR" ]; then

            echo ""
            echo "=============================================="
            echo "ANDROID PROJECT NOT FOUND"
            echo "=============================================="

            echo ""
            echo "The ZIP does not appear to contain a Gradle Android project."

            echo ""
            echo "Expected files:"
            echo "  settings.gradle"
            echo "  settings.gradle.kts"
            echo "  build.gradle"
            echo "  build.gradle.kts"
            echo "  gradlew"

            echo ""
            echo "Complete ZIP tree:"

            find "$ROOT" -maxdepth 12 -print

            exit 1
          fi


          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo ""
          echo "=============================================="
          echo "ANDROID PROJECT FOUND"
          echo "=============================================="

          echo "$PROJECT_DIR"

          echo ""

          ls -la "$PROJECT_DIR"

          echo ""

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================================
      # 10. INSPECT ANDROID PROJECT
      # ==========================================================

      - name: Inspect Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo "PROJECT ROOT"
          echo "=============================================="

          pwd

          echo ""
          echo "Files:"
          find . -maxdepth 5 -type f | sort

          echo ""
          echo "Directories:"
          find . -maxdepth 3 -type d | sort


      # ==========================================================
      # 11. FIND ANDROID APP MODULE
      # ==========================================================

      - name: Locate Android app module
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MODULE_DIR=""

          # Normal Android structure
          if [ -d "app" ]; then
            MODULE_DIR="$PROJECT_DIR/app"
          fi


          # Search for AndroidManifest if app/ is not present
          if [ -z "$MODULE_DIR" ]; then

            MANIFEST="$(
              find . \
                -type f \
                -path "*/src/main/AndroidManifest.xml" \
                | head -n 1
            )"

            if [ -n "$MANIFEST" ]; then

              MODULE_DIR="$(dirname "$(dirname "$(dirname "$MANIFEST")")")"

            fi

          fi


          if [ -z "$MODULE_DIR" ]; then

            echo ""
            echo "=============================================="
            echo "ANDROID APP MODULE NOT FOUND"
            echo "=============================================="

            echo "Project tree:"

            find . -maxdepth 8 -print

            exit 1

          fi


          MODULE_DIR="$(realpath "$MODULE_DIR")"

          echo ""
          echo "Android module:"
          echo "$MODULE_DIR"

          echo "APP_MODULE=$MODULE_DIR" >> "$GITHUB_ENV"


      # ==========================================================
      # 12. SETUP GRADLE
      #
      # This happens AFTER the ZIP has been extracted.
      # ==========================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}


      # ==========================================================
      # 13. GENERATE GRADLE WRAPPER
      # ==========================================================

      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then

            echo "Existing Gradle Wrapper found."

            chmod +x ./gradlew

          else

            echo "Gradle Wrapper not found."
            echo "Generating wrapper..."

            gradle wrapper \
              --gradle-version "${GRADLE_VERSION}" \
              --distribution-type bin

            chmod +x ./gradlew

          fi


      # ==========================================================
      # 14. VERIFY GRADLE
      # ==========================================================

      - name: Verify Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          ./gradlew --version


      # ==========================================================
      # 15. CHECK GRADLE PROJECT
      # ==========================================================

      - name: Check Gradle tasks
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew tasks \
            --no-daemon \
            --console=plain \
            --stacktrace


      # ==========================================================
      # 16. CLEAN
      # ==========================================================

      - name: Clean build
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew clean \
            --no-daemon \
            --stacktrace \
            --console=plain


      # ==========================================================
      # 17. BUILD DEBUG APK
      # ==========================================================

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo "BUILDING DEBUG APK"
          echo "=============================================="

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"


      # ==========================================================
      # 18. FIND APK
      # ==========================================================

      - name: Find generated APK
        if: success()
        shell: bash
        run: |
          set -e

          OUTPUT="$GITHUB_WORKSPACE/apk-output"

          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT"

          echo "=============================================="
          echo "SEARCHING FOR APK"
          echo "=============================================="

          mapfile -t APKS < <(
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -path "*/build/outputs/*" \
              | sort
          )

          if [ "${#APKS[@]}" -eq 0 ]; then

            echo ""
            echo "ERROR: No APK was generated."

            echo ""
            echo "Build outputs:"

            find "$PROJECT_DIR" \
              -type f \
              -path "*/build/outputs/*" \
              -print || true

            exit 1

          fi


          INDEX=1

          for APK in "${APKS[@]}"; do

            echo "Found:"
            echo "$APK"

            if [ "$INDEX" -eq 1 ]; then

              cp "$APK" \
                "$OUTPUT/TikTok-Downloader-debug.apk"

            else

              cp "$APK" \
                "$OUTPUT/TikTok-Downloader-debug-$INDEX.apk"

            fi

            INDEX=$((INDEX + 1))

          done


          echo ""
          echo "=============================================="
          echo "APK FILES"
          echo "=============================================="

          ls -lh "$OUTPUT"


      # ==========================================================
      # 19. UPLOAD APK
      # ==========================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-Downloader-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30


      # ==========================================================
      # 20. ALWAYS SAVE GRADLE LOG
      # ==========================================================

      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gradle-Build-Log
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7
