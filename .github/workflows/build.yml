
name: Build Substack Downloader APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Substack Downloader
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "platforms;android-36.1" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Extract substack-downloader.zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/substack-downloader.zip"

          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "ERROR: substack-downloader.zip was not found."
            echo "Upload substack-downloader.zip to the repository root."
            echo "Available ZIP files:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 -type f -iname '*.zip' -print || true
            exit 1
          fi

          echo "Using archive: substack-downloader.zip"

          if ! unzip -Z1 "$ZIP_FILE" | \
            grep -E '(^|/)settings\.gradle(\.kts)?$' \
            >/dev/null; then
            echo "ERROR: ZIP does not contain a Gradle settings file."
            exit 1
          fi

          EXTRACT_DIR="$RUNNER_TEMP/substack-downloader"
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          SETTINGS_FILE="$(
            find "$EXTRACT_DIR" -type f \
              \( -name settings.gradle \
                 -o -name settings.gradle.kts \) \
              -not -path '*/.gradle/*' \
              -print -quit
          )"

          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "ERROR: settings.gradle(.kts) not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [[ ! -f "$PROJECT_DIR/app/build.gradle.kts" && \
                ! -f "$PROJECT_DIR/app/build.gradle" ]]; then
            echo "ERROR: Android app module was not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Build Debug APK
        id: build_apk
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Gradle version:"
          gradle --version

          gradle --no-daemon \
            :app:assembleDebug \
            --stacktrace

          APK_PATH="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -f "$APK_PATH" ]]; then
            echo "ERROR: APK was not generated."
            find "$PROJECT_DIR" \
              -type f -name '*.apk' -print || true
            exit 1
          fi

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

          echo "APK built successfully: $APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Substack-Downloader-APK
          path: ${{ steps.build_apk.outputs.apk_path }}
          archive: false
          if-no-files-found: error
