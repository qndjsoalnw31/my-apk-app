name: Build TikTok Downloader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v7

      # ==========================================================
      # 2. Java 17
      # ==========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # 3. Use GitHub's preinstalled Android SDK
      # ==========================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_HOME:-}" ]; then
            if [ -d "/usr/local/lib/android/sdk" ]; then
              echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
              echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
              export ANDROID_HOME="/usr/local/lib/android/sdk"
              export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
            else
              echo "ERROR: Android SDK was not found."
              exit 1
            fi
          fi

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          echo
          echo "Installed Android platforms:"
          find "$ANDROID_HOME/platforms" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            -printf "%f\n" \
            | sort -V || true

          echo
          echo "Installed Build Tools:"
          find "$ANDROID_HOME/build-tools" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            -printf "%f\n" \
            | sort -V || true

          echo
          echo "ADB:"
          adb version

      # ==========================================================
      # 4. Find ZIP
      # ==========================================================
      - name: Find TikTok project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          if [ -f "$GITHUB_WORKSPACE/tiktok-downloader.zip" ]; then
            ZIP_FILE="$GITHUB_WORKSPACE/tiktok-downloader.zip"
          else
            ZIP_FILE="$(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -iname "*.zip" \
                -not -path "*/.git/*" \
                | head -n 1 || true
            )"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: tiktok-downloader.zip was not found."
            echo
            find "$GITHUB_WORKSPACE" \
              -maxdepth 5 \
              -type f \
              | sort
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "Using:"
          echo "$ZIP_FILE"

      # ==========================================================
      # 5. Validate ZIP
      # ==========================================================
      - name: Validate ZIP
        shell: bash
        run: |
          set -euo pipefail

          unzip -t "$ZIP_FILE" >/dev/null

          echo "ZIP validation: OK"

      # ==========================================================
      # 6. Extract project
      # ==========================================================
      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/android-project"
          mkdir -p "$GITHUB_WORKSPACE/android-project"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/android-project"

          echo "Extracted project:"
          find "$GITHUB_WORKSPACE/android-project" \
            -maxdepth 10 \
            -type f \
            | sort

      # ==========================================================
      # 7. Locate Gradle project
      # ==========================================================
      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/android-project"
          PROJECT_DIR=""

          SETTINGS_FILE="$(
            find "$ROOT" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -not -path "*/build/*" \
              | sort \
              | head -n 1 || true
          )"

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            GRADLEW_FILE="$(
              find "$ROOT" \
                -type f \
                -name "gradlew" \
                -not -path "*/build/*" \
                | sort \
                | head -n 1 || true
            )"

            if [ -n "$GRADLEW_FILE" ]; then
              PROJECT_DIR="$(dirname "$GRADLEW_FILE")"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project not found."
            echo
            find "$ROOT" -maxdepth 12 -print | sort
            exit 1
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "PROJECT:"
          echo "$PROJECT_DIR"

      # ==========================================================
      # 8. Detect Android app module
      # ==========================================================
      - name: Detect Android module
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          APP_DIR=""

          if [ -d "app" ]; then
            APP_DIR="$(realpath "app")"
          fi

          if [ -z "$APP_DIR" ]; then
            MANIFEST="$(
              find . \
                -type f \
                -path "*/src/main/AndroidManifest.xml" \
                -not -path "*/build/*" \
                | sort \
                | head -n 1 || true
            )"

            if [ -n "$MANIFEST" ]; then
              APP_DIR="$(realpath \
                "$(dirname \
                  "$(dirname \
                    "$(dirname "$MANIFEST")"
                  )"
                )"
              )"
            fi
          fi

          if [ -z "$APP_DIR" ]; then
            echo "ERROR: Android app module not found."
            echo
            find . -maxdepth 10 -type d | sort
            exit 1
          fi

          APP_DIR="$(realpath "$APP_DIR")"

          RELATIVE_APP="${APP_DIR#$PROJECT_DIR/}"

          if [ "$RELATIVE_APP" = "$APP_DIR" ] || [ -z "$RELATIVE_APP" ]; then
            BUILD_TASK="assembleDebug"
          else
            MODULE_NAME="${RELATIVE_APP//\//:}"
            BUILD_TASK=":${MODULE_NAME}:assembleDebug"
          fi

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "BUILD_TASK=$BUILD_TASK" >> "$GITHUB_ENV"

          echo "APP:"
          echo "$APP_DIR"

          echo "BUILD TASK:"
          echo "$BUILD_TASK"

      # ==========================================================
      # 9. Detect AGP / Gradle
      # ==========================================================
      - name: Detect Gradle version
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          AGP_VERSION=""

          # Old buildscript syntax:
          # com.android.tools.build:gradle:8.x.x
          AGP_VERSION="$(
            grep -RhoE \
              'com\.android\.tools\.build:gradle:[0-9]+\.[0-9]+(\.[0-9]+)?' \
              . \
              --include='*.gradle' \
              --include='*.gradle.kts' \
              2>/dev/null \
              | sed 's/.*://' \
              | sort -V \
              | tail -n 1 \
              || true
          )"

          # plugins {} syntax:
          # id("com.android.application") version "8.x.x"
          if [ -z "$AGP_VERSION" ]; then
            AGP_VERSION="$(
              grep -RhoE \
                'com\.android\.(application|library)[^[:cntrl:]\r\n]*version[[:space:]]*["'\''][0-9]+\.[0-9]+(\.[0-9]+)?["'\'']' \
                . \
                --include='*.gradle' \
                --include='*.gradle.kts' \
                2>/dev/null \
                | grep -oE \
                  '[0-9]+\.[0-9]+(\.[0-9]+)?' \
                | sort -V \
                | tail -n 1 \
                || true
            )"
          fi

          # Version catalog:
          # agp = "8.x.x"
          if [ -z "$AGP_VERSION" ] && [ -f "gradle/libs.versions.toml" ]; then
            AGP_VERSION="$(
              grep -E \
                '^[[:space:]]*(agp|android-gradle-plugin)[[:alnum:]_.-]*[[:space:]]*=' \
                gradle/libs.versions.toml \
                | grep -oE \
                  '[0-9]+\.[0-9]+(\.[0-9]+)?' \
                | sort -V \
                | tail -n 1 \
                || true
            )"
          fi

          if [ -z "$AGP_VERSION" ]; then
            echo "ERROR: Android Gradle Plugin version could not be detected."
            echo
            echo "Gradle files:"
            find . \
              -type f \
              \( \
                -name "*.gradle" \
                -o \
                -name "*.gradle.kts" \
                -o \
                -name "libs.versions.toml" \
              \) \
              -not -path "*/build/*" \
              | sort

            exit 1
          fi

          AGP_MAJOR_MINOR="$(echo "$AGP_VERSION" | cut -d. -f1,2)"

          case "$AGP_MAJOR_MINOR" in
            9.4) GRADLE_VERSION="9.6.0" ;;
            9.3) GRADLE_VERSION="9.5.0" ;;
            9.2) GRADLE_VERSION="9.4.1" ;;
            9.1) GRADLE_VERSION="9.3.1" ;;
            9.0) GRADLE_VERSION="9.1.0" ;;

            8.13) GRADLE_VERSION="8.13" ;;
            8.12) GRADLE_VERSION="8.13" ;;
            8.11) GRADLE_VERSION="8.13" ;;
            8.10) GRADLE_VERSION="8.11.1" ;;
            8.9)  GRADLE_VERSION="8.11.1" ;;
            8.8)  GRADLE_VERSION="8.10.2" ;;
            8.7)  GRADLE_VERSION="8.9" ;;
            8.6)  GRADLE_VERSION="8.7" ;;
            8.5)  GRADLE_VERSION="8.7" ;;
            8.4)  GRADLE_VERSION="8.6" ;;
            8.3)  GRADLE_VERSION="8.4" ;;
            8.2)  GRADLE_VERSION="8.2" ;;
            8.1)  GRADLE_VERSION="8.0" ;;
            8.0)  GRADLE_VERSION="8.0" ;;

            7.4)  GRADLE_VERSION="7.5" ;;
            7.3)  GRADLE_VERSION="7.4" ;;
            7.2)  GRADLE_VERSION="7.3.3" ;;
            7.1)  GRADLE_VERSION="7.2" ;;
            7.0)  GRADLE_VERSION="7.0" ;;

            *)
              echo "ERROR: Unsupported AGP version: $AGP_VERSION"
              exit 1
              ;;
          esac

          echo "AGP_VERSION=$AGP_VERSION" >> "$GITHUB_ENV"
          echo "GRADLE_VERSION=$GRADLE_VERSION" >> "$GITHUB_ENV"

          echo "AGP:"
          echo "$AGP_VERSION"

          echo "Gradle:"
          echo "$GRADLE_VERSION"

      # ==========================================================
      # 10. Detect compileSdk only for verification
      # ==========================================================
      - name: Detect compileSdk
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          COMPILE_SDK=""

          COMPILE_SDK="$(
            grep -RhoE \
              'compileSdk(Version)?[[:space:]]*=?[[:space:]]*[0-9]{2,3}' \
              . \
              --include='*.gradle' \
              --include='*.gradle.kts' \
              2>/dev/null \
              | grep -oE '[0-9]{2,3}$' \
              | head -n 1 \
              || true
          )"

          if [ -z "$COMPILE_SDK" ] && [ -f "gradle/libs.versions.toml" ]; then
            COMPILE_SDK="$(
              grep -E \
                '^[[:space:]]*compileSdk[[:space:]]*=' \
                gradle/libs.versions.toml \
                | grep -oE '[0-9]{2,3}' \
                | head -n 1 \
                || true
            )"
          fi

          if [ -n "$COMPILE_SDK" ]; then
            echo "COMPILE_SDK=$COMPILE_SDK" >> "$GITHUB_ENV"
            echo "compileSdk detected: $COMPILE_SDK"
          else
            echo "COMPILE_SDK=" >> "$GITHUB_ENV"
            echo "compileSdk is managed indirectly by the project."
          fi

      # ==========================================================
      # 11. Install missing platform ONLY when necessary
      # ==========================================================
      - name: Check Android platform
        if: env.COMPILE_SDK != ''
        shell: bash
        run: |
          set -euo pipefail

          PLATFORM="$ANDROID_HOME/platforms/android-${COMPILE_SDK}"

          if [ -d "$PLATFORM" ]; then
            echo "Android platform ${COMPILE_SDK} is already installed."
          else
            echo "Android platform ${COMPILE_SDK} is missing."
            echo "Trying to install only the missing platform..."

            sdkmanager \
              --install \
              "platforms;android-${COMPILE_SDK}"
          fi

      # ==========================================================
      # 12. Setup Gradle
      # ==========================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-disabled: false

      # ==========================================================
      # 13. Verify Gradle
      # ==========================================================
      - name: Verify Gradle
        shell: bash
        run: |
          set -euo pipefail

          echo "Java:"
          java -version

          echo
          echo "Gradle:"
          gradle --version

          echo
          echo "Android SDK:"
          echo "$ANDROID_HOME"

      # ==========================================================
      # 14. Build APK
      # ==========================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          : > "$GITHUB_WORKSPACE/gradle-build.log"

          echo "============================================="
          echo "BUILD START"
          echo "============================================="

          echo "Project: $PROJECT_DIR"
          echo "App: $APP_DIR"
          echo "Task: $BUILD_TASK"
          echo "AGP: $AGP_VERSION"
          echo "Gradle: $GRADLE_VERSION"
          echo "compileSdk: ${COMPILE_SDK:-managed by project}"

          echo
          echo "============================================="
          echo "GRADLE BUILD"
          echo "============================================="

          gradle "$BUILD_TASK" \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all \
            --no-configuration-cache \
            --console=plain \
            2>&1 \
            | tee "$GITHUB_WORKSPACE/gradle-build.log"

      # ==========================================================
      # 15. Find APK
      # ==========================================================
      - name: Find APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="$GITHUB_WORKSPACE/apk-output"

          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT"

          APK="$(
            find "$PROJECT_DIR" \
              -type f \
              -name "*-debug.apk" \
              -path "*/build/outputs/*" \
              | sort \
              | head -n 1 \
              || true
          )"

          if [ -z "$APK" ]; then
            APK="$(
              find "$PROJECT_DIR" \
                -type f \
                -name "*.apk" \
                -path "*/build/outputs/*" \
                | sort \
                | head -n 1 \
                || true
            )"
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was produced."

            echo
            echo "Build output:"
            find "$PROJECT_DIR" \
              -type f \
              -path "*/build/outputs/*" \
              | sort \
              || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" \
            "$OUTPUT/TikTok-Downloader-debug.apk"

          sha256sum \
            "$OUTPUT/TikTok-Downloader-debug.apk" \
            > "$OUTPUT/SHA256SUMS.txt"

          ls -lh "$OUTPUT"

      # ==========================================================
      # 16. Upload APK
      # ==========================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: TikTok-Downloader-APK
          path: |
            apk-output/TikTok-Downloader-debug.apk
            apk-output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      # ==========================================================
      # 17. Always upload Gradle log
      # ==========================================================
      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: TikTok-Downloader-Gradle-Log
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 14
