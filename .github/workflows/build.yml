name: Build TikTok Downloader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build TikTok Downloader APK
    runs-on: ubuntu-24.04

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v7


      # =========================================================
      # 2. Java 17
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # 3. Android SDK
      # =========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # =========================================================
      # 4. Find ZIP
      # =========================================================

      - name: Find TikTok project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=""

          if [ -f "$GITHUB_WORKSPACE/tiktok-downloader.zip" ]; then
            ZIP_FILE="$GITHUB_WORKSPACE/tiktok-downloader.zip"
          else
            ZIP_FILE="$(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -iname "*.zip" \
                -not -path "*/.git/*" \
                | head -n 1
            )"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: tiktok-downloader.zip was not found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "Using:"
          echo "$ZIP_FILE"


      # =========================================================
      # 5. Verify ZIP
      # =========================================================

      - name: Verify ZIP
        shell: bash
        run: |
          set -e

          unzip -t "$ZIP_FILE" >/dev/null

          echo "ZIP integrity: OK"


      # =========================================================
      # 6. Extract ZIP
      # =========================================================

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/android-project"

          mkdir -p "$GITHUB_WORKSPACE/android-project"

          unzip -q \
            "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/android-project"

          echo "Project extracted."


      # =========================================================
      # 7. Find Android project
      # =========================================================

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          ROOT="$GITHUB_WORKSPACE/android-project"
          PROJECT_DIR=""

          # Prefer project containing app/
          while IFS= read -r SETTINGS; do

            CANDIDATE="$(dirname "$SETTINGS")"

            if [ -d "$CANDIDATE/app" ]; then
              PROJECT_DIR="$CANDIDATE"
              break
            fi

          done < <(
            find "$ROOT" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -not -path "*/build/*" \
              | sort
          )


          # Any settings.gradle
          if [ -z "$PROJECT_DIR" ]; then

            SETTINGS="$(
              find "$ROOT" \
                -type f \
                \( \
                  -name "settings.gradle" \
                  -o \
                  -name "settings.gradle.kts" \
                \) \
                -not -path "*/build/*" \
                | head -n 1
            )"

            if [ -n "$SETTINGS" ]; then
              PROJECT_DIR="$(dirname "$SETTINGS")"
            fi

          fi


          # gradlew fallback
          if [ -z "$PROJECT_DIR" ]; then

            GRADLEW="$(
              find "$ROOT" \
                -type f \
                -name "gradlew" \
                -not -path "*/build/*" \
                | head -n 1
            )"

            if [ -n "$GRADLEW" ]; then
              PROJECT_DIR="$(dirname "$GRADLEW")"
            fi

          fi


          if [ -z "$PROJECT_DIR" ]; then

            echo "ERROR: Android Gradle project not found."

            echo ""
            echo "Extracted tree:"

            find "$ROOT" -maxdepth 12 -print | sort

            exit 1

          fi


          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Android project:"
          echo "$PROJECT_DIR"


      # =========================================================
      # 8. Find application module
      # =========================================================

      - name: Locate application module
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APP_MODULE=""

          # Standard app module
          if [ -d "app" ]; then
            APP_MODULE="$PROJECT_DIR/app"
          fi


          # Manifest fallback
          if [ -z "$APP_MODULE" ]; then

            MANIFEST="$(
              find . \
                -type f \
                -path "*/src/main/AndroidManifest.xml" \
                | head -n 1
            )"

            if [ -n "$MANIFEST" ]; then

              APP_MODULE="$(
                dirname \
                "$(dirname \
                "$(dirname "$MANIFEST")")"
              )"

            fi

          fi


          if [ -z "$APP_MODULE" ]; then

            echo "ERROR: Android application module not found."

            find . -maxdepth 8 -print | sort

            exit 1

          fi


          APP_MODULE="$(realpath "$APP_MODULE")"

          RELATIVE_MODULE="${APP_MODULE#$PROJECT_DIR/}"

          if [ "$RELATIVE_MODULE" = "$APP_MODULE" ]; then
            RELATIVE_MODULE="app"
          fi

          MODULE_TASK=":${RELATIVE_MODULE//\//:}:assembleDebug"

          echo "APP_MODULE=$APP_MODULE" >> "$GITHUB_ENV"
          echo "MODULE_TASK=$MODULE_TASK" >> "$GITHUB_ENV"

          echo ""
          echo "Application module:"
          echo "$APP_MODULE"

          echo ""
          echo "Build task:"
          echo "$MODULE_TASK"


      # =========================================================
      # 9. Determine Gradle version
      # =========================================================

      - name: Determine Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          USE_WRAPPER="false"
          GRADLE_VERSION=""
          AGP_VERSION=""

          # -----------------------------------------------------
          # Existing wrapper
          # -----------------------------------------------------

          if [ -f "./gradlew" ] && \
             [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then

            chmod +x ./gradlew

            USE_WRAPPER="true"

            echo "Existing Gradle Wrapper found."

          fi


          # -----------------------------------------------------
          # Read wrapper version if wrapper script exists
          # -----------------------------------------------------

          if [ "$USE_WRAPPER" = "true" ]; then

            DISTRIBUTION_URL="$(
              grep '^distributionUrl=' \
                gradle/wrapper/gradle-wrapper.properties \
                | head -n 1 \
                | cut -d'=' -f2-
            )"

            GRADLE_VERSION="$(
              echo "$DISTRIBUTION_URL" \
              | sed -n \
                's/.*gradle-\([0-9][0-9.]*\)-.*/\1/p'
            )"

            echo ""
            echo "Wrapper Gradle:"
            echo "${GRADLE_VERSION:-unknown}"

          fi


          # -----------------------------------------------------
          # Detect AGP
          # -----------------------------------------------------

          if [ "$USE_WRAPPER" = "false" ]; then

            # libs.versions.toml
            if [ -f "gradle/libs.versions.toml" ]; then

              # Direct version:
              # agp = "8.13.2"
              AGP_VERSION="$(
                grep -Ei \
                  '^[[:space:]]*(agp|androidGradlePlugin)[[:space:]]*=' \
                  gradle/libs.versions.toml \
                  | grep -oE \
                    '[0-9]+\.[0-9]+\.[0-9]+' \
                  | head -n 1 \
                  || true
              )"

            fi


            # Plugin version in Gradle files
            if [ -z "$AGP_VERSION" ]; then

              AGP_VERSION="$(
                grep -RhoE \
                  'com\.android\.application[[:space:]]*[^0-9]{0,100}[0-9]+\.[0-9]+\.[0-9]+' \
                  . \
                  --include="*.gradle" \
                  --include="*.gradle.kts" \
                  | grep -oE \
                    '[0-9]+\.[0-9]+\.[0-9]+' \
                  | head -n 1 \
                  || true
              )"

            fi


            # buildscript classpath
            if [ -z "$AGP_VERSION" ]; then

              AGP_VERSION="$(
                grep -RhoE \
                  'com\.android\.tools\.build:gradle:[0-9]+\.[0-9]+\.[0-9]+' \
                  . \
                  --include="*.gradle" \
                  --include="*.gradle.kts" \
                  | grep -oE \
                    '[0-9]+\.[0-9]+\.[0-9]+' \
                  | head -n 1 \
                  || true
              )"

            fi

          fi


          echo ""
          echo "Detected AGP:"
          echo "${AGP_VERSION:-unknown}"


          # -----------------------------------------------------
          # Exact AGP -> Gradle compatibility
          # -----------------------------------------------------

          if [ "$USE_WRAPPER" = "false" ]; then

            if [ -z "$AGP_VERSION" ]; then

              echo ""
              echo "WARNING: AGP version could not be detected."
              echo "Using Gradle 8.13 fallback."

              GRADLE_VERSION="8.13"

            else

              AGP_MAJOR="$(echo "$AGP_VERSION" | cut -d. -f1)"
              AGP_MINOR="$(echo "$AGP_VERSION" | cut -d. -f2)"


              # AGP 9.4.x -> Gradle 9.6
              if [ "$AGP_MAJOR" -eq 9 ] && [ "$AGP_MINOR" -ge 4 ]; then

                GRADLE_VERSION="9.6.0"

              # AGP 9.3.x -> Gradle 9.5
              elif [ "$AGP_MAJOR" -eq 9 ] && [ "$AGP_MINOR" -eq 3 ]; then

                GRADLE_VERSION="9.5.0"

              # AGP 9.2.x -> Gradle 9.4.1
              elif [ "$AGP_MAJOR" -eq 9 ] && [ "$AGP_MINOR" -eq 2 ]; then

                GRADLE_VERSION="9.4.1"

              # AGP 9.1.x -> Gradle 9.3.1
              elif [ "$AGP_MAJOR" -eq 9 ] && [ "$AGP_MINOR" -eq 1 ]; then

                GRADLE_VERSION="9.3.1"

              # AGP 9.0.x -> Gradle 9.1
              elif [ "$AGP_MAJOR" -eq 9 ]; then

                GRADLE_VERSION="9.1.0"

              # AGP 8.13 / 8.12 / 8.11 -> Gradle 8.13
              elif [ "$AGP_MAJOR" -eq 8 ] && [ "$AGP_MINOR" -ge 11 ]; then

                GRADLE_VERSION="8.13"

              # AGP 8.10 / 8.9 -> Gradle 8.11.1
              elif [ "$AGP_MAJOR" -eq 8 ] && [ "$AGP_MINOR" -ge 9 ]; then

                GRADLE_VERSION="8.11.1"

              # AGP 8.8 -> Gradle 8.10.2
              elif [ "$AGP_MAJOR" -eq 8 ] && [ "$AGP_MINOR" -eq 8 ]; then

                GRADLE_VERSION="8.10.2"

              # AGP 8.7 -> Gradle 8.9
              elif [ "$AGP_MAJOR" -eq 8 ] && [ "$AGP_MINOR" -eq 7 ]; then

                GRADLE_VERSION="8.9"

              # AGP 8.5 / 8.6 -> Gradle 8.7
              elif [ "$AGP_MAJOR" -eq 8 ] && [ "$AGP_MINOR" -ge 5 ]; then

                GRADLE_VERSION="8.7"

              # AGP 8.4 -> Gradle 8.6
              elif [ "$AGP_MAJOR" -eq 8 ] && [ "$AGP_MINOR" -eq 4 ]; then

                GRADLE_VERSION="8.6"

              # AGP 8.3 -> Gradle 8.4
              elif [ "$AGP_MAJOR" -eq 8 ] && [ "$AGP_MINOR" -eq 3 ]; then

                GRADLE_VERSION="8.4"

              # AGP 8.2 -> Gradle 8.2
              elif [ "$AGP_MAJOR" -eq 8 ] && [ "$AGP_MINOR" -eq 2 ]; then

                GRADLE_VERSION="8.2"

              # AGP 8.1 -> Gradle 8.0
              elif [ "$AGP_MAJOR" -eq 8 ] && [ "$AGP_MINOR" -eq 1 ]; then

                GRADLE_VERSION="8.0"

              # AGP 8.0 -> Gradle 8.0
              elif [ "$AGP_MAJOR" -eq 8 ]; then

                GRADLE_VERSION="8.0"

              # AGP 7.x
              elif [ "$AGP_MAJOR" -eq 7 ]; then

                GRADLE_VERSION="7.6.4"

              else

                GRADLE_VERSION="8.13"

              fi

            fi

          fi


          echo ""
          echo "=============================================="
          echo "BUILD TOOLCHAIN"
          echo "=============================================="

          echo "Wrapper:"
          echo "$USE_WRAPPER"

          echo ""
          echo "AGP:"
          echo "${AGP_VERSION:-wrapper-defined}"

          echo ""
          echo "Gradle:"
          echo "${GRADLE_VERSION:-wrapper-defined}"


          echo "USE_WRAPPER=$USE_WRAPPER" >> "$GITHUB_ENV"
          echo "AGP_VERSION=$AGP_VERSION" >> "$GITHUB_ENV"
          echo "GRADLE_VERSION=$GRADLE_VERSION" >> "$GITHUB_ENV"


      # =========================================================
      # 10. Setup Gradle when wrapper is absent
      # =========================================================

      - name: Setup Gradle
        if: env.USE_WRAPPER != 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-disabled: true
          add-job-summary: on-failure


      # =========================================================
      # 11. Install Android SDK required by project
      # =========================================================

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          COMPILE_SDK=""

          # Groovy
          COMPILE_SDK="$(
            grep -RhoE \
              'compileSdk(V|ersion)?[[:space:]]*[=]?[[:space:]]*[0-9]+' \
              "$PROJECT_DIR" \
              --include="*.gradle" \
              --include="*.gradle.kts" \
              | grep -oE '[0-9]+' \
              | head -n 1 \
              || true
          )"


          if [ -z "$COMPILE_SDK" ]; then
            COMPILE_SDK="36"
          fi


          echo "Detected compileSdk: $COMPILE_SDK"


          # Install broad supported SDK range.
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "platforms;android-36" \
            "platforms;android-37" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"


          # Try exact platform if different.
          sdkmanager \
            "platforms;android-${COMPILE_SDK}" \
            >/dev/null 2>&1 || true


          echo ""
          echo "Android SDK installation complete."


      # =========================================================
      # 12. Build only the application module
      # =========================================================

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo "BUILDING APK"
          echo "=============================================="

          echo ""
          echo "Project:"
          pwd

          echo ""
          echo "Task:"
          echo "$MODULE_TASK"

          echo ""
          echo "Java:"
          java -version

          echo ""


          if [ "$USE_WRAPPER" = "true" ]; then

            chmod +x ./gradlew

            ./gradlew \
              "$MODULE_TASK" \
              --no-daemon \
              --stacktrace \
              --console=plain \
              --warning-mode all \
              2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

          else

            gradle \
              "$MODULE_TASK" \
              --no-daemon \
              --stacktrace \
              --console=plain \
              --warning-mode all \
              2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

          fi


      # =========================================================
      # 13. Find APK
      # =========================================================

      - name: Find APK
        if: success()
        shell: bash
        run: |
          set -e

          OUTPUT="$GITHUB_WORKSPACE/apk-output"

          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT"


          APK_FILE="$(
            find "$APP_MODULE" \
              -type f \
              -name "*.apk" \
              -path "*/build/outputs/*" \
              | sort \
              | head -n 1
          )"


          if [ -z "$APK_FILE" ]; then

            echo "ERROR: Build succeeded but APK was not found."

            echo ""
            echo "Build outputs:"

            find "$APP_MODULE" \
              -path "*/build/outputs/*" \
              -print \
              | sort \
              || true

            exit 1

          fi


          cp "$APK_FILE" \
            "$OUTPUT/TikTok-Downloader-debug.apk"


          sha256sum \
            "$OUTPUT/TikTok-Downloader-debug.apk" \
            > "$OUTPUT/SHA256SUMS.txt"


          echo ""
          echo "=============================================="
          echo "APK READY"
          echo "=============================================="

          ls -lh "$OUTPUT"


      # =========================================================
      # 14. Upload APK
      # =========================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: TikTok-Downloader-APK
          path: |
            apk-output/TikTok-Downloader-debug.apk
            apk-output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30


      # =========================================================
      # 15. Always upload build log
      # =========================================================

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TikTok-Downloader-Build-Log
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7
