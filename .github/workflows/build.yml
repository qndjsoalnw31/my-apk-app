name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          if [ ! -f "substack-downloader.zip" ]; then
            echo "ERROR: substack-downloader.zip not found"
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted

          unzip -o "substack-downloader.zip" -d extracted

          echo "ZIP extracted successfully"

      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android Gradle project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project:"
          echo "$PROJECT_DIR"

          shopt -s dotglob
          cp -R "$PROJECT_DIR"/* .

          echo "Project copied successfully"

      - name: Show project structure
        shell: bash
        run: |
          echo "===== PROJECT ====="
          find . -maxdepth 3 -type f | sort | head -300

      - name: Remove invalid Google Services configuration
        shell: bash
        run: |
          set -e

          find . \
            -type f \
            -name "google-services.json" \
            -delete

          echo "Invalid Google Services files removed"

      - name: Remove Google Services plugin
        shell: bash
        run: |
          set -e

          find . \
            -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print0 |
          while IFS= read -r -d '' file; do

            echo "Checking: $file"

            sed -i \
              '/com\.google\.gms\.google-services/d' \
              "$file" || true

            sed -i \
              '/google-services/d' \
              "$file" || true

          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -e

          if [ ! -f "./gradlew" ]; then
            echo "Gradle wrapper missing"

            if command -v gradle >/dev/null 2>&1; then
              gradle wrapper
            else
              echo "ERROR: gradlew is missing and Gradle is unavailable"
              exit 1
            fi
          fi

          chmod +x ./gradlew

          echo "Gradle version:"
          ./gradlew --version

      - name: Clean project
        shell: bash
        run: |
          set -e

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      - name: Check Gradle projects
        shell: bash
        run: |
          set -e

          ./gradlew projects \
            --no-daemon \
            --stacktrace

      - name: Build Debug APK
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "BUILDING APK"
          echo "========================================"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all \
            2>&1 | tee gradle-build.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "BUILD RESULT"
          echo "EXIT CODE: $EXIT_CODE"
          echo "========================================"

          if [ "$EXIT_CODE" -ne 0 ]; then

            echo ""
            echo "===== WHAT WENT WRONG ====="
            grep -A 20 -B 5 \
              "\* What went wrong" \
              gradle-build.log || true

            echo ""
            echo "===== CAUSED BY ====="
            grep -A 20 -B 5 \
              "Caused by:" \
              gradle-build.log | head -120 || true

            echo ""
            echo "===== FAILED TASK ====="
            grep -E \
              "Execution failed for task|FAILED|FAILURE" \
              gradle-build.log | head -100 || true

            echo ""
            echo "===== LAST 150 LINES ====="
            tail -150 gradle-build.log

            exit "$EXIT_CODE"
          fi

          echo ""
          echo "========================================"
          echo "APK BUILD SUCCESSFUL"
          echo "========================================"

      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find . \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print

          APK_COUNT=$(find . \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Substack-Downloader-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
