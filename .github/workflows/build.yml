
name: CinePro Cinema Camera APK Builder

on:
  push:
    branches:
      - main
    paths:
      - 'cinepro-cinema-camera.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cinepro-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build CinePro APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      JAVA_TOOL_OPTIONS: -Xmx4g -Dfile.encoding=UTF-8
      GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=1g

    steps:
      # 1. تحميل المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد Java بدون Gradle cache
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. إعداد Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      # 4. فحص ملف المشروع
      - name: Verify project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/cinepro-cinema-camera.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::cinepro-cinema-camera.zip was not found."
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f
            exit 1
          fi

          if [ ! -s "$ZIP" ]; then
            echo "::error::ZIP file is empty."
            exit 1
          fi

          unzip -tq "$ZIP"

          echo "ZIP archive is valid."
          ls -lh "$ZIP"

      # 5. استخراج المشروع داخل مساحة العمل
      - name: Extract and detect Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/cinepro-cinema-camera.zip"
          DEST="$GITHUB_WORKSPACE/.build/cinepro"

          rm -rf "$GITHUB_WORKSPACE/.build"
          mkdir -p "$DEST"

          python3 - "$ZIP" "$DEST" <<'PY'
          import pathlib
          import stat
          import sys
          import zipfile

          archive = pathlib.Path(sys.argv[1])
          destination = pathlib.Path(sys.argv[2]).resolve()

          with zipfile.ZipFile(archive) as z:
              entries = z.infolist()

              if not entries:
                  raise SystemExit("ZIP archive is empty.")

              for entry in entries:
                  target = (destination / entry.filename).resolve()

                  if not target.is_relative_to(destination):
                      raise SystemExit(
                          "Unsafe ZIP path: " + entry.filename
                      )

                  mode = entry.external_attr >> 16

                  if stat.S_ISLNK(mode):
                      raise SystemExit(
                          "Symbolic link found: " + entry.filename
                      )

              z.extractall(destination)

          settings = []

          for name in ("settings.gradle", "settings.gradle.kts"):
              settings.extend(destination.rglob(name))

          settings = [
              p for p in settings
              if "__MACOSX" not in p.parts
              and ".gradle" not in p.parts
              and "build" not in p.parts
          ]

          if not settings:
              raise SystemExit(
                  "No settings.gradle or settings.gradle.kts found. "
                  "The ZIP may not contain an Android Gradle project."
              )

          roots = sorted(
              {p.parent.resolve() for p in settings},
              key=lambda p: len(p.parts)
          )

          root = roots[0]

          if not any(
              (root / name).is_file()
              for name in ("build.gradle", "build.gradle.kts")
          ):
              raise SystemExit(
                  "Root build.gradle or build.gradle.kts is missing."
              )

          manifests = list(root.rglob("AndroidManifest.xml"))

          if not manifests:
              raise SystemExit(
                  "AndroidManifest.xml was not found."
              )

          if not any(
              (root / name).exists()
              for name in ("gradlew", "gradlew.bat")
          ) and not (root / "gradle/wrapper/gradle-wrapper.properties").exists():
              print("WARNING: Gradle Wrapper is missing.")

          print("Android project root:", root)
          print("Manifest count:", len(manifests))

          pathlib.Path(
              destination.parent / "project-root.txt"
          ).write_text(str(root))
          PY

          PROJECT_DIR="$(cat "$GITHUB_WORKSPACE/.build/project-root.txt")"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f | head -100

      # 6. اكتشاف compileSdk من ملفات Gradle
      - name: Detect Android SDK version
        id: sdk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          SDK_VERSION="$(python3 - "$PROJECT_DIR" <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path(sys.argv[1])
          candidates = []

          for path in root.rglob("*"):
              if not path.is_file():
                  continue

              if path.suffix not in (".gradle", ".kts", ".toml"):
                  continue

              if any(x in path.parts for x in (
                  ".gradle", "build", ".git"
              )):
                  continue

              try:
                  content = path.read_text(errors="ignore")
              except OSError:
                  continue

              for pattern in (
                  r"\bcompileSdk(?:Version)?\s*[=(]?\s*(\d+)",
                  r"\bcompileSdk\s*=\s*(\d+)",
                  r"compileSdk\s*\(\s*(\d+)\s*\)"
              ):
                  candidates.extend(
                      int(x) for x in re.findall(pattern, content)
                  )

              if path.name == "libs.versions.toml":
                  for line in content.splitlines():
                      if re.search(
                          r"compile.?sdk",
                          line,
                          re.IGNORECASE
                      ):
                          match = re.search(r'["\'](\d+)["\']', line)
                          if match:
                              candidates.append(int(match.group(1)))

          print(max(candidates) if candidates else 35)
          PY
          )"

          echo "Detected compileSdk: $SDK_VERSION"
          echo "version=$SDK_VERSION" >> "$GITHUB_OUTPUT"

      # 7. تثبيت منصات Android وأدوات البناء الشائعة
      - name: Install Android SDK components
        shell: bash
        env:
          SDK_VERSION: ${{ steps.sdk.outputs.version }}
        run: |
          set -euo pipefail

          PACKAGES=(
            "platform-tools"
            "platforms;android-$SDK_VERSION"
            "build-tools;36.0.0"
          )

          sdkmanager "${PACKAGES[@]}"

      # 8. إعداد Gradle بعد استخراج المشروع
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # 9. فحص Java وGradle
      - name: Check build environment
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          echo "Java version:"
          java -version

          echo "Gradle version:"
          gradle --version

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          cd "$PROJECT_DIR"

          echo "Project root:"
          pwd

          echo "Gradle configuration:"
          ls -la

      # 10. بناء التطبيق
      - name: Build Android Debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew

            echo "Using project Gradle Wrapper."

            ./gradlew \
              --no-daemon \
              --stacktrace \
              --console=plain \
              assembleDebug

          else
            echo "Using installed Gradle."

            gradle \
              --no-daemon \
              --stacktrace \
              --console=plain \
              assembleDebug
          fi

      # 11. البحث عن APK ونسخه
      - name: Collect APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          OUTPUT="$GITHUB_WORKSPACE/output"

          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT"

          python3 - "$PROJECT_DIR" "$OUTPUT" <<'PY'
          import pathlib
          import shutil
          import sys

          root = pathlib.Path(sys.argv[1])
          output = pathlib.Path(sys.argv[2])

          apks = [
              p for p in root.rglob("*.apk")
              if p.is_file()
              and "build" in p.parts
              and "outputs" in p.parts
              and "apk" in p.parts
              and p.stat().st_size > 0
          ]

          if not apks:
              raise SystemExit(
                  "Build completed but no APK was generated."
              )

          apks.sort()

          for index, apk in enumerate(apks, 1):
              if len(apks) == 1:
                  name = "CinePro-Cinema-Camera.apk"
              else:
                  name = f"CinePro-{index}-{apk.name}"

              target = output / name
              shutil.copy2(apk, target)

              print(
                  target.name,
                  target.stat().st_size,
                  "bytes"
              )
          PY

          ls -lh "$OUTPUT"

      # 12. رفع ملفات APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CinePro-Cinema-Camera-APK
          path: output/*.apk
          if-no-files-found: error
          retention-days: 14

      # 13. ملخص البناء
      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## CinePro APK Build"
            echo ""
            if [ -d "$GITHUB_WORKSPACE/output" ]; then
              ls -lh "$GITHUB_WORKSPACE/output"
            else
              echo "APK output was not generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
