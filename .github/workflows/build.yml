name: Build TikTok Downloader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.13"
  ANDROID_API: "35"
  BUILD_TOOLS: "35.0.0"

jobs:
  build:

    name: Build Android APK

    runs-on: ubuntu-24.04

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v5


      # =========================================================
      # JAVA
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # ANDROID SDK
      # =========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          echo ""
          echo "Android SDK ready."


      # =========================================================
      # FIND ZIP
      # =========================================================

      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          ZIP=""

          if [ -f "tiktok-downloader.zip" ]; then
            ZIP="tiktok-downloader.zip"
          else
            ZIP="$(
              find . \
                -type f \
                -iname "*.zip" \
                -not -path "./.git/*" \
                | head -n 1
            )"
          fi

          if [ -z "$ZIP" ]; then
            echo "ERROR: Android project ZIP not found."
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP"

          echo "ZIP_FILE=$ZIP" >> "$GITHUB_ENV"


      # =========================================================
      # EXTRACT ZIP
      # =========================================================

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/project"

          mkdir -p "$GITHUB_WORKSPACE/project"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/project"

          echo "Project extracted."


      # =========================================================
      # LOCATE GRADLE PROJECT
      # =========================================================

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          ROOT="$GITHUB_WORKSPACE/project"

          PROJECT=""

          SETTINGS="$(
            find "$ROOT" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              | head -n 1
          )"

          if [ -n "$SETTINGS" ]; then
            PROJECT="$(dirname "$SETTINGS")"
          fi


          if [ -z "$PROJECT" ]; then

            BUILD_FILE="$(
              find "$ROOT" \
                -type f \
                \( \
                  -name "build.gradle" \
                  -o \
                  -name "build.gradle.kts" \
                \) \
                | head -n 1
            )"

            if [ -n "$BUILD_FILE" ]; then
              PROJECT="$(dirname "$BUILD_FILE")"
            fi

          fi


          if [ -z "$PROJECT" ]; then

            echo "ERROR: Gradle project not found."

            echo ""
            echo "Extracted files:"

            find "$ROOT" -maxdepth 10 -print

            exit 1

          fi


          PROJECT="$(realpath "$PROJECT")"

          echo "Gradle project:"
          echo "$PROJECT"

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"


      # =========================================================
      # INSPECT PROJECT
      # =========================================================

      - name: Inspect project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "PROJECT"
          echo "======================================"

          pwd

          echo ""
          echo "Files:"

          find . \
            -maxdepth 6 \
            -type f \
            | sort


      # =========================================================
      # FIND ANDROID MODULE
      # =========================================================

      - name: Locate Android module
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MODULE=""

          if [ -d "app" ]; then
            MODULE="$PROJECT_DIR/app"
          fi


          if [ -z "$MODULE" ]; then

            MANIFEST="$(
              find . \
                -type f \
                -path "*/src/main/AndroidManifest.xml" \
                | head -n 1
            )"

            if [ -n "$MANIFEST" ]; then

              MODULE="$(dirname "$(dirname "$(dirname "$MANIFEST")")")"

            fi

          fi


          if [ -z "$MODULE" ]; then

            echo "ERROR: Android app module not found."

            find . -maxdepth 8 -print

            exit 1

          fi


          MODULE="$(realpath "$MODULE")"

          echo "Android module:"
          echo "$MODULE"

          echo "APP_MODULE=$MODULE" >> "$GITHUB_ENV"


      # =========================================================
      # INSTALL GRADLE
      # =========================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-disabled: true


      # =========================================================
      # SHOW GRADLE VERSION
      # =========================================================

      - name: Check Gradle
        shell: bash
        run: |
          set -e

          gradle --version


      # =========================================================
      # CHECK PROJECT WITHOUT "gradle tasks"
      # =========================================================

      - name: Check Gradle configuration
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle \
            help \
            --no-daemon \
            --stacktrace \
            --console=plain


      # =========================================================
      # CLEAN
      # =========================================================

      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle \
            clean \
            --no-daemon \
            --stacktrace \
            --console=plain


      # =========================================================
      # BUILD APK
      # =========================================================

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILDING APK"
          echo "======================================"

          gradle \
            assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"


      # =========================================================
      # FIND APK
      # =========================================================

      - name: Find APK
        if: success()
        shell: bash
        run: |
          set -e

          OUTPUT="$GITHUB_WORKSPACE/apk-output"

          rm -rf "$OUTPUT"

          mkdir -p "$OUTPUT"

          echo "======================================"
          echo "APK SEARCH"
          echo "======================================"

          APK="$(
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -path "*/build/outputs/*" \
              | sort \
              | head -n 1
          )"


          if [ -z "$APK" ]; then

            echo "ERROR: APK was not generated."

            echo ""
            echo "Build outputs:"

            find "$PROJECT_DIR" \
              -path "*/build/outputs/*" \
              -print || true

            exit 1

          fi


          echo "APK found:"
          echo "$APK"


          cp "$APK" \
            "$OUTPUT/TikTok-Downloader-debug.apk"


          echo ""
          echo "Final APK:"

          ls -lh "$OUTPUT"


      # =========================================================
      # UPLOAD APK
      # =========================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-Downloader-APK
          path: apk-output/TikTok-Downloader-debug.apk
          if-no-files-found: error
          retention-days: 30


      # =========================================================
      # SAVE LOG WHEN ANYTHING FAILS
      # =========================================================

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gradle-Build-Log
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7
