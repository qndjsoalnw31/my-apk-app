name: Build SAM Advanced APK Analyzer

'on':
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build SAM APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # =========================================================
      # 2. SETUP JAVA
      # IMPORTANT:
      # No Gradle cache here because the Android project is
      # inside the ZIP, not in the repository root.
      # =========================================================

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'


      # =========================================================
      # 3. VERIFY JAVA
      # =========================================================

      - name: Verify Java
        shell: bash
        run: |
          set -e

          echo "JAVA_HOME=$JAVA_HOME"

          echo
          java -version

          echo
          javac -version


      # =========================================================
      # 4. SETUP ANDROID SDK
      # =========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # =========================================================
      # 5. ACCEPT ANDROID LICENSES
      # =========================================================

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true


      # =========================================================
      # 6. INSTALL ANDROID SDK COMPONENTS
      # =========================================================

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"


      # =========================================================
      # 7. LOCATE SAM ZIP
      # =========================================================

      - name: Locate SAM ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="$GITHUB_WORKSPACE/remix-sam_-advanced-apk-analyzer.zip"

          if [ ! -f "$ZIP_FILE" ]; then

            ZIP_FILE="$(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -name 'remix-sam_-advanced-apk-analyzer.zip' \
                | head -n 1 \
                || true
            )

          fi

          if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then

            echo "ERROR: SAM ZIP not found."

            echo
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 4 \
              -type f \
              | sort

            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo
          echo "=============================================="
          echo "SAM ZIP FOUND"
          echo "=============================================="
          echo "$ZIP_FILE"

          ls -lh "$ZIP_FILE"


      # =========================================================
      # 8. EXTRACT SAM PROJECT
      # =========================================================

      - name: Extract SAM project
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/extracted"

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip \
            -q \
            -o \
            "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo
          echo "SAM ZIP extracted."


      # =========================================================
      # 9. LOCATE ANDROID PROJECT ROOT
      # =========================================================

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          SETTINGS_FILE="$(
            find "$GITHUB_WORKSPACE/extracted" \
              -type f \
              \( \
                -name 'settings.gradle.kts' \
                -o \
                -name 'settings.gradle' \
              \) \
              | head -n 1 \
              || true
          )"

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          if [ -z "$PROJECT_DIR" ]; then

            echo "ERROR: settings.gradle(.kts) not found."

            echo
            echo "Extracted project:"
            find "$GITHUB_WORKSPACE/extracted" \
              -maxdepth 8 \
              -type f \
              | sort

            exit 1
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo
          echo "=============================================="
          echo "ANDROID PROJECT"
          echo "=============================================="
          echo "$PROJECT_DIR"


      # =========================================================
      # 10. VERIFY PROJECT STRUCTURE
      # =========================================================

      - name: Verify project structure
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Project root:"
          pwd

          echo
          echo "Required files:"

          REQUIRED_FILES=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "app/build.gradle.kts"
            "gradle/wrapper/gradle-wrapper.properties"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do

            if [ ! -f "$FILE" ]; then
              echo "MISSING: $FILE"
              exit 1
            fi

            echo "OK: $FILE"

          done


      # =========================================================
      # 11. SHOW GRADLE VERSION FROM PROJECT
      # =========================================================

      - name: Read Gradle wrapper version
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo
          echo "Gradle wrapper configuration:"
          cat gradle/wrapper/gradle-wrapper.properties

          GRADLE_VERSION="$(
            sed \
              -n \
              's/.*gradle-\([0-9][0-9.]*\)-bin.zip.*/\1/p' \
              gradle/wrapper/gradle-wrapper.properties \
              | head -n 1
          )"

          if [ -z "$GRADLE_VERSION" ]; then
            echo "ERROR: Could not determine Gradle version."
            exit 1
          fi

          echo "GRADLE_VERSION=$GRADLE_VERSION" >> "$GITHUB_ENV"

          echo
          echo "Detected Gradle version:"
          echo "$GRADLE_VERSION"


      # =========================================================
      # 12. INSTALL REQUIRED GRADLE VERSION
      # =========================================================

      - name: Install Gradle
        shell: bash
        run: |
          set -e

          VERSION="$GRADLE_VERSION"
          INSTALL_DIR="/opt/gradle-${VERSION}"

          if [ ! -d "$INSTALL_DIR" ]; then

            echo "Downloading Gradle ${VERSION}..."

            curl \
              -fL \
              --retry 3 \
              --retry-delay 5 \
              "https://services.gradle.org/distributions/gradle-${VERSION}-bin.zip" \
              -o "/tmp/gradle-${VERSION}.zip"

            unzip \
              -q \
              "/tmp/gradle-${VERSION}.zip" \
              -d /opt/

          fi

          echo "$INSTALL_DIR/bin" >> "$GITHUB_PATH"

          echo
          echo "Gradle installed."

          "$INSTALL_DIR/bin/gradle" --version


      # =========================================================
      # 13. VERIFY GRADLE + JAVA
      # =========================================================

      - name: Verify build environment
        shell: bash
        run: |
          set -e

          echo
          echo "=============================================="
          echo "JAVA"
          echo "=============================================="

          java -version

          echo
          echo "=============================================="
          echo "GRADLE"
          echo "=============================================="

          gradle --version


      # =========================================================
      # 14. CREATE DEBUG KEYSTORE
      # =========================================================

      - name: Create debug keystore
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          KEYSTORE="$PROJECT_DIR/debug.keystore"

          if [ ! -f "$KEYSTORE" ]; then

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

          fi

          echo
          echo "Debug keystore:"
          ls -lh "$KEYSTORE"


      # =========================================================
      # 15. VERIFY GRADLE PROJECT
      # =========================================================

      - name: Verify Gradle project
        shell: bash
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.daemon=false
            -Dorg.gradle.jvmargs=-Xmx4g
            -Dfile.encoding=UTF-8
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo
          echo "=============================================="
          echo "VERIFYING GRADLE PROJECT"
          echo "=============================================="

          gradle \
            tasks \
            --no-daemon \
            --stacktrace


      # =========================================================
      # 16. BUILD DEBUG APK
      # =========================================================

      - name: Build SAM Debug APK
        shell: bash
        env:
          CI: true
          GRADLE_OPTS: >-
            -Dorg.gradle.daemon=false
            -Dorg.gradle.jvmargs=-Xmx4g
            -Dfile.encoding=UTF-8
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo
          echo "=============================================="
          echo "BUILDING SAM ADVANCED APK ANALYZER"
          echo "=============================================="

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

          echo
          echo "=============================================="
          echo "BUILD FINISHED"
          echo "=============================================="


      # =========================================================
      # 17. LOCATE APK
      # =========================================================

      - name: Locate generated APK
        shell: bash
        run: |
          set -e

          APK="$(
            find "$PROJECT_DIR/app/build/outputs/apk" \
              -type f \
              -name '*.apk' \
              | grep -Ei 'debug.*\.apk$' \
              | head -n 1 \
              || true
          )"

          if [ -z "$APK" ]; then

            APK="$(
              find "$PROJECT_DIR" \
                -type f \
                -name '*.apk' \
                -not -path '*/.gradle/*' \
                | head -n 1 \
                || true
            )"

          fi

          if [ -z "$APK" ]; then

            echo "ERROR: APK was not generated."

            echo
            echo "All APK files:"
            find "$PROJECT_DIR" \
              -type f \
              -name '*.apk' \
              -print \
              || true

            echo
            echo "Build output:"
            find "$PROJECT_DIR/app/build" \
              -maxdepth 8 \
              -type f \
              | sort \
              || true

            exit 1
          fi

          echo
          echo "APK FOUND:"
          echo "$APK"

          mkdir -p "$PROJECT_DIR/output"

          cp \
            "$APK" \
            "$PROJECT_DIR/output/SAM-Advanced-APK-Analyzer-debug.apk"

          echo
          echo "Final APK:"
          ls -lh \
            "$PROJECT_DIR/output/SAM-Advanced-APK-Analyzer-debug.apk"

          echo \
            "APK_PATH=$PROJECT_DIR/output/SAM-Advanced-APK-Analyzer-debug.apk" \
            >> "$GITHUB_ENV"


      # =========================================================
      # 18. GENERATE SHA256
      # =========================================================

      - name: Generate APK checksum
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR/output"

          sha256sum \
            SAM-Advanced-APK-Analyzer-debug.apk \
            > SHA256SUMS.txt

          echo
          cat SHA256SUMS.txt


      # =========================================================
      # 19. UPLOAD APK
      # =========================================================

      - name: Upload SAM APK
        uses: actions/upload-artifact@v6
        with:
          name: SAM-Advanced-APK-Analyzer-debug
          path: |
            ${{ env.PROJECT_DIR }}/output/SAM-Advanced-APK-Analyzer-debug.apk
            ${{ env.PROJECT_DIR }}/output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30


      # =========================================================
      # 20. SUCCESS
      # =========================================================

      - name: Build successful
        if: success()
        shell: bash
        run: |
          echo
          echo "=============================================="
          echo "SAM BUILD SUCCESSFUL"
          echo "=============================================="
          echo
          echo "APK:"
          echo "SAM-Advanced-APK-Analyzer-debug.apk"
          echo
          echo "Artifact:"
          echo "SAM-Advanced-APK-Analyzer-debug"
