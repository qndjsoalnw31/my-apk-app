name: Build TikTok Downloader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  JAVA_VERSION: "17"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v7

      # ==========================================================
      # 2. JAVA
      #
      # IMPORTANT:
      # No Gradle cache here.
      #
      # The Android project is inside tiktok-downloader.zip,
      # so setup-java must not search for Gradle files before
      # the ZIP is extracted.
      # ==========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # 3. ANDROID SDK
      # ==========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # ==========================================================
      # 4. CHECK RUNNER
      # ==========================================================

      - name: Inspect runner
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "RUNNER"
          echo "=================================================="

          echo ""
          echo "OS:"
          uname -a

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "${JAVA_HOME:-unknown}"

          echo ""
          echo "ANDROID_HOME:"
          echo "${ANDROID_HOME:-unknown}"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "${ANDROID_SDK_ROOT:-unknown}"

          echo ""
          echo "Repository:"
          find . -maxdepth 5 -type f -print | sort

      # ==========================================================
      # 5. FIND ZIP
      # ==========================================================

      - name: Find TikTok Downloader ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          if [ -f "./tiktok-downloader.zip" ]; then
            ZIP_FILE="./tiktok-downloader.zip"
          else
            ZIP_FILE="$(
              find . \
                -type f \
                -iname "*.zip" \
                -not -path "./.git/*" \
                | sort \
                | head -n 1 \
                || true
            )"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo ""
            echo "ERROR: No ZIP file was found."
            echo ""
            echo "Repository tree:"
            find . -maxdepth 10 -print | sort
            exit 1
          fi

          echo ""
          echo "ZIP FILE:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # ==========================================================
      # 6. VALIDATE ZIP
      # ==========================================================

      - name: Validate ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP does not exist."
            exit 1
          fi

          echo "=================================================="
          echo "ZIP INFORMATION"
          echo "=================================================="

          ls -lh "$ZIP_FILE"

          echo ""
          echo "ZIP CONTENTS:"
          unzip -l "$ZIP_FILE" | sed -n '1,400p'

      # ==========================================================
      # 7. EXTRACT ZIP
      # ==========================================================

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/android-project"

          mkdir -p "$GITHUB_WORKSPACE/android-project"

          unzip -q \
            "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/android-project"

          echo "=================================================="
          echo "EXTRACTED PROJECT"
          echo "=================================================="

          find "$GITHUB_WORKSPACE/android-project" \
            -maxdepth 12 \
            -type f \
            -print \
            | sort

      # ==========================================================
      # 8. LOCATE GRADLE ROOT
      # ==========================================================

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/android-project"

          PROJECT_DIR=""

          # ------------------------------------------------------
          # Search settings.gradle
          # ------------------------------------------------------

          SETTINGS_FILE="$(
            find "$ROOT" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              | sort \
              | head -n 1 \
              || true
          )"

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          # ------------------------------------------------------
          # Search gradlew
          # ------------------------------------------------------

          if [ -z "$PROJECT_DIR" ]; then

            GRADLEW_FILE="$(
              find "$ROOT" \
                -type f \
                -name "gradlew" \
                | sort \
                | head -n 1 \
                || true
            )"

            if [ -n "$GRADLEW_FILE" ]; then
              PROJECT_DIR="$(dirname "$GRADLEW_FILE")"
            fi

          fi

          # ------------------------------------------------------
          # Search build.gradle
          # ------------------------------------------------------

          if [ -z "$PROJECT_DIR" ]; then

            BUILD_FILE="$(
              find "$ROOT" \
                -type f \
                \( \
                  -name "build.gradle" \
                  -o \
                  -name "build.gradle.kts" \
                \) \
                | sort \
                | head -n 1 \
                || true
            )"

            if [ -n "$BUILD_FILE" ]; then

              CANDIDATE="$(dirname "$BUILD_FILE")"

              if [ -d "$CANDIDATE/app" ]; then
                PROJECT_DIR="$CANDIDATE"
              fi

            fi

          fi

          # ------------------------------------------------------
          # Validate
          # ------------------------------------------------------

          if [ -z "$PROJECT_DIR" ]; then

            echo ""
            echo "ERROR: Android Gradle project was not found."

            echo ""
            echo "Complete extracted tree:"
            find "$ROOT" -maxdepth 15 -print | sort

            exit 1
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo ""
          echo "=================================================="
          echo "GRADLE PROJECT"
          echo "=================================================="

          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==========================================================
      # 9. INSPECT PROJECT
      # ==========================================================

      - name: Inspect Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=================================================="
          echo "ANDROID PROJECT"
          echo "=================================================="

          echo ""
          echo "Project root:"
          pwd

          echo ""
          echo "Root:"
          ls -la

          echo ""
          echo "Gradle files:"

          find . \
            -maxdepth 10 \
            -type f \
            \( \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
              -o \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
              -o \
              -name "gradle.properties" \
              -o \
              -name "libs.versions.toml" \
              -o \
              -name "gradle-wrapper.properties" \
            \) \
            -print \
            | sort

      # ==========================================================
      # 10. FIND APP MODULE
      # ==========================================================

      - name: Find Android app module
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          APP_MODULE=""

          # Standard Android module
          if [ -d "./app" ]; then
            APP_MODULE="$(realpath "./app")"
          fi

          # Search manifest if app/ does not exist
          if [ -z "$APP_MODULE" ]; then

            MANIFEST="$(
              find . \
                -type f \
                -path "*/src/main/AndroidManifest.xml" \
                | sort \
                | head -n 1 \
                || true
            )"

            if [ -n "$MANIFEST" ]; then
              APP_MODULE="$(realpath "$(dirname "$(dirname "$(dirname "$MANIFEST")")")")"
            fi

          fi

          if [ -z "$APP_MODULE" ]; then

            echo ""
            echo "ERROR: Android app module was not found."

            echo ""
            echo "Project directories:"
            find . -maxdepth 10 -type d -print | sort

            exit 1
          fi

          echo ""
          echo "APP MODULE:"
          echo "$APP_MODULE"

          echo "APP_MODULE=$APP_MODULE" >> "$GITHUB_ENV"

      # ==========================================================
      # 11. DETECT GRADLE WRAPPER
      #
      # We DO NOT overwrite an existing project wrapper.
      # ==========================================================

      - name: Detect Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then

            echo "=================================================="
            echo "EXISTING GRADLE WRAPPER FOUND"
            echo "=================================================="

            chmod +x ./gradlew

            echo ""
            echo "Wrapper:"
            ls -lh ./gradlew

            if [ -f "./gradle/wrapper/gradle-wrapper.properties" ]; then
              echo ""
              echo "gradle-wrapper.properties:"
              cat ./gradle/wrapper/gradle-wrapper.properties
            fi

            echo "HAS_WRAPPER=true" >> "$GITHUB_ENV"

          else

            echo "=================================================="
            echo "NO GRADLE WRAPPER"
            echo "=================================================="

            echo "HAS_WRAPPER=false" >> "$GITHUB_ENV"

          fi

      # ==========================================================
      # 12. SETUP GRADLE
      #
      # No forced Gradle version here.
      #
      # setup-gradle will use the project's wrapper when present.
      # ==========================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: on-failure

      # ==========================================================
      # 13. CREATE WRAPPER ONLY IF MISSING
      # ==========================================================

      - name: Create Gradle Wrapper if missing
        if: env.HAS_WRAPPER == 'false'
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "No wrapper exists."

          echo "Trying Gradle installed on runner..."

          gradle --version

          gradle wrapper \
            --distribution-type bin

          chmod +x ./gradlew

          echo ""
          echo "Generated wrapper:"
          cat ./gradle/wrapper/gradle-wrapper.properties

      # ==========================================================
      # 14. VERIFY WRAPPER
      # ==========================================================

      - name: Verify Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          echo "=================================================="
          echo "GRADLE VERSION"
          echo "=================================================="

          ./gradlew --version

      # ==========================================================
      # 15. DETECT compileSdk
      # ==========================================================

      - name: Detect compileSdk
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          COMPILE_SDK=""

          # ------------------------------------------------------
          # Groovy:
          # compileSdk 35
          # compileSdkVersion 35
          # ------------------------------------------------------

          COMPILE_SDK="$(
            grep -RhoE \
              'compileSdk(Version)?[[:space:]]+[0-9]+' \
              . \
              --include='*.gradle' \
              2>/dev/null \
              | grep -oE '[0-9]+' \
              | tail -n 1 \
              || true
          )"

          # ------------------------------------------------------
          # Kotlin:
          # compileSdk = 35
          # ------------------------------------------------------

          if [ -z "$COMPILE_SDK" ]; then

            COMPILE_SDK="$(
              grep -RhoE \
                'compileSdk[[:space:]]*=[[:space:]]*[0-9]+' \
                . \
                --include='*.gradle.kts' \
                2>/dev/null \
                | grep -oE '[0-9]+' \
                | tail -n 1 \
                || true
            )"

          fi

          # ------------------------------------------------------
          # Fallback
          # ------------------------------------------------------

          if [ -z "$COMPILE_SDK" ]; then
            COMPILE_SDK="35"
          fi

          echo ""
          echo "Detected compileSdk:"
          echo "$COMPILE_SDK"

          echo "COMPILE_SDK=$COMPILE_SDK" >> "$GITHUB_ENV"

      # ==========================================================
      # 16. INSTALL REQUIRED ANDROID PLATFORM
      # ==========================================================

      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "ANDROID SDK"
          echo "=================================================="

          echo ""
          echo "compileSdk:"
          echo "$COMPILE_SDK"

          echo ""
          echo "sdkmanager:"
          sdkmanager --version

          echo ""
          echo "Installing required platform..."

          sdkmanager \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}"

          echo ""
          echo "Installed Android packages:"
          sdkmanager --list_installed | sed -n '1,250p'

      # ==========================================================
      # 17. INSPECT BUILD CONFIGURATION
      # ==========================================================

      - name: Inspect build configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=================================================="
          echo "BUILD CONFIGURATION"
          echo "=================================================="

          if [ -f "./gradle.properties" ]; then
            echo ""
            echo "gradle.properties:"
            cat ./gradle.properties
          fi

          if [ -f "./settings.gradle" ]; then
            echo ""
            echo "settings.gradle:"
            cat ./settings.gradle
          fi

          if [ -f "./settings.gradle.kts" ]; then
            echo ""
            echo "settings.gradle.kts:"
            cat ./settings.gradle.kts
          fi

          if [ -f "./build.gradle" ]; then
            echo ""
            echo "build.gradle:"
            cat ./build.gradle
          fi

          if [ -f "./build.gradle.kts" ]; then
            echo ""
            echo "build.gradle.kts:"
            cat ./build.gradle.kts
          fi

      # ==========================================================
      # 18. VERIFY GRADLE TASKS
      # ==========================================================

      - name: Verify Gradle tasks
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew tasks \
            --no-daemon \
            --stacktrace \
            --console=plain

      # ==========================================================
      # 19. CLEAN
      # ==========================================================

      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew clean \
            --no-daemon \
            --stacktrace \
            --console=plain

      # ==========================================================
      # 20. BUILD DEBUG APK
      # ==========================================================

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          echo "=================================================="
          echo "BUILDING DEBUG APK"
          echo "=================================================="

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

      # ==========================================================
      # 21. FIND APK
      # ==========================================================

      - name: Find generated APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "SEARCHING FOR APK"
          echo "=================================================="

          rm -rf "$GITHUB_WORKSPACE/apk-output"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          APK_FILE="$(
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -path "*/build/outputs/*" \
              | sort \
              | head -n 1 \
              || true
          )"

          if [ -z "$APK_FILE" ]; then

            echo ""
            echo "ERROR: APK was not generated."

            echo ""
            echo "All APK files:"
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print \
              | sort \
              || true

            exit 1
          fi

          echo ""
          echo "APK:"
          echo "$APK_FILE"

          cp \
            "$APK_FILE" \
            "$GITHUB_WORKSPACE/apk-output/TikTok-Downloader-debug.apk"

          echo ""
          echo "APK output:"
          ls -lh "$GITHUB_WORKSPACE/apk-output"

      # ==========================================================
      # 22. UPLOAD APK
      # ==========================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: TikTok-Downloader-APK
          path: apk-output/TikTok-Downloader-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ==========================================================
      # 23. UPLOAD GRADLE LOG
      # ==========================================================

      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Gradle-Build-Log
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7

      # ==========================================================
      # 24. FINAL REPORT
      # ==========================================================

      - name: Final build report
        if: always()
        shell: bash
        run: |
          echo "=================================================="
          echo "FINAL REPORT"
          echo "=================================================="

          echo ""
          echo "Project:"
          echo "${PROJECT_DIR:-unknown}"

          echo ""
          echo "App module:"
          echo "${APP_MODULE:-unknown}"

          echo ""
          echo "compileSdk:"
          echo "${COMPILE_SDK:-unknown}"

          echo ""
          echo "Gradle wrapper:"
          echo "${HAS_WRAPPER:-unknown}"

          echo ""
          echo "APK directory:"

          if [ -d "$GITHUB_WORKSPACE/apk-output" ]; then
            ls -lah "$GITHUB_WORKSPACE/apk-output"
          else
            echo "No APK directory."
          fi
