      - name: Build Debug APK
        shell: bash
        run: |
          set +e

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all \
            2>&1 | tee gradle-build.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "BUILD RESULT"
          echo "========================================"

          if [ "$EXIT_CODE" -ne 0 ]; then

            echo ""
            echo "===== WHAT WENT WRONG ====="
            grep -A 20 -B 5 "\* What went wrong" gradle-build.log || true

            echo ""
            echo "===== CAUSED BY ====="
            grep -A 20 -B 5 "Caused by:" gradle-build.log | head -120 || true

            echo ""
            echo "===== FAILED TASK ====="
            grep -E "Execution failed for task|FAILED|FAILURE" \
              gradle-build.log | head -50 || true

            echo ""
            echo "===== LAST 150 LINES ====="
            tail -150 gradle-build.log

            exit "$EXIT_CODE"
          fi

          echo "APK BUILD SUCCESSFUL"
