name: Build TikTok Downloader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v7

      # =========================================================
      # 2. JAVA 17
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # 3. ANDROID SDK
      # لا يوجد sdkmanager
      # لا يوجد تثبيت platforms يدوي
      # =========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # =========================================================
      # 4. CREATE LOG BEFORE ANYTHING ELSE
      # =========================================================

      - name: Initialize log
        shell: bash
        run: |
          set -u

          : > "$GITHUB_WORKSPACE/build.log"

          {
            echo "=========================================="
            echo "TikTok Downloader APK"
            echo "=========================================="
            echo "Date:"
            date
            echo
            echo "Java:"
            java -version 2>&1 || true
            echo
            echo "Android SDK:"
            echo "${ANDROID_HOME:-}"
            echo
            echo "Gradle:"
            command -v gradle || true
            echo
          } | tee -a "$GITHUB_WORKSPACE/build.log"

      # =========================================================
      # 5. FIND ZIP
      # =========================================================

      - name: Find application ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          if [ -f "$GITHUB_WORKSPACE/tiktok-downloader.zip" ]; then
            ZIP_FILE="$GITHUB_WORKSPACE/tiktok-downloader.zip"
          else
            ZIP_FILE="$(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -iname "*.zip" \
                -not -path "*/.git/*" \
                | head -n 1
            )"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."

            echo
            echo "Repository:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 6 \
              -type f \
              | sort

            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "Found:"
          echo "$ZIP_FILE"

      # =========================================================
      # 6. VALIDATE ZIP
      # =========================================================

      - name: Validate ZIP
        shell: bash
        run: |
          set -euo pipefail

          unzip -t "$ZIP_FILE"

      # =========================================================
      # 7. EXTRACT
      # =========================================================

      - name: Extract application
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/project"

          mkdir -p "$GITHUB_WORKSPACE/project"

          unzip -q \
            "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/project"

          echo "Extraction completed."

      # =========================================================
      # 8. FIND GRADLE PROJECT
      # =========================================================

      - name: Find Gradle project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/project"

          PROJECT_DIR=""

          SETTINGS_FILE="$(
            find "$ROOT" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -not -path "*/build/*" \
              | sort \
              | head -n 1
          )"

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          if [ -z "$PROJECT_DIR" ]; then

            GRADLEW_FILE="$(
              find "$ROOT" \
                -type f \
                -name "gradlew" \
                -not -path "*/build/*" \
                | sort \
                | head -n 1
            )"

            if [ -n "$GRADLEW_FILE" ]; then
              PROJECT_DIR="$(dirname "$GRADLEW_FILE")"
            fi

          fi

          if [ -z "$PROJECT_DIR" ]; then

            echo "ERROR: Gradle project not found."

            echo
            echo "Extracted files:"
            find "$ROOT" \
              -maxdepth 12 \
              -print \
              | sort

            exit 1

          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo
          echo "PROJECT:"
          echo "$PROJECT_DIR"

      # =========================================================
      # 9. SHOW PROJECT
      # =========================================================

      - name: Inspect project
        shell: bash
        run: |
          set -u

          cd "$PROJECT_DIR"

          {
            echo
            echo "=========================================="
            echo "PROJECT"
            echo "=========================================="

            echo
            echo "Directory:"
            pwd

            echo
            echo "Files:"
            find . \
              -maxdepth 7 \
              -type f \
              | sort

            echo
            echo "Gradle files:"
            find . \
              -type f \
              \( \
                -name "build.gradle" \
                -o \
                -name "build.gradle.kts" \
                -o \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
                -o \
                -name "gradle-wrapper.properties" \
              \) \
              | sort

          } | tee -a "$GITHUB_WORKSPACE/build.log"

      # =========================================================
      # 10. FIND APP MODULE
      # =========================================================

      - name: Find Android app module
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          MODULE=""

          if [ -f "app/build.gradle" ] || \
             [ -f "app/build.gradle.kts" ]; then

            MODULE="app"

          fi

          if [ -z "$MODULE" ]; then

            MANIFEST="$(
              find . \
                -type f \
                -path "*/src/main/AndroidManifest.xml" \
                -not -path "*/build/*" \
                | sort \
                | head -n 1
            )"

            if [ -n "$MANIFEST" ]; then

              MODULE="$(
                dirname \
                  "$(dirname \
                    "$(dirname "$MANIFEST")" \
                  )"
              )"

              MODULE="${MODULE#./}"

            fi

          fi

          if [ -z "$MODULE" ]; then

            echo "ERROR: Android app module not found."

            echo
            echo "Directories:"
            find . \
              -maxdepth 8 \
              -type d \
              | sort

            exit 1

          fi

          echo "APP_MODULE=$MODULE" >> "$GITHUB_ENV"

          echo
          echo "APP MODULE:"
          echo "$MODULE"

      # =========================================================
      # 11. USE EXISTING GRADLE WRAPPER
      # =========================================================

      - name: Detect Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ] && \
             [ -f "./gradle/wrapper/gradle-wrapper.properties" ]; then

            chmod +x ./gradlew

            echo "USE_WRAPPER=true" >> "$GITHUB_ENV"

            echo "Using project's original Gradle Wrapper."

          else

            echo "USE_WRAPPER=false" >> "$GITHUB_ENV"

            echo "Project has no Gradle Wrapper."

          fi

      # =========================================================
      # 12. FALLBACK GRADLE
      # =========================================================

      - name: Setup fallback Gradle
        if: env.USE_WRAPPER == 'false'
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"

      # =========================================================
      # 13. VERIFY GRADLE
      # =========================================================

      - name: Verify Gradle
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          {
            echo
            echo "=========================================="
            echo "GRADLE"
            echo "=========================================="

            if [ "$USE_WRAPPER" = "true" ]; then

              ./gradlew --version

            else

              gradle --version

            fi

          } 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      # =========================================================
      # 14. BUILD
      # =========================================================

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          TASK=":${APP_MODULE//\//:}:assembleDebug"

          {
            echo
            echo "=========================================="
            echo "BUILD"
            echo "=========================================="

            echo
            echo "Module:"
            echo "$APP_MODULE"

            echo
            echo "Task:"
            echo "$TASK"

            echo

            if [ "$USE_WRAPPER" = "true" ]; then

              ./gradlew \
                "$TASK" \
                --no-daemon \
                --stacktrace \
                --warning-mode all \
                --console=plain

            else

              gradle \
                "$TASK" \
                --no-daemon \
                --stacktrace \
                --warning-mode all \
                --console=plain

            fi

          } 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      # =========================================================
      # 15. FIND APK
      # =========================================================

      - name: Find APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/apk"

          APK="$(
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -path "*/build/outputs/*" \
              | sort \
              | head -n 1
          )"

          if [ -z "$APK" ]; then

            echo "ERROR: APK was not generated."

            echo
            echo "Build outputs:"
            find "$PROJECT_DIR" \
              -path "*/build/outputs/*" \
              -print \
              | sort

            exit 1

          fi

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/apk/TikTok-Downloader-debug.apk"

          echo
          echo "APK CREATED:"
          ls -lh \
            "$GITHUB_WORKSPACE/apk/TikTok-Downloader-debug.apk"

      # =========================================================
      # 16. UPLOAD APK
      # =========================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: TikTok-Downloader-APK
          path: apk/TikTok-Downloader-debug.apk
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 17. ALWAYS UPLOAD LOG
      # =========================================================

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: TikTok-Downloader-Build-Log
          path: build.log
          if-no-files-found: error
          retention-days: 14
