name: Build TikTok Downloader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.13"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Inspect repository
        shell: bash
        run: |
          set -eux

          echo "======================================"
          echo "REPOSITORY"
          echo "======================================"

          pwd

          echo ""
          echo "Files:"
          find . -maxdepth 4 -type f | sort

          echo ""
          java -version

          echo ""
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Find TikTok project ZIP
        shell: bash
        run: |
          set -e

          ZIP=""

          if [ -f "tiktok-downloader.zip" ]; then
            ZIP="tiktok-downloader.zip"
          else
            ZIP=$(find . -type f -iname "*.zip" | head -n 1 || true)
          fi

          if [ -z "$ZIP" ]; then
            echo "ERROR: tiktok-downloader.zip was not found."
            exit 1
          fi

          echo "ZIP=$ZIP"
          echo "ZIP_FILE=$ZIP" >> "$GITHUB_ENV"

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ZIP_FILE" -d android-project

          echo "======================================"
          echo "EXTRACTED PROJECT"
          echo "======================================"

          find android-project -maxdepth 7 -type f | sort

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          PROJECT=""

          SETTINGS=$(find android-project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1 || true)

          if [ -n "$SETTINGS" ]; then
            PROJECT=$(dirname "$SETTINGS")
          fi

          if [ -z "$PROJECT" ]; then
            GRADLEW=$(find android-project \
              -type f \
              -name "gradlew" \
              | head -n 1 || true)

            if [ -n "$GRADLEW" ]; then
              PROJECT=$(dirname "$GRADLEW")
            fi
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No Android Gradle project found."
            find android-project -maxdepth 10 -print
            exit 1
          fi

          PROJECT=$(realpath "$PROJECT")

          echo ""
          echo "PROJECT DIRECTORY:"
          echo "$PROJECT"

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Inspect Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "ANDROID PROJECT"
          echo "======================================"

          echo "Directory:"
          pwd

          echo ""
          echo "Root files:"
          ls -la

          echo ""
          echo "Gradle files:"

          find . -maxdepth 5 -type f \
            \( \
              -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "gradle.properties" \
              -o -name "libs.versions.toml" \
            \) \
            -print

      - name: Find Android module
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MODULE=""

          if [ -d "app" ]; then
            MODULE="app"
          else
            MANIFEST=$(find . \
              -type f \
              -path "*/src/main/AndroidManifest.xml" \
              | head -n 1 || true)

            if [ -n "$MANIFEST" ]; then
              MODULE=$(dirname "$(dirname "$(dirname "$MANIFEST")")")
            fi
          fi

          if [ -z "$MODULE" ]; then
            echo "ERROR: Android app module was not found."

            echo ""
            echo "Project structure:"
            find . -maxdepth 6 -type d | sort

            exit 1
          fi

          echo "Android module: $MODULE"

          echo "APP_MODULE=$MODULE" >> "$GITHUB_ENV"

      # KSP 2.3.5 has a known CI NullPointerException.
      # KSP 2.3.6 contains the official fix.
      - name: Fix KSP 2.3.5 CI issue
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python3 - <<'PY'
          import re
          from pathlib import Path

          root = Path.cwd()
          changed = []

          candidates = []

          for p in root.rglob("*"):
              if not p.is_file():
                  continue

              if (
                  p.name.endswith(".gradle")
                  or p.name.endswith(".gradle.kts")
                  or p.name == "libs.versions.toml"
              ):
                  candidates.append(p)

          for path in candidates:
              try:
                  text = path.read_text(encoding="utf-8")
              except Exception:
                  continue

              original = text

              # Direct KSP plugin declarations.
              if "com.google.devtools.ksp" in text:
                  text = re.sub(
                      r"(?<![0-9.])2\.3\.5(?![0-9.])",
                      "2.3.6",
                      text,
                  )

              # Version-catalog KSP declaration.
              if path.name == "libs.versions.toml":
                  text = re.sub(
                      r'(?m)^(\s*ksp\s*=\s*["\'])2\.3\.5(["\'])',
                      r"\g<1>2.3.6\g<2>",
                      text,
                  )

              if text != original:
                  path.write_text(text, encoding="utf-8")
                  changed.append(str(path.relative_to(root)))

          if changed:
              echo = "Updated KSP 2.3.5 -> 2.3.6 in:"
              print(echo)

              for item in changed:
                  print(" -", item)
          else:
              print("No KSP 2.3.5 declaration found; project left unchanged.")

          print("")
          print("KSP references after patch:")

          for p in candidates:
              try:
                  text = p.read_text(encoding="utf-8")
              except Exception:
                  continue

              if (
                  "com.google.devtools.ksp" in text
                  or re.search(r"(?m)^\s*ksp\s*=", text)
              ):
                  print("")
                  print(f"--- {p.relative_to(root)} ---")

                  for line in text.splitlines():
                      if (
                          "com.google.devtools.ksp" in line
                          or re.search(r"^\s*ksp\s*=", line)
                      ):
                          print(line)
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "PREPARING GRADLE WRAPPER"
          echo "======================================"

          if [ -f "./gradlew" ]; then
            echo "Existing Gradle Wrapper found."
            echo "Keeping the project's original wrapper."

            chmod +x ./gradlew
          else
            echo "No Gradle Wrapper found."
            echo "Creating wrapper with Gradle $GRADLE_VERSION."

            gradle wrapper \
              --gradle-version "$GRADLE_VERSION" \
              --distribution-type bin

            chmod +x ./gradlew
          fi

          echo ""
          echo "Gradle version:"
          ./gradlew --version

      - name: Inspect Gradle tasks
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          ./gradlew tasks \
            --no-daemon \
            --console=plain \
            --stacktrace \
            || true

      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew clean \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILDING APK"
          echo "======================================"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

      - name: Find APK
        if: success()
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING APK"
          echo "======================================"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          FOUND=0

          while IFS= read -r APK; do
            echo ""
            echo "APK:"
            echo "$APK"

            cp "$APK" \
              "$GITHUB_WORKSPACE/apk-output/TikTok-Downloader-debug.apk"

            FOUND=1
            break
          done < <(
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -path "*/build/outputs/*" \
              | sort
          )

          if [ "$FOUND" -eq 0 ]; then
            echo ""
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "APK successfully found."

          ls -lh "$GITHUB_WORKSPACE/apk-output"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-Downloader-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gradle-Build-Log
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7
