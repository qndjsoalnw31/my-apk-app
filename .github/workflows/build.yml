name: Build TikTok Downloader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  JAVA_VERSION: "17"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v7

      # =========================================================
      # 2. Java 17
      # =========================================================
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # 3. Android SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      # =========================================================
      # 4. Repository diagnostics
      # =========================================================
      - name: Inspect repository
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "REPOSITORY"
          echo "=============================================="

          echo "Working directory:"
          pwd

          echo
          echo "Repository files:"
          find . -maxdepth 4 -type f | sort

          echo
          echo "Java:"
          java -version

          echo
          echo "Android SDK:"
          echo "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          echo
          echo "SDK Manager:"
          sdkmanager --version || true

      # =========================================================
      # 5. Find ZIP
      # =========================================================
      - name: Find TikTok Downloader ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          if [ -f "tiktok-downloader.zip" ]; then
            ZIP_FILE="tiktok-downloader.zip"
          else
            ZIP_FILE="$(find . -type f -iname "*.zip" | head -n 1 || true)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file was found."
            echo
            echo "Available files:"
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo
          echo "Using ZIP:"
          echo "$ZIP_FILE"

      # =========================================================
      # 6. Extract project
      # =========================================================
      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/android-project"
          mkdir -p "$GITHUB_WORKSPACE/android-project"

          unzip -oq "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/android-project"

          echo "=============================================="
          echo "EXTRACTED PROJECT"
          echo "=============================================="

          find "$GITHUB_WORKSPACE/android-project" \
            -maxdepth 10 \
            -type f \
            | sort

      # =========================================================
      # 7. Locate Gradle project
      # =========================================================
      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          SETTINGS_FILE="$(
            find "$GITHUB_WORKSPACE/android-project" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              | head -n 1 || true
          )"

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            GRADLEW_FILE="$(
              find "$GITHUB_WORKSPACE/android-project" \
                -type f \
                -name "gradlew" \
                | head -n 1 || true
            )"

            if [ -n "$GRADLEW_FILE" ]; then
              PROJECT_DIR="$(dirname "$GRADLEW_FILE")"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project was not found."
            echo
            echo "Expected settings.gradle, settings.gradle.kts, or gradlew."
            echo
            find "$GITHUB_WORKSPACE/android-project" \
              -maxdepth 12 \
              -print \
              | sort

            exit 1
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo
          echo "PROJECT_DIR:"
          echo "$PROJECT_DIR"

      # =========================================================
      # 8. Detect Android module
      # =========================================================
      - name: Detect Android module
        id: module
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          MODULE_DIR=""

          if [ -d "app" ]; then
            MODULE_DIR="$(realpath "app")"
          else
            MANIFEST="$(
              find . \
                -type f \
                -path "*/src/main/AndroidManifest.xml" \
                | head -n 1 || true
            )"

            if [ -n "$MANIFEST" ]; then
              MODULE_DIR="$(realpath "$(dirname "$MANIFEST")/../..")"
            fi
          fi

          if [ -z "$MODULE_DIR" ] || [ ! -d "$MODULE_DIR" ]; then
            echo "ERROR: Android application module was not found."
            echo
            echo "Directories:"
            find . -maxdepth 7 -type d | sort
            exit 1
          fi

          REL_MODULE="${MODULE_DIR#$PROJECT_DIR/}"

          if [ "$REL_MODULE" = "$MODULE_DIR" ]; then
            REL_MODULE=""
          fi

          if [ -z "$REL_MODULE" ]; then
            BUILD_TASK="assembleDebug"
          else
            TASK_MODULE="${REL_MODULE//\//:}"
            BUILD_TASK=":${TASK_MODULE}:assembleDebug"
          fi

          echo "MODULE_DIR=$MODULE_DIR"
          echo "REL_MODULE=$REL_MODULE"
          echo "BUILD_TASK=$BUILD_TASK"

          echo "module_dir=$MODULE_DIR" >> "$GITHUB_OUTPUT"
          echo "relative_module=$REL_MODULE" >> "$GITHUB_OUTPUT"
          echo "build_task=$BUILD_TASK" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 9. Detect Wrapper / AGP / Gradle / compileSdk
      # =========================================================
      - name: Detect Gradle toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          project = Path(".").resolve()

          files = []
          for p in project.rglob("*"):
              if not p.is_file():
                  continue

              if any(part in {
                  ".git",
                  ".gradle",
                  "build",
                  "node_modules"
              } for part in p.parts):
                  continue

              if p.suffix.lower() in {
                  ".gradle",
                  ".kts",
                  ".toml",
                  ".properties"
              }:
                  try:
                      if p.stat().st_size <= 2_000_000:
                          files.append(p)
                  except OSError:
                      pass

          texts = []

          for p in files:
              try:
                  texts.append((p, p.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  )))
              except Exception:
                  pass

          all_text = "\n".join(text for _, text in texts)

          # -----------------------------------------------------
          # Detect AGP
          # -----------------------------------------------------
          agp = ""

          patterns = [
              r'com\.android\.tools\.build:gradle:([0-9]+\.[0-9]+(?:\.[0-9]+)?)',

              r'id\s*\(\s*["\']com\.android\.(?:application|library)["\']\s*\)'
              r'\s*version\s*["\']([0-9]+\.[0-9]+(?:\.[0-9]+)?)["\']',

              r'id\s+["\']com\.android\.(?:application|library)["\']'
              r'\s+version\s+["\']([0-9]+\.[0-9]+(?:\.[0-9]+)?)["\']',
          ]

          for pattern in patterns:
              match = re.search(pattern, all_text)
              if match:
                  agp = match.group(1)
                  break

          # Version catalog fallback:
          # agp = "9.4.0"
          if not agp:
              match = re.search(
                  r'(?m)^\s*agp\s*=\s*["\']'
                  r'([0-9]+\.[0-9]+(?:\.[0-9]+)?)'
                  r'["\']',
                  all_text
              )
              if match:
                  agp = match.group(1)

          # -----------------------------------------------------
          # Detect wrapper version
          # -----------------------------------------------------
          wrapper_version = ""

          wrapper_properties = (
              project /
              "gradle" /
              "wrapper" /
              "gradle-wrapper.properties"
          )

          if wrapper_properties.exists():
              try:
                  wrapper_text = wrapper_properties.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  )

                  match = re.search(
                      r'gradle-([0-9]+\.[0-9]+(?:\.[0-9]+)?)-'
                      r'(?:bin|all)\.zip',
                      wrapper_text
                  )

                  if match:
                      wrapper_version = match.group(1)
              except Exception:
                  pass

          has_wrapper = (project / "gradlew").is_file()

          # -----------------------------------------------------
          # AGP -> required Gradle mapping
          # Android official compatibility table
          # -----------------------------------------------------
          gradle_map = {
              "9.4": "9.6.0",
              "9.3": "9.5.0",
              "9.2": "9.4.1",
              "9.1": "9.3.1",
              "9.0": "9.1.0",

              "8.13": "8.13",
              "8.12": "8.13",
              "8.11": "8.13",
              "8.10": "8.11.1",
              "8.9": "8.11.1",
              "8.8": "8.10.2",
              "8.7": "8.9",
              "8.6": "8.7",
              "8.5": "8.7",
              "8.4": "8.6",
              "8.3": "8.4",
              "8.2": "8.2",
              "8.1": "8.0",
              "8.0": "8.0",

              "7.4": "7.5",
              "7.3": "7.4",
              "7.2": "7.3.3",
              "7.1": "7.2",
              "7.0": "7.0",
          }

          selected_gradle = ""

          if has_wrapper and wrapper_version:
              selected_gradle = wrapper_version
          elif agp:
              agp_parts = agp.split(".")
              agp_key = ".".join(agp_parts[:2])
              selected_gradle = gradle_map.get(agp_key, "")

          # Conservative fallback for projects without wrapper
          # or detectable AGP.
          if not selected_gradle:
              selected_gradle = "8.13"

          # -----------------------------------------------------
          # Detect compileSdk
          # -----------------------------------------------------
          compile_sdk = ""

          compile_patterns = [
              r'\bcompileSdk(?:Version)?\s*=\s*["\']?([0-9]{2,3})',
              r'\bcompileSdk(?:Version)?\s+([0-9]{2,3})',
          ]

          for pattern in compile_patterns:
              match = re.search(pattern, all_text)
              if match:
                  compile_sdk = match.group(1)
                  break

          # Default platform for projects where compileSdk is
          # referenced through an unresolved catalog expression.
          if not compile_sdk:
              compile_sdk = "35"

          # -----------------------------------------------------
          # Results
          # -----------------------------------------------------
          output_file = os.environ["GITHUB_OUTPUT"]

          with open(output_file, "a", encoding="utf-8") as f:
              f.write(f"agp_version={agp}\n")
              f.write(f"wrapper_version={wrapper_version}\n")
              f.write(f"has_wrapper={'true' if has_wrapper else 'false'}\n")
              f.write(f"gradle_version={selected_gradle}\n")
              f.write(f"compile_sdk={compile_sdk}\n")

          print("==============================================")
          print("GRADLE TOOLCHAIN")
          print("==============================================")
          print(f"AGP:            {agp or 'not detected'}")
          print(f"Wrapper:        {has_wrapper}")
          print(f"Wrapper Gradle: {wrapper_version or 'none'}")
          print(f"Build Gradle:   {selected_gradle}")
          print(f"compileSdk:     {compile_sdk}")

          if not has_wrapper:
              print("")
              print("No Gradle wrapper found.")
              print(
                  f"Gradle {selected_gradle} will be used "
                  "from GitHub Actions."
              )
          PY

      # =========================================================
      # 10. Install Android platform requested by project
      # =========================================================
      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail

          COMPILE_SDK="${{ steps.toolchain.outputs.compile_sdk }}"

          echo "Installing Android platform:"
          echo "platforms;android-${COMPILE_SDK}"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platforms;android-${COMPILE_SDK}"

      # =========================================================
      # 11. Setup Gradle for projects that HAVE Wrapper
      # =========================================================
      - name: Setup Gradle using project Wrapper
        if: steps.toolchain.outputs.has_wrapper == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      # =========================================================
      # 12. Setup Gradle when Wrapper is missing
      # =========================================================
      - name: Setup Gradle without Wrapper
        if: steps.toolchain.outputs.has_wrapper != 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.toolchain.outputs.gradle_version }}

      # =========================================================
      # 13. Prepare Wrapper permissions
      # =========================================================
      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

          echo "=============================================="
          echo "PROJECT"
          echo "=============================================="

          echo "Directory:"
          pwd

          echo
          echo "Gradle files:"
          find . -maxdepth 5 -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
              -o \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
              -o \
              -name "gradle-wrapper.properties" \
              -o \
              -name "gradle.properties" \
            \) \
            | sort

          echo
          echo "Gradle version:"

          if [ -f "./gradlew" ]; then
            ./gradlew --version
          else
            gradle --version
          fi

      # =========================================================
      # 14. Build APK
      # =========================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          BUILD_TASK="${{ steps.module.outputs.build_task }}"

          echo "=============================================="
          echo "BUILDING APK"
          echo "=============================================="

          echo "Build task:"
          echo "$BUILD_TASK"

          echo
          echo "Gradle build started..."

          if [ -f "./gradlew" ]; then

            ./gradlew "$BUILD_TASK" \
              --no-daemon \
              --stacktrace \
              --info \
              --warning-mode all \
              --no-configuration-cache \
              --console=plain \
              2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

          else

            gradle "$BUILD_TASK" \
              --no-daemon \
              --stacktrace \
              --info \
              --warning-mode all \
              --no-configuration-cache \
              --console=plain \
              2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

          fi

      # =========================================================
      # 15. Find generated APK
      # =========================================================
      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "SEARCHING FOR APK"
          echo "=============================================="

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          APK=""

          # Prefer debug APK
          APK="$(
            find "$PROJECT_DIR" \
              -type f \
              -name "*-debug.apk" \
              -path "*/build/outputs/*" \
              | sort \
              | head -n 1 || true
          )"

          # Fallback to any APK
          if [ -z "$APK" ]; then
            APK="$(
              find "$PROJECT_DIR" \
                -type f \
                -name "*.apk" \
                -path "*/build/outputs/*" \
                | sort \
                | head -n 1 || true
            )"
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            echo
            echo "Build output directories:"
            find "$PROJECT_DIR" \
              -type d \
              -path "*/build/outputs/*" \
              | sort || true

            echo
            echo "All APK files:"
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              | sort || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk-output/TikTok-Downloader-debug.apk"

          echo
          echo "Final APK:"
          ls -lh "$GITHUB_WORKSPACE/apk-output/TikTok-Downloader-debug.apk"

      # =========================================================
      # 16. Upload APK
      # =========================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: TikTok-Downloader-APK
          path: apk-output/TikTok-Downloader-debug.apk
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 17. Upload logs even when build fails
      # =========================================================
      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TikTok-Downloader-Build-Logs
          path: |
            gradle-build.log
          if-no-files-found: warn
          retention-days: 14

      # =========================================================
      # 18. Final diagnostic dump
      # =========================================================
      - name: Diagnostic information
        if: always()
        shell: bash
        run: |
          {
            echo "=============================================="
            echo "FINAL DIAGNOSTICS"
            echo "=============================================="

            echo
            echo "Java:"
            java -version 2>&1 || true

            echo
            echo "Android SDK:"
            echo "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

            echo
            echo "Installed platforms:"
            sdkmanager --list 2>/dev/null \
              | grep -E "platforms;android-[0-9]+" \
              | head -n 30 || true

            echo
            echo "Project:"
            echo "${PROJECT_DIR:-unknown}"

            echo
            echo "APK files:"
            find "${PROJECT_DIR:-.}" \
              -type f \
              -name "*.apk" \
              | sort || true
          } > diagnostic.txt

      # =========================================================
      # 19. Upload diagnostics
      # =========================================================
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TikTok-Downloader-Diagnostics
          path: diagnostic.txt
          if-no-files-found: warn
          retention-days: 14
