name: Build Substack Downloader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout repository
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v5

      # =========================================================
      # 2. Setup JDK 17
      # =========================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # 3. Setup Android SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # =========================================================
      # 4. Accept Android SDK licenses
      # =========================================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      # =========================================================
      # 5. Install Android SDK components
      # =========================================================
      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      # =========================================================
      # 6. Extract Substack Downloader
      # =========================================================
      - name: Extract project
        shell: bash
        run: |
          set -e

          if [ -d "extracted" ]; then
            echo "extracted/ already exists."
            exit 0
          fi

          ZIP_FILE=""

          if [ -f "substack-downloader.zip" ]; then
            ZIP_FILE="substack-downloader.zip"
          else
            ZIP_FILE=$(find . \
              -maxdepth 2 \
              -type f \
              -name "*.zip" \
              | head -n 1 || true)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP:"
          echo "$ZIP_FILE"

          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

      # =========================================================
      # 7. Detect Android project
      # =========================================================
      - name: Detect Android Gradle project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          # Known location
          if [ -f "extracted/settings.gradle.kts" ] || \
             [ -f "extracted/settings.gradle" ]; then

            PROJECT_DIR="$(realpath extracted)"

          # Root location
          elif [ -f "settings.gradle.kts" ] || \
               [ -f "settings.gradle" ]; then

            PROJECT_DIR="$(pwd)"

          # Recursive search
          else

            SETTINGS_FILE=$(
              find . \
                -type f \
                \( \
                  -name "settings.gradle.kts" \
                  -o \
                  -name "settings.gradle" \
                \) \
                -not -path "./.git/*" \
                | head -n 1 || true
            )

            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_DIR="$(realpath "$(dirname "$SETTINGS_FILE")")"
            fi

          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."

            echo
            echo "Repository files:"
            find . \
              -maxdepth 6 \
              -type f \
              -not -path "./.git/*" \
              | sort

            exit 1
          fi

          echo "=============================================="
          echo "PROJECT FOUND"
          echo "=============================================="
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo
          echo "Project tree:"
          find "$PROJECT_DIR" \
            -maxdepth 4 \
            -type f \
            -not -path "*/.gradle/*" \
            | sort

      # =========================================================
      # 8. Repair Google Services BEFORE Gradle is executed
      # =========================================================
      - name: Remove Google Services from Gradle configuration
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo "REMOVING GOOGLE SERVICES"
          echo "=============================================="

          # -----------------------------------------------------
          # Root build.gradle.kts / build.gradle
          # -----------------------------------------------------
          if [ -f "build.gradle.kts" ]; then

            python3 <<'PY'
from pathlib import Path

p = Path("build.gradle.kts")
text = p.read_text(encoding="utf-8")

lines = text.splitlines()
out = []

for line in lines:
    s = line.strip()

    # Kotlin DSL version-catalog Google Services plugin
    if "libs.plugins.google.services" in s:
        continue

    # Explicit plugin ID
    if 'com.google.gms.google-services' in s:
        continue

    # Old apply syntax
    if 'google-services' in s and (
        'apply plugin' in s or
        'plugin:' in s
    ):
        continue

    out.append(line)

p.write_text("\n".join(out) + "\n", encoding="utf-8")
PY

          fi

          if [ -f "build.gradle" ]; then

            python3 <<'PY'
from pathlib import Path

p = Path("build.gradle")
text = p.read_text(encoding="utf-8")

lines = text.splitlines()
out = []

for line in lines:
    s = line.strip()

    if "google-services" in s:
        continue

    if "googleServices" in s:
        continue

    out.append(line)

p.write_text("\n".join(out) + "\n", encoding="utf-8")
PY

          fi

          # -----------------------------------------------------
          # app/build.gradle.kts
          # -----------------------------------------------------
          if [ -f "app/build.gradle.kts" ]; then

            python3 <<'PY'
from pathlib import Path

p = Path("app/build.gradle.kts")
text = p.read_text(encoding="utf-8")

lines = text.splitlines()
out = []

for line in lines:
    s = line.strip()

    # Version catalog plugin
    if "libs.plugins.google.services" in s:
        continue

    # Explicit Google Services plugin
    if 'com.google.gms.google-services' in s:
        continue

    # Old apply plugin form
    if 'google-services' in s:
        continue

    if 'googleServices' in s:
        continue

    out.append(line)

p.write_text("\n".join(out) + "\n", encoding="utf-8")
PY

          fi

          # -----------------------------------------------------
          # app/build.gradle
          # -----------------------------------------------------
          if [ -f "app/build.gradle" ]; then

            python3 <<'PY'
from pathlib import Path

p = Path("app/build.gradle")
text = p.read_text(encoding="utf-8")

lines = text.splitlines()
out = []

for line in lines:
    s = line.strip()

    if "google-services" in s:
        continue

    if "googleServices" in s:
        continue

    out.append(line)

p.write_text("\n".join(out) + "\n", encoding="utf-8")
PY

          fi

          # -----------------------------------------------------
          # Remove google-services.json everywhere
          # -----------------------------------------------------
          find . \
            -type f \
            -name "google-services.json" \
            -not -path "./.gradle/*" \
            -delete || true

          echo "Google Services references removed."

      # =========================================================
      # 9. Repair Version Catalog
      # =========================================================
      - name: Repair libs.versions.toml
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "gradle/libs.versions.toml" ]; then

            python3 <<'PY'
from pathlib import Path

p = Path("gradle/libs.versions.toml")
lines = p.read_text(encoding="utf-8").splitlines()

out = []

for line in lines:
    s = line.strip().lower()

    # Remove Google Services plugin alias
    if "google-services" in s:
        continue

    if "google_services" in s:
        continue

    if "google.services" in s:
        continue

    out.append(line)

p.write_text("\n".join(out) + "\n", encoding="utf-8")
PY

          fi

          echo "Version catalog repaired."

      # =========================================================
      # 10. Remove Google Services from all possible Gradle files
      # =========================================================
      - name: Final Google Services scan
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Remaining Google Services references:"

          grep -Rni \
            --exclude-dir=.git \
            --exclude-dir=.gradle \
            -E \
            "google-services|googleServices|libs\.plugins\.google\.services|com\.google\.gms\.google-services" \
            . \
            || true

      # =========================================================
      # 11. Gradle properties
      # =========================================================
      - name: Configure Gradle properties
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          touch gradle.properties

          python3 <<'PY'
from pathlib import Path

p = Path("gradle.properties")
text = p.read_text(encoding="utf-8")

required = {
    "org.gradle.daemon=false",
    "org.gradle.parallel=true",
    "org.gradle.caching=true",
    "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8",
    "android.useAndroidX=true",
    "android.nonTransitiveRClass=false",
}

lines = text.splitlines()

for item in required:
    key = item.split("=", 1)[0]

    lines = [
        line for line in lines
        if not line.startswith(key + "=")
    ]

    lines.append(item)

p.write_text("\n".join(lines) + "\n", encoding="utf-8")
PY

      # =========================================================
      # 12. Install Gradle 9.3.1
      # =========================================================
      - name: Install Gradle 9.3.1
        shell: bash
        run: |
          set -e

          VERSION="9.3.1"
          DIR="/opt/gradle-${VERSION}"

          if [ ! -d "$DIR" ]; then

            curl -fL \
              "https://services.gradle.org/distributions/gradle-${VERSION}-bin.zip" \
              -o /tmp/gradle.zip

            unzip -q \
              /tmp/gradle.zip \
              -d /opt/

          fi

          echo "$DIR/bin" >> "$GITHUB_PATH"

          export PATH="$DIR/bin:$PATH"

          gradle --version

      # =========================================================
      # 13. Create debug keystore
      # =========================================================
      - name: Create Android debug keystore
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android"

          KEYSTORE="$HOME/.android/debug.keystore"

          if [ ! -f "$KEYSTORE" ]; then

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

          fi

          cp "$KEYSTORE" "$PROJECT_DIR/debug.keystore"

          if [ -d "$PROJECT_DIR/app" ]; then
            cp "$KEYSTORE" "$PROJECT_DIR/app/debug.keystore"
          fi

          echo "Debug keystore created."

      # =========================================================
      # 14. Inspect important Gradle files
      # =========================================================
      - name: Validate project files
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "================ settings.gradle.kts ================"

          if [ -f settings.gradle.kts ]; then
            cat settings.gradle.kts
          fi

          echo
          echo "================ build.gradle.kts ================"

          if [ -f build.gradle.kts ]; then
            cat build.gradle.kts
          fi

          echo
          echo "================ app/build.gradle.kts ================"

          if [ -f app/build.gradle.kts ]; then
            cat app/build.gradle.kts
          fi

          echo
          echo "================ gradle/libs.versions.toml ================"

          if [ -f gradle/libs.versions.toml ]; then
            cat gradle/libs.versions.toml
          fi

      # =========================================================
      # 15. Build Debug APK
      # =========================================================
      - name: Build Debug APK
        shell: bash
        env:
          CI: true
          GRADLE_OPTS: >-
            -Dorg.gradle.daemon=false
            -Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
        run: |
          set -e

          cd "$PROJECT_DIR"

          export PATH="/opt/gradle-9.3.1/bin:$PATH"

          echo "Gradle version:"
          gradle --version

          echo
          echo "Running assembleDebug..."

          gradle \
            clean \
            assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # =========================================================
      # 16. Find APK
      # =========================================================
      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK_FILES=$(
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -not -path "*/.gradle/*" \
              | sort
          )

          if [ -z "$APK_FILES" ]; then
            echo "ERROR: No APK generated."

            echo
            echo "Build folders:"
            find "$PROJECT_DIR" \
              -type d \
              -name build \
              | sort

            exit 1
          fi

          echo "Found APK files:"
          echo "$APK_FILES"

          APK=$(
            echo "$APK_FILES" \
              | grep -E 'debug.*\.apk$' \
              | head -n 1 \
              || true
          )

          if [ -z "$APK" ]; then
            APK=$(echo "$APK_FILES" | head -n 1)
          fi

          mkdir -p "$PROJECT_DIR/output"

          cp \
            "$APK" \
            "$PROJECT_DIR/output/Substack-Downloader-debug.apk"

          echo
          echo "Selected APK:"
          echo "$APK"

          echo
          echo "APK size:"
          du -h \
            "$PROJECT_DIR/output/Substack-Downloader-debug.apk"

      # =========================================================
      # 17. Upload APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Substack-Downloader-debug
          path: ${{ env.PROJECT_DIR }}/output/Substack-Downloader-debug.apk
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 18. Success
      # =========================================================
      - name: Build success
        if: success()
        shell: bash
        run: |
          echo "=============================================="
          echo "BUILD SUCCESSFUL"
          echo "=============================================="
          echo
          echo "Substack Downloader APK generated successfully."
          echo
          echo "Artifact:"
          echo "Substack-Downloader-debug"
